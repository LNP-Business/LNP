<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Simulateur LNP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>
/* LNP · Entraînement › Simulateur (Romain 2026-11-11) : l'appel de vente simulé, le prospect est joué par Claude, en texte ou à la
   voix. Un seul document dans un cadre de la page LNP, comme l'Académie ; il passe par window.parent.claude.use("crm") (lecture des
   tables crm_sim_*) et use("simulateur") (la fonction Edge, qui écrit tout). Vues : Nouvelle simulation, appel, fin d'appel,
   résultat, Historique ; pour les administrateurs : Offres et prospects, Réglages. */
:root{--ink:#0C1330;--ink2:#2A3352;--mut:#5A6478;--line:#D6DEF0;--soft:#EEF3FC;--pale:#E3ECFB;--sky:#AECBF2;--bg:#F7F8FB;--card:#FFFFFF;
  --brand:#1E2A5E;--vif:#2B6CF5;--clair:#5B8DF7;--ok:#137A4F;--oks:#E2F4EB;--mid:#B45309;--mids:#FDF0DC;--ko:#B42318;--kos:#FCE5E2;
  --sans:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans);overflow:hidden;display:flex;flex-direction:column}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.45}
:focus{outline:none}:focus-visible{outline:3px solid #2B6CF5;outline-offset:2px}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #2B6CF5;outline-offset:0}
[hidden]{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.bar{flex:none;display:flex;align-items:center;gap:16px;padding:6px 18px;background:var(--card);border-bottom:1px solid var(--line);min-height:54px}
.brand{line-height:1.1}.brand b{display:block;font-size:10.5px;letter-spacing:.12em;color:var(--brand)}.brand span{font-size:13px;font-weight:600;color:var(--ink2)}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px;flex:none}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 13px;font-weight:600;font-size:13px;color:var(--ink2);white-space:nowrap}
.seg button[aria-current=page],.seg button[aria-pressed=true]{background:var(--card);color:var(--brand);box-shadow:0 1px 3px rgba(12,19,48,.14)}
.sp{flex:1}
.who{font-size:12px;color:var(--mut);text-align:right;line-height:1.3}.who b{color:var(--brand);font-weight:600}
#view{flex:1;min-height:0;overflow:auto}
body.calling .bar{display:none}body.calling #view{overflow:hidden}
.wrap{max-width:1240px;margin:0 auto;padding:22px 28px 48px;display:flex;flex-direction:column;gap:16px}
h1{font-size:22px;line-height:1.25;margin:0;color:var(--brand)}h2{font-size:17px;margin:0;color:var(--brand)}h3{font-size:14px;margin:0;color:var(--brand)}
p{margin:0}
.head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.ct{font-weight:600;color:var(--brand);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.ct small{font-weight:500;color:var(--mut);font-size:12px}
.cap{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.muted{color:var(--mut)}.small{font-size:12.5px}
.btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:7px 14px;font-weight:600;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap;text-decoration:none;color:var(--ink)}
.btn:hover:not(:disabled){border-color:var(--clair)}
.btn.p{background:var(--vif);border-color:var(--vif);color:#fff}.btn.p:hover:not(:disabled){background:#1F5BDB}
.btn.n{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.ko{background:var(--ko);border-color:var(--ko);color:#fff}
.btn.kol{color:var(--ko)}
.btn.g{border-color:transparent;background:transparent}.btn.g:hover:not(:disabled){background:var(--soft)}
.btn.sm{padding:4px 10px;font-size:12px;border-radius:8px}
.btn.cta{padding:10px 20px;font-size:14px;background:linear-gradient(135deg,#2B6CF5,#1F4FC8);border:0;color:#fff;box-shadow:0 3px 10px rgba(43,108,245,.25);transition:transform .15s,box-shadow .15s}
.btn.cta:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 5px 16px rgba(43,108,245,.35)}
.btn.cta:disabled{background:#C9D2E6;box-shadow:none}
.lnk{border:0;background:none;padding:2px 0;color:var(--vif);text-decoration:underline;font-weight:500;font-size:13px}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;border-radius:999px;padding:2px 9px;background:var(--soft);color:var(--brand);white-space:nowrap}
.pill.ok{background:var(--oks);color:var(--ok)}.pill.mid{background:var(--mids);color:var(--mid)}.pill.ko{background:var(--kos);color:var(--ko)}.pill.b{background:var(--pale);color:#1F4FC8}
.spin{display:inline-block;width:16px;height:16px;border:2.5px solid var(--sky);border-top-color:var(--vif);border-radius:50%;animation:rot .8s linear infinite;vertical-align:middle}
.spin.l{width:34px;height:34px;border-width:4px}
@keyframes rot{to{transform:rotate(360deg)}}
.load{display:flex;align-items:center;justify-content:center;gap:10px;padding:60px 20px;color:var(--mut)}
.empty{text-align:center;padding:34px 20px;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:8px}
.empty b{color:var(--ink2);font-size:15px}
.ico{width:56px;height:56px;border-radius:16px;background:var(--pale);color:var(--vif);display:flex;align-items:center;justify-content:center;font-size:26px}
.notice{background:#FFF8E6;border:1px solid #F0D58C;border-radius:12px;padding:12px 16px;color:#5C4200}.notice b{color:#7A5400}
.err{color:var(--ko);font-size:13px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--ink2)}
label.f small{font-weight:400;color:var(--mut)}
.in,select.in,textarea.in{border:1px solid var(--line);border-radius:9px;padding:7px 10px;background:#fff;font-size:13.5px;font-weight:400;color:var(--ink);width:100%}
textarea.in{resize:vertical;min-height:90px;line-height:1.45}
/* toasts */
.toasts{position:fixed;top:14px;right:14px;z-index:90;display:flex;flex-direction:column;gap:8px;width:min(380px,calc(100vw - 28px))}
.toast{background:#fff;border:1px solid var(--line);border-left:4px solid var(--vif);border-radius:10px;padding:10px 34px 10px 12px;box-shadow:0 8px 24px rgba(12,19,48,.16);position:relative;font-size:13px;display:flex;flex-direction:column;gap:2px}
.toast b{color:var(--brand)}.toast.bad{border-left-color:var(--ko)}.toast.bad b{color:var(--ko)}
.toast .tx{position:absolute;top:6px;right:6px;border:0;background:none;width:24px;height:24px;border-radius:6px;color:var(--mut)}
/* fenêtres */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(12,19,48,.5);display:flex;justify-content:center;align-items:center;padding:24px}
.modal{width:min(480px,100%);max-height:calc(100vh - 48px);overflow:auto;background:#fff;border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.28)}
.modal.wide{width:min(900px,100%)}
.mh{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.x{width:34px;height:34px;flex:none;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:16px;line-height:1}
.acts{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.warnt{color:var(--mid);font-weight:700}.court{color:#C2410C;font-size:12.5px}
.stars{display:flex;justify-content:center;gap:6px}
.stars button{border:0;background:none;font-size:38px;line-height:1;color:#D6DEF0;padding:2px;border-radius:8px}
.stars button.on{color:#F5B301}
/* nouvelle simulation */
.banner{display:flex;flex-direction:column;gap:8px}
.brow{display:flex;align-items:center;gap:12px;border:1px solid var(--sky);background:var(--pale);border-radius:12px;padding:10px 14px}
.brow .bi{width:36px;height:36px;border-radius:50%;background:var(--vif);color:#fff;display:flex;align-items:center;justify-content:center;flex:none}
.brow b{display:block;color:var(--brand)}.brow small{color:var(--mut)}
.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.mb{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:12px 14px;display:flex;gap:12px;align-items:flex-start}
.mb .mi{width:34px;height:34px;border-radius:10px;background:var(--soft);color:var(--brand);display:flex;align-items:center;justify-content:center;flex:none;font-size:16px}
.mb b{display:block;color:var(--ink)}.mb small{color:var(--mut);font-size:12px;line-height:1.35;display:block}
.mb[aria-pressed=true]{border-color:var(--vif);background:#F3F7FF}.mb[aria-pressed=true] .mi{background:var(--vif);color:#fff}
.offs{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:8px;max-height:176px;overflow:auto;padding:2px}
.ob{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;display:flex;align-items:center;gap:8px;font-size:13px}
.ob i{width:9px;height:9px;border-radius:50%;background:var(--sky);flex:none}
.ob .on{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ob[aria-pressed=true]{border-color:var(--vif);background:#F3F7FF;font-weight:600}.ob[aria-pressed=true] i{background:var(--vif)}
.ok-ic{width:18px;height:18px;border-radius:50%;background:var(--vif);color:#fff;font-size:11px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.pc{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.pc[aria-pressed=true]{border-color:var(--vif);box-shadow:0 0 0 3px rgba(43,108,245,.12)}
.pc .top{display:flex;align-items:center;gap:10px}
.av{width:38px;height:38px;border-radius:11px;background:var(--pale);color:var(--brand);font-weight:700;display:flex;align-items:center;justify-content:center;flex:none}
.pc[aria-pressed=true] .av{background:var(--vif);color:#fff}
.pc .nm{flex:1;min-width:0}.pc .nm b{display:block}.pc .nm small{color:var(--mut);font-size:12px}
.pc .job{font-size:12.5px;color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.diff{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;border-radius:6px;padding:2px 7px;align-self:flex-start}
.pc .no{font-size:11.5px;color:var(--mid)}
/* offres (administrateurs) */
.ogrid{display:grid;grid-template-columns:minmax(340px,400px) minmax(0,1fr);gap:16px;align-items:start}
.olist{display:flex;flex-direction:column;gap:8px}
.oi{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.oi[aria-pressed=true]{border-color:var(--vif);background:#F3F7FF}
.oi .l1{display:flex;align-items:center;gap:8px;font-weight:600}.oi .l1 .on{flex:1;min-width:0}
.filein{position:relative;align-self:flex-start;cursor:pointer}.filein:focus-within{outline:3px solid #2B6CF5;outline-offset:2px}
.oi small{color:var(--mut);font-size:12px}
.form{display:flex;flex-direction:column;gap:10px}
.files{display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.files div{display:flex;align-items:center;gap:8px;background:var(--soft);border-radius:8px;padding:4px 8px}.files div span{flex:1}
.dl{display:grid;grid-template-columns:minmax(150px,220px) minmax(0,1fr);gap:6px 14px;font-size:13px}
.dl dt{font-weight:600;color:var(--brand)}.dl dd{margin:0;color:var(--ink2);white-space:pre-wrap}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{border-top:1px solid var(--line);padding:8px 8px;text-align:left;vertical-align:middle}
table.t th{color:var(--mut);font-weight:600;font-size:12px;border-top:0}
table.t tr.off td{opacity:.6}
table.t select{width:auto;min-width:130px}
details.sec{border:1px solid var(--line);border-radius:10px;padding:8px 12px}
details.sec summary{cursor:pointer;font-weight:600;color:var(--brand)}
details.sec[open] summary{margin-bottom:8px}
.pd ul{margin:2px 0;padding-left:18px}.pd .sub{border-left:3px solid var(--pale);padding-left:10px;margin:4px 0}
/* réglages */
.rgl{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;align-items:start}
.rgl .card{display:flex;flex-direction:column;gap:12px}
.sw{display:flex;align-items:center;gap:10px;font-size:13.5px;font-weight:500}
.sw input{width:18px;height:18px}
/* historique */
.filt{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.filt select,.filt input{width:auto;min-width:150px;height:34px;padding:4px 8px}
.hl{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
.hr{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:14px;align-items:center;padding:14px 18px;border-top:1px solid var(--line)}
.hr:first-child{border-top:0}
.hs{font-size:22px;font-weight:700;text-align:center;color:var(--mut)}.hs.g{color:var(--ok)}.hs.m{color:var(--vif)}.hs.b{color:var(--ko)}
.hs .pulse{animation:pul 1.4s ease-in-out infinite;display:inline-block}
@keyframes pul{50%{opacity:.35}}
.hc{display:flex;flex-direction:column;gap:3px;min-width:0}
.hc .l1{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.hc .l1 b{font-size:14.5px;color:var(--ink)}
.hc .l2,.hc .l3{font-size:12.5px;color:var(--mut)}
.ha{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.pager{display:flex;align-items:center;justify-content:center;gap:12px;font-size:13px;color:var(--ink2)}
/* appel */
.call{display:grid;grid-template-columns:var(--bw,340px) minmax(0,1fr);height:100%;min-height:0}
.call.nobrief{grid-template-columns:minmax(0,1fr)!important}
.brief{border-right:1px solid var(--line);background:var(--card);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.bt{margin:10px;border:0;border-radius:10px;background:var(--brand);color:#fff;padding:9px 12px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:8px;justify-content:center}
.bb{flex:1;overflow:auto;padding:4px 14px 18px;display:flex;flex-direction:column;gap:12px}
.bid{display:flex;align-items:center;gap:10px}
.bid .av{width:34px;height:34px;border-radius:50%}
.mbadge{font-size:10.5px;font-weight:700;color:#fff;border-radius:999px;padding:2px 9px;background:var(--ok)}
.mbadge.m-diagnostic{background:var(--vif)}.mbadge.m-objections{background:#C2410C}
.bsec{display:flex;flex-direction:column;gap:6px}
.bsec h3{display:flex;align-items:center;gap:6px;font-size:13px}
.bg2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bx{background:var(--soft);border-radius:8px;padding:6px 9px;font-size:12.5px}.bx.w{grid-column:span 2}
.bx small{display:block;color:var(--mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.quote{background:var(--soft);border-left:3px solid var(--vif);border-radius:6px;padding:6px 9px;font-size:12.5px;font-style:italic}
.quote small{display:block;font-style:normal;color:var(--mut);font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.vok{color:var(--ok);font-size:12px;font-weight:600}
.gapb{background:var(--kos);border-radius:10px;padding:10px;font-size:12.5px}.gapb .big{font-size:20px;font-weight:700;color:var(--ko)}
.ammo{background:#FFF8E6;border:1px solid #F0D58C;border-radius:10px;padding:8px 10px;font-size:12.5px}.ammo ul{margin:4px 0 0;padding-left:18px}
.prix{background:var(--pale);border-radius:10px;padding:10px;text-align:center}.prix b{display:block;font-size:22px;color:var(--brand)}
.cmain{display:flex;flex-direction:column;min-height:0;min-width:0}
.chead{display:flex;align-items:center;gap:10px;padding:8px 16px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.92);flex-wrap:wrap}
.ib{width:36px;height:36px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:17px;flex:none}
.cwho{min-width:0}.cwho b{display:block;font-size:15px;color:var(--brand);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cwho small{color:var(--mut);font-size:12px}
.timer{font:700 20px/1 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--soft);border-radius:10px;padding:7px 10px;display:inline-flex;align-items:baseline;gap:4px;color:var(--ink)}
.timer small{font-size:11px;color:var(--mut);font-weight:600}
.timer.w5{background:var(--mids);color:var(--mid)}.timer.w1{background:var(--kos);color:var(--ko)}.timer.w1 .tri{animation:pul 1s infinite}
.sess{display:flex;align-items:center;gap:10px;background:var(--kos);color:var(--ko);padding:8px 16px;font-size:13px;font-weight:500}
.track{padding:8px 16px;border-bottom:1px solid var(--line);background:#fff;display:flex;flex-direction:column;gap:7px}
.phs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.ph{border:1px solid var(--line);background:#fff;border-radius:12px;padding:4px 11px;font-size:12px;font-weight:600;white-space:nowrap;color:var(--ink2)}
.ph.done{background:var(--oks);border-color:#9FD7B9;color:var(--ok)}
.ph[aria-pressed=true]{background:var(--vif);border-color:var(--vif);color:#fff}
.crs{display:flex;gap:6px;flex-wrap:wrap}
.cr{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px 3px 4px;font-size:12px;display:inline-flex;align-items:center;gap:6px}
.cr i{width:17px;height:17px;border-radius:50%;border:1.5px solid #B6C2DA;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:10px;font-weight:700}
.cr.y{border-color:#9FD7B9;background:var(--oks)}.cr.y i{background:var(--ok);border-color:var(--ok);color:#fff}
.cr.n{border-color:#F2B8B0;background:var(--kos)}.cr.n i{background:var(--ko);border-color:var(--ko);color:#fff}
.cscroll{flex:1;min-height:0;overflow:auto;position:relative}
.orbw{position:sticky;top:0;z-index:2;height:260px;background:radial-gradient(circle at 30% 20%,#EEF3FC,transparent 55%),radial-gradient(circle at 75% 70%,#E3ECFB,transparent 50%),#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;border-bottom:1px solid var(--line)}
.orbw canvas{width:220px;height:220px}
.orbl{font-size:12.5px;color:var(--mut);margin-top:-6px}
.msgs{max-width:820px;margin:0 auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px;min-height:100%}
.msgs .spacer{flex:1}
.msg{display:flex}.msg.s{justify-content:flex-end}
.bub{max-width:75%;border-radius:16px;padding:9px 14px;font-size:14px;white-space:pre-wrap;overflow-wrap:anywhere}
.msg.s .bub{background:var(--brand);color:#fff;border-top-right-radius:5px}
.msg.p .bub{background:#fff;border:1px solid var(--line);border-top-left-radius:5px}
.msg.tmp .bub{opacity:.8}
.typing{color:var(--mut);font-size:13px;display:inline-flex;align-items:center;gap:8px}
.dots{display:inline-flex;gap:4px}.dots i{width:7px;height:7px;border-radius:50%;background:#9AA7C2;animation:bnc 1.2s infinite}
.dots i:nth-child(2){animation-delay:.2s}.dots i:nth-child(3){animation-delay:.4s}
.msg.s .bub.typing{background:var(--pale);border:1px solid var(--sky)}
@keyframes bnc{0%,80%,100%{transform:translateY(0);opacity:.5}40%{transform:translateY(-4px);opacity:1}}
.cempty{margin:auto;text-align:center;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:8px;padding:30px}
.cempty b{color:var(--ink);font-size:16px}
.cbottom{border-top:1px solid var(--line);background:#fff;padding:10px 16px}
.inbar{max-width:820px;margin:0 auto;display:flex;gap:8px;align-items:flex-end}
.taw{flex:1;position:relative}
.taw textarea{width:100%;min-height:44px;max-height:120px;resize:none;border:1px solid var(--line);border-radius:12px;padding:11px 14px;line-height:1.4;font-size:14px;display:block}
.taw.rec textarea{border-color:var(--ko)}
.taw .rd{position:absolute;right:12px;top:16px;width:10px;height:10px;border-radius:50%;background:var(--ko);animation:pul 1s infinite}
.rb{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:#fff;font-size:18px;flex:none}
.rb.on{background:var(--ko);border-color:var(--ko);color:#fff;animation:pul 1.4s infinite}
.rb.send{background:var(--vif);border-color:var(--vif);color:#fff}
.vbar{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:10px;min-height:44px}
.vt{flex:1;min-width:0;font-size:13px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vt.u{color:var(--ink);font-style:italic}.vt .gd{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--ok);margin-right:8px;animation:pul 1s infinite}
.btn.mute[aria-pressed=true]{background:var(--kos);border-color:#F2B8B0;color:var(--ko)}
/* fin d'appel : plein écran */
.full{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:48px 20px}
.fc{width:min(560px,100%);display:flex;flex-direction:column;gap:14px}
.fc.c{text-align:center;align-items:center;width:min(480px,100%);margin-top:6vh}
.rond{width:80px;height:80px;border-radius:50%;background:var(--pale);display:flex;align-items:center;justify-content:center;font-size:32px;color:var(--vif)}
.rond.a{background:var(--mids);color:var(--mid)}
.prog4{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.prog4 i{height:6px;border-radius:3px;background:var(--line)}.prog4 i.on{background:var(--vif)}
.lvopt{display:flex;flex-direction:column;gap:8px}
.lv{text-align:left;border:2px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px}
.lv b{display:block;color:var(--ink)}.lv small{color:var(--mut)}
.lv[aria-checked=true]{border-color:var(--vif);background:#F3F7FF}
.aart{min-height:130px}
/* résultat */
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);overflow-x:auto}
.tabs button{border:0;background:transparent;padding:9px 14px;font-weight:600;font-size:13.5px;color:var(--mut);border-bottom:3px solid transparent;margin-bottom:-1px;white-space:nowrap}
.tabs button[aria-selected=true]{color:var(--brand);border-bottom-color:var(--vif)}
.r3{display:grid;grid-template-columns:1fr 1.2fr 1fr;gap:16px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.score{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center}
.score .n{font-size:84px;font-weight:700;line-height:1;color:var(--brand);font-variant-numeric:tabular-nums}.score .n small{font-size:22px;color:var(--mut)}
.lvl{font-weight:700;font-size:13px;border-radius:999px;padding:4px 14px;background:var(--pale);color:var(--brand)}
.lad{display:flex;flex-direction:column;gap:0}
.lad div{display:flex;align-items:center;gap:10px;font-size:13px;padding:6px 0;position:relative}
.lad i{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:11px;font-weight:700;background:var(--line);color:var(--mut);flex:none}
.lad .ok i{background:var(--ok);color:#fff}.lad .cur i{background:var(--vif);color:#fff;box-shadow:0 0 0 4px var(--pale)}

.fort{background:var(--oks);border-color:#BFE5CF}.faible{background:#FFF8E6;border-color:#F0D58C}
.cond{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px 12px;align-items:center;font-size:13px}
.cond>div{padding:6px 0;border-top:1px solid var(--line)}
.vd{border-radius:10px;padding:8px 10px;font-size:12.5px;margin-top:6px}
.vd.confirme{background:var(--oks);color:#0E5C3B}.vd.nuance{background:var(--mids);color:#7A3A06}.vd.contredit{background:var(--kos);color:#8F1B12}
.vd b{text-transform:uppercase;letter-spacing:.05em;font-size:11px;display:block}
.dimg{display:grid;grid-template-columns:240px minmax(0,1fr);gap:16px;align-items:start}
.dl5{display:flex;flex-direction:column;gap:6px}
.db{text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:9px 12px;display:flex;flex-direction:column;gap:5px}
.db[aria-pressed=true]{border-color:var(--vif);background:#F3F7FF}
.db .l1{display:flex;justify-content:space-between;font-weight:600;font-size:13px}
.mbar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}.mbar i{display:block;height:100%}
.it{border-top:1px solid var(--line)}.it:first-child{border-top:0}
.it summary{display:flex;align-items:center;gap:10px;padding:9px 2px;cursor:pointer;list-style:none;font-size:13.5px}
.it summary::-webkit-details-marker{display:none}
.it summary span.lb{flex:1}
.st{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;flex:none}
.st.correct{background:var(--oks);color:var(--ok)}.st.partiel{background:var(--mids);color:var(--mid)}.st.absent{background:var(--kos);color:var(--ko)}
.it .bd{padding:0 2px 10px 32px;font-size:13px;display:flex;flex-direction:column;gap:4px}
.verb{font-style:italic;color:var(--ink2)}.com{color:var(--mid)}
.lg{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
.tl{display:flex;flex-direction:column;gap:10px}
.tln{display:grid;grid-template-columns:86px minmax(0,1fr);gap:10px;font-size:13.5px;border-radius:10px;padding:6px 8px}
.tln .who2{font-size:11.5px;color:var(--mut);font-weight:600}.tln.s .who2{color:var(--vif)}
.tln.hl{box-shadow:0 0 0 3px var(--clair)}
.ann{margin-top:6px;border-radius:8px;padding:6px 9px;font-size:12.5px}
.ann.positif{background:var(--oks)}.ann.partiel{background:var(--mids)}.ann.negatif{background:var(--kos)}
.mom{display:flex;flex-direction:column;gap:6px;position:sticky;top:10px}
.mom button.m{text-align:left;border:1px solid var(--line);background:#fff;border-radius:10px;padding:7px 10px;font-size:12.5px}
.fpills{display:flex;gap:6px;flex-wrap:wrap}
.fpills button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600}
.fpills button[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.drill{border:2px solid var(--vif)}
.model{background:var(--oks);border-radius:10px;padding:10px 12px;font-style:italic}
.chart{width:100%;height:auto;display:block}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition:none!important}}
@media (max-width:1000px){.ogrid,.rgl,.r3,.g2,.g3,.dimg,.lg{grid-template-columns:1fr}.modes{grid-template-columns:1fr}.call{grid-template-columns:var(--bwm,56px) minmax(0,1fr)}}

        return '<button type="button" data-k="fl-' + f[0] + '" data-filtre="' + f[0] + '" aria-pressed="' + (R.filtre === f[0]) + '">' + f[1] + " " + cnt[f[0]] + "</button>";
      }).join("") + "</div>";
    if (!vis.length) h += '<p class="muted small">Aucun moment annoté sur cet appel.</p>';
    else h += vis.map(function (x) {
      return '<button type="button" class="m" data-ligne="' + (x.ligne == null ? "" : x.ligne) + '"' + (x.ligne == null ? ' disabled title="Citation introuvable dans la conversation"' : "") + '><span class="pill ' + ({ positif: "ok", partiel: "mid", negatif: "ko" }[x.a.evaluation] || "") + '">' + (EVAL[x.a.evaluation] || "") + "</span> <b>" + esc(x.a.label || x.a.critere) + "</b>" +
        (x.a.verbatim ? '<br><span class="verb">« ' + esc(String(x.a.verbatim).slice(0, 140)) + (String(x.a.verbatim).length > 140 ? "…" : "") + " »</span>" : "") + "</button>";
    }).join("");
    return h + "</aside></div>";
  }
  function ongletExercice(res) {
    var d = res.drill;
    if (!d || !d.titre) return '<section class="card empty"><b>Aucun exercice proposé par l’analyse de cet appel.</b></section>';
    var dur = String(d.duree_estimee || "").replace(/^(\d+)\s*min$/, "$1 min");
    var h = '<p class="notice">Entraîne-toi avant ton prochain appel.</p><section class="card drill" style="display:flex;flex-direction:column;gap:10px"><div class="acts"><span class="pill b">Exercice' + (dur ? " · " + esc(dur) : "") + "</span>" +
      (d.type ? '<span class="pill">' + esc(TYPE_EX[d.type] || d.type) + "</span>" : "") + "</div><h2>" + esc(d.titre) + "</h2>" + (d.contexte ? '<div><div class="cap">Contexte</div><p>' + esc(d.contexte) + "</p></div>" : "") +
      '<div><div class="cap">Ce que tu dois faire</div><p>' + esc(d.consigne || "") + "</p></div>" +
      '<label class="f">Ta réponse<textarea class="in" id="exr" data-k="exr" placeholder="Écris ta réponse ici avant de voir le modèle…">' + esc(R.ex.txt) + "</textarea></label>";
    if (R.ex.vu && d.exemple_reponse) h += '<div><div class="cap">Réponse modèle</div><p class="model">« ' + esc(d.exemple_reponse) + " »</p></div>";
    h += '<div class="acts">' + (!R.ex.vu ? '<button type="button" class="btn p" data-k="exv" data-do="ex-voir"' + (d.exemple_reponse && R.ex.txt.trim().length > 5 ? "" : " disabled") + ">" + (d.exemple_reponse ? "Valider et voir le modèle" : "Pas de réponse modèle fournie") + "</button>" : "") +
      (R.ex.fait ? '<p class="vok">✓ Tu ne repars pas les mains vides.</p>' : '<button type="button" class="btn" data-do="ex-fait">Exercice fait</button>') + "</div></section>";
    return h;
  }
  function courbe(pts) {
    var W = 720, Hh = 250, pl = 44, pr = 20, pt = 18, pb = 36, n = pts.length;
    var x = function (i) { return n === 1 ? (pl + W - pr) / 2 : pl + i * (W - pl - pr) / (n - 1); }, y = function (v) { return pt + (100 - v) * (Hh - pt - pb) / 100; };
    var grid = [0, 25, 50, 75, 100].map(function (v) { return '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(v) + '" y2="' + y(v) + '" stroke="#E3ECFB"/><text x="' + (pl - 8) + '" y="' + (y(v) + 4) + '" text-anchor="end" font-size="11" fill="#5A6478">' + v + "</text>"; }).join("");
    var seuils = [[50, "Découverte"], [65, "Diagnostic"], [85, "Élite"]].map(function (s) { return '<line x1="' + pl + '" x2="' + (W - pr) + '" y1="' + y(s[0]) + '" y2="' + y(s[0]) + '" stroke="#AECBF2" stroke-dasharray="4 4"/><text x="' + (W - pr) + '" y="' + (y(s[0]) - 4) + '" text-anchor="end" font-size="10" fill="#5B8DF7">' + s[1] + "</text>"; }).join("");
    var line = n > 1 ? '<polyline fill="none" stroke="#2B6CF5" stroke-width="2.5" points="' + pts.map(function (p, i) { return x(i) + "," + y(p.v); }).join(" ") + '"/>' : "";
    var dots = pts.map(function (p, i) { return '<circle cx="' + x(i) + '" cy="' + y(p.v) + '" r="' + (p.cur ? 6 : 4) + '" fill="' + (p.cur ? "#1E2A5E" : "#fff") + '" stroke="#2B6CF5" stroke-width="2"><title>' + jour(p.d) + " : " + p.v + "/100</title></circle>" +
      (n <= 14 || i % Math.ceil(n / 14) === 0 || p.cur ? '<text x="' + x(i) + '" y="' + (Hh - 12) + '" text-anchor="middle" font-size="10.5" fill="#5A6478">' + jm(p.d) + "</text>" : ""); }).join("");
    return '<svg viewBox="0 0 ' + W + " " + Hh + '" class="chart" role="img" aria-label="Évolution du score : ' + esc(pts.map(function (p) { return jour(p.d) + " " + p.v; }).join(", ")) + '">' + grid + seuils + line + dots + "</svg>";
  }
  function ongletProgression(res) {
    if (R.hist == null) return loader("Chargement de la progression…");
    var hist = R.hist.length ? R.hist : [{ id: R.an.id, created_at: R.an.created_at, result: res }];
    var pts = hist.map(function (x) { return { d: x.created_at, v: Math.round(Number(x.result.score_total) || 0), cur: x.id === R.an.id }; });
    var dims = dimsDe(res).filter(function (d) { return d.max > 0; });
    var faible = dims.slice().sort(function (a, b) { return a.score / a.max - b.score / b.max; })[0];
    var h = '<section class="card"><div class="ct">Score sur ' + plur(pts.length, "appel analysé", "appels analysés") + "</div>" + courbe(pts) +
      (pts.length < 2 ? '<p class="muted small">Premier appel analysé : la progression s’affichera dès le prochain.</p>' : "") + "</section>";
    if (faible) {
      var sur3 = function (r) { var d = dimsDe(r).filter(function (x) { return x.key === faible.key; })[0]; return d && d.max > 0 ? Math.round(d.score / d.max * 300) / 100 : null; };
      var lignes = hist.map(function (x) { return { d: x.created_at, n: sur3(x.result), cur: x.id === R.an.id }; }).filter(function (x) { return x.n != null; });
      h += '<section class="card"><div class="ct">Chantier prioritaire : ' + faible.label + " <small>la dimension la plus faible de cet appel</small></div>" +
        '<p class="notice small">' + (lignes.length <= 1 ? "Premier appel noté sur cette dimension : la progression se mesurera dès le prochain appel." : "Le progrès se confirmera si la note remonte au prochain appel.") + "</p>" +
        '<table class="t" style="margin-top:8px"><thead><tr><th>Appel</th><th>' + faible.label + " (sur 3)</th></tr></thead><tbody>" + lignes.map(function (l) { return "<tr><td>" + (l.cur ? "<b>Cet appel</b>" : "Appel du " + jour(l.d)) + "</td><td>" + nb(l.n, 2) + " / 3</td></tr>"; }).join("") +
        '</tbody></table><p class="muted small" style="margin-top:6px">Objectif : repasser au-dessus de 2 / 3 au prochain appel.</p></section>';
    }
    h += '<section class="card"><div class="ct">Tes appels analysés</div><table class="t"><thead><tr><th>Date</th><th>Score</th><th>Niveau</th></tr></thead><tbody>' + hist.slice().reverse().map(function (x) {
      return "<tr><td>" + (x.id === R.an.id ? "<b>" + quand(x.created_at) + " (cet appel)</b>" : quand(x.created_at)) + "</td><td>" + Math.round(Number(x.result.score_total) || 0) + "/100</td><td>" + esc(niveauLabel(x.result.niveau)) + "</td></tr>";
    }).join("") + "</tbody></table></section>";
    return h;
  }

  // ------------------------------------------------------------------ événements
  document.addEventListener("click", function (e) {
    if (e.target.closest("#layers")) return;
    var b = e.target.closest("button,[data-go]"); if (!b || b.disabled) return;
    if (b.dataset.go) { e.preventDefault(); return go(b.dataset.go); }
    if (b.dataset.tab && R) { R.tab = b.dataset.tab; renderResultat(); var t = $("#tab-" + R.tab); if (t) t.focus(); if (R.tab === "progression" && R.hist == null) chargerProgression(); return; }
    if (b.dataset.dim && R) { R.dim = b.dataset.dim; return renderResultat(); }
    if (b.dataset.filtre && R) { R.filtre = b.dataset.filtre; return renderResultat(); }
    if (b.dataset.ligne != null && b.dataset.ligne !== "" && R) { $$(".tln.hl").forEach(function (x) { x.classList.remove("hl"); }); var l = document.getElementById("ln-" + b.dataset.ligne); if (l) { l.classList.add("hl"); l.scrollIntoView({ block: "center", behavior: "smooth" }); } return; }
    if (b.dataset.lv) { if (C && C.fin) { C.fin.aar.niveauEstime = b.dataset.lv; renderFin(); } return; }
    var d = b.dataset.do, v = b.dataset.v; if (!d) return;
    switch (d) {
      case "h-voix": H.voix = v === "1"; lset("lnp-sim-voix", H.voix); return renderNouvelle();
      case "h-mode": H.mode = v; return renderNouvelle();
      case "h-offre": H.offre = v; if (!A.demo) { lset("lnp-sim-offre", v); return chargerProspectsAccueil(v); } return renderNouvelle();
      case "h-prospect": H.prospect = v; if (!A.demo) lset("lnp-sim-prospect-" + H.offre, v); return renderNouvelle();
      case "h-generer": return api("offres/" + H.offre + "/prospects", { method: "POST" }).then(function () { toast("Génération lancée", "Les prospects apparaîtront dans quelques minutes. Suivez-la dans « Offres et prospects »."); }, function (x) { toast("Erreur", x.message, true); });
      case "lancer": return lancer();
      case "o-sel": O.sel = v; renderOffres(); if (!O.pers[v]) chargerPersAdmin(v).then(renderOffres); return;
      case "o-pdfx": O.form.pdfs.splice(+v, 1); return renderOffres();
      case "o-creer": return creerOffre();
      case "o-gen": case "o-rean": case "o-archiver": case "o-suppr": case "o-train": return actionOffre(d);
      case "p-fiche": case "p-actif": case "p-suppr": return actionProspect(d, v);
      case "r-save": return enregistrerReglages();
      case "r-annuler": CHAMPS.forEach(function (k) { RG.edit[k] = RG.row[k]; }); return renderReglages();
      case "r-reprendre": return api("analyses/reprendre", { method: "POST" }).then(function (r) { toast("Analyses relancées", r && r.relancees != null ? plur(r.relancees, "analyse relancée", "analyses relancées") + (r.enAttente ? ", " + r.enAttente + " encore en attente." : ".") : "Les analyses en attente repartent dès qu’une place se libère."); if (V.name === "resultat") route(); }, function (x) { toast("Erreur", x.message, true); });
      case "h-page": HI.page += +v; renderHistorique(); $("#view").scrollTop = 0; return;
      case "h-txt": { var r1 = (HI.rows || []).filter(function (x) { return String(x.id) === v; })[0]; return r1 && telechargerConversation({ id: r1.id, prospect_name: r1.prospect_name, difficulty: r1.difficulty, simulation_mode: r1.mode, started_at: r1.started_at, duration_seconds: r1.duration_seconds }); }
      case "h-suppr": { var r2 = (HI.rows || []).filter(function (x) { return String(x.id) === v; })[0]; return r2 && supprimerSimulation(r2).then(function (ok) { if (ok) chargerHistorique(); }); }
      case "r-txt": return R && telecharger("conversation-" + slug(R.sim.prospect_name) + "-" + isoJour(R.sim.started_at) + ".txt", texteConversation(R.sim, R.msgs));
      case "ex-voir": if (R) { R.ex.vu = true; renderResultat(); } return;
      case "ex-fait": if (R) { R.ex.fait = true; renderResultat(); } return;
      case "brief": C.brief = !C.brief; lset("lnp-sim-fiche-repliee", C.brief); return renderBrief();
      case "retour": return actif() ? ouvrirFin() : go("#nouvelle");
      case "terminer": return ouvrirFin();
      case "undo": return annulerEchange();
      case "v-voix": return C.voiceView ? null : voixDemarrer(false);
      case "v-texte": if (C.voiceView) { voixArret(); setTimeout(function () { var t = $("#ta"); if (t) t.focus(); }, 30); } return;
      case "muet": return muet();
      case "recharger": return location.reload();
      case "phase": C.phase = +v; return renderSuivi();
      case "crit": { var k = +v, s = C.crit[k]; C.crit[k] = s == null ? true : s === true ? false : null; return renderSuivi(); }
      case "envoyer": return envoyerSaisie();
      case "dictee": return dicteeBasculer();
      case "aar-suiv": return aarSuivant();
      case "aar-ret": { C.fin.step = Math.max(1, C.fin.step - 1); renderFin(); var tt = $("#aar"); if (tt) tt.focus(); return; }
      case "aar-env": return aarEnvoyer();
    }
  });
  document.addEventListener("input", function (e) {
    var t = e.target;
    if (t.id === "ta") { taille(t); if (C) C.draft = t.value; return; }
    if (t.id === "aar" && C && C.fin) { var F = C.fin; F.aar[AARQ[F.step - 1][0]] = t.value; var b = $('[data-do="aar-suiv"]'); if (b) b.disabled = !t.value.trim(); return; }
    if (t.id === "exr" && R) { R.ex.txt = t.value; var dr = R.an && R.an.result && R.an.result.drill, bv = $('[data-do="ex-voir"]'); if (bv) bv.disabled = !(dr && dr.exemple_reponse && t.value.trim().length > 5); return; }
    if (t.dataset.f && t.dataset.f !== "pdf") { O.form[t.dataset.f] = t.value; return; }
    if (t.dataset.hf === "q") { HI.q = t.value; HI.page = 1; return renderHistorique(); }
    if (t.dataset.r && t.type === "number") { RG.edit[t.dataset.r] = t.value === "" ? RG.row[t.dataset.r] : Number(t.value); var sv = $('[data-do="r-save"]'), an = $('[data-do="r-annuler"]'); if (sv) sv.disabled = !rgModifie(); if (an) an.disabled = !rgModifie(); }
  });
  document.addEventListener("change", function (e) {
    var t = e.target;
    if (t.dataset.f === "pdf") return ajouterPdfs(t);
    if (t.dataset.do === "o-arch") { O.arch = t.checked; return renderOffres(); }
    if (t.dataset.pvoix) return actionProspect("p-voix", t.dataset.pvoix, t.value);
    if (t.dataset.pdiff) return actionProspect("p-diff", t.dataset.pdiff, t.value);
    if (t.dataset.ploq) return actionProspect("p-loq", t.dataset.ploq, t.value);
    if (t.dataset.hf && t.dataset.hf !== "q") { HI[t.dataset.hf] = t.value; HI.page = 1; if (t.dataset.hf === "personne") { HI.rows = null; renderHistorique(); return chargerHistorique(); } return renderHistorique(); }
    if (t.dataset.r && t.type !== "number") { RG.edit[t.dataset.r] = t.type === "checkbox" ? t.checked : t.value; return renderReglages(); }
  });
  document.addEventListener("keydown", function (e) {
    if (LAY.length) return;
    var t = e.target;
    if (t.id === "ta" && e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); return envoyerSaisie(); }
    if (t.id === "aar" && e.key === "Enter" && (e.metaKey || e.ctrlKey)) { e.preventDefault(); return aarSuivant(); }
    if (t.getAttribute && t.getAttribute("role") === "tab" && (e.key === "ArrowRight" || e.key === "ArrowLeft") && R) {
      e.preventDefault(); var i = ONGLETS.findIndex(function (o) { return o[0] === R.tab; }); i = (i + (e.key === "ArrowRight" ? 1 : ONGLETS.length - 1)) % ONGLETS.length;
      R.tab = ONGLETS[i][0]; renderResultat(); var f = $("#tab-" + R.tab); if (f) f.focus(); if (R.tab === "progression" && R.hist == null) chargerProgression();
    }
  });

  // ------------------------------------------------------------------ démarrage
  function demo() {
    A.demo = true; A.config = { voice_mode_enabled: true };
    $("#who").textContent = "Aperçu hors ligne";
    HASH = "#nouvelle"; route();
  }
  async function boot() {
    if (!P) return demo();
    paint($("#view"), loader("Connexion à votre compte…"));
    try {
      var r = await Promise.all([P.claude.use("crm"), P.claude.use("simulateur")]);
      if (!r[0] || !r[1]) return demo();
      A.crm = r[0]; A.sim = r[1];
      try { A.token = await A.sim.token(); } catch (e) {}
      var me = await api("moi");
      A.me = me || {}; A.admin = !!A.me.admin; A.config = A.me.config || {}; A.voix = A.me.voix || []; A.voixEL = !!A.me.voixElevenLabs;
    } catch (e) {
      paint($("#view"), '<div class="wrap"><div class="card empty"><div class="ico">⚠</div><b>Le simulateur est injoignable</b><p>' + esc(e.message || "") + '</p><button type="button" class="btn p" data-do="recharger">Réessayer</button></div></div>');
      return;
    }
    $("#who").innerHTML = esc(A.me.email || "") + (A.admin ? "<br><b>Administrateur</b>" : "");
    // le jeton de la personne, gardé à jour pour la fin d'appel par « beacon »
    setInterval(function () { Promise.resolve(A.sim.token()).then(function (t) { if (t) A.token = t; }, function () {}); }, 240000);
    route();
  }
  window.LNP_SIMULATEUR = { A: A, H: H, VX: VX, go: go, etat: function () { return { C: C, R: R, HI: HI, O: O }; }, Decoupeur: Decoupeur };
  boot();
})();
</script>
