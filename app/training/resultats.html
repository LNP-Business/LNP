<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Résultats d'entraînement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>
/* LNP · Entraînement › Mes résultats et Suivi des commerciaux (Romain 2026-11-06). One document, two screens: MODE "moi" (each
   person, their own results) or "equipe" (admins: every sales rep, with their sales). Data: crm_training_dashboard() and
   crm_training_results (migration 049, append only). */
:root{--ink:#0C1330;--ink2:#2A3352;--mut:#5A6478;--line:#D6DEF0;--soft:#EEF3FC;--bg:#F7F8FB;--card:#FFFFFF;--brand:#1E2A5E;--vif:#2B6CF5;
  --ok:#137A4F;--oks:#E2F4EB;--mid:#B45309;--mids:#FDF0DC;--ko:#B42318;--kos:#FCE5E2;--sans:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--sans)}
button{font:inherit;color:inherit;cursor:pointer}
.bar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:14px;padding:10px 18px;background:var(--card);border-bottom:1px solid var(--line)}
.bar h1{margin:0;font-size:17px;color:var(--brand);white-space:nowrap}
.seg{display:flex;gap:2px;padding:3px;background:var(--soft);border-radius:10px}
.seg button{border:0;background:transparent;border-radius:8px;padding:4px 11px;font-size:13px;font-weight:600;color:var(--mut)}
.seg button[aria-pressed=true]{background:var(--card);color:var(--brand);box-shadow:0 1px 2px rgba(12,19,48,.12)}
.sp{flex:1}
.upd{font-size:12px;color:var(--mut);white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:9px;padding:5px 11px;font-weight:600;font-size:13px}
.wrap{padding:16px 18px 28px;display:flex;flex-direction:column;gap:14px;max-width:1500px}
.tiles{display:grid;grid-template-columns:1.6fr repeat(3,1fr);gap:12px}
.tile,.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.tile{padding:14px 16px;min-width:0}
.tile .k{font-size:12px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.06em}
.tile .v{font-size:30px;font-weight:700;line-height:1.15;color:var(--ink);margin-top:4px;font-variant-numeric:tabular-nums}
.tile .v small{font-size:15px;font-weight:600;color:var(--mut)}
.tile .s{font-size:12.5px;color:var(--mut);margin-top:2px}
.score{display:flex;flex-direction:column;gap:10px}
.score .v{font-size:40px}
.parts{display:flex;flex-direction:column;gap:6px}
.part{display:grid;grid-template-columns:132px minmax(0,1fr) 30px;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2)}
.part b{font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.meter{display:block;height:8px;border-radius:4px;background:var(--soft);overflow:hidden}.meter i{display:block;height:100%;background:var(--brand);border-radius:4px}
.card{padding:14px 16px;min-width:0}
.card h2{margin:0 0 4px;font-size:15px;color:var(--brand)}
.card .q{margin:0 0 10px;font-size:12.5px;color:var(--mut)}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:14px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:7px 6px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{font-size:10.5px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.grp th{border-bottom:0;padding-bottom:0;color:var(--brand)}
th button{border:0;background:transparent;padding:0;font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit}
th button[aria-sort]::after{content:"";margin-left:3px}
th[aria-sort=descending] button::after{content:" ↓"}th[aria-sort=ascending] button::after{content:" ↑"}
tbody tr.row{cursor:pointer}tbody tr.row:hover{background:var(--soft)}tbody tr.row.on{background:#E3EBFB}
.who{font-weight:600}.who small{display:block;font-weight:400;font-size:11.5px;color:var(--mut)}
.sc{display:flex;align-items:center;gap:8px;justify-content:flex-end}.sc .meter{width:56px}
.pill{display:inline-block;font-size:11.5px;font-weight:600;border-radius:999px;padding:1px 8px;background:var(--soft);color:var(--brand);white-space:nowrap}
.pill.ok{background:var(--oks);color:var(--ok)}.pill.mid{background:var(--mids);color:var(--mid)}.pill.ko{background:var(--kos);color:var(--ko)}
.muted{color:var(--mut)}
.chart{position:relative}
.chart svg{display:block;width:100%;height:150px;overflow:visible}
.chart .tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;font-size:12px;border-radius:8px;padding:5px 8px;white-space:nowrap;transform:translate(-50%,-110%);display:none}
.hist td.d{white-space:nowrap;color:var(--ink2)}
.det{background:var(--soft);font-size:12.5px;color:var(--ink2)}
.det td{padding:8px 12px}.det div+div{margin-top:4px}
.empty{padding:26px;text-align:center;color:var(--mut);font-size:13.5px}
.err{background:var(--kos);color:var(--ko);border-radius:10px;padding:10px 14px;font-size:13px}
.more{margin-top:10px}
.foot{font-size:12px;color:var(--mut)}
@media (max-width:1100px){.tiles{grid-template-columns:1fr 1fr}.two{grid-template-columns:1fr}}
@media (max-width:620px){.tiles{grid-template-columns:1fr}.bar{flex-wrap:wrap}.score{grid-template-columns:1fr}}
.tscroll{overflow-x:auto}
table.team{font-size:12.5px}table.team th{white-space:normal;vertical-align:bottom;line-height:1.25}
.team td.d{white-space:nowrap}
</style>
</head>
<body>
<header class="bar">
  <h1 id="ttl"></h1>
  <div class="seg" role="group" aria-label="Période" id="per">
    <button type="button" data-d="7">7 j</button><button type="button" data-d="30">30 j</button><button type="button" data-d="90">90 j</button><button type="button" data-d="0">Depuis le début</button>
  </div>
  <div class="sp"></div>
  <span class="upd" id="upd" role="status"></span>
  <button type="button" class="btn" id="reload">Actualiser</button>
</header>
<div class="wrap" id="main"></div>
<script>
(function () {
  "use strict";
  var MODE = /*@MODE@*/"moi";
  var CAT = /*@CATALOGUE@*/{ a: {}, c: {}, l: {} };
  var P = (function () { try { return window.parent !== window && window.parent.claude && window.parent.claude.web ? window.parent : null; } catch (e) { return null; } })();
  var TEAM = MODE === "equipe";
  var MOD = { coup: "Le coup suivant", lettre: "La lettre imposée", academie: "Maîtrise de l’offre" };
  var MODE_TXT = { regles: "Règles et jugement", auto: "Auto-évaluation", claude: "Claude" };
  var GESTE = { L1: "L1 Situation", L2: "L2 Problème", L3: "L3 Impact", L4: "L4 Vision" };
  var KEYP = "lnp-resultats-periode-" + MODE;
  var S = { days: 30, data: null, err: "", loading: false, sel: null, hist: {}, sort: { k: "score", dir: -1 }, open: {}, at: null };
  try { var sv = window.localStorage.getItem(KEYP); if (sv != null && [0, 7, 30, 90].indexOf(+sv) >= 0) S.days = +sv; } catch (e) {}

  // ------------------------------------------------------------------ formats (fr-FR)
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  var NF = new Intl.NumberFormat("fr-FR"), EUR = new Intl.NumberFormat("fr-FR", { style: "currency", currency: "EUR", maximumFractionDigits: 0 });
  function n(x) { return NF.format(Math.round(Number(x) || 0)); }
  function eur(x) { return EUR.format(Number(x) || 0); }
  function num1(x) { return String(Math.round(Number(x) * 10) / 10).replace(".", ","); }
  function dur(s) {
    s = Math.round(Number(s) || 0);
    if (s < 60) return s + " s";
    if (s < 3600) return Math.round(s / 60) + " min";
    var h = Math.floor(s / 3600), m = Math.round((s % 3600) / 60); if (m === 60) { h++; m = 0; }
    return h + " h " + (m < 10 ? "0" : "") + m;
  }
  function dt(iso) { if (!iso) return "–"; var d = new Date(iso); return d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" }) + ", " + d.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }); }
  function day(iso) { if (!iso) return "–"; return new Date(iso).toLocaleDateString("fr-FR", { day: "numeric", month: "short", year: "numeric" }); }
  function pct(x) { return x == null ? "–" : n(x) + " %"; }
  function perTxt() { return S.days ? "sur " + S.days + " jours" : "depuis le début"; }
  function caseTxt(r) {
    if (r.module === "academie") return r.case_id + (CAT.a[r.case_id] ? " · " + CAT.a[r.case_id] : "");
    if (r.module === "coup") return "Cas " + r.case_id + (CAT.c[r.case_id] ? " · attendu " + (GESTE[CAT.c[r.case_id]] || CAT.c[r.case_id]) : "");
    return "Cas " + r.case_id + (CAT.l[r.case_id] ? " · " + CAT.l[r.case_id] : "");
  }
  function resTxt(r) {
    var sc = Number(r.score), mx = Number(r.max), cls = sc / mx >= 0.8 ? "ok" : sc / mx >= 0.5 ? "mid" : "ko";
    var t = r.module === "coup" ? (sc ? "Juste" : "À revoir") : r.module === "lettre" ? num1(sc) + " / 3 questions valides" : num1(sc) + " / 10";
    return '<span class="pill ' + cls + '">' + esc(t) + "</span>";
  }

  // ------------------------------------------------------------------ données
  var crmP = null;
  function crm() { if (!crmP) crmP = P.claude.use("crm"); return crmP; }
  function since() { return S.days ? new Date(Date.now() - S.days * 864e5).toISOString() : null; }
  function load() {
    if (!P) { S.err = "Les résultats sont enregistrés sur le compte de chacun : ouvre LNP en ligne pour les voir."; return render(); }
    if (S.loading) return; S.loading = true; upd("Chargement…");
    crm().then(function (c) { return c.rpc("crm_training_dashboard", { p_days: S.days }); }).then(function (d) {
      S.loading = false; S.err = ""; S.data = d; S.at = new Date();
      if (TEAM && d && !d.admin) { S.err = "Cet écran est réservé aux administrateurs."; S.data = null; }
      var me = d && (d.people || []).filter(function (p) { return p.me; })[0];
      if (!TEAM) S.sel = me ? me.id : null;
      else if (S.sel && !(d.people || []).some(function (p) { return p.id === S.sel; })) S.sel = null;
      render(); if (S.sel) loadHist(S.sel);
    }, function (e) { S.loading = false; S.err = "Impossible de charger les résultats. Réessaie dans un instant."; render(); });
  }
  function loadHist(id, more) {
    var h = S.hist[id];
    if (!h || h.days !== S.days) h = S.hist[id] = { rows: [], done: false, loading: false, days: S.days };
    if (h.loading || (more && h.done)) return; h.loading = true;
    var from = since(), start = more ? h.rows.length : 0;
    crm().then(function (c) {
      var q = c.from("crm_training_results").select("id,module,case_id,score,max,mode,duration_s,details,created_at").eq("user_id", id);
      if (from) q = q.gte("created_at", from);
      return q.order("created_at", { ascending: false }).order("id", { ascending: false }).range(start, start + 199);
    }).then(function (r) {
      h.loading = false;
      if (r && r.error) { h.err = true; return render(); }
      var rows = (r && r.data) || []; h.rows = more ? h.rows.concat(rows) : rows; h.done = rows.length < 200; h.err = false; render();
    }, function () { h.loading = false; h.err = true; render(); });
  }
  function upd(t) { document.getElementById("upd").textContent = t; }

  // ------------------------------------------------------------------ rendu
  function render() {
    document.getElementById("ttl").textContent = TEAM ? "Suivi des commerciaux" : "Mes résultats";
    document.title = TEAM ? "Suivi des commerciaux" : "Mes résultats";
    [].forEach.call(document.querySelectorAll("#per button"), function (b) { b.setAttribute("aria-pressed", String(+b.dataset.d === S.days)); });
    if (S.at) upd("Mis à jour à " + S.at.toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" })); else if (!S.loading) upd("");
    var M = document.getElementById("main");
    if (S.err) { M.innerHTML = P ? '<div class="err" role="alert">' + esc(S.err) + "</div>" : '<div class="empty">' + esc(S.err) + "</div>"; return; }
    if (!S.data) { M.innerHTML = '<div class="empty">Chargement des résultats…</div>'; return; }
    M.innerHTML = TEAM ? teamHtml() : meHtml();
    drawChart();
  }
  function scoreTile(p, title) {
    var parts = p.parts || {};
    return '<div class="tile score"><div><div class="k">' + esc(title) + '</div><div class="v" data-score>' + n(p.score) + "<small> / 100</small></div>" +
      '<div class="s">Moyenne des trois entraînements</div></div><div class="parts">' +
      [["coup", "Le coup suivant", "coups justes sur les 50 derniers"], ["lettre", "La lettre imposée", "questions valides sur les 20 derniers cas"], ["academie", "Maîtrise de l’offre", "meilleures notes des 100 cas"]].map(function (x) {
        var v = Math.max(0, Math.min(100, Number(parts[x[0]]) || 0));
        return '<div class="part" title="' + esc(x[2]) + '"><span>' + x[1] + '</span><span class="meter" role="img" aria-label="' + esc(x[1]) + " : " + n(v) + ' sur 100"><i style="width:' + v + '%"></i></span><b>' + n(v) + "</b></div>";
      }).join("") + "</div></div>";
  }
  function meHtml() {
    var p = (S.data.people || []).filter(function (x) { return x.me; })[0];
    if (!p) return '<div class="empty">Aucun résultat pour l’instant.</div>';
    var per = p.period || {}, ac = p.academie || {};
    var h = '<section class="tiles" aria-label="Synthèse">' + scoreTile(p, "Ton score d’entraînement") +
      '<div class="tile"><div class="k">Exercices faits</div><div class="v">' + n(per.n) + '</div><div class="s">' + perTxt() + " · " + n((p.total || {}).n) + " en tout</div></div>" +
      '<div class="tile"><div class="k">Temps passé</div><div class="v">' + dur(per.time_s) + '</div><div class="s">' + perTxt() + " · " + dur((p.total || {}).time_s) + " en tout</div></div>" +
      '<div class="tile"><div class="k">Maîtrise de l’offre</div><div class="v">' + n(ac.validated) + "<small> / 100</small></div><div class=\"s\">cas validés (8/10 ou plus) · " + n(ac.tried) + " cas travaillés</div></div></section>";
    h += '<div class="two">' + modulesCard(per) + activityCard(p.id) + "</div>";
    h += histCard(p.id, "Ton historique", "Chaque exercice terminé est enregistré sur ton compte et ne peut pas être effacé.");
    return h;
  }
  function modulesCard(per) {
    var m = per.modules || {};
    return '<section class="card"><h2>Par entraînement</h2><p class="q">' + esc(perTxt().charAt(0).toUpperCase() + perTxt().slice(1)) + ".</p><table><thead><tr><th>Entraînement</th><th class=\"n\">Exercices</th><th class=\"n\">Réussite</th><th class=\"n\">Temps</th></tr></thead><tbody>" +
      ["coup", "lettre", "academie"].map(function (k) { var x = m[k] || {}; return "<tr><td>" + MOD[k] + '</td><td class="n">' + n(x.n) + '</td><td class="n">' + (x.n ? pct(x.ok) : "–") + '</td><td class="n">' + (x.n ? dur(x.time_s) : "–") + "</td></tr>"; }).join("") +
      "</tbody></table><p class=\"q\" style=\"margin:10px 0 0\">Réussite : la note moyenne rapportée au maximum (un coup juste, trois questions valides, 10 sur 10).</p></section>";
  }
  function activityCard(id) {
    return '<section class="card"><h2>Temps d’entraînement par jour</h2><p class="q">Minutes actives, ' + (S.days && S.days <= 30 ? "sur " + S.days + " jours" : "sur les 30 derniers jours") + '.</p><div class="chart" data-chart="' + esc(id) + '"><svg role="img" aria-label="Minutes d’entraînement par jour"></svg><div class="tip"></div></div></section>';
  }
  function histCard(id, title, note) {
    var h = S.hist[id];
    var body;
    if (!h || (h.loading && !h.rows.length)) body = '<div class="empty">Chargement de l’historique…</div>';
    else if (h.err && !h.rows.length) body = '<div class="err">Impossible de charger l’historique.</div>';
    else if (!h.rows.length) body = '<div class="empty">Aucun exercice ' + esc(perTxt()) + ".</div>";
    else body = '<div class="tscroll"><table class="hist"><thead><tr><th>Date</th><th>Entraînement</th><th>Cas</th><th>Résultat</th><th>Correction</th><th class="n">Durée</th></tr></thead><tbody>' +
      h.rows.map(function (r) {
        var o = S.open[r.id];
        return '<tr class="row' + (o ? " on" : "") + '" data-r="' + r.id + '" tabindex="0" aria-expanded="' + !!o + '"><td class="d">' + esc(dt(r.created_at)) + "</td><td>" + MOD[r.module] + "</td><td>" + esc(caseTxt(r)) + "</td><td>" + resTxt(r) + '</td><td class="muted">' + esc(MODE_TXT[r.mode] || r.mode) + '</td><td class="n">' + dur(r.duration_s) + "</td></tr>" +
          (o ? '<tr class="det"><td colspan="6">' + detail(r) + "</td></tr>" : "");
      }).join("") + "</tbody></table></div>" + (h.done ? "" : '<button type="button" class="btn more" data-more="' + esc(id) + '">' + (h.loading ? "Chargement…" : "Voir les exercices plus anciens") + "</button>");
    return '<section class="card" aria-label="' + esc(title) + '"><h2>' + esc(title) + '</h2><p class="q">' + esc(note) + " Clique sur une ligne pour voir le détail.</p>" + body + "</section>";
  }
  function detail(r) {
    var d = r.details || {}, out = [];
    if (r.module === "coup") {
      out.push("<div>Geste attendu : <b>" + esc(GESTE[d.attendu] || d.attendu || "–") + "</b> · joué : <b>" + esc(GESTE[d.joue] || d.joue || "–") + "</b>" + (d.sur === "sur" ? " · sûr de toi" : d.sur ? " · hésitant" : "") + (d.indice ? " · avec indice (ne compte pas)" : "") + "</div>");
      out.push("<div>Question : " + (d.question ? "« " + esc(d.question) + " »" : "aucune") + (d.question ? (d.question_ok ? " · passe les règles et ton jugement" : " · à retravailler") : "") + "</div>");
    } else if (r.module === "lettre") {
      (d.liens || []).forEach(function (l, k) {
        out.push("<div>I" + (k + 1) + " · " + (l.valide ? "valide" : "refusée") + " : " + (l.question ? "« " + esc(l.question) + " »" : "pas de question") + (l.fautes && l.fautes.length ? " · règles en faute : " + esc(l.fautes.join(", ")) : "") + "</div>");
      });
    } else {
      out.push("<div>Format " + esc(d.format || "") + " · points par critère : " + esc((d.criteres || []).map(num1).join(" · ")) + (d.eliminatoire ? " · formulation éliminatoire" : "") + "</div>");
      if (d.reponse) out.push("<div>Réponse : « " + esc(d.reponse) + " »</div>");
      if (d.reponse2) out.push("<div>Seconde réponse : « " + esc(d.reponse2) + " »</div>");
    }
    return out.join("") || "<div>Pas de détail.</div>";
  }

  // the team (admins): one row per person, the training and the sales of the period
  var COLS = [
    ["name", "Commercial", function (p) { return p.name; }],
    ["score", "Score", function (p) { return p.score; }],
    ["coup", "Le coup suivant", function (p) { return m(p, "coup").n || 0; }],
    ["lettre", "La lettre imposée", function (p) { return m(p, "lettre").n || 0; }],
    ["academie", "Maîtrise de l’offre", function (p) { return (p.academie || {}).validated || 0; }],
    ["n", "Exercices", function (p) { return (p.period || {}).n || 0; }],
    ["time", "Temps", function (p) { return (p.period || {}).time_s || 0; }],
    ["last", "Dernier entraînement", function (p) { return (p.total || {}).last_at || ""; }],
    ["calls", "Appels réalisés", function (p) { return (p.sales || {}).calls || 0; }],
    ["won", "Ventes", function (p) { return (p.sales || {}).won || 0; }],
    ["signed", "CA signé", function (p) { return Number((p.sales || {}).signed) || 0; }],
    ["collected", "Encaissé", function (p) { return Number((p.sales || {}).collected) || 0; }],
    ["per", "CA par appel", function (p) { var s = p.sales || {}; return s.calls ? (Number(s.signed) || 0) / s.calls : -1; }]
  ];
  function m(p, k) { return ((p.period || {}).modules || {})[k] || {}; }
  function teamHtml() {
    var ppl = (S.data.people || []).slice();
    var col = COLS.filter(function (c) { return c[0] === S.sort.k; })[0] || COLS[1];
    ppl.sort(function (a, b) { var x = col[2](a), y = col[2](b); return (x < y ? -1 : x > y ? 1 : 0) * S.sort.dir || String(a.name).localeCompare(String(b.name), "fr"); });
    var tot = { n: 0, t: 0, act: 0, sc: 0, calls: 0, signed: 0, coll: 0 };
    ppl.forEach(function (p) { var per = p.period || {}, s = p.sales || {}; tot.n += per.n || 0; tot.t += per.time_s || 0; if (per.n) tot.act++; tot.sc += Number(p.score) || 0; tot.calls += s.calls || 0; tot.signed += Number(s.signed) || 0; tot.coll += Number(s.collected) || 0; });
    var h = '<section class="tiles" aria-label="Synthèse de l’équipe" style="grid-template-columns:repeat(4,1fr)">' +
      '<div class="tile"><div class="k">Score moyen</div><div class="v">' + (ppl.length ? n(tot.sc / ppl.length) : "–") + '<small> / 100</small></div><div class="s">' + n(ppl.length) + " personne" + (ppl.length > 1 ? "s" : "") + " suivie" + (ppl.length > 1 ? "s" : "") + "</div></div>" +
      '<div class="tile"><div class="k">Exercices faits</div><div class="v">' + n(tot.n) + '</div><div class="s">' + perTxt() + " · " + n(tot.act) + " personne" + (tot.act > 1 ? "s" : "") + " entraînée" + (tot.act > 1 ? "s" : "") + "</div></div>" +
      '<div class="tile"><div class="k">Temps d’entraînement</div><div class="v">' + dur(tot.t) + '</div><div class="s">' + perTxt() + "</div></div>" +
      '<div class="tile"><div class="k">CA signé</div><div class="v">' + eur(tot.signed) + '</div><div class="s">' + n(tot.calls) + " appel" + (tot.calls > 1 ? "s" : "") + " réalisé" + (tot.calls > 1 ? "s" : "") + " · " + eur(tot.coll) + " encaissés</div></div></section>";
    var th = function (c, cls) { var on = S.sort.k === c[0]; return '<th class="' + (cls || "") + '"' + (on ? ' aria-sort="' + (S.sort.dir < 0 ? "descending" : "ascending") + '"' : "") + '><button type="button" data-sort="' + c[0] + '">' + c[1] + "</button></th>"; };
    h += '<section class="card"><h2>Par commercial</h2><p class="q">Score : depuis le début. Entraînement et ventes : ' + esc(perTxt()) + ". Clique sur une personne pour voir le détail de ses exercices.</p>" +
      '<div class="tscroll"><table class="team"><thead><tr class="grp"><th></th><th></th><th colspan="6">Entraînement</th><th colspan="5" class="n">Ventes</th></tr><tr>' +
      th(COLS[0]) + th(COLS[1], "n") + th(COLS[2], "n") + th(COLS[3], "n") + th(COLS[4], "n") + th(COLS[5], "n") + th(COLS[6], "n") + th(COLS[7]) + th(COLS[8], "n") + th(COLS[9], "n") + th(COLS[10], "n") + th(COLS[11], "n") + th(COLS[12], "n") + "</tr></thead><tbody>" +
      ppl.map(function (p) {
        var c = m(p, "coup"), l = m(p, "lettre"), a = m(p, "academie"), s = p.sales || {}, per = p.period || {};
        return '<tr class="row' + (S.sel === p.id ? " on" : "") + '" data-p="' + esc(p.id) + '" tabindex="0" aria-expanded="' + (S.sel === p.id) + '">' +
          '<td class="who">' + esc(p.name) + (p.me ? " (vous)" : "") + "<small>" + esc(p.role === "admin" ? "Administrateur" : p.role === "sales_lead" ? "Responsable commercial" : p.role === "sales" ? "Commercial" : p.active ? "" : "Ne fait plus partie de l’équipe") + "</small></td>" +
          '<td class="n"><b>' + n(p.score) + "</b></td>" +
          '<td class="n">' + (c.n ? n(c.n) + ' <span class="muted">· ' + pct(c.ok) + "</span>" : "–") + "</td>" +
          '<td class="n">' + (l.n ? n(l.n) + ' <span class="muted">· ' + pct(l.ok) + "</span>" : "–") + "</td>" +
          '<td class="n">' + n((p.academie || {}).validated) + '/100 <span class="muted">· ' + n(a.n) + "</span></td>" +
          '<td class="n">' + n(per.n) + "</td>" +
          '<td class="n">' + (per.time_s ? dur(per.time_s) : "–") + "</td>" +
          '<td class="d">' + esc((p.total || {}).last_at ? new Date(p.total.last_at).toLocaleDateString("fr-FR", { day: "numeric", month: "short" }) : "Jamais") + "</td>" +
          '<td class="n">' + n(s.calls) + "</td>" +
          '<td class="n">' + n(s.won) + "</td>" +
          '<td class="n">' + eur(s.signed) + "</td>" +
          '<td class="n">' + eur(s.collected) + "</td>" +
          '<td class="n">' + (s.calls ? eur((Number(s.signed) || 0) / s.calls) : "–") + "</td></tr>";
      }).join("") + "</tbody></table></div>" +
      '<p class="foot">Le coup suivant et La lettre imposée : exercices faits · part de réussite. Maîtrise de l’offre : cas validés (8/10 ou plus) · essais de la période. ' +
      "Appels réalisés : les appels tenus (R1, R2…) des prospects de la personne. CA signé : le prix des ventes conclues sur la période. Encaissé : ce que ces ventes ont rapporté à ce jour.</p></section>";
    var sel = ppl.filter(function (p) { return p.id === S.sel; })[0];
    if (sel) {
      h += '<section class="tiles" aria-label="' + esc(sel.name) + '">' + scoreTile(sel, "Score de " + sel.name) +
        '<div class="tile"><div class="k">Exercices</div><div class="v">' + n((sel.period || {}).n) + '</div><div class="s">' + perTxt() + " · " + n((sel.total || {}).n) + " en tout</div></div>" +
        '<div class="tile"><div class="k">Temps passé</div><div class="v">' + dur((sel.period || {}).time_s) + '</div><div class="s">' + perTxt() + " · " + dur((sel.total || {}).time_s) + " en tout</div></div>" +
        '<div class="tile"><div class="k">Premier entraînement</div><div class="v" style="font-size:20px">' + esc((sel.total || {}).first_at ? day(sel.total.first_at) : "–") + '</div><div class="s">dernier : ' + esc((sel.total || {}).last_at ? dt(sel.total.last_at) : "jamais") + "</div></div></section>";
      h += '<div class="two">' + modulesCard(sel.period || {}) + activityCard(sel.id) + "</div>";
      h += histCard(sel.id, "Historique de " + sel.name, "Les résultats de chacun sont enregistrés sur son compte et ne peuvent pas être effacés.");
    }
    return h;
  }

  // minutes per day, one series (bars), from the history rows loaded
  function drawChart() {
    var box = document.querySelector("[data-chart]"); if (!box) return;
    var id = box.getAttribute("data-chart"), h = S.hist[id], rows = (h && h.rows) || [];
    var N = S.days && S.days <= 30 ? S.days : 30, days = [], byDay = {};
    var today = new Date(); today.setHours(0, 0, 0, 0);
    for (var i = N - 1; i >= 0; i--) { var d = new Date(today); d.setDate(d.getDate() - i); days.push(d); byDay[d.toDateString()] = { s: 0, n: 0 }; }
    rows.forEach(function (r) { var k = new Date(r.created_at); k.setHours(0, 0, 0, 0); var b = byDay[k.toDateString()]; if (b) { b.s += r.duration_s || 0; b.n++; } });
    var svg = box.querySelector("svg"), W = box.clientWidth || 500, H = 150, pb = 20, pt = 8, max = 0;
    days.forEach(function (d) { max = Math.max(max, byDay[d.toDateString()].s / 60); });
    var top = max <= 10 ? 10 : Math.ceil(max / 10) * 10, bw = W / N, gap = Math.min(4, bw * 0.3);
    var y = function (v) { return pt + (H - pb - pt) * (1 - v / top); };
    var out = '<line x1="0" x2="' + W + '" y1="' + y(0) + '" y2="' + y(0) + '" stroke="#D6DEF0"/>' +
      '<line x1="0" x2="' + W + '" y1="' + y(top) + '" y2="' + y(top) + '" stroke="#EEF3FC"/><text x="0" y="' + (y(top) - 2) + '" font-size="10.5" fill="#5A6478">' + top + " min</text>";
    days.forEach(function (d, k) {
      var b = byDay[d.toDateString()], v = b.s / 60, x = k * bw + gap / 2, w = Math.max(1, bw - gap), yy = y(v), hh = y(0) - yy;
      if (hh > 0) out += '<path d="M' + x + "," + y(0) + "V" + (yy + Math.min(4, hh)) + "Q" + x + "," + yy + " " + (x + Math.min(4, w / 2)) + "," + yy + "H" + (x + w - Math.min(4, w / 2)) + "Q" + (x + w) + "," + yy + " " + (x + w) + "," + (yy + Math.min(4, hh)) + "V" + y(0) + 'Z" fill="#1E2A5E"/>';
      out += '<rect data-k="' + k + '" x="' + (k * bw) + '" y="0" width="' + bw + '" height="' + H + '" fill="transparent"/>';
      if (k === 0 || k === N - 1 || (N > 14 && k === Math.floor(N / 2))) out += '<text x="' + (k === N - 1 ? W : k === 0 ? 0 : x + w / 2) + '" y="' + (H - 4) + '" font-size="10.5" fill="#5A6478" text-anchor="' + (k === N - 1 ? "end" : k === 0 ? "start" : "middle") + '">' + d.toLocaleDateString("fr-FR", { day: "numeric", month: "short" }) + "</text>";
    });
    svg.setAttribute("viewBox", "0 0 " + W + " " + H); svg.innerHTML = out;
    var tip = box.querySelector(".tip");
    svg.onmousemove = function (e) {
      var t = e.target.getAttribute && e.target.getAttribute("data-k"); if (t == null) { tip.style.display = "none"; return; }
      var d = days[+t], b = byDay[d.toDateString()];
      tip.textContent = d.toLocaleDateString("fr-FR", { weekday: "short", day: "numeric", month: "short" }) + " · " + (b.s ? dur(b.s) : "0 min") + " · " + b.n + " exercice" + (b.n > 1 ? "s" : "");
      tip.style.left = ((+t + 0.5) * bw) + "px"; tip.style.top = y(b.s / 60) + "px"; tip.style.display = "block";
    };
    svg.onmouseleave = function () { tip.style.display = "none"; };
  }

  // ------------------------------------------------------------------ événements
  document.getElementById("per").addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b) return;
    S.days = +b.dataset.d; try { window.localStorage.setItem(KEYP, String(S.days)); } catch (x) {}
    S.open = {}; load();
  });
  document.getElementById("reload").addEventListener("click", load);
  function toggle(tr) {
    if (tr.dataset.r) { S.open[tr.dataset.r] = !S.open[tr.dataset.r]; render(); return; }
    if (tr.dataset.p) { S.sel = S.sel === tr.dataset.p ? null : tr.dataset.p; S.open = {}; render(); if (S.sel) loadHist(S.sel); }
  }
  document.getElementById("main").addEventListener("click", function (e) {
    var s = e.target.closest("[data-sort]");
    if (s) { var k = s.dataset.sort; S.sort = { k: k, dir: S.sort.k === k ? -S.sort.dir : (k === "name" ? 1 : -1) }; return render(); }
    var mo = e.target.closest("[data-more]"); if (mo) return loadHist(mo.dataset.more, true);
    var tr = e.target.closest("tr.row"); if (tr) toggle(tr);
  });
  document.getElementById("main").addEventListener("keydown", function (e) {
    if (e.key !== "Enter" && e.key !== " ") return;
    var tr = e.target.closest && e.target.closest("tr.row"); if (!tr) return; e.preventDefault(); toggle(tr);
  });
  window.addEventListener("resize", function () { clearTimeout(S.rz); S.rz = setTimeout(drawChart, 150); });
  // a result kept by one of the trainings (app/training/results_log.js) refreshes the figures
  var rt = null;
  function soon() { clearTimeout(rt); rt = setTimeout(load, 800); }
  if (P) { try { P.addEventListener("lnp-training-result", soon); } catch (e) {} }
  setInterval(function () { if (!document.hidden && P && !S.loading) load(); }, TEAM ? 120000 : 300000);
  load();
  window.LNP_RESULTATS = { S: S, load: load };
})();
</script>
