# Agent de qualification des leads LNP (analyse-appel/qualification) : lancé à la main sur les leads les plus récents, résultats
# enregistrés dans crm_lead_qualifications (042). Le dépôt est public : le journal ne montre que des numéros d'appel, des statuts
# et des nombres de jetons.
name: lead-qualification
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Nombre de leads (le dernier R1 de chacun, les plus récents d'abord)"
        default: "30"
      again:
        description: "Aussi les leads déjà qualifiés avec cette version de la consigne"
        type: boolean
        default: false
  push:
    paths: ["analyse-appel/qualification/**", ".github/workflows/qualification.yml"]
  pull_request:
    paths: ["analyse-appel/qualification/**", ".github/workflows/qualification.yml"]
env:
  SUPABASE_URL: ${{ vars.SUPABASE_URL }}
jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest && cd analyse-appel/qualification && python3 -m pytest -q tests
  qualify:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: lead-qualification
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Qualifier les leads
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 analyse-appel/qualification/executer.py --limit "${{ inputs.limit }}" ${{ inputs.again && '--again' || '' }}
