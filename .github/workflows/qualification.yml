# LNP lead qualification agent (call-analysis/qualification): run by hand on the most recent leads, results stored in
# crm_lead_qualifications (042). The repository is public: the log shows call ids, statuses and token counts only.
name: lead-qualification
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Number of leads (latest R1 of each, most recent first)"
        default: "30"
      again:
        description: "Also the leads already qualified with this prompt version"
        type: boolean
        default: false
  push:
    paths: ["call-analysis/qualification/**", ".github/workflows/qualification.yml"]
  pull_request:
    paths: ["call-analysis/qualification/**", ".github/workflows/qualification.yml"]
env:
  SUPABASE_URL: ${{ vars.SUPABASE_URL }}
jobs:
  test:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest && cd call-analysis/qualification && python3 -m pytest -q tests
  qualify:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    concurrency:
      group: lead-qualification
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Qualify the leads
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python3 call-analysis/qualification/run.py --limit "${{ inputs.limit }}" ${{ inputs.again && '--again' || '' }}
