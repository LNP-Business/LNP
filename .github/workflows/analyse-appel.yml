# Analyse d'appel LNP (analyse-appel/PLAN.md) : tests du moteur et de l'exécutant à chaque changement ; l'exécutant tourne
# chaque heure et à la demande. Secret GitHub nécessaire : SUPABASE_SERVICE_ROLE_KEY (Supabase › Project settings › API keys).
# Sans lui, les tests tournent sans les vraies transcriptions (25 tests de l'annexe B ignorés) et l'exécutant ne fait rien.
# La clé du modèle reste dans Supabase (secret de fonction ANTHROPIC_API_KEY, lu par la fonction Edge callqa-llm).
name: Analyse d'appel
on:
  push:
    branches: [main]
    paths: ["analyse-appel/**", ".github/workflows/analyse-appel.yml"]
  pull_request:
    paths: ["analyse-appel/**", ".github/workflows/analyse-appel.yml"]
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      effort:
        description: "Effort du modèle pour cette exécution : none (sans réflexion, défaut LNP), low, ou default (le défaut de chaque modèle), pour les comparer"
        type: choice
        options: [none, low, default]
        default: none
env:
  SUPABASE_URL: ${{ vars.SUPABASE_URL }}  # LNP : variable du dépôt, https://<ref>.supabase.co
jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - name: Vraies transcriptions des tests de l'annexe B (stockage privé, jamais dans git)
        env:
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::SUPABASE_SERVICE_ROLE_KEY absent : les tests de l'annexe B sur les vraies transcriptions sont ignorés."
            echo "CALLQA_SKIP_MISSING_CORPUS=1" >> "$GITHUB_ENV"; exit 0
          fi
          if ! curl -fsS -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "$SUPABASE_URL/storage/v1/object/callqa-fixtures/transcripts.tar.gz" -o /tmp/t.tgz; then
            echo "::notice::callqa-fixtures/transcripts.tar.gz introuvable dans le stockage : les tests de l'annexe B sur les vraies transcriptions sont ignorés."
            echo "CALLQA_SKIP_MISSING_CORPUS=1" >> "$GITHUB_ENV"; exit 0
          fi
          mkdir -p analyse-appel/moteur/tests/fixtures/transcripts
          tar xzf /tmp/t.tgz -C analyse-appel/moteur/tests/fixtures/transcripts
          rm /tmp/t.tgz
      - name: Moteur complet
        run: cd analyse-appel/moteur && python3 -m pytest -q tests
      - name: Exécutant
        run: cd analyse-appel/executant && python3 -m pytest -q tests
      - name: Moteur allégé
        run: cd analyse-appel/allege && python3 -m pytest -q tests

  worker:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    concurrency:
      group: analyse-appel-executant
      cancel-in-progress: false
    steps:
      - name: Rien à faire tant que le secret n'est pas défini
        id: ready
        env:
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "::notice::SUPABASE_SERVICE_ROLE_KEY absent : aucun appel analysé."; echo "go=false" >> "$GITHUB_OUTPUT";
          else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.go == 'true'
      - uses: actions/setup-python@v5
        if: steps.ready.outputs.go == 'true'
        with:
          python-version: "3.11"
      - name: Analyser les appels en attente
        if: steps.ready.outputs.go == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CALLQA_EFFORT: ${{ inputs.effort || 'none' }}
        run: python3 analyse-appel/executant/executer.py --budget-min 120
