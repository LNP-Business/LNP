# CRM ingestion functions: unit tests on every change; deploy to the Supabase project skl-os from main only
# (the same project as the app: decision D13), when its secrets exist.
# Secrets (GitHub › Settings › Secrets and variables › Actions): SUPABASE_ACCESS_TOKEN, SUPABASE_PROJECT_REF.
# See docs/crm/setup.md. The functions only store raw requests (phase 0).
name: CRM functions

on:
  push:
    branches: ["main", "crm-*"]
    paths: ["supabase/**", "web/supabase/**", "skl-os/crm/**", "web/api/**", "web/tests/**", "web/package*.json", ".github/workflows/crm-functions.yml"]
  pull_request:
    paths: ["supabase/**", "web/supabase/**", "skl-os/crm/**", "web/api/**", "web/tests/**", "web/package*.json", ".github/workflows/crm-functions.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/*/index.ts
      - run: deno test --allow-env --allow-read supabase/tests

  sql:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - run: web/supabase/tests/run.sh
      - run: node skl-os/crm/data.test.js

  # Claude connector (web/api/mcp.js, web/api/oauth.js): OAuth flow and the 8 tools on an in-memory Supabase
  connector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm test

  deploy:
    needs: [test, sql]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
    steps:
      - name: Skip when the deploy secrets are not set yet
        id: ready
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$PROJECT_REF" ]; then
            echo "::notice::Deploy secrets not set: functions not deployed (docs/crm/setup.md, step 2)."
            echo "go=false" >> "$GITHUB_OUTPUT"
          else
            echo "go=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.go == 'true'
      - uses: supabase/setup-cli@v1
        if: steps.ready.outputs.go == 'true'
        with:
          version: latest
      - name: Deploy the ingestion functions and the worker
        if: steps.ready.outputs.go == 'true'
        run: |
          for f in iclosed-in fathom-in sendblue-in whop-in process-inbox crm-import callqa-llm sla-tick; do
            supabase functions deploy "$f" --remote="$PROJECT_REF" --no-verify-jwt --yes
          done
