# LNP call analysis (call-analysis/PLAN.md): engine and worker tests on every change; the worker runs every hour and on demand.
# GitHub secret needed: SUPABASE_SERVICE_ROLE_KEY (Supabase › Project settings › API keys). Without it the tests run without
# the real transcripts (25 Annex B tests skipped) and the worker does nothing. The model key stays in Supabase
# (function secret ANTHROPIC_API_KEY, read by the Edge Function callqa-llm).
name: Call analysis
on:
  push:
    branches: [main]
    paths: ["call-analysis/**", ".github/workflows/call-analysis.yml"]
  pull_request:
    paths: ["call-analysis/**", ".github/workflows/call-analysis.yml"]
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:
    inputs:
      effort:
        description: "Model effort of this run: none (no thinking, LNP default), low, or default (each model's own default), to compare them"
        type: choice
        options: [none, low, default]
        default: none
      task:
        description: "worker: analyse the queued calls; measure: run the quality measure (call-analysis/qa) on the reference set"
        type: choice
        options: [worker, measure]
        default: worker
      repeat:
        description: "measure: analyses per call (5 to measure the reproducibility, C4)"
        default: "1"
env:
  SUPABASE_URL: ${{ vars.SUPABASE_URL }}  # LNP: repository variable, https://<ref>.supabase.co
jobs:
  test:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pytest
      - name: Real transcripts of the Annex B tests (private Storage bucket, never in git)
        env:
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::SUPABASE_SERVICE_ROLE_KEY not set: Annex B tests on real transcripts are skipped."
            echo "CALLQA_SKIP_MISSING_CORPUS=1" >> "$GITHUB_ENV"; exit 0
          fi
          if ! curl -fsS -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
            "$SUPABASE_URL/storage/v1/object/callqa-fixtures/transcripts.tar.gz" -o /tmp/t.tgz; then
            echo "::notice::callqa-fixtures/transcripts.tar.gz not found in Storage: Annex B tests on real transcripts are skipped."
            echo "CALLQA_SKIP_MISSING_CORPUS=1" >> "$GITHUB_ENV"; exit 0
          fi
          mkdir -p call-analysis/engine/tests/fixtures/transcripts
          tar xzf /tmp/t.tgz -C call-analysis/engine/tests/fixtures/transcripts
          rm /tmp/t.tgz
      - name: Engine (184 tests)
        run: cd call-analysis/engine && python3 -m pytest -q tests
      - name: Worker
        run: cd call-analysis/worker && python3 -m pytest -q tests
      - name: Lite engine
        run: cd call-analysis/lite && python3 -m pytest -q tests
      - name: Quality measure
        run: cd call-analysis/qa && python3 -m pytest -q tests

  worker:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.task != 'measure')
    runs-on: ubuntu-latest
    timeout-minutes: 150
    concurrency:
      group: call-analysis-worker
      cancel-in-progress: false
    steps:
      - name: Skip when the secret is not set yet
        id: ready
        env:
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$KEY" ]; then echo "::notice::SUPABASE_SERVICE_ROLE_KEY not set: no call analysed."; echo "go=false" >> "$GITHUB_OUTPUT";
          else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.ready.outputs.go == 'true'
      - uses: actions/setup-python@v5
        if: steps.ready.outputs.go == 'true'
        with:
          python-version: "3.11"
      - name: Analyse the queued calls
        if: steps.ready.outputs.go == 'true'
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CALLQA_EFFORT: ${{ inputs.effort || 'none' }}
        run: python3 call-analysis/worker/run.py --budget-min 120

  # Quality measure (call-analysis/qa/README.md): the reference set and its cases come from the private bucket
  # callqa-fixtures (qa/reference.tar.gz, qa/cases.tar.gz, never in git); the report, which quotes the calls, goes back to
  # the bucket (qa/reports/), never to the log or to an artifact. The log shows numbers only.
  measure:
    if: github.event_name == 'workflow_dispatch' && inputs.task == 'measure'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Measure the lite engine on the reference set
        env:
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EFFORT: ${{ inputs.effort == 'none' && 'low' || inputs.effort }}
          REPEAT: ${{ inputs.repeat }}
        run: |
          set -e
          mkdir -p /tmp/qa/reference /tmp/qa/cases
          for f in reference cases; do
            curl -fsS -H "apikey: $KEY" -H "Authorization: Bearer $KEY" \
              "$SUPABASE_URL/storage/v1/object/callqa-fixtures/qa/$f.tar.gz" -o /tmp/qa/$f.tgz
            tar xzf /tmp/qa/$f.tgz -C /tmp/qa/$f
          done
          python3 call-analysis/qa/qa_run.py --cases /tmp/qa/cases --refs /tmp/qa/reference --mode live \
            --repeat "${REPEAT:-1}" --effort "$EFFORT" --out /tmp/qa/report.json || true
          curl -fsS -X POST -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H "content-type: application/json" \
            --data-binary @/tmp/qa/report.json \
            "$SUPABASE_URL/storage/v1/object/callqa-fixtures/qa/reports/${{ github.run_id }}.json"
          rm -rf /tmp/qa
