<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cockpit Overview · proposal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F6F4EF;--card:#FFFFFF;--ink:#1B1B18;--ink2:#3D3A33;--mut:#5E5B53;--mut2:#8E8A80;--line:#E3DFD5;--line2:#EFEBE3;--soft:#ECE8DF;
  --gold:#D9B46A;--gold2:#9A6614;--goldsoft:#FBF6EC;
  --green:#2E7D4F;--greent:#1E5E38;--greens:#E6F2EA;
  --amber:#B45309;--ambert:#8A3F06;--ambers:#FDF1E3;
  --red:#B42318;--redt:#9B1C12;--reds:#FDECEA;
  --sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;--serif:Fraunces,Georgia,serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
#stage{width:1440px;height:900px;display:flex;transform-origin:0 0;position:absolute;left:0;top:0}
nav{width:232px;flex-shrink:0;background:#1B1B18;padding:26px 16px 18px;display:flex;flex-direction:column;gap:3px;color:#C9C4B7}
.logo{font-family:var(--serif);font-size:28px;font-weight:600;color:#F6F4EF;padding:0 12px 16px}.logo span{color:var(--gold)}
.sys{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:#2C2B26;border-radius:12px;margin-bottom:16px}
.sys span{display:block;padding:8px 6px;border-radius:9px;text-align:center;font-size:12px;line-height:1.3}.sys .on{background:#F6F4EF;color:#1B1B18;font-weight:600}
.grp{padding:0 14px 6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8E8A80}.it+.grp{margin-top:12px}
.it{display:flex;align-items:center;padding:10px 14px;border-radius:10px;font-size:15px}.it.on{font-weight:600;color:var(--gold);background:#34322C;box-shadow:inset 3px 0 0 var(--gold)}
.it b{margin-left:auto;min-width:22px;padding:1px 7px;border-radius:999px;background:var(--red);color:#fff;font-size:12px;text-align:center}
main{flex:1;min-width:0;padding:16px 24px 18px;display:grid;grid-template-rows:auto auto minmax(0,1.08fr) minmax(0,1fr);gap:12px;position:relative}
.top{display:flex;align-items:center;gap:14px}
.seg{display:flex;gap:3px;padding:4px;background:var(--soft);border-radius:10px}
.seg button{border:0;background:transparent;font:inherit;font-size:13px;color:var(--ink2);padding:6px 11px;border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--ink);color:#fff;font-weight:600}
.sp{flex:1}
.pill{display:flex;align-items:center;gap:10px;padding:7px 12px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:12px;color:var(--mut)}
.pill b{font-family:var(--mono);color:var(--ink);font-size:13px}
.health{display:flex;height:10px;width:150px;border-radius:5px;overflow:hidden;gap:2px}
.health i{display:block;height:100%}
.row{display:grid;gap:14px;min-height:0}
.rA{grid-template-columns:minmax(0,9fr) minmax(0,3fr)}
.rB{grid-template-columns:minmax(0,5.2fr) minmax(0,3.2fr) minmax(0,3.2fr)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:8px}
.ch h2{margin:0;font-family:var(--serif);font-weight:500;font-size:19px;white-space:nowrap}
.q{font-size:12px;color:var(--mut);white-space:nowrap}
svg{display:block;overflow:visible}
.num{font-family:var(--mono)}
/* key results: one at a time */
.krnav{display:flex;align-items:center;gap:8px}
.arrow{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:16px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.arrow:hover{border-color:var(--ink)}
.chips{display:flex;gap:5px}
.chip{width:26px;height:26px;border-radius:7px;border:0;font:inherit;font-family:var(--mono);font-size:12px;font-weight:600;color:#fff;cursor:pointer;opacity:.45}
.chip.on{opacity:1;box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
.krv{display:grid;grid-template-columns:230px minmax(0,1fr);gap:20px;flex:1;min-height:0}
.kri{display:flex;flex-direction:column;gap:8px;min-width:0}
.kri .o{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut2)}
.kri h3{margin:0;font-family:var(--serif);font-weight:500;font-size:22px;line-height:1.15}
.kri .who{font-size:12px;color:var(--mut)}
.kri .big{display:flex;align-items:baseline;gap:8px;margin-top:auto}
.kri{gap:7px}
.kri .big b{font-family:var(--mono);font-size:38px;font-weight:600;line-height:1}
.kri .big span{font-size:11px;color:var(--mut)}
.facts{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.facts div{background:var(--bg);border-radius:8px;padding:6px 9px}
.facts span{display:block;font-size:10.5px;color:var(--mut)}
.facts b{font-family:var(--mono);font-size:14px}
#krchart{min-width:0;min-height:0}
.nextm{background:var(--goldsoft);border:1px solid #E6D3A8;border-radius:8px;padding:6px 9px}.nextm span{display:block;font-size:10.5px;color:var(--gold2)}.nextm b{font-size:13px}

.krs{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;flex:1;min-height:0}
.kr{display:flex;flex-direction:column;gap:6px;min-width:0;min-height:0;padding:10px 12px 12px;border-radius:12px;background:var(--bg);cursor:pointer;border:1px solid transparent;position:relative}
.kr:hover{border-color:var(--gold)}
.kr .o{font-size:10px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kr .n{font-size:14px;font-weight:600;line-height:1.25;min-height:35px}
.kr .who{font-size:11px;color:var(--mut)}
.kr .ch2{flex:1;min-height:0}
.kr .foot{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.kr .ratio{font-family:var(--mono);font-size:22px;font-weight:600}
.kr .val{font-family:var(--mono);font-size:12px;color:var(--mut);text-align:right}
.st{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.st i{width:7px;height:7px;border-radius:50%}
.s-green{background:var(--greens);color:var(--greent)}.s-green i{background:var(--green)}
.s-amber{background:var(--ambers);color:var(--ambert)}.s-amber i{background:var(--amber)}
.s-red{background:var(--reds);color:var(--redt)}.s-red i{background:var(--red)}
.s-stale{background:var(--soft);color:var(--ink2)}.s-stale i{border:2px solid var(--mut);background:transparent;width:8px;height:8px}
/* pulse */
.pulse{display:flex;flex-direction:column;justify-content:space-between;flex:1;gap:8px}
.pr{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-top:1px solid var(--line2)}
.pr:first-child{border-top:0;padding-top:2px}
.pr .h{display:flex;justify-content:space-between;align-items:baseline}
.pr .l{font-size:13px;font-weight:600}
.pr .v{font-family:var(--serif);font-size:30px;line-height:1}
.pr .d{font-family:var(--mono);font-size:12px;font-weight:600}
.bul{position:relative;height:10px;border-radius:5px;background:var(--soft)}
.bul i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.bul u{position:absolute;top:-4px;width:2px;height:18px;background:var(--ink)}
.bul+small{font-size:11px;color:var(--mut2)}
/* actions */
.acts{display:flex;flex-direction:column;flex:1;min-height:0}
.ar{display:grid;grid-template-columns:10px minmax(0,1fr) 28px 44px;gap:10px;align-items:center;flex:0 1 50px;border-top:1px solid var(--line2);min-height:0;cursor:pointer}
.ar:hover{background:var(--goldsoft)}
.dot{width:9px;height:9px;border-radius:50%}
.ar .t{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ar .k{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ar .k b{color:var(--redt)}
.av{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:#fff}
.age{font-family:var(--mono);font-size:12px;color:var(--mut);text-align:right}
.mini-seg{display:flex;gap:2px;padding:3px;background:var(--soft);border-radius:8px}
.mini-seg button{border:0;background:transparent;font:inherit;font-size:12px;padding:3px 8px;border-radius:6px;cursor:pointer;color:var(--ink2)}
.mini-seg button.on{background:var(--ink);color:#fff;font-weight:600}
.mini-seg button b{font-family:var(--mono);margin-left:4px}
/* load */
.load{display:flex;flex-direction:column;flex:1;justify-content:space-around}
.lr{display:grid;grid-template-columns:84px minmax(0,1fr) 40px;gap:10px;align-items:center}
.lr .n{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lbar{position:relative;height:18px;border-radius:5px;background:var(--soft)}
.lbar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px}
.lbar u{position:absolute;top:-4px;width:2px;height:26px;background:var(--ink)}
.lbar s{position:absolute;top:3px;height:12px;display:flex;gap:3px;text-decoration:none}
.lbar s em{width:12px;height:12px;border-radius:3px;font-style:normal;font-size:9px;font-weight:700;color:#fff;display:inline-flex;align-items:center;justify-content:center}
.lr .p{font-family:var(--mono);font-size:13px;font-weight:600;text-align:right}
.legend{display:flex;gap:12px;font-size:11px;color:var(--mut);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend em{width:10px;height:10px;border-radius:3px;display:inline-block}
/* explorations */
.ex{display:flex;flex-direction:column;flex:1;min-height:0;gap:6px}
.xr{display:flex;flex-direction:column;gap:5px;padding:7px 0;border-top:1px solid var(--line2)}
.xr:first-child{border-top:0}
.xr .t{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb{position:relative;height:12px;border-radius:4px;background:var(--soft)}
.tb i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.xr .m{display:flex;justify-content:space-between;font-size:11px;color:var(--mut)}
.xs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:auto}
.xs div{background:var(--bg);border-radius:9px;padding:7px 8px;display:flex;flex-direction:column;gap:2px}
.xs b{font-family:var(--serif);font-weight:500;font-size:20px;line-height:1}
.xs span{font-size:10.5px;color:var(--mut);line-height:1.2}
/* learning */
.lrn{display:flex;flex-direction:column;flex:1;gap:22px}
.lt{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}
.br{display:grid;grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"n x" "b b";gap:3px 8px;align-items:center;font-size:12px;padding:4px 0}.br>span:first-child{grid-area:n}.br .b{grid-area:b}.br .x{grid-area:x}
.br .b{height:10px;border-radius:4px;background:var(--soft);position:relative}.br .b i{position:absolute;left:0;top:0;bottom:0;border-radius:4px}
.br .x{font-family:var(--mono);font-size:12px;font-weight:600;text-align:right}
/* decisions */
.decs{display:flex;flex-direction:column;flex:1;min-height:0}
.dh,.dr{display:grid;grid-template-columns:minmax(0,1fr) 200px;gap:12px;align-items:center}
.dh{font-size:10px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut2);padding-bottom:6px;border-bottom:1px solid var(--line)}
.days{display:grid;grid-template-columns:1.1fr repeat(5,1fr);text-align:center;line-height:1.25;letter-spacing:.03em}
.days span:first-child{color:var(--redt)}
.days .td{color:var(--ink);font-weight:700}
.dr{flex:0 1 38px;border-bottom:1px solid var(--line2);cursor:pointer;min-height:0}
.dr:hover{background:var(--goldsoft)}
.dr .t{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dr .k{display:flex;gap:7px;align-items:center;font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;min-width:0}
.dr .k .t{flex:0 1 auto;min-width:0}
.mk.ex{background:#fff!important;border:3px solid var(--c);width:16px;height:16px;box-shadow:none}
.lg{display:flex;gap:10px;font-size:11px;color:var(--mut)}.lg span{display:inline-flex;align-items:center;gap:4px}.lg i{width:9px;height:9px;border-radius:50%;background:var(--ink);display:inline-block}
.tag{font-size:10px;font-weight:700;letter-spacing:.03em;padding:1px 6px;border-radius:5px;white-space:nowrap}
.strip{position:relative;height:26px;display:grid;grid-template-columns:1.1fr repeat(5,1fr)}
.strip>i{border-left:1px dashed var(--line)}
.strip>i:first-child{border-left:0;background:#FDF5F3;border-radius:6px 0 0 6px}
.strip>i.td{background:var(--goldsoft)}
.mk{position:absolute;top:50%;transform:translate(-50%,-50%);width:16px;height:16px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.08)}
.mk.rv{border-radius:4px}
/* brief */
.brief{display:grid;grid-template-columns:auto repeat(3,minmax(0,1fr));gap:10px;align-items:stretch}
.brief .lab{display:flex;align-items:center;font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold2);padding-right:4px}
.bi{display:flex;align-items:center;gap:9px;padding:8px 12px;border-radius:10px;background:var(--card);border:1px solid var(--line);font-size:13px;line-height:1.3;cursor:pointer;text-align:left;font-family:inherit;color:var(--ink);min-width:0}
.bi:hover{border-color:var(--gold)}
.bi i{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.bi span{overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.bi b{font-weight:700}
/* kr extras */
.krbody{display:flex;flex-direction:column;gap:8px;min-width:0;min-height:0}
.krx{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.krx>div{border-radius:8px;padding:6px 10px;display:flex;justify-content:space-between;align-items:center;gap:10px;min-width:0}
.krx span{font-size:10.5px;color:var(--mut);display:block}
.krx b{font-size:13px}
.krx .vv{font-family:var(--mono);font-size:16px;font-weight:600;white-space:nowrap}
.lead{background:var(--bg)}
.why{border:0;background:var(--ink);color:var(--gold);font:inherit;font-size:12px;font-weight:600;border-radius:8px;padding:6px 10px;cursor:pointer}
/* since friday */
.feed{display:flex;flex-direction:column;flex:1;min-height:0;overflow:hidden}
.ev{display:grid;grid-template-columns:16px minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 0;border-top:1px solid var(--line2);font-size:12.5px}
.ev:first-child{border-top:0}
.ev .ic{width:16px;height:16px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff}
.ev .tx{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ev .d{font-size:11px;color:var(--mut2);font-family:var(--mono)}
/* drawer */
#veil{position:absolute;inset:0;background:rgba(27,27,24,.35);opacity:0;pointer-events:none;transition:opacity .15s;z-index:20}
#drawer{position:absolute;top:0;right:0;bottom:0;width:440px;background:#fff;box-shadow:-12px 0 40px rgba(27,27,24,.18);transform:translateX(105%);transition:transform .2s;z-index:21;padding:24px 26px;display:flex;flex-direction:column;gap:14px}
#drawer.open{transform:none}#veil.open{opacity:1;pointer-events:auto}
#drawer .x{position:absolute;top:16px;right:16px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:18px;cursor:pointer}
#drawer .ey{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
#drawer h3{margin:0;font-family:var(--serif);font-weight:500;font-size:24px;line-height:1.2;padding-right:40px}
.chain{display:flex;flex-direction:column}
.node{display:grid;grid-template-columns:22px minmax(0,1fr);gap:12px;position:relative;padding-bottom:14px}
.node:not(:last-child)::after{content:"";position:absolute;left:10px;top:22px;bottom:0;width:2px;background:var(--line)}
.node .c{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700}
.node .k{font-size:10.5px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--mut)}
.node .t{font-size:14px;font-weight:600;line-height:1.3}
.node .m{font-size:12px;color:var(--mut);margin-top:2px}
.acts2{display:flex;flex-direction:column;gap:8px;margin-top:auto}
.btn{min-height:42px;border-radius:10px;font:inherit;font-size:14px;font-weight:600;cursor:pointer;padding:0 14px;text-align:left;display:flex;justify-content:space-between;align-items:center}
.btn.p{background:var(--ink);color:var(--gold);border:0}.btn.s{background:#fff;color:var(--ink);border:1px solid var(--line)}
#toast{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);background:var(--ink);color:#F6F4EF;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;z-index:30;pointer-events:none}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:#F6F4EF;font-size:12px;line-height:1.4;padding:8px 10px;border-radius:8px;max-width:260px;opacity:0;transition:opacity .12s;z-index:9}
.note{position:fixed;left:12px;bottom:12px;z-index:8;background:var(--gold);color:var(--ink);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:6px}
</style>
</head>
<body>
<div class="note">Proposal · not live</div>
<div id="stage">
<nav aria-label="Main navigation">
  <div class="logo">SKL <span>OS</span></div>
  <div class="sys"><span class="on">Operating<br>System</span><span>Knowledge<br>System</span></div>
  <div class="grp">Operating System</div>
  <div class="it on">Cockpit</div><div class="it">Roadmap</div><div class="it">Inbox<b>4</b></div><div class="it">My Day<b>1</b></div><div class="it">Decisions<b>5</b></div><div class="it">Weekly Review<b>3</b></div>
  <div class="grp">Sales Ops</div><div class="it">CRM</div>
</nav>
<main>
  <header class="top">
    <div class="seg" role="group" aria-label="Cockpit view"><button class="on">Overview</button><button>Marketing</button><button>Sales</button><button>Finance</button></div>
    <span class="sp"></span>
    <div class="pill" id="health"></div>
    <div class="pill" id="hyg"></div>
  </header>
  <div class="brief" id="brief"></div>

  <section class="row rA">
    <div class="card">
      <div class="ch"><h2>Key results</h2><div class="krnav"><button class="arrow" id="krprev" aria-label="Previous key result">←</button><div class="chips" id="chips"></div><button class="arrow" id="krnext" aria-label="Next key result">→</button></div></div>
      <div class="krv"><div class="kri" id="kri"></div><div class="krbody"><div id="krchart" style="flex:1"></div><div class="krx" id="krx"></div></div></div>
    </div>
    <div class="card">
      <div class="ch"><h2>Pulse</h2><span class="q">vs target · last week</span></div>
      <div class="pulse" id="pulse"></div>
    </div>
  </section>

  <section class="row rB">
    <div class="card">
      <div class="ch"><h2>Decisions</h2><span class="q" id="decq"></span></div>
      <div class="decs" id="decs"></div>
    </div>
    <div class="card">
      <div class="ch"><h2>Needs action</h2><div class="mini-seg" id="actseg"></div></div>
      <div class="acts" id="acts"></div>
    </div>
    <div class="card">
      <div class="ch"><h2>Since Saturday</h2><span class="q">last review · 9 Oct</span></div>
      <div class="feed" id="feed"></div>
    </div>
  </section>
</main>
<div id="veil"></div>
<aside id="drawer" role="dialog" aria-modal="true" aria-label="Why and what to do"></aside>
<div id="toast" role="status"></div>
</div>
<div id="tip" role="tooltip"></div>

/* ---- pace: last two check-ins vs what the target needs ---- */
function paces(k){
  const cks=[[0,k.baseline]].concat(k.checkins.map(([d,v])=>[day(d),v])), a=cks[cks.length-1], b=cks.length>1?cks[cks.length-2]:null;
  const wl=Math.max(1,(QDAYS-today)/7), need=(k.target-k.current)/wl, lowerBetter=k.target<k.baseline;
  const f=v=>{const sgn=v>0?"+":v<0?"−":"";const a=Math.abs(v);return sgn+(k.unit==="eur"?fmt(Math.round(a),"eur"):k.unit==="eur2"?"€"+a.toFixed(2):k.unit==="pct"?(Math.round(a*10)/10)+" pts":(a>=10?Math.round(a):Math.round(a*10)/10))};
  if(k.status==="stale"||!b) return {pace:"—",need:lowerBetter&&k.current<=k.target?"at target":f(need),tone:"var(--mut)",ok:null};
  const p=(a[1]-b[1])/Math.max(1,a[0]-b[0])*7, ok=lowerBetter?(k.current<=k.target||p<=need):p>=need;
  return {pace:f(p),need:lowerBetter&&k.current<=k.target?"at target":f(need),tone:ok?"var(--greent)":"var(--redt)",ok,p,n:need};
}

  bindTips(el("kri")); bindTips(el("krx"));

function chart(k){
  const box=el("krchart"), W=box.clientWidth, H=box.clientHeight; if(W<100||H<80) return;
  const L=56,R=16,T=26,B=46, iw=W-L-R, ih=H-T-B;
  const lowerBetter=k.target<k.baseline;
  const pts=[[0,k.baseline]].concat(k.checkins.map(([d,v])=>[day(d),v])); if(k.status!=="stale") pts.push([today,k.current]);
  const cks=[[0,k.baseline]].concat(k.checkins.map(([d,v])=>[day(d),v])), a=cks[cks.length-1], b=cks.length>1?cks[cks.length-2]:cks[0];
  const last=pts[pts.length-1];
  let proj=null;
  if(k.status!=="stale"){ proj=last[1]+(a[1]-b[1])/Math.max(1,a[0]-b[0])*(QDAYS-last[0]); const cap=k.target+(k.target-k.baseline)*.25; proj=lowerBetter?Math.max(proj,cap):Math.min(proj,cap); }
  const vals=[k.baseline,k.target,k.current,k.expected].concat(k.checkins.map(c=>c[1])).concat(proj===null?[]:[proj]);
  let lo=Math.min(...vals), hi=Math.max(...vals); const pad=(hi-lo)*.12||1; lo-=pad; hi+=pad; if(lo<0&&Math.min(...vals)>=0) lo=0;
  const X=d=>L+iw*Math.max(0,Math.min(QDAYS,d))/QDAYS, Y=v=>T+ih-(v-lo)/(hi-lo)*ih;
  const col=COL[k.status];
  let s=`<svg width="${W}" height="${H}" role="img" aria-label="${k.name}: plan, actual and projection over the quarter">`;
  // grid + y ticks
  [k.baseline,(k.baseline+k.target)/2,k.target].forEach(v=>{s+=`<line x1="${L}" x2="${L+iw}" y1="${Y(v)}" y2="${Y(v)}" stroke="#EFEBE3"/><text x="${L-8}" y="${Y(v)+4}" text-anchor="end" font-family="IBM Plex Mono" font-size="11" fill="#8E8A80">${fmt(Math.round(v*100)/100,k.unit)}</text>`});
  // weeks
  for(let w=1;w<=13;w++){const x=X((w-.5)*7);s+=`<text x="${x}" y="${T+ih+18}" text-anchor="middle" font-size="10.5" fill="${w===3?"#1B1B18":"#8E8A80"}" font-weight="${w===3?700:400}">W${w}</text>`}
  // today band
  s+=`<rect x="${X(14)}" y="${T}" width="${X(21)-X(14)}" height="${ih}" fill="#FBF6EC"/>`;
  // plan
  s+=`<line x1="${X(0)}" y1="${Y(k.baseline)}" x2="${X(QDAYS)}" y2="${Y(k.target)}" stroke="#1B1B18" stroke-width="1.5" stroke-dasharray="5 5"/>`;
  s+=`<line x1="${X(QDAYS)-14}" x2="${X(QDAYS)+6}" y1="${Y(k.target)}" y2="${Y(k.target)}" stroke="#1B1B18" stroke-width="3"/>`;
  s+=`<text x="${X(QDAYS)}" y="${Y(k.target)-8}" text-anchor="end" font-size="11" font-weight="600" fill="#1B1B18">target</text>`;
  // actual + projection (capped a quarter beyond target)
  if(proj!==null){
    s+=`<line x1="${X(last[0])}" y1="${Y(last[1])}" x2="${X(QDAYS)}" y2="${Y(proj)}" stroke="${col}" stroke-width="2" stroke-dasharray="1 5" stroke-linecap="round"/>`;
  }
  s+=`<polyline points="${pts.map(p=>X(p[0])+","+Y(p[1])).join(" ")}" fill="none" stroke="${col}" stroke-width="3" stroke-linejoin="round"/>`;
  pts.slice(1).forEach(p=>{s+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="4" fill="#fff" stroke="${col}" stroke-width="2"/>`});
  s+=`<text x="${X(last[0])+10}" y="${Y(last[1])-10}" font-family="IBM Plex Mono" font-size="13" font-weight="600" fill="${col}">${fmt(last[1],k.unit)}</text>`;
  if(k.status==="stale") s+=`<text x="${X(last[0])+12}" y="${Y(last[1])+22}" font-size="12" font-weight="600" fill="#8A3F06">no check-in for ${k.age} d</text>`;
  // milestones on the time axis
  const nx=k.miles.find(m=>!m[2]);
  k.miles.forEach(m=>{const x=X((m[0]-.5)*7), isN=m===nx;
    s+=`<g data-tip="W${m[0]} · ${m[1]}${m[2]?" · done":""}"><circle cx="${x}" cy="${T+ih+34}" r="6" fill="${m[2]?"#2E7D4F":isN?"#D9B46A":"#fff"}" stroke="${m[2]?"#2E7D4F":isN?"#9A6614":"#C9C4B7"}" stroke-width="1.5"/></g>`;
  });
  s+=`</svg>`;
  box.innerHTML=s;
}

function pulse(){
  el("pulse").innerHTML=PULSE.map(p=>{
    const good=p.better==="up"?p.v>=p.target:p.v<=p.target, c=good?"var(--green)":p.v===p.target?"var(--amber)":(Math.abs(p.v-p.target)/p.target<.25?"var(--amber)":"var(--red)");
    const dlt=p.prev===null?"":((p.v>p.prev?"↑ ":"↓ ")+Math.abs(Math.round((p.v-p.prev)*10)/10)+p.unit.trim());
    const dGood=p.prev===null?true:(p.better==="up"?p.v>=p.prev:p.v<=p.prev);
    return `<div class="pr" data-tip="${p.tip}"><div class="h"><span class="l">${p.l}</span><span class="d" style="color:${dGood?"var(--greent)":"var(--redt)"}">${dlt}</span></div>
      <span class="v" style="color:${c}">${p.v}${p.unit}</span>
      <div class="bul"><i style="width:${Math.min(100,p.v/p.max*100)}%;background:${c}"></i><u style="left:${p.target/p.max*100}%"></u></div><small>target ${p.better==="up"?"≥":"≤"} ${p.target}${p.unit}</small></div>`}).join("");
  bindTips(el("pulse"));
}

/* ---- needs action: tasks and decisions, mine or the team's ---- */
let actTab="mine";
function acts(){
  const mine=ACTS.filter(a=>a.pid===ME||a.esc===ME);
  el("actseg").innerHTML=`<button class="${actTab==="mine"?"on":""}" data-t="mine">Mine<b>${mine.length}</b></button><button class="${actTab==="team"?"on":""}" data-t="team">Team<b>${ACTS.length}</b></button>`;
  el("actseg").querySelectorAll("button").forEach(b=>b.onclick=()=>{actTab=b.dataset.t;acts()});
  const L=(actTab==="mine"?mine:ACTS).slice().sort((a,b)=>(b.esc?1:0)-(a.esc?1:0)||b.ageH-a.ageH);
  el("acts").innerHTML=L.map(a=>`<div class="ar" data-tip="Click: why, and what to do · ${a.alert} · ${PEOPLE[a.pid].n}${a.esc?" · escalated to "+PEOPLE[a.esc].n:""}">
    <span class="dot" style="background:${a.sev==="High"?"var(--amber)":a.sev==="Critical"?"var(--red)":"var(--mut2)"}"></span>
    <div style="min-width:0"><div class="t">${a.subject}</div><div class="k">${a.alert}${a.esc?` · <b>escalated</b>`:""}</div></div>
    ${av(a.pid)}<span class="age">${age(a.ageH)}</span></div>`).join("");
  el("acts").querySelectorAll(".ar").forEach((n,i)=>n.onclick=()=>openWhy(L[i].ref));
  bindTips(el("acts"));
}

/* ---- decisions: this week on one strip, late ones on the left ---- */
function decs(){
  const days=["2026-10-12","2026-10-13","2026-10-14","2026-10-15","2026-10-16"], cols=6;
  const colOf=d=>d<days[0]?0:days.indexOf(d)+1;
  const late=DECS.filter(d=>d.kind==="decide"&&d.due<TODAY).length;
  el("decq").innerHTML=`<span class="lg"><span><i></i>decide</span><span><i style="background:#fff;border:2px solid #1B1B18;width:7px;height:7px"></i>end of exploration</span><span><i style="border-radius:2px;background:#8E8A80"></i>review</span>${late?`<b style="color:var(--redt)">${late} late</b>`:""}</span>`;
  const L=DECS.slice().sort((a,b)=>a.due<b.due?-1:1);
  el("decs").innerHTML=`<div class="dh"><span>This week</span><div class="days"><span>late</span>${days.map(d=>`<span class="${d===TODAY?"td":""}">${D(d).toLocaleDateString("en-GB",{weekday:"short"}).slice(0,2)}<br>${D(d).getDate()}</span>`).join("")}</div></div>`+
   L.map(d=>{const c=colOf(d.due), lateD=d.due<TODAY, col=d.kind==="review"?"#8E8A80":lateD?"#B42318":!d.rev?"#B45309":"#1B1B18";
     return `<div class="dr" data-ref="${d.ref}" data-tip="${d.title} · ${PEOPLE[d.pid].n} · ${d.kind==="review"?"review":"decide"} by ${D(d.due).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"short"})}${d.blocks?" · blocks "+d.blocks+" task"+(d.blocks>1?"s":""):""}">
       <div class="k"><span class="av" style="width:20px;height:20px;font-size:8px;flex-shrink:0;background:${PEOPLE[d.pid].c}">${PEOPLE[d.pid].n.split(" ").map(w=>w[0]).join("").slice(0,2)}</span><span class="t" style="font-size:13px;font-weight:600;color:var(--ink)">${d.title}</span>${!d.rev?'<span class="tag" style="background:var(--ambers);color:var(--ambert)">irreversible</span>':""}${d.blocks?`<span class="tag" style="background:var(--reds);color:var(--redt)">blocks ${d.blocks}</span>`:""}</div>
       <div class="strip">${Array.from({length:cols},(_,i)=>`<i class="${i>0&&days[i-1]===TODAY?"td":""}"></i>`).join("")}<span class="mk ${d.kind==="review"?"rv":d.kind==="explore"?"ex":""}" style="--c:${d.kind==="explore"?"#0F5E5C":col};left:${(c===0?.55:1.1+(c-1)+.5)/(1.1+5)*100}%;background:${col}"></span></div></div>`}).join("");
  el("decs").querySelectorAll(".dr").forEach(n=>n.onclick=()=>openWhy(n.dataset.ref));
  bindTips(el("decs"));
}

/* ---- explorations: timebox bar to the decision date ---- */
function explo(){
  el("ex").innerHTML=EXPLO.map(x=>{const tot=Math.max(1,day(x.due)-day(x.start)), used=Math.max(0,Math.min(tot,today-day(x.start))), p=x.status==="todo"&&used===0?0:Math.round(used/tot*100);
    const left=day(x.due)-today, c=p>=100?"var(--red)":p>=75?"var(--amber)":"#0F5E5C";
    return `<div class="xr" data-tip="${x.title} · ${PEOPLE[x.pid].n} · decision ${D(x.due).toLocaleDateString("en-GB",{weekday:"short",day:"numeric"})}">
      <span class="t">${x.title}</span>
      <div class="tb"><i style="width:${Math.max(p,2)}%;background:${p?c:"#C9C4B7"}"></i></div>
      <div class="m"><span>${PEOPLE[x.pid].n}</span><span>${p?p+"% used":"not started"} · ${left<=0?"decide today":"decide in "+left+" d"}</span></div></div>`}).join("")+
    `<div class="xs"><div data-tip="Share of team time spent exploring"><b>26%</b><span>of time</span></div><div data-tip="Explorations closed within their timebox"><b>67%</b><span>in timebox</span></div><div data-tip="Explorations stopped. Healthy: 20 to 40%"><b>25%</b><span>stopped</span></div></div>`;
  bindTips(el("ex"));
}

/* ---- learning: where estimates slip and why ---- */
function learning(){
  const mx=Math.max(...EST.map(e=>e[1])), sm=Math.max(...SURPRISE.map(s=>s[1]));
  el("lrn").innerHTML=`<div><div class="lt">Actual ÷ estimate</div>${EST.map(([n,v])=>`<div class="br" data-tip="${n} work takes ${v}× its estimate"><span>${n}</span><div class="b"><i style="width:${v/mx*100}%;background:${v<1.2?"var(--green)":v<2?"var(--amber)":"var(--red)"}"></i></div><span class="x">×${v}</span></div>`).join("")}</div>
    <div><div class="lt">Surprises by cause</div>${SURPRISE.map(([n,v])=>`<div class="br"><span>${n}</span><div class="b"><i style="width:${v/sm*100}%;background:var(--ink2)"></i></div><span class="x">${v}</span></div>`).join("")}</div>`;
  bindTips(el("lrn"));
}

/* ---- brief: three sentences written from the data ---- */
function brief(){
  const worst=KRS.filter(k=>k.status!=="stale"&&k.status!=="green").sort((a,b)=>a.ratio-b.ratio)[0], pw=paces(worst);
  const dec=DECS.filter(d=>d.kind==="decide"&&d.due<TODAY).sort((a,b)=>a.due<b.due?-1:1)[0];
  const hot=LOAD.map(l=>({...l,p:Math.round(l.h/l.cap*100)})).filter(l=>l.p>70).sort((a,b)=>b.p-a.p);
  const items=[
   {c:COL[worst.status],ref:worst.id,h:`<b>${worst.name}</b> at <b>${worst.ratio.toFixed(2)}</b>: ${pw.ok?"recent pace "+pw.pace+"/wk covers the "+pw.need+" needed":"needs "+pw.need+"/wk, doing "+pw.pace}`},
   {c:"var(--red)",ref:dec.ref,h:`<b>${dec.title}</b> is <b>${day(TODAY)-day(dec.due)} d late</b> and blocks ${dec.blocks} task${dec.blocks>1?"s":""} on KR ${dec.kr}`},
   (hot[0]&&hot[0].p>90)?{c:"var(--red)",ref:"load",h:`<b>${PEOPLE[hot[0].id].n}</b> at <b>${hot[0].p}%</b> load on the critical path`}
     :(()=>{const d=DECS.find(x=>x.kind==="decide"&&!x.rev);return {c:"var(--amber)",ref:d.ref,h:`<b>${d.title}</b>, irreversible, due <b>${D(d.due).toLocaleDateString("en-GB",{weekday:"short",day:"numeric"})}</b>: blocks ${d.blocks} tasks on KR ${d.kr}`}})()
  ];
  el("brief").innerHTML=`<span class="lab">Today</span>`+items.map(x=>`<button class="bi" data-ref="${x.ref}"><i style="background:${x.c}"></i><span>${x.h}</span></button>`).join("");
  el("brief").querySelectorAll(".bi").forEach(b=>b.onclick=()=>openWhy(b.dataset.ref));
}

/* ---- since the last Weekly Review ---- */
function feed(){
  el("feed").innerHTML=EVENTS.map(e=>`<div class="ev" ${e.ref?`data-ref="${e.ref}" style="cursor:pointer"`:""}><span class="ic" style="background:${COL[e.c]||e.c}">${e.i}</span><span class="tx">${e.t}</span><span class="d">${D(e.d).toLocaleDateString("en-GB",{weekday:"short"})}</span></div>`).join("");
  el("feed").querySelectorAll("[data-ref]").forEach(n=>n.onclick=()=>openWhy(n.dataset.ref));
}

/* ---- side panel: from effect to cause, then act ---- */
function openWhy(ref){
  const c=CHAINS[ref]; if(!c) return;
  el("drawer").innerHTML=`<button class="x" aria-label="Close">×</button><span class="ey">${c.ey}</span><h3>${c.title}</h3>
    <div class="chain">${c.nodes.map((n,i)=>`<div class="node"><span class="c" style="background:${COL[n.c]}">${i+1}</span><div><div class="k">${n.k}</div><div class="t">${n.t}</div><div class="m">${n.m}</div></div></div>`).join("")}</div>
    <div class="acts2">${c.acts.map(a=>`<button class="btn ${a[0]}" data-msg="${a[2]}">${a[1]}<span>→</span></button>`).join("")}</div>`;
  el("drawer").querySelectorAll(".btn").forEach(b=>b.onclick=()=>{toast(b.dataset.msg);if(!b.textContent.includes("Open"))closeWhy()});
  el("drawer").querySelector(".x").onclick=closeWhy;
  el("drawer").classList.add("open"); el("veil").classList.add("open");
}
function closeWhy(){el("drawer").classList.remove("open");el("veil").classList.remove("open")}
el("veil").onclick=closeWhy;
addEventListener("keydown",e=>{if(e.key==="Escape")closeWhy()});
function toast(m){const t=el("toast");t.textContent=m;t.style.opacity=1;clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.opacity=0,2200)}

function flash(n){n.style.borderColor="var(--gold)";setTimeout(()=>n.style.borderColor="",600)}
function render(){header();brief();krs();pulse();acts();decs();feed()}
function fit(){const st=el("stage");const z=Math.min(innerWidth/1440,innerHeight/900);st.style.transform=`scale(${z})`;st.style.left=Math.max(0,(innerWidth-1440*z)/2)+"px"}
addEventListener("resize",fit); fit(); render();
document.fonts&&document.fonts.ready.then(render);
</script>
</body>
</html>
