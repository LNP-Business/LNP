<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Roadmap review · proposal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F4EF;--card:#FFFFFF;--ink:#1B1B18;--ink2:#3D3A33;--mut:#5E5B53;--mut2:#8E8A80;--line:#E3DFD5;--line2:#EFEBE3;--soft:#ECE8DF;
--gold:#D9B46A;--gold2:#9A6614;--goldsoft:#FBF6EC;--green:#2E7D4F;--greent:#1E5E38;--greens:#E6F2EA;--amber:#B45309;--ambert:#8A3F06;--ambers:#FDF1E3;--red:#B42318;--redt:#9B1C12;--reds:#FDECEA;
--sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;--serif:Fraunces,Georgia,serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);overflow:hidden}
#stage{width:1440px;height:900px;display:flex;transform-origin:0 0;position:absolute;left:0;top:0}
nav{width:232px;flex-shrink:0;background:#1B1B18;padding:26px 16px 18px;display:flex;flex-direction:column;gap:3px;color:#C9C4B7}
.logo{font-family:var(--serif);font-size:28px;font-weight:600;color:#F6F4EF;padding:0 12px 16px}.logo span{color:var(--gold)}
.sys{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;background:#2C2B26;border-radius:12px;margin-bottom:16px}
.sys span{display:block;padding:8px 6px;border-radius:9px;text-align:center;font-size:12px;line-height:1.3}.sys .on{background:#F6F4EF;color:#1B1B18;font-weight:600}
.grp{padding:0 14px 6px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8E8A80}.it+.grp{margin-top:12px}
.it{display:flex;align-items:center;padding:10px 14px;border-radius:10px;font-size:15px}.it.on{font-weight:600;color:var(--gold);background:#34322C;box-shadow:inset 3px 0 0 var(--gold)}
.it b{margin-left:auto;min-width:22px;padding:1px 7px;border-radius:999px;background:var(--red);color:#fff;font-size:12px;text-align:center}
.note{position:fixed;left:12px;bottom:12px;z-index:8;background:var(--gold);color:var(--ink);font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:6px}
main{flex:1;min-width:0;padding:18px 24px 18px;display:grid;grid-template-rows:auto auto minmax(0,1fr);gap:12px}
.top{display:flex;align-items:center;gap:16px}
.top h1{margin:0;font-family:var(--serif);font-weight:500;font-size:30px}
.seg{display:flex;gap:3px;padding:4px;background:var(--soft);border-radius:10px}
.seg button{border:0;background:transparent;font:inherit;font-size:13px;color:var(--ink2);padding:7px 12px;border-radius:7px;cursor:pointer;white-space:nowrap}
.seg button.on{background:var(--ink);color:#fff;font-weight:600}
.sp{flex:1}
.btn{border:0;background:var(--ink);color:var(--gold);font:inherit;font-size:14px;font-weight:600;border-radius:10px;padding:10px 16px;cursor:pointer;white-space:nowrap}
.btnl{border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:13px;font-weight:600;border-radius:8px;padding:6px 11px;cursor:pointer;white-space:nowrap}
.btnl:hover{border-color:var(--ink)}
.objs{display:flex;gap:10px}
.obj{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;cursor:pointer;font:inherit;color:inherit}
.obj.on{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.obj .k{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.obj .n{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.obj .m{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--mut)}
.dotc{width:9px;height:9px;border-radius:50%;display:inline-block}
.todo{margin-left:auto;font-family:var(--mono);font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--reds);color:var(--redt)}
.todo.ok{background:var(--greens);color:var(--greent)}
.body{display:grid;grid-template-columns:minmax(0,1fr) 328px;gap:14px;min-height:0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;min-height:0;min-width:0;display:flex;flex-direction:column}
.ch{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 18px 10px}
.ch h2{margin:0;font-family:var(--serif);font-weight:500;font-size:20px;white-space:nowrap}
.q{font-size:12px;color:var(--mut)}
/* timeline */
.tl{flex:1;min-height:0;overflow:auto;padding:0 18px 10px;position:relative}
.tlw{position:relative;min-width:0}
.hdr{display:grid;grid-template-columns:250px minmax(0,1fr);position:sticky;top:0;z-index:6;background:linear-gradient(#fff 85%,rgba(255,255,255,0))}
.hdr .lh{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut2);align-self:end;padding:0 0 10px}
.mon{position:relative;height:20px}
.mon span{position:absolute;top:2px;font-size:12px;font-weight:600;color:var(--ink2);padding-left:6px;border-left:2px solid var(--line)}
.wks{position:relative;height:26px}
.wks span{position:absolute;top:2px;transform:translateX(-50%);font-family:var(--mono);font-size:10.5px;color:var(--mut2);padding:2px 6px;border-radius:999px}
.wks span.now{background:var(--ink);color:#fff;font-weight:600}
.lanes{position:relative}
.bgcols{position:absolute;top:0;bottom:0;left:250px;right:0;pointer-events:none;z-index:0}
.bgcols i{position:absolute;top:0;bottom:0}
.today{position:absolute;top:0;bottom:0;width:2px;margin-left:-1px;background:linear-gradient(var(--gold),rgba(217,180,106,.25));z-index:4;pointer-events:none;border-radius:2px}
.today b{position:absolute;top:-2px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:10px;font-weight:600;color:var(--ink);background:var(--gold);padding:2px 7px;border-radius:999px;white-space:nowrap}
.r{display:grid;grid-template-columns:250px minmax(0,1fr);align-items:center;position:relative;z-index:1;border-radius:10px}
.r:hover{background:rgba(236,232,223,.45)}
.r .lb{padding:6px 12px 6px 4px;min-width:0;cursor:pointer;display:flex;align-items:center;gap:9px}
.r .lb .tx{min-width:0}
.r .t{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.r .s{font-size:11px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:1px}
.r .tr{position:relative;height:100%}
.r.kr{margin-top:14px;min-height:88px;background:linear-gradient(90deg,var(--goldsoft),rgba(251,246,236,0) 60%)}
.r.kr:first-child{margin-top:4px}
.r.kr .t{font-size:15px}
.r.kr .lb{gap:8px}
.ckb{flex-shrink:0;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:11px;font-weight:600;border-radius:999px;padding:3px 9px;cursor:pointer}
.ckb:hover{border-color:var(--ink)}
.r.kr.folded{min-height:80px}
.r.in{min-height:42px}
.r.ta{min-height:36px}
.av{width:24px;height:24px;border-radius:50%;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;color:#fff;letter-spacing:.02em}
.chev{width:20px;height:20px;border-radius:6px;flex-shrink:0;display:inline-flex;align-items:center;justify-content:center;font-size:10px;color:var(--mut);background:var(--soft);transition:transform .15s}
.chev.op{transform:rotate(90deg)}
.ibadge{flex-shrink:0;font-family:var(--mono);font-size:10.5px;font-weight:600;padding:2px 6px;border-radius:6px;color:#fff}
/* key result track */
.rail{position:absolute;left:0;right:0;top:44px;height:8px;border-radius:999px;background:#ECE8DF}
.elapsed{position:absolute;left:0;top:44px;height:8px;border-radius:999px;background:repeating-linear-gradient(-45deg,#E9DDC2,#E9DDC2 4px,#F3EAD6 4px,#F3EAD6 8px)}
.prog{position:absolute;left:0;top:44px;height:8px;z-index:1;border-radius:999px;box-shadow:0 2px 8px rgba(27,27,24,.15)}
.progl{position:absolute;top:56px;transform:translateX(-50%);font-family:var(--mono);font-size:10.5px;font-weight:600;white-space:nowrap}
.node{position:absolute;top:48px;width:20px;height:20px;transform:translate(-50%,-50%);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;cursor:pointer;z-index:3;transition:transform .12s}
.node:hover{transform:translate(-50%,-50%) scale(1.2)}
.bub{position:absolute;top:8px;transform:translateX(-50%);font-family:var(--mono);font-size:10.5px;font-weight:600;padding:3px 7px;border-radius:7px;background:#fff;border:1px solid var(--line);color:var(--ink);white-space:nowrap;box-shadow:0 1px 4px rgba(27,27,24,.08)}
.bub:after{content:"";position:absolute;left:50%;bottom:-4px;width:6px;height:6px;background:#fff;border-right:1px solid var(--line);border-bottom:1px solid var(--line);transform:translateX(-50%) rotate(45deg)}
.nextm{position:absolute;top:60px;font-size:11px;color:var(--ink2);white-space:nowrap;transform:translateX(-50%)}
/* initiative and action pills */
.pillbar{position:absolute;top:50%;transform:translateY(-50%);height:24px;min-width:58px;border-radius:999px;overflow:hidden;cursor:pointer;display:flex;align-items:center;gap:6px;padding:0 10px;font-size:11px;font-weight:600;white-space:nowrap;transition:box-shadow .12s}
.pillbar:hover{box-shadow:0 0 0 2px var(--ink)}
.pillbar .fill{position:absolute;left:0;top:0;bottom:0;z-index:0}
.pillbar span{position:relative;z-index:1;overflow:hidden;text-overflow:ellipsis}
.pillbar .warnd{width:7px;height:7px;border-radius:50%;background:var(--red);flex-shrink:0;position:relative;z-index:1;box-shadow:0 0 0 2px #fff}
.task{position:absolute;top:50%;transform:translateY(-50%);height:26px;border-radius:8px;display:flex;align-items:center;gap:6px;padding:0 8px 0 4px;font-size:11.5px;font-weight:500;color:var(--ink);white-space:nowrap;overflow:hidden;cursor:pointer;border-left:3px solid;transition:box-shadow .12s,transform .12s}
.task:hover{box-shadow:0 4px 12px rgba(27,27,24,.16);transform:translateY(-50%) translateY(-1px)}
.task .av{width:18px;height:18px;font-size:8px}
.task span{overflow:hidden;text-overflow:ellipsis}
.st-todo{background:#F1EEE7;border-color:#BDB7A9}
.st-progress{background:#FBF1DC;border-color:#D9B46A}
.st-done{background:#E6F2EA;border-color:#2E7D4F;color:var(--greent)}
.st-late,.st-blocked{background:repeating-linear-gradient(-45deg,#FDECEA,#FDECEA 6px,#FADBD7 6px,#FADBD7 12px);border-color:#B42318;color:var(--redt)}
.st-split{background:#FDF1E3;border-color:#B45309}
.addrow{display:flex;gap:12px;padding:2px 4px 2px 33px}
.add{border:0;background:transparent;color:var(--gold2);font:inherit;font-size:12px;font-weight:600;cursor:pointer;padding:2px 0}
.add:hover{text-decoration:underline}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;white-space:nowrap}
.legend{display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding:9px 18px 12px;border-top:1px solid var(--line2);font-size:11px;color:var(--mut)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:16px;height:10px;border-radius:3px;display:inline-block;border-left:3px solid}
.legend .nd{width:12px;height:12px;border-radius:50%;border:2px solid}
/* side */
.side{overflow:auto;padding:0 16px 14px;display:flex;flex-direction:column;gap:8px;flex:1;min-height:0}
.qi{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:10px;align-items:start;padding:10px 12px;border:1px solid var(--line2);border-radius:10px;cursor:pointer;background:#fff;text-align:left;font:inherit;color:inherit;width:100%}
.qi:hover{border-color:var(--ink)}
.qi .ic{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff}
.qi .t{font-size:13px;font-weight:600;line-height:1.3}
.qi .s{font-size:12px;color:var(--mut);margin-top:2px;line-height:1.35}
.qi .go{font-size:12px;font-weight:600;color:var(--gold2);white-space:nowrap;align-self:center}
.qh{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:6px 0 0;display:flex;justify-content:space-between}
.ed{display:flex;flex-direction:column;gap:12px}
.ed h3{margin:0;font-family:var(--serif);font-weight:500;font-size:19px;line-height:1.25}
.f{display:flex;flex-direction:column;gap:4px;font-size:11px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--mut);min-width:0}
.f input,.f select,.f textarea{font:inherit;font-size:14px;font-weight:400;letter-spacing:0;text-transform:none;color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;background:#fff;width:100%;min-width:0}
.f textarea{resize:vertical;min-height:56px}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.back{border:0;background:transparent;font:inherit;font-size:13px;color:var(--mut);cursor:pointer;padding:0;align-self:flex-start}
.ctx{font-size:12px;color:var(--mut);padding:8px 10px;background:var(--bg);border-radius:8px;line-height:1.45}
.row2{display:flex;gap:8px;justify-content:flex-end}
.conf{display:flex;gap:4px}.conf button{flex:1;border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 0;font-family:var(--mono);font-size:12px;cursor:pointer}
.conf button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:#F6F4EF;font-size:12px;line-height:1.45;padding:8px 10px;border-radius:8px;max-width:280px;opacity:0;transition:opacity .1s;z-index:20}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;opacity:0;transition:opacity .2s;z-index:20}
</style>
</head>
<body>
<div class="note">Proposal · not live</div>
<div id="stage">
<nav aria-label="Main navigation">
  <div class="logo">SKL <span>OS</span></div>
  <div class="sys"><span class="on">Operating<br>System</span><span>Knowledge<br>System</span></div>
  <div class="grp">Operating System</div>
  <div class="it">Cockpit</div><div class="it on">Roadmap</div><div class="it">My Day<b>4</b></div><div class="it">Decisions<b>5</b></div><div class="it">Weekly Review<b>3</b></div>
  <div class="grp">Sales Ops</div><div class="it">CRM</div>
</nav>
<main>
  <header class="top">
    <h1>Roadmap</h1>
    <div class="seg" role="group" aria-label="Roadmap mode"><button class="on">Review &amp; update</button><button onclick="location.href='kr-builder.html'">Build a key result</button></div>
    <span class="sp"></span>
    <span class="q" id="wkq"></span>
    <button class="btn" onclick="location.href='kr-builder.html'">+ Build a key result</button>
  </header>
  <div class="objs" id="objs"></div>
  <section class="body">
    <div class="card">
      <div class="ch"><div style="display:flex;flex-direction:column;gap:2px;min-width:0"><h2 id="oname"></h2><span class="q" id="oq"></span></div><div style="display:flex;gap:8px"><button class="btnl" id="foldall"></button><button class="btnl" id="addkr">+ Key result to this objective</button></div></div>
      <div class="tl" id="tl"></div>
      <div class="legend"><span><i class="st-todo"></i>To do</span><span><i class="st-progress"></i>In progress</span><span><i class="st-late"></i>Late or blocked</span><span><i class="st-done"></i>Done</span><span><b class="nd" style="background:#2E7D4F;border-color:#2E7D4F"></b>Milestone reached</span><span><b class="nd" style="background:#fff;border-color:#1B1B18"></b>Upcoming</span><span><b class="nd" style="background:#FDECEA;border-color:#B42318"></b>Missed</span><span style="margin-left:auto">Solid bar = result today · gold stripes = where the plan expects it today</span></div>
    </div>
    <div class="card">
      <div class="ch" id="sideh"></div>
      <div class="side" id="side"></div>
    </div>
  </section>
</main>
</div>
<div id="tip" role="tooltip"></div><div id="toast" role="status"></div>
<script>
const SEED=/*SEED*/null;
const el=id=>document.getElementById(id), tip=el("tip");
const TODAY="2026-10-13", Q0=new Date("2026-09-28T12:00:00"), WEEK=3;
const OBJ={O1:"Launch the masterclass series",O2:"Build a qualified audience",O3:"Generate first revenue"};
const PEOPLE={amin:"Amin",romain:"Romain",marketing:"Michael",contenu:"Ilya",sales:"Sales Lead"};
const ST={todo:"#C9C4B7",progress:"#D9B46A",blocked:"#B42318",late:"#B42318",done:"#2E7D4F",split:"#B45309"};
const STL={todo:"To do",progress:"In progress",blocked:"Blocked",late:"Late",done:"Done",split:"To split"};
const D=s=>new Date(s+"T12:00:00");
const weekOf=s=>Math.max(1,Math.min(13,Math.floor((D(s)-Q0)/(7*864e5))+1));
const wkDate=w=>new Date(Q0.getTime()+(w-1)*7*864e5).toLocaleDateString("en-GB",{day:"numeric",month:"short"});
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=(v,u)=>u==="pct"?v+"%":u==="eur"?"€"+(v>=1000?(v/1000).toLocaleString("en-GB",{maximumFractionDigits:1})+"k":v):u==="eur2"?"€"+Number(v).toFixed(2):Number(v).toLocaleString("en-GB");
const KRS=SEED.krs, TASKS=SEED.tasks;
let obj="O2", sel=null, kfold={}, open={"kr3:0":true,"kr1:2":true,"kr5:0":true};
function late(t){return t.status!=="done"&&t.status!=="blocked"&&t.due<TODAY}
function stat(k){
  const r=(k.current-k.baseline)/((k.expected-k.baseline)||1), inv=k.target<k.baseline, lc=(k.checkins||[])[0];
  if(!lc||WEEK-lc.week>=2) return ["Not tracked","#8E8A80","background:#EFECE4;color:#3D3A33"];
  const rr=inv?(k.baseline-k.current)/((k.baseline-k.expected)||1):r;
  if(rr>=.9) return ["On track","#2E7D4F","background:var(--greens);color:var(--greent)"];
  return rr>=.5?["Recovering","#B45309","background:var(--ambers);color:var(--ambert)"]:["Off track","#B42318","background:var(--reds);color:var(--redt)"];
}
// what needs updating, per objective
function queue(o){
  const out=[];
  KRS.filter(k=>k.obj===o).forEach(k=>{
    const lc=(k.checkins||[])[0];
    if(!lc||lc.week<WEEK) out.push({ic:"#B42318",g:"!",t:"Check in "+k.name,s:lc?"Last check-in W"+lc.week+" · "+fmt(lc.value,k.unit):"No check-in yet",go:"Check in",sel:{type:"kr",kr:k.id}});
    (k.miles||[]).forEach((m,i)=>{ if(!m.done&&m.week<WEEK) out.push({ic:"#B42318",g:"◆",t:"Milestone W"+m.week+" missed",s:m.text,go:"Update",sel:{type:"ms",kr:k.id,i}});
      else if(!m.done&&m.week===WEEK+1) out.push({ic:"#B45309",g:"◆",t:"Milestone next week",s:m.text+" · W"+m.week,go:"Review",sel:{type:"ms",kr:k.id,i}}); });
    (k.inits||[]).forEach((x,i)=>{ const ts=TASKS.filter(t=>t.kr===k.id&&Number(t.init)===i&&t.status!=="done");
      if(!ts.some(t=>weekOf(t.due)<=WEEK+1)) out.push({ic:"#B45309",g:"I",t:"No action in the next 2 weeks",s:"I"+(i+1)+" · "+x.name,go:"Add action",sel:{type:"init",kr:k.id,i}}); });
    TASKS.filter(t=>t.kr===k.id&&(late(t)||t.status==="blocked")).forEach(t=>out.push({ic:"#B42318",g:"▬",t:t.status==="blocked"?"Blocked: "+t.title:"Late: "+t.title,s:PEOPLE[t.owner]+" · due "+D(t.due).toLocaleDateString("en-GB",{day:"numeric",month:"short"})+(t.note?" · "+t.note:""),go:"Update",sel:{type:"task",id:t.id}}));
  });
  return out;
}
function objs(){
  el("objs").innerHTML=Object.keys(OBJ).map(o=>{const ks=KRS.filter(k=>k.obj===o), q=queue(o).length;
    return `<button class="obj ${o===obj?"on":""}" data-o="${o}"><span class="k">${o} · ${ks.length} key result${ks.length>1?"s":""}</span><span class="n">${OBJ[o]}</span><span class="m">${ks.map(k=>`<i class="dotc" style="background:${stat(k)[1]}" data-tip="${esc(k.name)} · ${stat(k)[0]}"></i>`).join("")}<span class="todo ${q?"":"ok"}">${q?q+" to update":"up to date"}</span></span></button>`}).join("");
  el("objs").querySelectorAll(".obj").forEach(b=>b.onclick=()=>{obj=b.dataset.o;sel=null;render()});
}
const AV={amin:"#3D3A33",romain:"#9A6614",marketing:"#7A4B00",contenu:"#0F5E5C",sales:"#5E5B53"};
const INI={amin:"AM",romain:"RN",marketing:"MI",contenu:"IL",sales:"SL"};
const ICOL=["#1B1B18","#9A6614","#0F5E5C","#7A4B00","#5E5B53"];
const avatar=o=>`<span class="av" style="background:${AV[o]||"#8E8A80"}">${INI[o]||"?"}</span>`;
const TODAYP=(D(TODAY)-Q0)/(91*864e5)*100;
function timeline(){
  const ks=KRS.filter(k=>k.obj===obj);
  const nT=TASKS.filter(t=>ks.some(k=>k.id===t.kr)).length, nI=ks.reduce((a,k)=>a+(k.inits||[]).length,0), nM=ks.reduce((a,k)=>a+(k.miles||[]).length,0);
  el("oname").textContent=obj+" · "+OBJ[obj];
  el("oq").textContent=`${ks.length} key results · ${nM} milestones · ${nI} initiatives · ${nT} actions`;
  const P=w=>(w-1)/13*100, PW=n=>n/13*100, C=w=>(w-.5)/13*100;
  const months=[["Oct",1],["Nov",6],["Dec",10]];
  let h=`<div class="tlw"><div class="hdr"><div class="lh">Key result · initiative · action</div><div><div class="mon">${months.map(([m,w])=>`<span style="left:${P(w)}%">${m}</span>`).join("")}</div>
    <div class="wks">${Array.from({length:13},(_,i)=>`<span class="${i+1===WEEK?"now":""}" style="left:${C(i+1)}%">W${i+1}</span>`).join("")}</div></div></div><div class="lanes">`;
  h+=`<div class="bgcols">${Array.from({length:13},(_,i)=>i%2?`<i style="left:${P(i+1)}%;width:${PW(1)}%;background:rgba(236,232,223,.35)"></i>`:"").join("")}<div class="today" style="left:${TODAYP}%" data-tip="Today · 13 Oct"></div></div>`;
  ks.forEach(k=>{
    const expP=Math.max(0,Math.min(100,(k.expected-k.baseline)/((k.target-k.baseline)||1)*100));
    const st=stat(k), prog=Math.max(0,Math.min(100,(k.current-k.baseline)/((k.target-k.baseline)||1)*100)), nx=(k.miles||[]).find(m=>!m.done&&m.week>=WEEK);
    const fold=!!kfold[k.id], nIn=(k.inits||[]).length, nAc=TASKS.filter(t=>t.kr===k.id).length;
    h+=`<div class="r kr${fold?" folded":""}"><div class="lb" data-fold="${k.id}"><span class="chev ${fold?"":"op"}">▶</span>${avatar(k.owner)}<div class="tx"><div class="t">${esc(k.name)}</div><div class="s"><span class="pill" style="${st[2]}">${st[0]}</span> <b style="font-family:var(--mono);color:${st[1]}">${Math.round(prog)}%</b> · ${fmt(k.current,k.unit)} of ${fmt(k.target,k.unit)}</div><div class="s" style="margin-top:4px;display:flex;gap:8px;align-items:center"><button class="ckb" data-sel='${JSON.stringify({type:"kr",kr:k.id})}'>Check in</button>${fold?`<span>${nIn} initiatives · ${nAc} actions folded</span>`:""}</div></div></div><div class="tr">
      <div class="rail"></div><div class="elapsed" style="width:${expP}%" data-tip="Expected by now: ${fmt(k.expected,k.unit)}"></div>
      <div class="prog" style="width:${Math.max(prog,1.5)}%;background:linear-gradient(90deg,${st[1]}99,${st[1]})"></div>
`;
    (k.checkins||[]).forEach(c=>h+=`<span class="bub" style="left:${C(c.week)}%" data-tip="Check-in W${c.week}: ${fmt(c.value,k.unit)} · confidence ${c.conf}/10">${fmt(c.value,k.unit)}</span>`);
    (k.miles||[]).forEach((m,i)=>{const miss=!m.done&&m.week<WEEK, isNx=m===nx;
      const sty=m.done?"background:#2E7D4F;color:#fff;box-shadow:0 0 0 3px #fff":miss?"background:#FDECEA;border:2px solid #B42318;color:#B42318;box-shadow:0 0 0 3px #fff":isNx?"background:#D9B46A;border:2px solid #9A6614;color:#1B1B18;box-shadow:0 0 0 3px #fff,0 0 0 6px rgba(217,180,106,.35)":"background:#fff;border:2px solid #1B1B18;box-shadow:0 0 0 3px #fff";
      h+=`<span class="node" style="left:${C(m.week)}%;${sty}" data-sel='${JSON.stringify({type:"ms",kr:k.id,i})}' data-tip="W${m.week} · ${esc(m.text)}${m.done?" · reached":miss?" · missed":isNx?" · next milestone":""}">${m.done?"✓":miss?"!":""}</span>`;});
    if(nx) h+=`<span class="nextm" style="left:${Math.min(78,Math.max(14,C(nx.week)))}%;top:66px">Next · W${nx.week}: ${esc(nx.text.length>26?nx.text.slice(0,25)+"…":nx.text)}</span>`;
    h+=`</div></div>`;
    if(fold) return;
    h+=`<div class="addrow"><button class="add" data-addms="${k.id}">+ Milestone</button><button class="add" data-addinit="${k.id}">+ Initiative</button></div>`;
    (k.inits||[]).concat([{name:"Not tied to an initiative",loose:true}]).forEach((x,i)=>{
      const idx=x.loose?-1:i, ts=TASKS.filter(t=>t.kr===k.id&&(x.loose?!(Number(t.init)>=0&&Number(t.init)<(k.inits||[]).length):Number(t.init)===i));
      if(x.loose&&!ts.length) return;
      const key=k.id+":"+idx, isOpen=open[key]===true, col=x.loose?"#8E8A80":ICOL[i%ICOL.length];
      const wk=ts.map(t=>weekOf(t.due)), st0=ts.map(t=>Math.min(weekOf(t.due),t.start||weekOf(t.due)));
      const w1=ts.length?Math.min(...st0):WEEK, w2=ts.length?Math.max(...wk):WEEK, done=ts.filter(t=>t.status==="done").length, bad=ts.some(t=>late(t)||t.status==="blocked");
      h+=`<div class="r in"><div class="lb" data-toggle="${key}"><span class="chev ${isOpen?"op":""}">▶</span><span class="ibadge" style="background:${col}">${x.loose?"—":"I"+(i+1)}</span><div class="tx"><div class="t">${esc(x.name)}</div><div class="s">${ts.length} action${ts.length===1?"":"s"}${x.contrib?" · "+esc(x.contrib):""}</div></div></div><div class="tr">`;
      if(ts.length) h+=`<div class="pillbar" data-toggle="${key}" style="left:calc(${P(w1)}% + 3px);width:calc(${PW(w2-w1+1)}% - 6px);background:${col}1F;color:${col}" data-tip="${esc(x.name)} · ${done}/${ts.length} done${bad?" · something late or blocked":""}"><i class="fill" style="width:${done/ts.length*100}%;background:${col}40"></i><span>${done}/${ts.length}${w2-w1>=2?" done":""}</span>${bad?`<b class="warnd"></b>`:""}</div>`;
      else h+=`<div class="pillbar" style="left:calc(${P(WEEK)}% + 3px);width:calc(${PW(2)}% - 6px);background:transparent;border:1.5px dashed ${col}80;color:${col}" data-addtask="${k.id}:${i}"><span>+ first action</span></div>`;
      h+=`</div></div>`;
      if(isOpen){ ts.sort((a,b)=>a.due<b.due?-1:1).forEach(t=>{const e=weekOf(t.due), b0=Math.min(e,t.start||e), s=late(t)?"late":t.status;
        h+=`<div class="r ta"><div class="lb" style="padding-left:33px" data-sel='${JSON.stringify({type:"task",id:t.id})}'><div class="tx"><div class="t" style="font-weight:500;font-size:12.5px">${esc(t.title)}</div><div class="s" style="${s==="late"||s==="blocked"?"color:var(--redt)":""}">${PEOPLE[t.owner]} · ${t.est} h · ${STL[s]}</div></div></div>
          <div class="tr"><div class="task st-${s}" style="left:calc(${P(b0)}% + 3px);width:calc(${PW(e-b0+1)}% - 6px)" data-sel='${JSON.stringify({type:"task",id:t.id})}' data-tip="${esc(t.title)} · ${PEOPLE[t.owner]} · ${STL[s]} · due ${D(t.due).toLocaleDateString("en-GB",{day:"numeric",month:"short"})}">${avatar(t.owner)}${e-b0>=2?`<span>${esc(t.title)}</span>`:s==="done"?"<span>✓</span>":s==="late"||s==="blocked"?"<span>!</span>":""}</div></div></div>`});
        if(!x.loose) h+=`<div class="addrow" style="padding-left:62px"><button class="add" data-addtask="${k.id}:${i}">+ Action</button></div>`;
      }
    });
  });
  h+=`</div></div>`;
  el("tl").innerHTML=h;
  el("tl").querySelectorAll("[data-sel]").forEach(n=>n.onclick=e=>{e.stopPropagation();sel=JSON.parse(n.dataset.sel);side()});
  el("tl").querySelectorAll("[data-fold]").forEach(n=>n.onclick=()=>{kfold[n.dataset.fold]=!kfold[n.dataset.fold];timeline();tips();foldBtn()});
  el("tl").querySelectorAll("[data-toggle]").forEach(n=>n.onclick=()=>{open[n.dataset.toggle]=!open[n.dataset.toggle];timeline();tips()});
  el("tl").querySelectorAll("[data-addtask]").forEach(n=>n.onclick=()=>{const [kr,i]=n.dataset.addtask.split(":");sel={type:"newtask",kr,i:+i};side()});
  el("tl").querySelectorAll("[data-addms]").forEach(n=>n.onclick=()=>{sel={type:"newms",kr:n.dataset.addms};side()});
  el("tl").querySelectorAll("[data-addinit]").forEach(n=>n.onclick=()=>{sel={type:"newinit",kr:n.dataset.addinit};side()});
}
const opt=(arr,v)=>arr.map(([a,b])=>`<option value="${a}" ${String(a)===String(v)?"selected":""}>${esc(b)}</option>`).join("");
const weeks=v=>opt(Array.from({length:13},(_,i)=>[i+1,"W"+(i+1)+" · "+wkDate(i+1)]),v);
const ppl=v=>opt(Object.entries(PEOPLE),v);
function side(){
  const q=queue(obj);
  if(!sel){
    el("sideh").innerHTML=`<div style="display:flex;flex-direction:column;gap:2px"><h2>To update</h2><span class="q">${q.length?q.length+" items before Friday's review":"Everything is up to date"}</span></div>`;
    const grp=[["Check-ins",x=>x.go==="Check in"],["Milestones",x=>x.g==="◆"],["Actions",x=>x.g==="▬"||x.g==="I"]];
    el("side").innerHTML=q.length?grp.map(([n,f])=>{const it=q.filter(f); return it.length?`<div class="qh"><span>${n}</span><span>${it.length}</span></div>`+it.map((x,i)=>`<button class="qi" data-q="${q.indexOf(x)}"><span class="ic" style="background:${x.ic}">${x.g}</span><span style="min-width:0"><div class="t">${esc(x.t)}</div><div class="s">${esc(x.s)}</div></span><span class="go">${x.go} →</span></button>`).join(""):""}).join("")
      :`<div class="ctx">Every key result of this objective is checked in, every milestone is on time and every initiative has an action in the next two weeks.</div>`;
    el("side").querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>{sel=q[+b.dataset.q].sel;side()});
    return;
  }
  const back=`<button class="back" id="bk">← Back to the list</button>`;
  let h="", hd="";
  const k=sel.kr?KRS.find(x=>x.id===sel.kr):null;
  if(sel.type==="kr"){ const lc=(k.checkins||[])[0]||{value:k.current,conf:5};
    hd="Check in · W"+WEEK;
    h=`<h3>${esc(k.name)}</h3><div class="ctx">Last: ${fmt(lc.value,k.unit)} (W${lc.week||"—"}) · target ${fmt(k.target,k.unit)} · expected now ${fmt(k.expected,k.unit)}</div>
      <div class="f2"><label class="f">Value this week<input id="v" value="${k.current}"></label><label class="f">Leading indicator<input value="${esc(k.leadValue||"")}" placeholder="${esc(k.lead||"")}"></label></div>
      <div class="f">Confidence we hit the target<div class="conf" id="cf">${Array.from({length:10},(_,i)=>`<button type="button" class="${i+1===lc.conf?"on":""}">${i+1}</button>`).join("")}</div></div>
      <label class="f">What moved it<textarea id="mv" placeholder="One line"></textarea></label><label class="f">What blocks<textarea placeholder="One line"></textarea></label>
      <div class="row2"><button class="btnl" id="bk2">Cancel</button><button class="btn" id="save">Save check-in</button></div>`;
  } else if(sel.type==="ms"||sel.type==="newms"){ const m=sel.type==="ms"?k.miles[sel.i]:{week:WEEK+2,text:"",done:false};
    hd=sel.type==="ms"?"Milestone":"New milestone";
    h=`<h3>${sel.type==="ms"?esc(m.text):"Add a milestone to "+esc(k.name)}</h3>
      <label class="f">Milestone<input id="mt" value="${esc(m.text)}" placeholder="A checkable result, e.g. “Sign-up page live”"></label>
      <div class="f2"><label class="f">Week<select id="mw">${weeks(m.week)}</select></label><label class="f">Status<select id="md">${opt([["0","Not reached"],["1","Reached"]],m.done?1:0)}</select></label></div>
      ${sel.type==="ms"&&!m.done&&m.week<WEEK?`<div class="ctx" style="background:var(--reds);color:var(--redt)">Missed by ${WEEK-m.week} week${WEEK-m.week>1?"s":""}. Mark it reached, or move it and say why in the next check-in.</div>`:""}
      <div class="row2"><button class="btnl" id="bk2">Cancel</button><button class="btn" id="save">${sel.type==="ms"?"Save":"Add milestone"}</button></div>`;
  } else if(sel.type==="init"||sel.type==="newinit"){ const x=sel.type==="init"?k.inits[sel.i]:{name:"",hyp:"",contrib:""};
    hd=sel.type==="init"?"Initiative I"+(sel.i+1):"New initiative";
    h=`<h3>${sel.type==="init"?esc(x.name):"Add an initiative to "+esc(k.name)}</h3>
      <label class="f">Initiative<input id="in" value="${esc(x.name)}"></label>
      <label class="f">Hypothesis · if we do this, then…<textarea id="ih">${esc(x.hyp)}</textarea></label>
      <label class="f">Expected contribution<input id="ic" value="${esc(x.contrib)}" placeholder="e.g. +400 sign-ups"></label>
      ${sel.type==="init"?`<div class="ctx">No action planned in W${WEEK} or W${WEEK+1}. An initiative without a next action is a wish: add one, or stop the initiative.</div>`:""}
      <div class="row2"><button class="btnl" id="bk2">Cancel</button>${sel.type==="init"?`<button class="btnl" id="addt">+ Action</button>`:""}<button class="btn" id="save">${sel.type==="init"?"Save":"Add initiative"}</button></div>`;
  } else { const t=sel.type==="task"?TASKS.find(x=>x.id===sel.id):{title:"",owner:k.owner,due:"2026-10-20",est:2,status:"todo",kr:k.id,init:sel.i,kind:"L"};
    const kk=KRS.find(x=>x.id===t.kr), s=late(t)?"late":t.status;
    hd=sel.type==="task"?"Action":"New action";
    h=`<h3>${sel.type==="task"?esc(t.title):"Add an action"}</h3><div class="ctx">${esc(kk.name)}${Number(t.init)>=0&&kk.inits[t.init]?" · I"+(Number(t.init)+1)+" "+esc(kk.inits[t.init].name):""}</div>
      <label class="f">Action<input id="tt" value="${esc(t.title)}" placeholder="A task of 8 h or less"></label>
      <div class="f2"><label class="f">Owner<select id="to">${ppl(t.owner)}</select></label><label class="f">Due<input id="td" type="date" value="${t.due}"></label></div>
      <div class="f2"><label class="f">Estimate (h)<input id="te" type="number" min="1" max="40" value="${t.est}"></label><label class="f">Status<select id="ts">${opt(Object.entries(STL).filter(([a])=>a!=="late"),t.status)}</select></label></div>
      ${s==="late"?`<div class="ctx" style="background:var(--reds);color:var(--redt)">Past its date. Set a new date you can keep, or mark it blocked with the reason.</div>`:""}
      ${s==="blocked"&&t.note?`<div class="ctx" style="background:var(--reds);color:var(--redt)">Blocked: ${esc(t.note)}</div>`:""}
      <div class="row2"><button class="btnl" id="bk2">Cancel</button><button class="btn" id="save">${sel.type==="task"?"Save":"Add action"}</button></div>`;
  }
  el("sideh").innerHTML=`<div style="display:flex;flex-direction:column;gap:2px"><h2>${hd}</h2><span class="q">${obj} · ${OBJ[obj]}</span></div>`;
  el("side").innerHTML=back+`<div class="ed">${h}</div>`;
  const done=msg=>{sel=null;render();toast(msg)};
  el("bk").onclick=el("bk2").onclick=()=>{sel=null;side()};
  const cf=el("cf"); if(cf) cf.querySelectorAll("button").forEach(b=>b.onclick=()=>{cf.querySelectorAll("button").forEach(x=>x.classList.remove("on"));b.classList.add("on")});
  if(el("addt")) el("addt").onclick=()=>{sel={type:"newtask",kr:sel.kr,i:sel.i};side()};
  el("save").onclick=()=>{
    if(sel.type==="kr"){const v=Number(el("v").value)||k.current, c=+(cf.querySelector(".on")||{textContent:5}).textContent; k.checkins.unshift({week:WEEK,date:TODAY,value:v,conf:c,moved:el("mv").value}); k.current=v; done("Check-in saved for "+k.name);}
    else if(sel.type==="ms"){const m=k.miles[sel.i]; m.text=el("mt").value; m.week=+el("mw").value; m.done=el("md").value==="1"; done("Milestone updated");}
    else if(sel.type==="newms"){if(!el("mt").value.trim())return; k.miles.push({week:+el("mw").value,text:el("mt").value,done:el("md").value==="1"}); k.miles.sort((a,b)=>a.week-b.week); done("Milestone added");}
    else if(sel.type==="init"){Object.assign(k.inits[sel.i],{name:el("in").value,hyp:el("ih").value,contrib:el("ic").value}); done("Initiative updated");}
    else if(sel.type==="newinit"){if(!el("in").value.trim())return; k.inits.push({name:el("in").value,hyp:el("ih").value,contrib:el("ic").value}); done("Initiative added");}
    else {const t=sel.type==="task"?TASKS.find(x=>x.id===sel.id):{id:"n"+Date.now(),kr:sel.kr,init:sel.i,kind:"L",unc:"C",note:""}; if(!el("tt").value.trim())return;
      Object.assign(t,{title:el("tt").value,owner:el("to").value,due:el("td").value,est:+el("te").value,status:el("ts").value}); if(sel.type!=="task"){t.start=weekOf(t.due);TASKS.push(t);} done(sel.type==="task"?"Action updated":"Action added");}
  };
  tips();
}
function tips(){document.querySelectorAll("[data-tip]").forEach(n=>{n.onmousemove=e=>{tip.innerHTML=n.dataset.tip;tip.style.opacity=1;tip.style.left=Math.min(innerWidth-290,e.clientX+14)+"px";tip.style.top=(e.clientY+14)+"px"};n.onmouseleave=()=>tip.style.opacity=0})}
function toast(m){const t=el("toast");t.textContent=m;t.style.opacity=1;clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity=0,2200)}
function render(){el("wkq").textContent="Q4 2026 · week "+WEEK+" of 13 · review before Friday";objs();timeline();side();tips();foldBtn()}
function foldBtn(){const ks=KRS.filter(k=>k.obj===obj), all=ks.every(k=>kfold[k.id]);el("foldall").textContent=all?"Expand all":"Collapse all";el("foldall").onclick=()=>{ks.forEach(k=>kfold[k.id]=!all);timeline();tips();foldBtn()}}
el("addkr").onclick=()=>location.href="kr-builder.html?obj="+obj;
function fit(){const st=el("stage");const z=Math.min(innerWidth/1440,innerHeight/900);st.style.transform=`scale(${z})`;st.style.left=Math.max(0,(innerWidth-1440*z)/2)+"px"}
addEventListener("resize",fit); fit(); render();
</script>
