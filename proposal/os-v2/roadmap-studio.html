<title>Roadmap Studio</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: SKL OS frame. Build = method rail | plan workspace | Claude guide. Execute = one card at a time. */
:root{
  --bg:#F6F4EF;--card:#FFFFFF;--ink:#1B1B18;--ink2:#3D3A33;--mut:#5E5B53;--mut2:#8C877B;--line:#E3DFD5;--line2:#EEEBE4;--soft:#ECE8DF;
  --gold:#D9B46A;--gold2:#9A6614;--goldsoft:#FBF6EC;--goldline:#E6D3A8;
  --ok:#2E7D4F;--oks:#E6F2EA;--late:#B45309;--lates:#FEF3E2;--crit:#C2261A;--crits:#FDECEA;--info:#2D5C9C;--infos:#E8EEF7;
  --pbg:#1B1B18;--pfg:#D9B46A;--shadow:0 1px 2px rgba(27,27,24,.05);
  --serif:Fraunces,Georgia,serif;--sans:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141412;--card:#1D1C1A;--ink:#F1EEE6;--ink2:#D8D3C6;--mut:#A9A394;--mut2:#7F7A6E;--line:#33312B;--line2:#2A2925;--soft:#292824;
  --gold:#D9B46A;--gold2:#E2C07C;--goldsoft:#2A251B;--goldline:#5A4A2C;
  --ok:#62B583;--oks:#1C2A21;--late:#E59B4E;--lates:#33261A;--crit:#EB6B5E;--crits:#381E1B;--info:#86AAE0;--infos:#1C2433;
  --pbg:#D9B46A;--pfg:#1B1B18;--shadow:none;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141412;--card:#1D1C1A;--ink:#F1EEE6;--ink2:#D8D3C6;--mut:#A9A394;--mut2:#7F7A6E;--line:#33312B;--line2:#2A2925;--soft:#292824;
  --gold:#D9B46A;--gold2:#E2C07C;--goldsoft:#2A251B;--goldline:#5A4A2C;
  --ok:#62B583;--oks:#1C2A21;--late:#E59B4E;--lates:#33261A;--crit:#EB6B5E;--crits:#381E1B;--info:#86AAE0;--infos:#1C2433;
  --pbg:#D9B46A;--pfg:#1B1B18;--shadow:none;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 48px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1720px;margin:0 auto;display:grid;grid-template-columns:184px minmax(0,1fr);gap:22px;align-items:start}
.mainc{display:flex;flex-direction:column;gap:18px;padding-top:18px;min-width:0}
.snav{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;display:flex;flex-direction:column;gap:22px;padding:22px 16px 22px 0;border-right:1px solid var(--line);z-index:8;background:var(--bg)}
.snl{display:flex;flex-direction:column;gap:4px}
.snl button{display:flex;align-items:center;gap:10px;border:0;background:none;border-radius:10px;padding:10px 12px;font-size:14.5px;font-weight:500;color:var(--ink2);text-align:left}
.snl button svg{width:16px;height:16px;flex-shrink:0}
.snl button:hover{background:var(--soft)}
.snl button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.snav .ibtn{align-self:flex-start}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--bg);display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 0 12px;border-bottom:1px solid var(--line)}
.brand{display:flex;flex-direction:column;line-height:1.15;margin-right:6px}
.brand b{font-family:var(--serif);font-weight:500;font-size:20px}
.brand span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold2);font-weight:700}
.seg{display:flex;gap:4px;padding:4px;background:var(--soft);border-radius:12px}
.seg button{border:0;background:none;border-radius:9px;padding:8px 16px;font-size:14px;font-weight:500;color:var(--ink2);display:flex;gap:7px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg);font-weight:600}
.seg button small{font-size:11px;opacity:.7;font-weight:500}
.sp{flex:1}
.krsel{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--mut)}
.krsel{min-width:0;max-width:100%}.krsel select{min-height:38px;max-width:min(360px,calc(100vw - 120px));min-width:0;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 10px;font-size:13px;color:var(--ink)}
.ibtn{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--card);font-family:var(--serif);font-style:italic;font-weight:600;font-size:17px}
.btn{min-height:36px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:13px;font-weight:600;white-space:nowrap;display:inline-flex;align-items:center;gap:7px}
.btn.p{background:var(--pbg);color:var(--pfg);border-color:var(--pbg)}
.btn.sm{min-height:30px;padding:0 10px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:none;color:var(--gold2)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.pk{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--mut2);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}

/* build grid */
.build{display:grid;grid-template-columns:270px minmax(0,1fr) 420px;gap:18px;align-items:start}
.build>*{min-width:0}
.rail{position:sticky;top:18px;display:flex;flex-direction:column;gap:14px;max-height:calc(100vh - 36px);overflow-y:auto;padding-bottom:2px}
.steps{padding:8px}
.step{display:grid;grid-template-columns:26px 1fr auto;gap:10px;align-items:center;width:100%;text-align:left;border:0;background:none;border-radius:10px;padding:9px 8px}
.step:hover{background:var(--goldsoft)}
.step[aria-current="true"]{background:var(--soft)}
.step .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font:600 12px var(--mono);border:1.5px solid var(--line);color:var(--mut)}
.step.ok .n{background:var(--ok);border-color:var(--ok);color:#fff}
.step[aria-current="true"] .n{border-color:var(--ink);color:var(--ink)}
.step b{display:block;font-size:13.5px;font-weight:600}
.step span.d{display:block;font-size:11.5px;color:var(--mut)}
.badge{font:600 11px/18px var(--mono);padding:0 7px;border-radius:999px;background:var(--crits);color:var(--crit)}
.badge.ok{background:var(--oks);color:var(--ok)}
.score{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.qrow{display:flex;align-items:baseline;justify-content:space-between;gap:8px}.qrow b{font-family:var(--serif);font-size:30px;font-weight:500;line-height:1}.qrow small{font-size:15px}
.qbar{height:6px;border-radius:3px;background:var(--soft);overflow:hidden}.qbar i{display:block;height:100%;border-radius:3px}
.ring{display:flex;gap:14px;align-items:center}
.ring svg{flex-shrink:0}
.ring b{font-family:var(--serif);font-size:30px;font-weight:500;line-height:1}
.ring span{font-size:12px;color:var(--mut)}
.kv{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:12.5px}
.kv span{color:var(--mut)}.kv b{font-family:var(--mono);font-weight:600}

/* workspace */
.ws{display:flex;flex-direction:column;gap:16px}
.wsh{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.wsh h1{margin:0;font-family:var(--serif);font-weight:500;font-size:30px;letter-spacing:-.01em;text-wrap:balance}
.wsh p{margin:4px 0 0;color:var(--mut);font-size:13.5px;max-width:68ch}
.rule{display:flex;gap:10px;align-items:flex-start;background:var(--goldsoft);border:1px solid var(--goldline);border-radius:12px;padding:10px 14px;font-size:13px;color:var(--ink2)}
.rule b{color:var(--ink)}
.rule .ic{font-family:var(--serif);font-style:italic;color:var(--gold2);font-size:18px;line-height:1}
.krc{padding:18px 20px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.krc .full{grid-column:1/-1}
.fld{display:flex;flex-direction:column;gap:5px;font-size:12px;color:var(--mut)}
.fld input,.fld select,.fld textarea{min-height:38px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:6px 10px;font-size:14px;color:var(--ink);width:100%}
.fld textarea{min-height:60px;resize:vertical;line-height:1.4}
.fld .v{font:600 18px var(--mono);color:var(--ink)}
.checks{display:flex;flex-wrap:wrap;gap:6px}
.chk{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--oks);color:var(--ok)}
.chk.x{background:var(--crits);color:var(--crit)}
.chk.w{background:var(--lates);color:var(--late)}

.ms{overflow:hidden}
.msh{display:grid;grid-template-columns:42px minmax(0,1fr) auto;gap:12px;padding:14px 16px;align-items:start}
.msn{width:42px;height:42px;border-radius:10px;background:var(--soft);display:flex;flex-direction:column;align-items:center;justify-content:center;font:600 11px/1.1 var(--mono);color:var(--mut)}
.msn b{font-size:14px;color:var(--ink)}
.ti{width:100%;border:1px solid transparent;border-radius:8px;background:none;padding:4px 6px;margin-left:-6px;font-family:var(--serif);font-size:17px;font-weight:500;color:var(--ink);line-height:1.3;resize:none;overflow:hidden}
.ti:hover{border-color:var(--line)}.ti:focus{border-color:var(--gold);background:var(--card);outline:none}
.meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:6px}
.meta select,.meta input{min-height:30px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:0 8px;font-size:12.5px;color:var(--ink)}
.meta input.num{width:70px;font-family:var(--mono)}
.proof{padding:0 16px 12px 70px;display:flex;flex-direction:column;gap:5px}
.proof .pr{display:flex;gap:8px;align-items:center}
.proof input{flex:1;min-width:0;min-height:32px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:0 9px;font-size:13px}
button.x:not(.chk){border:0;background:none;color:var(--mut2);font-size:16px;width:28px;height:28px;border-radius:6px;flex-shrink:0}
button.x:not(.chk):hover{background:var(--crits);color:var(--crit)}
.tasks{border-top:1px solid var(--line2);background:color-mix(in srgb,var(--soft) 35%,var(--card))}
.trow{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,2fr) 120px 74px 28px;gap:8px;align-items:start;padding:9px 16px 9px 70px;border-bottom:1px solid var(--line2)}
.trow:last-child{border-bottom:0}
.trow input,.trow select{width:100%;min-height:32px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:0 8px;font-size:13px;color:var(--ink)}
.trow input.num{font-family:var(--mono)}
.trow .checks{grid-column:1/-1}
.thead{padding:8px 16px 4px 70px;display:grid;grid-template-columns:minmax(0,2.2fr) minmax(0,2fr) 120px 74px 28px;gap:8px;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut2);font-weight:700}
.addrow{padding:8px 16px 12px 70px}
.empty{padding:28px;text-align:center;color:var(--mut)}

table.t{width:100%;border-collapse:collapse;font-size:13px}
table.t th{text-align:left;font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut2);font-weight:700;padding:10px 12px;border-bottom:1px solid var(--line)}
table.t td{padding:10px 12px;border-bottom:1px solid var(--line2);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t td.n{font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
table.t input.num{width:64px;min-height:30px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:0 8px;font-family:var(--mono);font-size:13px;color:var(--ink)}
.tw{overflow-x:auto}
.who{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.av{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-size:9.5px;font-weight:700;color:#fff;flex-shrink:0}

.fc{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.fchead{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.big{font-family:var(--serif);font-size:48px;line-height:1;font-weight:500;letter-spacing:-.02em}
.verdict{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.verdict.ok{background:var(--oks);color:var(--ok)}.verdict.w{background:var(--lates);color:var(--late)}.verdict.x{background:var(--crits);color:var(--crit)}
svg.ch{width:100%;height:auto;display:block;overflow:visible}
svg.ch text{font-family:var(--sans);font-size:11px;fill:var(--mut)}
svg.ch text.l{fill:var(--ink);font-size:12px;font-weight:600}
svg.ch text.v{font-family:var(--mono);fill:var(--ink);font-weight:600}
.lg{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--mut)}
.lg span{display:inline-flex;gap:6px;align-items:center}.lg i{display:inline-block}
.risk{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 120px 28px;gap:8px;padding:8px 16px 8px 70px;border-bottom:1px solid var(--line2);align-items:center}
.risk input,.risk select{width:100%;min-height:32px;border:1px solid var(--line);border-radius:8px;background:var(--card);padding:0 8px;font-size:13px;color:var(--ink)}

/* Claude guide */
.col3{position:sticky;top:18px;display:flex;flex-direction:column;gap:14px;height:calc(100vh - 36px);min-height:520px;min-width:0}
.guide{display:flex;flex-direction:column;overflow:hidden;flex:1 1 auto;min-height:420px}
.gh{padding:14px 16px 10px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.gh .mk{width:30px;height:30px;border-radius:9px;background:var(--pbg);color:var(--pfg);display:grid;place-items:center;font-family:var(--serif);font-weight:600;font-size:16px}
.gh b{display:block;font-size:14px}.gh span{display:block;font-size:11.5px;color:var(--mut)}
.feed{flex:1;overflow-y:auto;padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-height:80px}
.gh,.gin,.status{flex-shrink:0}
.msg{font-size:13.5px;line-height:1.5;color:var(--ink2);white-space:pre-wrap}
.msg.me{align-self:flex-end;background:var(--soft);border-radius:12px 12px 4px 12px;padding:8px 12px;max-width:88%;color:var(--ink)}
.msg.cl{border-left:2px solid var(--gold);padding-left:10px}
.msg.sys{font-size:12px;color:var(--mut);text-align:center}
.sug{border:1px solid var(--goldline);background:var(--goldsoft);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.sug .ty{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--gold2);font-weight:700}
.sug b{font-size:13.5px;font-weight:600;color:var(--ink)}
.sug p{margin:0;font-size:12.5px;color:var(--ink2)}
.sug .pv{font-size:12.5px;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 9px}
.sug .acts{display:flex;gap:6px}
.sug.done{opacity:.55}.sug.done .acts{display:none}
.gq{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px;border-top:1px solid var(--line2);max-height:156px;overflow-y:auto;flex-shrink:0}
.gql{width:100%;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut2);font-weight:700}
.gqc{text-align:left;display:inline-flex;gap:6px;align-items:baseline;line-height:1.3}
.gqk{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gold2);white-space:nowrap}
.chip{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--ink2)}
.chip:hover{border-color:var(--gold)}
.gin{border-top:1px solid var(--line);padding:10px 12px;display:flex;gap:8px;align-items:flex-end}
.gin textarea{flex:1;min-width:0;min-height:40px;max-height:120px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:8px 10px;font-size:13.5px;color:var(--ink)}
.status{font-size:11.5px;color:var(--mut);padding:0 14px 8px}
.dots::after{content:"";animation:dots 1.4s steps(4) infinite}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%{content:"..."}}

/* execute */
.exec{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.exec>*{min-width:0}
.ehead{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.prog{flex:1;min-width:200px}
.prog .bar{height:8px;border-radius:4px;background:var(--soft);overflow:hidden;margin-top:6px}
.prog .bar i{display:block;height:100%;background:var(--ink);border-radius:4px}
.stage{display:flex;flex-direction:column;align-items:center;gap:16px;padding:20px 0}
.deck{position:relative;width:min(560px,100%)}
.deck::before,.deck::after{content:"";position:absolute;left:16px;right:16px;bottom:-8px;height:20px;border-radius:0 0 18px 18px;background:var(--card);border:1px solid var(--line);z-index:0}
.deck::after{left:32px;right:32px;bottom:-16px;opacity:.6}
.tc{position:relative;z-index:1;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 26px;display:flex;flex-direction:column;gap:14px;box-shadow:0 12px 32px rgba(27,27,24,.08);transition:transform .25s ease,opacity .25s ease}
.tc.out{transform:translateX(60px) rotate(4deg);opacity:0}
@media (prefers-reduced-motion:reduce){.tc{transition:none}}
.tc .ctx{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--mut)}
.tag{font-size:11px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--soft);color:var(--ink2)}
.tc h2{margin:0;font-family:var(--serif);font-weight:500;font-size:28px;line-height:1.2;text-wrap:balance}
.dw{display:flex;gap:10px;font-size:14px;color:var(--ink2);background:var(--soft);border-radius:10px;padding:10px 12px}
.dw b{color:var(--ink)}
.est{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.est div{display:flex;flex-direction:column;gap:2px;border-left:2px solid var(--line);padding-left:10px}
.est b{font:600 20px var(--mono)}.est span{font-size:11.5px;color:var(--mut)}
.why{font-size:12.5px;color:var(--mut)}
.timer{font:600 40px var(--mono);text-align:center;letter-spacing:.02em}
.cacts{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.cacts .btn{min-height:44px;padding:0 18px;font-size:14px}
.side{display:flex;flex-direction:column;gap:14px}
.side .card{padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.li{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:5px 0;border-bottom:1px solid var(--line2)}
.li:last-child{border-bottom:0}
.li span{color:var(--mut)}
.help{border:1px solid var(--info);background:var(--infos);border-radius:18px;padding:20px 22px;display:flex;flex-direction:column;gap:12px;width:min(560px,100%)}
.help h3{margin:0;font-family:var(--serif);font-weight:500;font-size:22px}
.reasons{display:flex;flex-wrap:wrap;gap:6px}
.reasons button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cockpit{padding:24px;display:flex;flex-direction:column;gap:12px;max-width:760px}
.cockpit h2{margin:0;font-family:var(--serif);font-weight:500;font-size:26px}
.cockpit ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;color:var(--ink2)}

/* execute: day setup, run, replan */
.xwrap{display:flex;flex-direction:column;gap:14px;max-width:1080px;margin:0 auto;width:100%}
.xwin{padding:20px 22px;display:flex;flex-direction:column;gap:18px}

.rbody{display:flex;flex-direction:column;gap:3px}.rbody b{font-size:14.5px;font-weight:600}
.rh{font-size:13px;font-weight:600;padding-top:2px}
.racts{display:flex;gap:2px}.racts .x:disabled{opacity:.25;cursor:default;background:none}
.mini{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.mini li{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;font-size:13px;padding:8px 12px;border:1px dashed var(--line);border-radius:10px}

.obj{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--goldline);background:var(--goldsoft);border-radius:12px;padding:11px 13px;font-size:13.5px;font-weight:600;color:var(--ink);line-height:1.35}

.fb.cur .fbar{background:var(--ink)}.fb.cur .fl{color:var(--ink)}.fb.cur .ft{color:var(--ink);font-weight:600}

.xsubf{display:flex;flex-direction:column;gap:8px}.xsubf:empty{display:none}
.xclaude{display:flex;flex-direction:column;gap:8px;border:1px solid var(--goldline);background:var(--goldsoft);border-radius:12px;padding:10px 12px}
.dlg .seg{flex-wrap:wrap;align-self:flex-start}
@media (max-width:820px){.obar{grid-template-columns:1fr}.rrow{--tl:44px;grid-template-columns:var(--tl) 14px minmax(0,1fr) auto}.rrow .racts{grid-column:3/-1}.xhead h2{font-size:23px}}

/* day setup v2 */

.ocard{display:grid;grid-template-columns:24px 1fr;grid-template-rows:1fr auto;gap:4px 10px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;min-height:86px;font-size:13.5px;color:var(--ink2);line-height:1.35}

.ocard[aria-pressed="true"]{border-color:var(--ink);background:var(--goldsoft);color:var(--ink);font-weight:600}

.bld{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.2fr);gap:16px;align-items:start}
.poolc{display:flex;flex-direction:column;gap:12px;border:1px dashed var(--line);border-radius:14px;padding:12px;background:color-mix(in srgb,var(--soft) 40%,var(--card));min-height:200px}

.pg{display:flex;flex-direction:column;gap:6px}
.pgh{display:flex;align-items:baseline;gap:8px}.pgh b{font-size:12px;letter-spacing:.08em;text-transform:uppercase}

.pc:hover{border-color:var(--gold)}.pc.dragging,.tcard.dragging{opacity:.4}

.pcb{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}.pcb b{font-size:13.5px;font-weight:600;line-height:1.3}

.qadd select{min-height:38px;border:1px solid var(--line);border-radius:10px;background:var(--card);padding:0 8px}

/* KR picker, milestone chooser */

.kpr{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.kpc{position:relative;display:flex;flex-direction:column;gap:8px;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:11px 12px;font-size:13px;color:var(--ink2);line-height:1.35}
.kpc:hover{border-color:var(--gold)}
.kpc[aria-pressed="true"]{border-color:var(--ink);background:var(--goldsoft);color:var(--ink);box-shadow:inset 3px 0 0 var(--gold)}

.crsum{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mut)}.crsum span{display:inline-flex;gap:5px;align-items:center}.crsum b{color:var(--ink)}

.crh{display:flex;gap:6px;align-items:center}.crt{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--gold2)}.crh2{margin-left:auto;font-size:12px;font-weight:600}

<script>
/* ================= data ================= */
// Key results of Q4 2026, from SKL OS (W44). Today: Fri 30 Oct 2026, W44. Plans start W45.
const KRS=[
 {id:"kr11",t:"1.1 · Ad batches ready within 5 working days",o:"michael",now:"0",tg:"7"},
 {id:"kr12",t:"1.2 · Handoffs accepted on first submission",o:"michael",now:"67 %",tg:"90 %"},
 {id:"kr13",t:"1.3 · 70 % of new students reach a first result in 30 days",o:"romain",now:"0 %",tg:"70 %"},
 {id:"kr21",t:"2.1 · 5 qualified live calls per day per sales rep",o:"amin",now:"1",tg:"5"},
 {id:"kr22",t:"2.2 · Cost per qualified live call ≤ $500",o:"michael",now:"$1,100",tg:"$500"},
 {id:"kr23",t:"2.3 · Trust score ≥ 8/10, prospects and sales team",o:"amin",now:"0",tg:"8"},
 {id:"kr31",t:"3.1 · $200k cash collected in December",o:"amin",now:"$11k",tg:"$200k"},
 {id:"kr32",t:"3.2 · Close 35 % of qualified live calls",o:"valentino",now:"25 %",tg:"35 %"},
 {id:"kr33",t:"3.3 · Refunds within 30 days below 3 % of Q4 sales",o:"romain",now:"3 %",tg:"3 %"}];
// Hours per week each person gives to THIS plan (their other KRs take the rest) and estimation coefficient (actual ÷ estimated). Sample values until Execute has 4 weeks of data.
const TEAM={romain:{n:"Romain",focus:5,coef:1.4,c:"#7A4B00"},amin:{n:"Amin",focus:2,coef:1.2,c:"#2D5C9C"},michael:{n:"Michael",focus:3,coef:1.6,c:"#1F6A66"},
 ilya:{n:"Ilya",focus:4,coef:1.3,c:"#6B4FA0"},valentino:{n:"Valentino",focus:2,coef:1.1,c:"#8A2D3B"},liam:{n:"Liam",focus:3,coef:1.3,c:"#4F6B2D"}};
const R={now:44,start:45,last:52,taskMax:4,gap:2,msWeek:3,help:.15,commit:85,dayH:9,days:6};R.weekMax=R.dayH*R.days;
const ACT=["work","working","prepare","preparing","start","starting","continue","improve","improving","think","research","look","try","help","support","manage","handle","explore","review","reviewing","discuss","plan","planning","organise","organize","follow","focus","develop","developing","build","building"];
const VERBS=new Set("add analyse analyze approve ask audit book brief build calculate call check choose clean collect compare compile configure confirm connect create decide define deliver design draft edit email export fill find fix gather hire import interview launch list load log map measure meet merge migrate move name note order outline pay post price print publish record recruit remove rename replace report rewrite run schedule score send set setup share ship sign sort split survey tag test train update upload validate write".split(" "));
const SAMPLES={};
const STEPS=[
 ["outcome","Outcome","Key result, target, deadline"],
 ["milestones","Milestones","Results, 3 a week at most"],
 ["tasks","Tasks","Next physical actions, ≤ 4 h"],
 ["estimates","Estimates","Calibrated on each person's record"],
 ["premortem","Pre-mortem","Why we could be late"],
 ["commit","Commit","Priority order, then Execute"]];

/* ================= state ================= */
const KEY="skl-roadmap-studio-v5";
const S={choose:{},view:"build",step:"milestones",kr:"kr13",plans:{},feed:{},sugs:{},committed:{},exec:{who:"romain",blocked:[],log:[],doneIds:[],dropped:[],pool:[],history:[],day:null},pop:null};
function load(){try{if(S.view==="cockpit")S.view="build";const d=JSON.parse(localStorage.getItem(KEY)||"null");if(d&&d.plans){Object.assign(S,{carryOpen:d.carryOpen,weeks:d.weeks||{},carryDone:d.carryDone||{},carryReserve:d.carryReserve,plans:d.plans,committed:d.committed||{},step:d.step||S.step,kr:d.kr||S.kr,exec:Object.assign(S.exec,d.exec||{})})}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify({carryOpen:S.carryOpen,weeks:S.weeks,carryDone:S.carryDone,carryReserve:S.carryReserve,plans:S.plans,committed:S.committed,step:S.step,kr:S.kr,exec:S.exec}))}catch(e){}}
function planOf(id){if(!S.plans[id])S.plans[id]=SAMPLES[id]?JSON.parse(JSON.stringify(SAMPLES[id])):{kr:id,due:52,why:"",ms:[]};return S.plans[id]}
function plan(){return planOf(S.kr)}
const krOf=id=>KRS.find(k=>k.id===id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const uid=p=>p+Math.random().toString(36).slice(2,7);
const allTasks=P=>P.ms.flatMap(m=>m.tasks.map(t=>Object.assign(t,{_m:m.id})));
const findT=(P,id)=>allTasks(P).find(t=>t.id===id);
const findM=(P,id)=>P.ms.find(m=>m.id===id);
const ownerOf=(P,t)=>t.o||(findM(P,t._m)||{}).o||"";
const cap=o=>TEAM[o]?TEAM[o].focus:8;
const coef=o=>TEAM[o]?TEAM[o].coef:1.3;
const cal=(P,t)=>(+t.e||0)*coef(ownerOf(P,t));
// Sunday 8 pm of ISO week w, 2026 (W1 starts Mon 29 Dec 2025)
const sunday=w=>{const d=new Date(Date.UTC(2025,11,29)+((w-1)*7+6)*864e5);return d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short",timeZone:"UTC"})};
const av=o=>TEAM[o]?`<span class="av" style="background:${TEAM[o].c}">${TEAM[o].n.slice(0,2).toUpperCase()}</span>`:`<span class="av" style="background:var(--mut2)">?</span>`;
const ownerSel=(v,attrs)=>`<select ${attrs}><option value="">No owner</option>${Object.entries(TEAM).map(([k,p])=>`<option value="${k}" ${v===k?"selected":""}>${p.n}</option>`).join("")}</select>`;
const weekSel=(v,attrs)=>`<select ${attrs}>${Array.from({length:R.last-R.start+1},(_,i)=>R.start+i).map(w=>`<option value="${w}" ${+v===w?"selected":""}>W${w} · ${sunday(w)}</option>`).join("")}</select>`;

/* ================= checks: the code decides ================= */
function msChecks(P,m){const first=(m.t||"").trim().toLowerCase().split(/\s+/)[0]||"";const c=[];
 c.push({k:"result",ok:!!m.t&&!ACT.includes(first),hard:1,lab:m.t?(ACT.includes(first)?"Activity, not a result":"States a result"):"No title"});
 c.push({k:"proof",ok:m.proof.filter(x=>x.trim()).length>0,hard:1,lab:m.proof.filter(x=>x.trim()).length?"Proof for Sunday 8 pm":"No proof line"});
 c.push({k:"owner",ok:!!m.o,hard:1,lab:m.o?"One owner":"No owner"});
 c.push({k:"date",ok:m.w>=R.start&&m.w<=P.due,hard:1,lab:m.w<=P.due?"Before the KR deadline":"After the KR deadline"});
 c.push({k:"tasks",ok:m.tasks.length>0,hard:1,lab:m.tasks.length?m.tasks.length+" task"+(m.tasks.length>1?"s":""):"No task delivers it"});
 const same=P.ms.filter(x=>x.w===m.w).length;c.push({k:"load",ok:same<=R.msWeek,hard:1,lab:same>R.msWeek?`${same} milestones in W${m.w}: keep ${R.msWeek}`:`${same} of ${R.msWeek} in W${m.w}`});
 return c}
function taskChecks(P,t){const first=(t.t||"").trim().toLowerCase().split(/\s+/)[0]||"";const c=[];
 c.push({k:"verb",ok:VERBS.has(first),hard:0,lab:VERBS.has(first)?"Starts with a verb":"Start with a verb"});
 c.push({k:"done",ok:!!(t.dw||"").trim(),hard:1,lab:(t.dw||"").trim()?"Done-when set":"No done-when"});
 c.push({k:"owner",ok:!!t.o,hard:1,lab:t.o?"Owner":"No owner"});
 c.push({k:"est",ok:+t.e>0,hard:1,lab:+t.e>0?"Estimated":"No estimate"});
 c.push({k:"size",ok:!(+t.e>R.taskMax),hard:1,lab:+t.e>R.taskMax?`${t.e} h · over ${R.taskMax} h, split it`:`≤ ${R.taskMax} h`});
 return c}
function gaps(P){return []} // gap rule removed: only this week's milestones are required, 3 at most
function overWeeks(P){const by={};P.ms.forEach(m=>(by[m.w]=by[m.w]||[]).push(m));return Object.keys(by).map(Number).filter(w=>by[w].length>R.msWeek).sort((a,b)=>a-b).map(w=>({w,list:by[w]}))}
const MSI=STEPS.findIndex(s=>s[0]==="milestones");
function blockedFrom(i){const P=plan();return i>MSI&&overWeeks(P).length}
function riskChecks(P,m){const ok=m.risks.some(r=>(r.t||"").trim()&&(r.mit||"").trim());return {ok,lab:ok?"Pre-mortem done":"No risk with a mitigation"}}
function stepIssues(P,step){
 if(!P.ms.length&&["tasks","estimates","premortem"].includes(step))return 1;
 if(step==="outcome")return 0; // a targeted key result (yours or someone else's) validates the step; the why is encouraged, not required
 if(step==="milestones")return P.ms.reduce((a,m)=>a+msChecks(P,m).filter(c=>!c.ok&&c.k!=="tasks").length,0)+gaps(P).length+(P.ms.length?0:1);
 if(step==="tasks")return P.ms.reduce((a,m)=>a+(m.tasks.length?0:1)+m.tasks.reduce((b,t)=>b+taskChecks(P,t).filter(c=>!c.ok&&c.k!=="est"&&c.k!=="size").length,0),0);
 if(step==="estimates")return allTasks(P).filter(t=>!(+t.e>0)||+t.e>R.taskMax).length+weekLoad(P).over.length;
 if(step==="forecast")return 0;
 if(step==="premortem")return P.ms.filter(m=>!riskChecks(P,m).ok).length;
 if(step==="commit")return S.committed[S.kr]?0:1;
 return 0}
function quality(P){let ok=0,n=0;P.ms.forEach(m=>{msChecks(P,m).forEach(c=>{n++;ok+=c.ok}) ;const r=riskChecks(P,m);n++;ok+=r.ok;m.tasks.forEach(t=>taskChecks(P,t).forEach(c=>{n++;ok+=c.ok}))});const g=gaps(P).length;n+=1;ok+=g?0:1;n+=1;ok+=P.why.trim()?1:0;return n?Math.round(ok/n*100):0}
const hardFails=P=>weekLoad(P).over.length+P.ms.reduce((a,m)=>a+msChecks(P,m).filter(c=>c.hard&&!c.ok).length+m.tasks.reduce((b,t)=>b+taskChecks(P,t).filter(c=>c.hard&&!c.ok).length,0),0)+gaps(P).length;

/* ================= forecast: Monte Carlo, priority by slack ================= */
function order(P,slack){const T=allTasks(P),dependents={};T.forEach(t=>(t.deps||[]).forEach(d=>dependents[d]=(dependents[d]||0)+1));
 const mo={};P.ms.forEach((m,i)=>mo[m.id]=i);
 const base=T.slice().sort((a,b)=>{const sa=slack?slack[a._m]:0,sb=slack?slack[b._m]:0;return (sa-sb)||(findM(P,a._m).w-findM(P,b._m).w)||(mo[a._m]-mo[b._m])||((dependents[b.id]||0)-(dependents[a.id]||0))});
 const out=[],done=new Set();let guard=0;while(out.length<base.length&&guard++<500){for(const t of base){if(done.has(t.id))continue;if((t.deps||[]).every(d=>done.has(d)||!findT(P,d))){out.push(t);done.add(t.id);break}}}
 base.forEach(t=>{if(!done.has(t.id))out.push(t)});return {list:out,dependents}}
let FC={sig:"",val:null};
// Order of work only (no probability): earliest milestone first, then what unblocks the most
function forecast(P){const sig=JSON.stringify([P.ms]);if(FC.sig===sig)return FC.val;const fin=order(P);const v={order:fin.list,dependents:fin.dependents,ms:{},slack:{},prob:1};FC={sig,val:v};return v}
const lateMs=()=>[];
function whyFirst(P,F,t){const m=findM(P,t._m),d=F.dependents[t.id]||0,bits=[];
 bits.push(`M${P.ms.indexOf(m)+1} is due W${m.w}`);
 if(d)bits.push(`unblocks ${d} task${d>1?"s":""}`);return bits.join(" · ")}

/* ================= suggestions (same shape for Claude and for the built-in guide) ================= */
// {type, target, data, why}: rewrite_ms, add_ms, move_ms, rewrite_task, split_task, set_owner, add_task, set_est, add_risk, reassign_task, set_focus
function applySug(P,s){const d=s.data||{};
 switch(s.type){
  case "rewrite_ms":{const m=findM(P,s.target);if(!m)throw 0;if(d.t)m.t=d.t;if(Array.isArray(d.proof))m.proof=d.proof.slice(0,4);if(d.o)m.o=d.o;break}
  case "add_ms":{const m={id:d.id&&!findM(P,d.id)?d.id:uid("m"),t:d.t||"New milestone",w:Math.min(P.due,Math.max(R.start,+d.w||R.start)),o:d.o||"",proof:Array.isArray(d.proof)?d.proof:[],risks:[],tasks:[]};P.ms.push(m);P.ms.sort((a,b)=>a.w-b.w);break}
  case "move_ms":{const m=findM(P,s.target);if(!m)throw 0;m.w=Math.min(P.due,Math.max(R.start,+d.w));P.ms.sort((a,b)=>a.w-b.w);break}
  case "rewrite_task":{const t=findT(P,s.target);if(!t)throw 0;if(d.t)t.t=d.t;if(d.dw!=null)t.dw=d.dw;break}
  case "split_task":{const t=findT(P,s.target);if(!t||!Array.isArray(d.parts))throw 0;const m=findM(P,t._m),i=m.tasks.indexOf(t);
   const parts=d.parts.map((p,k)=>({id:uid("t"),t:p.t,dw:p.dw||"",o:t.o,e:+p.e||2,deps:k?[]:t.deps.slice()}));for(let k=1;k<parts.length;k++)parts[k].deps=[parts[k-1].id];
   m.tasks.splice(i,1,...parts);allTasks(P).forEach(x=>{if(x.deps.includes(t.id))x.deps=x.deps.map(z=>z===t.id?parts[parts.length-1].id:z)});break}
  case "set_owner":case "reassign_task":{const t=findT(P,s.target);if(!t)throw 0;t.o=d.o;break}
  case "add_task":{const m=findM(P,s.target);if(!m)throw 0;m.tasks.push({id:uid("t"),t:d.t||"New task",dw:d.dw||"",o:d.o||m.o,e:+d.e||0,deps:[],nb:+d.nb||undefined});break}
  case "set_est":{const t=findT(P,s.target);if(!t)throw 0;t.e=+d.e;break}
  case "add_risk":{const m=findM(P,s.target);if(!m)throw 0;m.risks.push({t:d.t||"",mit:d.mit||"",l:d.l||"medium"});break}
  case "set_focus":{if(!TEAM[s.target])throw 0;TEAM[s.target].focus=+d.h;break}
  default:throw 0}}
const SUGT={rewrite_ms:"Rewrite milestone",add_ms:"Add milestone",move_ms:"Move milestone",rewrite_task:"Rewrite task",split_task:"Split task",set_owner:"Set owner",reassign_task:"Rebalance",add_task:"Add task",set_est:"Correct estimate",add_risk:"Add risk",set_focus:"Capacity"};
function sugPreview(P,s){const d=s.data||{};const t=findT(P,s.target),m=findM(P,s.target);
 switch(s.type){case "rewrite_ms":return `<b>${esc(d.t||m&&m.t)}</b>${d.proof?`<br>Proof: ${d.proof.map(esc).join(" · ")}`:""}`;
  case "add_ms":return `<b>W${d.w} · ${esc(d.t)}</b>${d.proof?`<br>Proof: ${d.proof.map(esc).join(" · ")}`:""}`;
  case "move_ms":return `${esc(m?m.t:"")} → <b>W${d.w}</b>`;
  case "rewrite_task":return `<b>${esc(d.t||t&&t.t)}</b>${d.dw?`<br>Done when: ${esc(d.dw)}`:""}`;
  case "split_task":return (d.parts||[]).map(p=>`• ${esc(p.t)} <span class="mono">${p.e} h</span>`).join("<br>");
  case "set_owner":case "reassign_task":return `${esc(t?t.t:"")} → <b>${esc(TEAM[d.o]?TEAM[d.o].n:d.o)}</b>`;
  case "add_task":return `<b>${esc(d.t)}</b>${d.dw?`<br>Done when: ${esc(d.dw)}`:""} <span class="mono">${d.e||"?"} h</span>`;
  case "set_est":return `${esc(t?t.t:"")}: <span class="mono">${t?t.e:"?"} h → <b>${d.e} h</b></span>`;
  case "add_risk":return `<b>${esc(d.t)}</b><br>Mitigation: ${esc(d.mit)}`;
  case "set_focus":return `${esc(TEAM[s.target]?TEAM[s.target].n:"")}: <b>${d.h} focus h / week</b>`}return ""}
// Built-in guidance for the sample plan (used when Claude cannot be reached from this view)
const BUILTIN={};

/* ================= Claude ================= */
let SAMPLE=null,BUSY=null;
(async()=>{try{SAMPLE=await window.claude?.use?.("sample")}catch(e){SAMPLE=null}renderGuideMode()})();
// SKL OS · Claude roadmap planner · prompt pack v1 (30 Oct 2026)
// One source for the page and for the integration document. {{name}} = value filled by the page.
const PROMPTS = {
version: "planner-v1",

system: `You are the roadmap planner of SKL OS, the operating system of ALKIMIY. You guide one person, step by step, to build the best possible roadmap for one key result of the quarter, then to commit it. Work like a world-class chief of staff: precise, demanding, brief.

## What you can see
- CONTEXT holds live SKL OS data read for this session: who the person is, the quarter's objectives and key results with status, the targeted key result in full (metric, baseline, plan, milestones, initiatives and hypotheses, check-ins, risks, linked library items and decisions), roadmap health, open tasks of this key result, open decisions, alerts, the last weekly review and related library items.

## Rules of SKL OS (enforced by code; you never override them)
1. Key result: a number with a deadline and one owner. Anyone may draft its roadmap; the owner commits it.
2. Milestone: a RESULT true on Sunday 8 pm of its week, never an activity ("work on", "prepare", "improve", "explore"…). One to four proof lines anyone can check. One owner. At most {{msWeek}} milestones in the same week. Only this week's milestones are required; later weeks are optional.
3. Task: the next physical action. Starts with a verb, has a "done when", one owner, at most {{taskMax}} h (split bigger ones). Every proof line is delivered by at least one task.
4. Estimates: planned hours = estimate × the owner's coefficient (actual ÷ estimated). Nobody is planned over {{dayH}} h a day, {{days}} days a week ({{weekMax}} h) of their own work. Help to colleagues comes on top and is not planned here.
5. Pre-mortem: at least one risk per milestone, each with a mitigation someone can do; a mitigation that needs work becomes a task.
6. Commit: only with no blocking issue. Order of work: earliest milestone first, then the task that unblocks the most.

## Best practices you apply, most important first
1. Line of sight. Every milestone must move the key result. State its hypothesis: "if X is true on Sunday, the number moves because Y". Challenge any milestone that does not move the number.
2. Lead before lag. Prefer milestones that install or move a leading indicator the team controls every week (calls booked, students reaching day 7, scripts approved…), not only the final number.
3. Backwards from the deadline. Ask what must be true the week before W{{due}}, and the week before that, even when only this week is written down. Give that path in one or two lines.
4. Smallest proof first. The first milestone proves the approach works within one or two weeks, before heavy investment.
5. Cut scope, never quality or the date. When the plan does not fit, propose what to drop, defer or simplify.
6. Capacity is real. Use the coefficients and LOAD. Never plan anyone over {{weekMax}} h in a week. Avoid single-person bottlenecks.
7. Dependencies are commitments. Name who each task waits on; a dependency on another person needs their date.
8. One owner, a clear done. No shared ownership, no vague "done when".
9. Reference class. Compare estimates with similar done tasks in SKL OS and say which ones.
10. Pre-mortem from evidence: open alerts, late or blocked tasks, check-in trends, pending decisions, people, tools, clients, holidays.
11. Reuse what exists. Initiatives, hypotheses, library items, mechanisms and past decisions in SKL OS come before new ideas.

## How you work with the person
- Stay on the current step. Message: two to four short sentences. Then concrete suggestions the page can apply.
- Nothing changes until the person accepts a suggestion. Never claim you changed the plan.
- Every "why" cites its evidence: a rule, a number from CONTEXT or a read (example: "key_result 1.3: baseline 0 %, no check-in since W43").
- Never invent a fact about the company: no number, price, client, tool, date or person that is not in CONTEXT or a read. If it is missing, write "to confirm" and ask one question.
- Owners come only from TEAM. English only. Never write "closer": say "sales".
- If this step is already good, say so in one sentence and return no suggestion.`,

 el.innerHTML=`<div class="scrim" data-close="1"><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="mh"><div class="dh"><div><div class="pk" style="color:var(--gold2)">Page method</div><h2 id="mh">Roadmap Studio</h2></div><button class="close" data-close="1" aria-label="Close">×</button></div><div class="db">
 <section><h4>What it is for</h4><p>Turn a key result into a roadmap that holds: milestones anyone can check, tasks small enough to finish, estimates corrected by real records, a week that fits ${R.weekMax} h per person, then execution one task at a time.</p></section>
 <section><h4>The method, and where it comes from</h4><ul>
  <li><b>Week by week</b>: each week sets up to three milestones, results that must be true on Sunday; later weeks are built when they come.</li>
  <li><b>Milestones are results</b>, checked on Sunday 8 pm against proof lines (OKR practice: outcomes, not activities).</li>
  <li><b>Definition of ready and done</b> for tasks: a verb, a done-when, one owner, ${R.taskMax} h at most.</li>
  <li><b>Reference-class forecasting and calibration</b>: estimates are compared with similar past work and corrected by each person's actual ÷ estimated record.</li>
  <li><b>Priority by due date and critical path</b>: the task of the earliest milestone goes first, then the one that unblocks the most.</li>
  <li><b>Pre-mortem</b>: assume failure, list the causes, mitigate them before starting.</li>
  <li><b>Daily planning</b>: each day starts with three objectives (results visible tonight) and a timed roadmap that fits the focus hours; it is validated before the first task.</li>
  <li><b>Work in progress = 1</b> in Execute: one card at a time, the day's timeline above it, the real time recorded.</li>
  <li><b>End-of-day review</b>: what is not finished is replanned on the spot (tomorrow first, back to the queue, or dropped) with what got in the way; the EOD recap is then written from the day and posted to Slack once you validate it.</li></ul></section>
 <section><h4>Decisions taken for SKL OS</h4><ul>
  <li>Task: ${R.taskMax} h at most; above that it is split.</li>
  <li>Milestone: a result with proof lines; ${R.msWeek} per week at most, only this week's are required, and a fourth one must be chosen out before going further.</li>
  <li>Priority is computed by the OS. A person cannot reorder the queue; a lead can override with a written reason.</li>
  <li>Planned work: ${R.dayH} h a day, ${R.days} days a week (${R.weekMax} h). Help given to colleagues comes on top and is counted per person.</li>
  <li>Commit only with no blocking issue.</li>
  <li>Help requests wait until the current card is done, unless marked urgent; their cost on your milestone is shown. Every answer (accept, later today, tomorrow, decline) sends a message to the person who asked, prepared for that answer or written by Claude from your main points.</li>
  <li>Blocked needs a reason and who it waits on; it raises a risk on the milestone.</li>
  <li>The Cockpit is unchanged; it reads the plan, the actual times and the help given.</li></ul></section>
 <section><h4>How to use it</h4><ul><li>Pick a key result, then go through the six steps on the left; red marks show which rule is broken.</li><li>Ask Claude at each step. Every suggestion shows a preview and a reason; nothing changes until you accept it.</li><li>Commit, then open Execute.</li></ul></section>
 <p class="note">Sample values: coefficients are examples until Execute has four weeks of real times. Your edits are kept in this browser only. <button class="btn sm" data-reset="1">Restore the sample plan</button></p></div></div></div>`}
