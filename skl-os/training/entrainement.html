<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Entraînement discovery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;family=Literata:opsz,wght@7..72,400;7..72,500&amp;display=swap">
<style>
/* LNP · Entraînement discovery (Romain, 2026-11-05: cahier « Prompt Entraînement discovery », cas coup_lnp.json et
   lettre_lnp.json tels quels). Fond clair, texte foncé, contrastes forts ; couleurs de la charte LNP. */
:root{--ink:#0C1330;--ink2:#2A3352;--mut:#5A6478;--line:#D6DEF0;--soft:#EEF3FC;--bg:#F7F8FB;--card:#FFFFFF;--brand:#1E2A5E;--vif:#2B6CF5;
  --ok:#137A4F;--oks:#E2F4EB;--mid:#B45309;--mids:#FDF0DC;--ko:#B42318;--kos:#FCE5E2;
  --L1:#2B6CF5;--L2:#7A3FD1;--L3:#C2410C;--L4:#0F766E;--r:14px;--sans:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;--read:'Literata',Georgia,'Times New Roman',serif}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:14px/1.5 var(--sans);overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}button:disabled{cursor:default;opacity:.45}
textarea{font:inherit}
.top{position:fixed;inset:0 0 auto 0;height:58px;z-index:20;display:flex;align-items:center;gap:16px;padding:0 20px;background:var(--card);border-bottom:1px solid var(--line)}
.top .ttl{font-weight:700;font-size:16px;color:var(--brand);white-space:nowrap}
.top .sync{margin-left:auto;min-width:0;font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{flex:1;display:flex;justify-content:center;gap:6px}
.tabs button{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 16px;font-weight:600;color:var(--ink2)}
.tabs button[aria-current=page]{background:var(--brand);border-color:var(--brand);color:#fff}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:600}
.btn.p{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.sm{padding:5px 10px;font-size:13px}
.view{position:fixed;inset:58px 0 0 0;display:none;grid-template-rows:auto minmax(0,1fr);gap:14px;padding:14px 20px 16px}
.view.on{display:grid}
.row1{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;min-height:0}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px 16px}
.cap{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.win{background:var(--card);border:1px solid var(--line);border-radius:var(--r);display:flex;flex-direction:column;min-height:0;overflow:hidden}
.win>.hd{flex:none;padding:12px 16px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px}
.win>.sc{flex:1;min-height:0;overflow:auto;padding:14px 16px}
.win>.sc.stack{display:flex;flex-direction:column;align-items:stretch;gap:12px}
.hd b{font-size:15px}.hd .m{font-size:12.5px;color:var(--mut)}.hd .sp{flex:1}
.persona{flex-basis:100%;font-size:13px;color:var(--ink2)}
.chrono{font:600 13px var(--sans);padding:3px 9px;border-radius:999px;background:var(--soft);color:var(--brand)}.chrono.over{background:var(--kos);color:var(--ko)}
/* séance */
.sess{display:flex;flex-direction:column;gap:6px}
.sess .l1{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.big{font-size:30px;font-weight:700;line-height:1;color:var(--brand)}
.prog{position:relative;height:8px;border-radius:4px;background:var(--soft);overflow:visible;margin:4px 0}
.prog i{position:absolute;left:0;top:0;bottom:0;border-radius:4px;background:var(--ok)}
.prog .goal{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--brand)}
.leg{font-size:12px;color:var(--mut)}
.dots{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.dot{width:14px;height:14px;border-radius:50%;background:var(--soft);border:1px solid var(--line);position:relative;flex:none}
.dot.g{background:var(--ok);border-color:var(--ok)}.dot.o{background:var(--mid);border-color:var(--mid)}.dot.r{background:var(--ko);border-color:var(--ko)}
.dot.cur{box-shadow:0 0 0 2px var(--card),0 0 0 4px var(--brand)}
.dot.hint::after{content:'';position:absolute;inset:3px;border-radius:50%;border:2px solid #fff}
.grp{display:flex;gap:3px;padding:2px 4px;border:1px solid var(--line);border-radius:999px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--mut)}.legend span{display:inline-flex;align-items:center;gap:5px}.legend .dot{width:10px;height:10px}
/* consigne */
.cons p{margin:4px 0 8px;font-weight:600;color:var(--ink2)}
.steps3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.steps3 div{background:var(--soft);border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.4;color:var(--ink2)}.steps3 b{display:block;font-size:13px;color:var(--brand)}
/* script */
.line{display:flex;flex-direction:column;gap:2px;margin:0 0 12px}
.who{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}.who span{font-weight:500;letter-spacing:0;text-transform:none}
.txt{font:16px/1.6 var(--read);color:var(--ink)}
.line.S .txt{color:var(--ink2)}
.line.last{background:var(--soft);border-left:4px solid var(--brand);border-radius:0 10px 10px 0;padding:8px 12px}
.said{font-size:12px;font-weight:700;color:var(--brand)}
.yours{font-size:13px;color:var(--mut);margin-top:2px}
.me{border:2px dashed var(--line);border-radius:12px;padding:10px 12px;margin-top:6px}
.me .txt{min-height:1.6em}.me .empty{color:var(--mut);font:italic 14px var(--sans)}
.hintbox{background:#FFF8E6;border:1px solid #F0D58C;border-radius:10px;padding:10px 12px;margin-bottom:12px}.hintbox .cap{color:#7A5400}
/* tags */
.tag{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;border-radius:999px;padding:2px 9px;color:#fff;white-space:nowrap}
.tag.L1{background:var(--L1)}.tag.L2{background:var(--L2)}.tag.L3{background:var(--L3)}.tag.L4{background:var(--L4)}.tag.I{background:var(--brand)}
/* steps band */
.band{display:flex;gap:6px;flex-wrap:wrap}
.band span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:center;font-size:12.5px;font-weight:600;padding:6px 8px;border-radius:999px;background:var(--soft);color:var(--mut)}
.band span.on{background:var(--brand);color:#fff}.band span.done{background:var(--oks);color:var(--ok)}
.band3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.band3 div{border:1px solid var(--line);border-radius:10px;padding:7px 10px;display:flex;flex-direction:column;gap:1px}
.band3 b{font-size:13px;color:var(--brand)}.band3 span{font-size:12px;color:var(--ink2)}.band3 em{font-style:normal;font-size:11.5px;font-weight:700;color:var(--mut)}
.band3 .cur{border-color:var(--brand);box-shadow:inset 0 0 0 1px var(--brand)}.band3 .v em{color:var(--ok)}.band3 .x em{color:var(--ko)}
h2{margin:0;font-size:18px;line-height:1.3}.sub{margin:-6px 0 0;color:var(--mut);font-size:13px}
/* gestes */
.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.card{position:relative;text-align:left;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:4px}
.card .c{font-weight:700;font-size:13px}.card .n{font-weight:700;font-size:16px}.card .d{font-size:13px;color:var(--ink2)}
.card kbd{position:absolute;top:10px;right:12px;font:600 11px var(--sans);border:1px solid var(--line);border-radius:5px;padding:0 6px;color:var(--mut)}
.card[aria-pressed=true]{border-color:var(--brand);background:var(--soft)}
.seg{display:inline-flex;gap:4px;padding:3px;border-radius:10px;background:var(--soft)}
.seg button{border:0;background:transparent;border-radius:8px;padding:5px 12px;font-weight:600;color:var(--ink2)}.seg button[aria-pressed=true]{background:var(--card);color:var(--brand);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.rowc{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.fb{border-radius:10px;padding:9px 12px;font-weight:600}.fb.good{background:var(--oks);color:var(--ok)}.fb.bad{background:var(--kos);color:var(--ko)}
.etat{background:var(--soft);border-radius:10px;padding:9px 12px;color:var(--ink2)}
.ladder{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.ladder div{border:1px solid var(--line);border-radius:10px;padding:6px 8px;font-size:12.5px;display:flex;flex-direction:column;gap:2px}
.ladder b{font-size:12.5px}.ladder em{font-style:normal;font-size:11px;font-weight:700;color:var(--mut)}
.ladder .att{border-color:var(--brand);background:var(--soft)}.ladder .att em{color:var(--brand)}.ladder .bad em{color:var(--ko)}
.test{border-left:3px solid var(--brand);padding:2px 0 2px 10px;color:var(--ink2);font-size:13.5px}
.ins{font-size:14px;color:var(--ink2)}.ins b{color:var(--ink)}
.exergue{border-left:4px solid var(--brand);background:var(--soft);border-radius:0 10px 10px 0;padding:9px 12px;font-weight:600;color:var(--brand)}
textarea.q{width:100%;min-height:76px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:16px/1.5 var(--read);color:var(--ink);background:#fff}
textarea.q:focus{outline:2px solid var(--vif);outline-offset:0;border-color:var(--vif)}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;border:1px solid var(--line);color:var(--mut);background:#fff}
.chip.ok{border-color:#A7DCC3;background:var(--oks);color:var(--ok)}.chip.ko{border-color:#F2B8B0;background:var(--kos);color:var(--ko)}.chip.adv{border-color:#F1CF9A;background:var(--mids);color:var(--mid)}
.gauge{display:flex;flex-direction:column;gap:3px}
.gbar{position:relative;height:10px;border-radius:5px;background:var(--soft)}
.gbar .zone{position:absolute;top:0;bottom:0;background:#BFE3D0;border-radius:3px}
.gbar .lim{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ko)}
.gbar .cur{position:absolute;top:-4px;width:4px;height:18px;margin-left:-2px;border-radius:2px;background:var(--brand)}
.gline{display:flex;justify-content:space-between;font-size:12px;color:var(--mut)}
.fault{font-size:13px;color:var(--ko);font-weight:500}.fault.adv{color:var(--mid)}
.acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.panel{border:1px solid var(--line);border-radius:12px;padding:11px 13px;display:flex;flex-direction:column;gap:6px}
.panel .qt{font:16px/1.5 var(--read)}.panel .why{font-size:13.5px;color:var(--ink2)}
.panel.std{border-color:#A7DCC3;background:#F5FBF8}
.ko-list{display:flex;flex-direction:column;gap:8px}
.ko-list div{display:flex;flex-direction:column;gap:1px}
.ko-list s{font:15px/1.45 var(--read);color:var(--ink2)}.ko-list span{font-size:13px;color:var(--ko)}
.judge{border:1px solid var(--brand);border-radius:12px;padding:11px 13px;display:flex;flex-direction:column;gap:8px}
.judge .jq{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}.judge .jq p{margin:0;flex:1;min-width:220px}
.yn{display:inline-flex;gap:4px}.yn button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:4px 12px;font-weight:600}
.yn button[aria-pressed=true].y{background:var(--ok);border-color:var(--ok);color:#fff}.yn button[aria-pressed=true].n{background:var(--ko);border-color:var(--ko);color:#fff}
.verdict{border-radius:12px;padding:11px 13px;font-weight:700;font-size:15px}
.verdict.g{background:var(--oks);color:var(--ok)}.verdict.o{background:var(--mids);color:var(--mid)}.verdict.r{background:var(--kos);color:var(--ko)}.verdict.n{background:var(--soft);color:var(--mut);font-weight:500;font-size:13.5px}
.verdict small{display:block;font-weight:500;font-size:13.5px;margin-top:3px}
mark{background:#FFE8A3;color:inherit;border-radius:3px;padding:0 1px}
.ends{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.ends div{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;flex-direction:column;gap:3px;font-size:13px}
.ends b{color:var(--brand)}.ends .st.v{color:var(--ok);font-weight:700}.ends .st.x{color:var(--ko);font-weight:700}
.ends .qt{font:14px/1.45 var(--read);color:var(--ink2)}
/* bilan */
.bilan{grid-row:2;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;display:flex;flex-direction:column;gap:14px}
.score{font-size:52px;font-weight:700;line-height:1;color:var(--brand)}
.figs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.figs div{background:var(--soft);border-radius:12px;padding:10px 12px}.figs b{display:block;font-size:24px;color:var(--brand)}.figs span{font-size:12.5px;color:var(--ink2)}
.analysis{font-size:14.5px;color:var(--ink2);margin:0}
table.mx{border-collapse:collapse;font-size:13px}
table.mx th,table.mx td{border:1px solid var(--line);padding:6px 10px;text-align:center}
table.mx th{background:var(--soft);font-weight:600}
table.mx td.dg{background:var(--oks);color:var(--ok);font-weight:700}table.mx td.er{background:var(--kos);color:var(--ko);font-weight:700}
.redo{display:flex;flex-direction:column;gap:8px}
.redo div{border:1px solid var(--line);border-radius:10px;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.redo .qt{font:15px/1.45 var(--read)}.redo .m{font-size:12.5px;color:var(--mut)}
.bars{display:flex;flex-direction:column;gap:6px;max-width:520px}
.bars div{display:grid;grid-template-columns:40px 70px minmax(0,1fr);align-items:center;gap:10px;font-size:13px}
.bars i{display:block;height:10px;border-radius:5px;background:var(--soft);position:relative;overflow:hidden}.bars i b{position:absolute;left:0;top:0;bottom:0;background:var(--ok)}
/* modale */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(12,19,48,.45);display:flex;align-items:flex-start;justify-content:center;padding:60px 16px;overflow:auto}
.modal{width:min(560px,100%);background:var(--card);border-radius:16px;padding:20px 22px;display:flex;flex-direction:column;gap:14px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h2{font-size:20px}.modal .intro{margin:0;color:var(--ink2)}
.opt{display:flex;flex-direction:column;gap:6px}.opt .ch{display:flex;flex-wrap:wrap;gap:6px}
.opt .ch button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 12px;font-weight:600;font-size:13px}
.opt .ch button[aria-pressed=true]{background:var(--brand);border-color:var(--brand);color:#fff}
.info{font-size:13px;color:var(--mut)}.info.none{color:var(--ko);font-weight:600}
@media (max-width:980px){
  body{overflow:auto}
  .view{position:static;margin-top:58px;display:none;grid-template-rows:auto}
  .view.on{display:flex;flex-direction:column}
  .row1,.row2{grid-template-columns:1fr}
  .win,.win>.sc{overflow:visible}
  .bilan{overflow:visible}
  .steps3,.ends,.figs{grid-template-columns:1fr}
  .ladder{grid-template-columns:repeat(2,minmax(0,1fr))}
  .top{position:fixed;flex-wrap:nowrap}.top .ttl{font-size:14px}.tabs button{padding:6px 10px;font-size:12.5px}
}
@media (max-width:620px){.top .ttl{display:none}.cards{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="top">
  <div class="ttl">Entraînement discovery</div>
  <nav class="tabs" aria-label="Entraînements">
    <button type="button" data-tab="coup">Le coup suivant</button>
    <button type="button" data-tab="lettre">La lettre imposée</button>
  </nav>
  <span class="sync" id="sync" role="status"></span>
  <button type="button" class="btn p" id="newSession">Nouvelle séance</button>
</header>
<main class="view" id="view-coup"></main>
<main class="view" id="view-lettre"></main>
<div id="modalRoot"></div>
<script>/*@RESULTS@*/</script>
<script>
(function () {
  "use strict";
  var COUP = /*@COUP@*/[];
  var LETTRE = /*@LETTRE@*/[];

  // ------------------------------------------------------------------ communs
  var REG = { F: "Financier", T: "Temps & charge", Id: "Identité & statut", M: "Mental & émotionnel" };
  var GESTES = {
    L1: { nom: "Situation", court: "Faire décrire les faits : volumes, prix, organisation.", long: "Faire décrire les faits : activité, volumes, prix, organisation.",
      test: "Ta question réclame-t-elle un fait vérifiable : un nombre, une organisation, une manière de faire ? Si la réponse attendue est un ressenti, ce n’est pas L1." },
    L2: { nom: "Problème", court: "Faire nommer, avec ses mots, ce qui coince.", long: "Faire nommer par le prospect lui-même ce qui coince.",
      test: "La réponse attendue est-elle une difficulté formulée avec ses mots à lui ? Si c’est toi qui as posé le frein et qu’il acquiesce, le geste n’est pas fait." },
    L3: { nom: "Impact", court: "Faire peser ou chiffrer la conséquence du problème.", long: "Faire peser ou chiffrer la conséquence du problème déjà nommé.",
      test: "Le problème est-il nommé avant ta question ? Sinon tu pèses un problème qui n’existe pas encore. La réponse attendue est un montant, une durée, une fréquence ou un effet concret." },
    L4: { nom: "Vision", court: "Faire projeter le prospect sur la situation résolue.", long: "Faire projeter le prospect sur la situation résolue.",
      test: "L’impact est-il pesé avant ta question ? Et la réponse attendue est-elle une image que lui décrit, pas une solution que tu proposes ?" }
  };
  var GK = ["L1", "L2", "L3", "L4"];
  var MAILLONS = [
    { k: "I1", nom: "Le coût direct", cons: "Fais chiffrer ou peser ce que le frein qu’il vient de nommer lui coûte : de l’argent, du temps, des clients.", court: "Fais chiffrer ce que le frein lui coûte." },
    { k: "I2", nom: "L’effet en chaîne", cons: "Pars de la perte qu’il vient de dire et fais dire ce qu’elle entraîne à son tour.", court: "Fais dire ce que cette perte entraîne." },
    { k: "I3", nom: "Ce que ça lui fait", cons: "Fais dire ce que cette situation produit chez lui : un état, une image de soi, une relation.", court: "Fais dire ce que ça lui fait, à lui." }
  ];

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function words(s) { return String(s || "").split(/[^\p{L}\p{N}%]+/u).filter(Boolean); }
  function nWords(s) { return words(s).length; }
  function norm(s) { return String(s || "").toLowerCase().replace(/[’`´]/g, "'").replace(/\s+/g, " ").trim(); }
  function pad(n, k) { n = String(n); while (n.length < k) n = "0" + n; return n; }
  function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
  function goalOf(n) { return Math.ceil(n * 0.8); }
  function pct(a, b) { return b ? Math.round(a / b * 100) + " %" : "—"; }

  // historique local, une clé par entraînement ; l'application marche aussi sans
  function load(key) { try { var v = JSON.parse(window.localStorage.getItem(key) || "{}"); return v && typeof v === "object" ? v : {}; } catch (e) { return {}; } }
  function store(key, v) { try { window.localStorage.setItem(key, JSON.stringify(v)); } catch (e) {} }
  var R = window.LNP_RESULTS || { mark: function () { return 0; }, since: function () { return 0; }, add: function () {}, onChange: function () {} };
  R.onChange(function (t) { var el = document.getElementById("sync"); if (el) { el.textContent = t; el.title = t; } });
  var KEY_COUP = "lnp-entrainement-coup-suivant", KEY_LETTRE = "lnp-entrainement-lettre-imposee";

  // la jauge de longueur : 0 à 24 mots, zone cible, marque rouge à 18, curseur
  function gauge(n, lo, hi) {
    var w = function (x) { return Math.min(100, x / 24 * 100) + "%"; };
    return '<div class="gauge"><div class="gbar"><span class="zone" style="left:' + w(lo) + ';width:calc(' + w(hi) + ' - ' + w(lo) + ')"></span>' +
      '<span class="lim" style="left:' + w(18) + '"></span><span class="cur" style="left:' + w(Math.min(n, 24)) + '"></span></div>' +
      '<div class="gline"><span>' + n + " mot" + (n > 1 ? "s" : "") + "</span><span>cible " + lo + " à " + hi + " · limite 18</span></div></div>";
  }
  function chipsHtml(res, empty) {

    if (topRule) ana += " La règle que tu enfreins le plus : « " + topRule + " » (" + counts[topRule] + " fois).";
    if (judgedNo) ana += " " + judgedNo + " question" + (judgedNo > 1 ? "s passaient" : " passait") + " la forme mais pas ton propre jugement : c’est le fond qu’il faut travailler.";
    var bars = '<div class="bars">' + per.map(function (p) { return "<div><b>" + MAILLONS[p.k].k + "</b><span>" + p.v + " / " + p.t + '</span><i><b style="width:' + (p.t ? p.v / p.t * 100 : 0) + '%"></b></i></div>'; }).join("") + "</div>";
    var refused = all.filter(function (x) { return !x.l.valid; }).map(function (x) {
      var c = LETTRE.filter(function (z) { return z.n === x.n; })[0];
      return '<div><span><span class="tag I">' + MAILLONS[x.k].k + " · " + esc(MAILLONS[x.k].nom) + '</span></span><span class="qt">' + esc(c.r[x.k].ok) + '</span><span class="m">' + (x.l.q ? "Ta version : " + esc(x.l.q) : "Tu n’avais pas écrit de question.") +
        (x.l.faults && x.l.faults.length ? " · règles en faute : " + esc(x.l.faults.join(", ")) : "") + " · cas " + pad(x.n, 2) + "</span></div>";
    }).join("");
    var incomplete = Lt.chains.filter(function (ch) { return ch.links.filter(function (l) { return l.valid; }).length < 3; });
    return '<section class="bilan" aria-label="Bilan de séance"><div class="score">' + valid + "/" + tot + "</div><h2>" + (valid >= g ? "Objectif atteint" : "Objectif non atteint : " + g + " questions valides visées") + "</h2>" +
      '<p class="analysis">Questions d’implication valides sur ' + N + " cas. Une question est valide quand elle passe les sept règles de forme et tes deux jugements.</p>" +
      '<div class="figs"><div><b>' + held + " / " + N + "</b><span>chaînes tenues</span></div><div><b>" + pct(valid, tot) + "</b><span>de questions valides</span></div><div><b>" + avg + "</b><span>temps moyen par question (cible sous 30 s)</span></div></div>" +
      '<p class="analysis">' + esc(ana) + "</p>" +
      '<div class="cap">Réussite selon la place dans la chaîne</div>' + bars +
      (refused ? '<div class="cap">Les questions refusées</div><div class="redo">' + refused + "</div>" : "") +
      '<div class="acts">' + (incomplete.length ? '<button type="button" class="btn" data-do="rejouer">Rejouer les ' + incomplete.length + " cas incomplets</button>" : "") + '<button type="button" class="btn p" data-do="nouvelle">Nouvelle séance</button></div></section>';
  }
  function lettrePool(sel) {
    var h = load(KEY_LETTRE);
    return LETTRE.filter(function (c) {
      if (sel.reg !== "all" && c.reg !== sel.reg) return false;
      if (sel.quels === "never" && h[c.n] && h[c.n].count) return false;
      if (sel.quels === "incomplete" && !(h[c.n] && h[c.n].count && h[c.n].last < 3)) return false;
      return true;
    });
  }
  function settingsLettre() {
    openModal({ intro: "Chaque cas impose trois questions d’implication de suite. L’objectif est 80 % de questions valides.",
      sel: Object.assign({}, Lt.sel),
      groups: [
        { key: "nb", label: "Nombre de cas", opts: [["3", "3 cas · 9 questions"], ["5", "5 cas · 15"], ["10", "10 cas · 30"], ["20", "Les 20"]] },
        { key: "reg", label: "Registre", opts: [["all", "Tous"], ["F", REG.F], ["T", REG.T], ["Id", REG.Id], ["M", REG.M]] },
        { key: "quels", label: "Quels cas", opts: [["all", "Tous"], ["never", "Jamais joués"], ["incomplete", "Chaînes incomplètes"]] }],
      pool: lettrePool, count: function (s) { return +s.nb; }, start: function (pick, sel) { Lt.sel = sel; startLettre(pick); } });
  }
  viewL.addEventListener("click", function (e) {
    var b = e.target.closest("button"); if (!b || b.disabled) return;
    if (b.dataset.j) { var kv = b.dataset.j.split(":"); Lt[kv[0]] = kv[1] === "1"; renderLettre(false); return; }
    var d = b.dataset.do;
    if (d === "seche") { Lt.q = ""; toCorrigeL(); }
    else if (d === "comparer") { if (Lt.q.trim()) toCorrigeL(); }
    else if (d === "repondre") answerL();
    else if (d === "cas") nextCas();
    else if (d === "rejouer") { var inc = Lt.chains.filter(function (ch) { return ch.links.filter(function (l) { return l.valid; }).length < 3; }).map(function (ch) { return LETTRE.filter(function (x) { return x.n === ch.n; })[0]; }); startLettre(shuffle(inc)); }
    else if (d === "nouvelle") settingsLettre();
  });
  viewL.addEventListener("input", function (e) { if (e.target.id === "qL") { Lt.q = e.target.value; liveLettre(); } });

  // ------------------------------------------------------------------ navigation, URL, clavier
  var TABS = { coup: "coup-suivant", lettre: "lettre-imposee" }, current = "coup";
  function show(tab, fromHash) {
    current = tab;
    document.querySelectorAll(".tabs button").forEach(function (b) { if (b.dataset.tab === tab) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
    viewC.classList.toggle("on", tab === "coup"); viewL.classList.toggle("on", tab === "lettre");
    if (!fromHash) { try { history.replaceState(null, "", "#" + TABS[tab]); } catch (e) { try { location.hash = TABS[tab]; } catch (e2) {} } }
    if (tab === "lettre" && Lt.phase === "write" && !Lt.bilan) { var ta = document.getElementById("qL"); if (ta) ta.focus(); }
  }
  function fromHash() { var h = (location.hash || "").replace("#", ""); return h === TABS.lettre ? "lettre" : "coup"; }
  document.querySelector(".tabs").addEventListener("click", function (e) { var b = e.target.closest("[data-tab]"); if (b) show(b.dataset.tab); });
  window.addEventListener("hashchange", function () { show(fromHash(), true); });
  document.getElementById("newSession").addEventListener("click", function () { if (current === "coup") settingsCoup(); else settingsLettre(); });
  function inField(t) { return t && (t.tagName === "TEXTAREA" || t.tagName === "INPUT" || t.isContentEditable); }
  function visible() { return document.visibilityState !== "hidden"; }
  document.addEventListener("keydown", function (e) {
    if (modal) { if (e.key === "Escape") { e.preventDefault(); closeModal(); } return; }
    if (!visible()) return;
    var t = e.target, ctrlEnter = e.key === "Enter" && (e.metaKey || e.ctrlKey);
    if (current === "coup" && !C.bilan) {
      if (ctrlEnter && C.step === 2) { e.preventDefault(); if (C.q.trim()) toCorrige(); return; }
      if (inField(t)) return;
      if (C.step === 1) {
        var k = "1234".indexOf(e.key);
        if (k >= 0) { e.preventDefault(); C.choice = GK[k]; renderCoup(); return; }
        if (e.key === "Enter" && C.choice) { e.preventDefault(); C.step = 2; renderCoup(); var ta = document.getElementById("qC"); if (ta) ta.focus(); return; }
      } else if (C.step === 3) {
        var wrote = !!C.q.trim();
        if (wrote && (e.key === "o" || e.key === "O" || e.key === "n" || e.key === "N")) {
          e.preventDefault(); var yes = e.key.toLowerCase() === "o";
          if (C.j1 === null) C.j1 = yes; else if (C.j2 === null) C.j2 = yes; renderCoup(); return;
        }
        if (e.key === "Enter" && (!wrote || (C.j1 !== null && C.j2 !== null))) { e.preventDefault(); nextCoup(); return; }
      }
    } else if (current === "lettre" && !Lt.bilan) {
      if (ctrlEnter && Lt.phase === "write") { e.preventDefault(); if (Lt.q.trim()) toCorrigeL(); return; }
      if (inField(t)) return;
      if (Lt.phase === "correct") {
        var w = !!Lt.q.trim();
        if (w && (e.key === "o" || e.key === "O" || e.key === "n" || e.key === "N")) {
          e.preventDefault(); var y = e.key.toLowerCase() === "o";
          if (Lt.j1 === null) Lt.j1 = y; else if (Lt.j2 === null) Lt.j2 = y; renderLettre(false); return;
        }
        if (e.key === "Enter" && (!w || (Lt.j1 !== null && Lt.j2 !== null))) { e.preventDefault(); answerL(); return; }
      } else if (Lt.phase === "end" && e.key === "Enter") { e.preventDefault(); nextCas(); return; }
    }
  });

  // au chargement : une séance de 20 coups et une séance de 5 cas démarrent directement
  startCoup(shuffle(COUP).slice(0, 20));
  startLettre(shuffle(LETTRE).slice(0, 5));
  show(fromHash(), !location.hash);
  window.LNP_TRAINING = { C: C, L: Lt, rulesCoup: rulesCoup, rulesLettre: rulesLettre, nWords: nWords, prospectKeys: prospectKeys };
})();
</script>
</body>
</html>
