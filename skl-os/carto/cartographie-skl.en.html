<title>SKL Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500;6..96,700&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: infinite canvas. Horizontal axis = observable states of the individual, from A to B, linked by transition cells.
   Each card is a NEED; the means (agent, human, system) are a layer. Lanes: meta · production · experience · graph · conversion · support · memory · tools.
   A single model, editable and shared; four more views: Events, Build order, Simulator, Model. */
:root{
  --bg:#0C0C0D; --surface:#151517; --surface-2:#1C1C1F; --line:#2B2A27; --line-strong:#3D3A33;
  --fg:#EEEAE2; --muted:#9A958A; --gold:#C9A75E; --gold-dim:rgba(201,167,94,.16);
  --ok:#71B58C; --wip:#86A9DB; --missing:#DE6E5E; --loop:#8FC4BB; --esc:#C9A0D6;
  --es-ev:#F0954B; --es-pol:#B597E6; --es-cmd:#6FA3E6; --es-act:#E2C25A; --es-read:#6CC08D;
  --dot:rgba(238,234,226,.07); --shadow:0 12px 32px rgba(0,0,0,.5); --scrim:rgba(12,12,13,.88);
  --f-display:'Bodoni Moda', Didot, 'Bodoni 72', Georgia, serif;
  --f-body:'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono:'JetBrains Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]){
  --bg:#F1EFEA; --surface:#FFFFFF; --surface-2:#F8F6F1; --line:#DCD7CC; --line-strong:#C4BDAE;
  --fg:#131313; --muted:#67625A; --gold:#94742C; --gold-dim:rgba(148,116,44,.12);
  --ok:#2E7A50; --wip:#2D5C9C; --missing:#B23F2D; --loop:#2F7A72; --esc:#7B4A8C;
  --es-ev:#C2601A; --es-pol:#7A55B0; --es-cmd:#2F68AE; --es-act:#9A7A10; --es-read:#2E7F50;
  --dot:rgba(19,19,19,.09); --shadow:0 10px 26px rgba(40,30,10,.13); --scrim:rgba(241,239,234,.92);
  color-scheme:light;
}}
:root[data-theme="light"]{
  --bg:#F1EFEA; --surface:#FFFFFF; --surface-2:#F8F6F1; --line:#DCD7CC; --line-strong:#C4BDAE;
  --fg:#131313; --muted:#67625A; --gold:#94742C; --gold-dim:rgba(148,116,44,.12);
  --ok:#2E7A50; --wip:#2D5C9C; --missing:#B23F2D; --loop:#2F7A72; --esc:#7B4A8C;
  --es-ev:#C2601A; --es-pol:#7A55B0; --es-cmd:#2F68AE; --es-act:#9A7A10; --es-read:#2E7F50;
  --dot:rgba(19,19,19,.09); --shadow:0 10px 26px rgba(40,30,10,.13); --scrim:rgba(241,239,234,.92);
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#app{position:fixed;inset:0}
#viewport{position:absolute;inset:0;overflow:hidden;cursor:grab;touch-action:none;background-color:var(--bg);background-image:radial-gradient(var(--dot) 1.2px,transparent 1.3px)}
#viewport.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#layer{position:absolute;left:0;top:0}
body.ro .edit-only{display:none!important}

.topbar{position:absolute;left:0;right:0;top:0;z-index:20;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 12px;background:linear-gradient(var(--scrim),var(--scrim) 70%,transparent);pointer-events:none}
.topbar>*{pointer-events:auto}
.brand{display:flex;align-items:baseline;gap:10px}
.brand b{font-family:var(--f-display);font-size:26px;letter-spacing:.06em;color:var(--gold);font-weight:700}
.brand span{font-size:13px;color:var(--muted);white-space:nowrap}
.stats{display:flex;gap:6px;overflow-x:auto;min-width:0;flex:1 1 0;scrollbar-width:none}
.fbar{position:absolute;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:17;display:flex;gap:8px}
.fbtn:disabled{opacity:.45;cursor:default;border-color:var(--line)}
.fbtn.undo::before{content:"↶";width:auto;height:auto;background:none;color:var(--gold);font-size:17px;line-height:1}
.toast{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:30;display:flex;align-items:center;gap:14px;padding:10px 14px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);color:var(--fg);box-shadow:var(--shadow);font-size:13.5px;max-width:calc(100% - 32px)}
.toast button{border:1px solid var(--gold);background:none;color:var(--gold);border-radius:6px;padding:4px 10px;font-size:13px;white-space:nowrap}
#confirm{position:fixed;inset:0;z-index:40;background:color-mix(in srgb,var(--bg) 72%,transparent);display:flex;align-items:center;justify-content:center;padding:16px}
.cf-box{background:var(--surface);border:1px solid var(--line-strong);border-radius:14px;box-shadow:var(--shadow);padding:22px;max-width:440px;width:100%;box-sizing:border-box;display:flex;flex-direction:column;gap:12px}
.cf-box h2{margin:0;font:500 26px/1.15 var(--f-display);text-wrap:balance}
.cf-box p{margin:0;line-height:1.5;font-size:14px}
.cf-box .cf-n{color:var(--muted);font-size:12.5px}
.cf-a{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;flex-wrap:wrap}
.cf-a .btn{padding:9px 16px;font-size:14px}
.cf-a .cf-danger{background:var(--missing);color:var(--bg);border-color:var(--missing)}
.fbtn{position:relative;display:inline-flex;align-items:center;gap:8px;padding:9px 14px;border:1px solid var(--gold);border-radius:10px;background:var(--surface);color:var(--fg);font-size:13.5px;font-weight:500;box-shadow:var(--shadow)}
.fbtn::before{content:"";width:14px;height:10px;flex:none;background:linear-gradient(var(--gold),var(--gold)) 0 0/100% 2px no-repeat,linear-gradient(var(--gold),var(--gold)) 2px 4px/10px 2px no-repeat,linear-gradient(var(--gold),var(--gold)) 4px 8px/6px 2px no-repeat}
.fbtn[aria-pressed="true"]{background:var(--gold-dim)}
.fbtn .cnt{font:12px var(--f-mono);color:var(--gold)}
.lh{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:-4px 0 -4px}
.lh b{font:500 22px var(--f-display)}
.lh button{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;width:32px;height:30px;font-size:16px;line-height:1}
.chip{display:inline-flex;align-items:center;gap:7px;padding:6px 11px;border:1px solid var(--line);border-radius:999px;background:var(--surface);font-size:12.5px;white-space:nowrap;font-variant-numeric:tabular-nums}
.chip i{width:8px;height:8px;border-radius:50%;display:inline-block}
.chip[aria-pressed="true"]{border-color:var(--gold);background:var(--gold-dim)}
.seg2{display:inline-flex;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:2px;flex-wrap:wrap}
.seg2 button{border:0;background:none;padding:5px 10px;border-radius:6px;font-size:13px;white-space:nowrap;color:var(--muted)}
.seg2 button[aria-pressed="true"]{background:var(--gold-dim);color:var(--fg)}
.search input{width:180px;max-width:40vw;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
.search input::placeholder{color:var(--muted)}
.tb-btn{padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);font-size:13px;white-space:nowrap}
.tb-btn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
body.model-open .map-only{display:none!important}

#layers{position:absolute;left:16px;top:var(--top,84px);bottom:calc(68px + env(safe-area-inset-bottom,0px));width:262px;z-index:15;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;gap:16px}
#layers h3{margin:0 0 6px;font:500 10.5px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.opt{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:13.5px;cursor:pointer;user-select:none}
.opt input{accent-color:var(--gold);width:15px;height:15px;margin:0}
.opt .n{margin-left:auto;color:var(--muted);font:12px var(--f-mono);font-variant-numeric:tabular-nums}
.sw{width:20px;height:0;border-top:2px solid;flex:none}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;justify-content:space-between;gap:8px;border:0;background:none;padding:5px 8px;margin:0 -8px;border-radius:6px;text-align:left;font-size:13.5px}
.nav button:hover{background:var(--surface-2)}
.nav small{color:var(--muted);font:11px var(--f-mono)}
.hint{font-size:12px;color:var(--muted);line-height:1.5;border-top:1px solid var(--line);padding-top:12px;margin-top:auto}
.hint kbd{font:11px var(--f-mono);border:1px solid var(--line);border-radius:4px;padding:1px 4px}
.btnrow{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:6px 10px;font-size:12.5px;white-space:nowrap}
.btn:hover{border-color:var(--gold)}
.btn.add{border-style:dashed;border-color:color-mix(in srgb,var(--gold) 60%,var(--line));color:var(--gold)}
.btn.danger,.btn.del{color:var(--missing);border-color:color-mix(in srgb,var(--missing) 50%,var(--line))}

.lane{position:absolute;border-top:1px solid var(--line)}
.lane-label{position:absolute;width:300px;font:500 13px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--muted);line-height:1.5}
.lane-label b{display:block;font:500 34px/1.05 var(--f-display);letter-spacing:-.005em;text-transform:none;color:var(--fg);margin-top:6px}
.lane-label span{display:block;font:14px/1.4 var(--f-body);letter-spacing:0;text-transform:none;margin-top:6px}
.world-title{position:absolute;white-space:nowrap}
.world-title .k{font:500 14px var(--f-mono);letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
.world-title h1{margin:8px 0 0;font:500 92px/1 var(--f-display);letter-spacing:-.015em}
.world-title p{margin:10px 0 0;font-size:20px;color:var(--muted)}
.zone{position:absolute;border:1px solid var(--line);border-radius:20px;background:color-mix(in srgb,var(--surface) 50%,transparent)}
.zone h2{position:absolute;left:24px;top:18px;margin:0;font:500 36px/1 var(--f-display)}
.zone p{position:absolute;left:24px;top:62px;margin:0;color:var(--muted);font-size:14px}
.chain-label{position:absolute;width:270px;box-sizing:border-box}
.chain-label .k{font:500 11px var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.chain-label b{display:block;font:500 26px/1.1 var(--f-display);margin-top:4px}
.chain-label span{display:block;font-size:13px;color:var(--muted);margin-top:4px;line-height:1.4}
.chain-label.dom{cursor:pointer;border:1px solid transparent;border-radius:12px;padding:8px 10px;margin:-8px -10px}
.chain-label.dom:hover,.chain-label.dom.sel{border-color:var(--gold)}
.act{position:absolute;border-top:2px solid var(--gold);padding-top:10px}
.act .k{font:500 12px var(--f-mono);letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.act b{display:block;font:500 40px/1.05 var(--f-display);margin-top:4px}
.act span{display:block;color:var(--muted);font-size:14px;margin-top:2px}

.card{position:absolute;box-sizing:border-box;border:1px solid var(--line-strong);border-radius:12px;background:var(--surface);cursor:pointer;transition:opacity .2s,box-shadow .2s,border-color .2s;overflow:hidden}
.card:hover{border-color:var(--gold)}
.card.sel{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-dim),var(--shadow)}
.card.match{box-shadow:0 0 0 3px var(--gold)}
#world.focus .dim{opacity:.13}
.code{font:500 11px var(--f-mono);color:var(--muted);letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.krb{color:var(--gold);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block;flex:none}
.d-ok{background:var(--ok)} .d-wip{background:var(--wip)} .d-missing{background:var(--missing)}
.s-missing .pill{color:var(--missing);border-color:color-mix(in srgb,var(--missing) 45%,transparent)}

.state{padding:14px 16px;display:flex;flex-direction:column;gap:4px;border-color:var(--gold);border-radius:18px}
.state .nm{font:500 26px/1.05 var(--f-display)}
.state .sb{font-size:12.5px;color:var(--muted);line-height:1.35}
.state .sg{margin-top:auto;font-size:12px;line-height:1.4;border-top:1px solid var(--line);padding-top:8px;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden}
.state .sg em{display:block;font-style:normal;color:var(--gold);font:500 10.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;margin-bottom:2px}
.state .sg em.ko{color:var(--missing)}
.state.pole-end{background:var(--gold-dim)}
.state.pole-end .nm{font-size:32px}

.head{padding:12px 14px;display:flex;flex-direction:column;gap:7px}
.head .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.head .tag{font:500 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.head .ms{font:500 20px/1.15 var(--f-display);text-wrap:balance;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.head .cons{font-size:11.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meas{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.meas div{border:1px solid var(--line);border-radius:6px;padding:3px 7px;min-width:0}
.meas small{display:block;font:500 9.5px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.meas b{display:block;font:500 13px var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meas b.none{color:var(--missing);font-weight:400}
.checks{display:flex;gap:10px;margin-top:auto;font-size:11.5px;color:var(--muted)}
.checks span{display:inline-flex;align-items:center;gap:5px}
.checks .ko{color:var(--missing)} .checks .ok{color:var(--ok)}
.head.incomplete{border-color:color-mix(in srgb,var(--missing) 50%,var(--line-strong))}
.exp{position:absolute;box-sizing:border-box;height:34px;padding:0 12px;display:flex;align-items:center;border-radius:999px;border:1px solid var(--line);background:var(--surface-2);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

.need{padding:10px 12px;display:flex;flex-direction:column;gap:5px}
.need .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.need .ti{font-size:15.5px;font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-wrap:balance}
.need .why{font-size:12px;line-height:1.38;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.need .ft,.tool .ft{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:11.5px;color:var(--muted)}
.ko-t{color:var(--missing)}
.need.ghost{border-style:dashed;border-color:color-mix(in srgb,var(--missing) 60%,var(--line));background:color-mix(in srgb,var(--surface) 55%,transparent)}
.means{display:flex;flex-direction:column;gap:3px;border-top:1px solid var(--line);padding-top:5px}
.mline{display:flex;align-items:center;gap:7px;font-size:12px;min-width:0}
.mline .k{font:500 9.5px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--gold);flex:none;width:44px}
.mline .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mline.m-missing .nm{color:var(--missing)}
.meter{display:inline-flex;gap:2px;align-items:center;flex:none}
.meter i{width:10px;height:6px;border-radius:2px;border:1px solid var(--gold);box-sizing:border-box}
.meter i.f{background:var(--gold)} .meter i.t{border-style:dashed} .meter i.n{border-color:var(--line-strong)}
.asset{padding:12px 14px;display:flex;flex-direction:column;gap:5px;border:1.5px dashed var(--gold);background:var(--gold-dim)}
.asset .k{font:500 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.asset .ti{font:500 20px/1.15 var(--f-display)}
.asset .fd{margin-top:auto;font-size:12px;color:var(--muted)}
.tool{padding:10px 12px;display:flex;flex-direction:column;gap:5px;border-radius:4px}
.tool .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tool .ti{font:500 19px/1.15 var(--f-display)}
.tool .rl{font-size:12px;color:var(--muted);line-height:1.38;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.also{position:absolute;font-size:12px;color:var(--muted);line-height:1.5}
.also button,.chips button{border:1px solid var(--line);background:none;border-radius:6px;padding:1px 6px;margin:2px 3px 0 0;font:11px var(--f-mono);color:var(--muted)}
.also button:hover,.chips button:hover{border-color:var(--gold);color:var(--fg)}
.exit{padding:10px 12px;display:flex;flex-direction:column;gap:4px;border-style:dashed;border-color:color-mix(in srgb,var(--missing) 65%,var(--line));border-radius:18px;background:color-mix(in srgb,var(--surface) 60%,transparent)}
.exit .k{font:500 10.5px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--missing)}
.exit .ti{font:500 21px/1.1 var(--f-display)}
.exit .ds{font-size:12px;color:var(--muted);line-height:1.38;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.exit .rc{margin-top:auto;font-size:11.5px}
.strip{position:absolute;box-sizing:border-box;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);cursor:pointer}
.strip.s-missing{border-style:dashed;border-color:color-mix(in srgb,var(--missing) 55%,var(--line))}
.strip:hover{border-color:var(--gold)}
.strip.sel{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-dim)}
.strip-name{position:absolute;left:14px;top:50%;transform:translateY(-50%);display:flex;align-items:center;gap:10px;white-space:nowrap}
.strip-name b{font:500 22px var(--f-display)}
.strip-name .host{font-size:12px;color:var(--muted)}
.strip-name .host.ko-t{color:var(--missing)}
.mark{position:absolute;top:50%;transform:translateY(-50%);font:500 11.5px var(--f-mono);padding:3px 8px;border-radius:6px;border:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.mark.w{border-color:var(--gold);color:var(--gold)}

.edge{fill:none;transition:opacity .2s}
.e-spine{stroke:var(--gold);stroke-width:3}
.e-hand{stroke:var(--gold);stroke-width:2}
.e-loop{stroke:var(--loop);stroke-width:2.6;stroke-dasharray:10 8}
.e-short{stroke:var(--gold);stroke-width:2.2;stroke-dasharray:3 6}
.e-exit{stroke:var(--missing);stroke-width:2;stroke-dasharray:7 6}
.e-ret{stroke:var(--ok);stroke-width:2;stroke-dasharray:7 6}
.e-esc{stroke:var(--esc);stroke-width:1.8;stroke-dasharray:2 5}
.e-feed{stroke:var(--gold);stroke-width:1.4;stroke-dasharray:4 6;opacity:.75}
.elabel{font:500 13px var(--f-mono);paint-order:stroke;stroke:var(--bg);stroke-width:6px;stroke-linejoin:round}
.l-gold{fill:var(--gold)} .l-loop{fill:var(--loop)} .l-ret{fill:var(--ok)} .l-esc{fill:var(--esc)}
#world.far .need .why,#world.far .need .ft,#world.far .means,#world.far .head .cons,#world.far .meas,#world.far .exit .ds,#world.far .state .sb,#world.far .code,#world.far .elabel,#world.far .tool .rl,#world.far .tool .ft{display:none}
#world.far .need .ti{font-size:24px;-webkit-line-clamp:4}
#world.far .head .ms{font-size:28px;-webkit-line-clamp:4}
#world.far .exp{font-size:17px}

#panel{position:absolute;right:16px;top:var(--top,84px);bottom:16px;width:400px;z-index:16;overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:20px;display:flex;flex-direction:column;gap:15px}
#panel .meta{display:flex;justify-content:space-between;align-items:center;font:12px var(--f-mono);color:var(--muted)}
#panel h2{margin:0;font:500 30px/1.1 var(--f-display);text-wrap:balance}

const STATES_B=[
 ["E0","Point A","Lives the problem, does not know the guru","Part of the market targeted by the Factory","target_market"],
 ["E1","Exposed","Has seen the guru for the first time","First view of a piece of content (at least 3 s)","content_viewed"],

const TRANS_B=[
 ["T01","Exposure","Make them discover that the guru exists",["Short video in the feed","Guru ad","Guest appearance with another creator"],"Exposed / targeted market",["P1","P2"]],
 ["T02","Exposure","Make them want to come back",["Series of pillar content","Recognizable recurring format","Live"],"% of exposed who come back",["P1","P2"]],
 ["T03","Exposure","Build a relationship",["Personal reply to their comment","DM conversation","Question asked in a story"],"Engagement rate",["P1","P4"]],
 ["T04","Marketing","Get their contact details",["Lead magnet","Masterclass sign-up","Offer in DM"],"Opt-in rate",["P2","P3"]],
 ["T05","Marketing","Prove it is possible for them",["Masterclass","VSL","Proof messages","Cases of students who look like them"],"% of proof viewed to 70%",["P3","P4"]],
 ["T06","Marketing","Get them to ask to talk about it",["Qualification form","Booking page","Appointment-setting message"],"% of leads who book",[]],
 ["T07","Sales","Get them to show up to the call",["Confirmation and reminders","Preparation video","Pre-call questions"],"Attendance rate",[]],
 ["T08","Sales","Clarify their decision",["SPIN sales call","Pitch aligned with their gap","Personal page: solution and roadmap"],"Conversion rate",["P4","P6"]],
 ["T09","Delivery","Get them moving within 7 days",["Welcome message","Kick-off","Personal action plan"],"% started within 7 days",["P5"]],

const UNDO=[];let grp=null;

function put(id,val){record(id);if(val===undefined)delete over[id];else over[id]=val;persist(id)}
function setO(path,v,id){id=id||V.sel;record(id);const o=clone(over[id]||{});let cur=o;for(let i=0;i<path.length-1;i++){cur[path[i]]=cur[path[i]]||{};cur=cur[path[i]]}cur[path[path.length-1]]=v;over[id]=o;persist(id)}
function setMany(id,obj){put(id,Object.assign(clone(over[id]||{}),clone(obj)))}

function undo(){if(SHARED&&!CANW)return;while(UNDO.length&&!Object.keys(UNDO[UNDO.length-1].prev).length)UNDO.pop();const g=UNDO.pop();grp=null;if(!g){updUndo();return}

  const kd=e=>{if(e.key==="Escape"){e.preventDefault();e.stopPropagation();done(false)}else if(e.key==="Tab"){const bs=[...m.querySelectorAll("button")];const i=bs.indexOf(document.activeElement);e.preventDefault();bs[(i+(e.shiftKey?-1:1)+bs.length)%bs.length].focus()}};
  const done=v=>{m.hidden=true;m.onclick=null;document.removeEventListener("keydown",kd,true);try{if(prev&&prev.focus&&document.body.contains(prev))prev.focus()}catch(e){}res(v)};
  m.onclick=e=>{const b=e.target.closest("[data-cf]");if(b)return done(b.dataset.cf==="1");if(e.target===m)done(false)};

const pl=(n,s1,s2)=>n+" "+(n>1?s2:s1);
const V={lanes:{meta:1,prod:1,exp:1,graph:1,mach:1,sup:1,found:1,tools:1},edges:{hand:1,loops:1,short:1,esc:0},kinds:{agent:1,human:1,system:1},cov:{ok:1,wip:1,missing:1},lens:"need",sel:null,model:false,view:"map",gaps:false,ill:false};
let tx=0,ty=0,s=1;

/* =================== RULES =================== */
const RANK={ok:2,wip:1,missing:0};
function cover(n){let best=-1;n.means.forEach(m=>{const r=RANK[m.status];if(r>best)best=r});return best<0?"missing":Object.keys(RANK).find(k=>RANK[k]===best)}
const serves=t=>NEEDS.filter(x=>x.t.includes(t.id));
const chainNeeds=c=>NEEDS.filter(x=>x.chain===c.id);
const contractN=x=>NFIELDS.filter(([k])=>String(x.c[k]||"").trim()).length;
const illDefined=x=>contractN(x)<NFIELDS.length;
const meansOwnerless=x=>x.means.filter(m=>!String(m.owner||"").trim()).length;
const specN=m=>SPEC.filter(([k])=>String((m.spec||{})[k]||"").trim()).length;
const agentMeans=()=>{const a=[];NEEDS.forEach(n=>n.means.forEach((m,i)=>{if(m.kind==="agent")a.push({n,m,i})}));return a};
const mv=(t,k)=>(O(t.id).m||{})[k]||"";
function checks(t){const sy=serves(t).some(x=>cover(x)!=="missing")||t.cons.some(c=>chainNeeds(byId[c]).some(x=>cover(x)!=="missing"));const to=STATES[t.n];
  const sg=!!(to&&O(to.id).signalOk);const mn=MEAS.filter(([k])=>mv(t,k)).length;return{sy,sg,mn,ok:sy&&sg&&mn===4}}
const escTarget=(n,m)=>{const e=m.esc;return byId[e]&&byId[e]._k==="need"&&e!==n.id?e:null};
const toolUsers=t=>NEEDS.filter(n=>n.means.some(m=>m.tools.includes(t.id)));
const placeOf=n=>n.chain?"prod":n.dom?"sup":n.meta?"meta":"mach";

/* =================== GEOMETRY =================== */
const SW=220,CW=330,CARD=300,SH=140,LX=-380,HG=58;
const sx=i=>i*(SW+CW),cx=n=>sx(n-1)+SW;let WTOT=0;
let G={},bounds={};
function visNeed(x){const kindOk=!x.means.length||x.means.some(m=>V.kinds[m.kind]);return kindOk&&V.cov[cover(x)]&&(!V.gaps||cover(x)==="missing")&&(!V.ill||illDefined(x))}

    const rows=Math.max(1,place(NEEDS.filter(x=>x.meta==="FX"&&visNeed(x)),zf),place(NEEDS.filter(x=>x.meta==="CK"&&visNeed(x)),zc));const h=100+rows*(SH+16)+16;
    G.zf={...zf,y,h};G.zc={...zc,y,h};G.lanes.push({id:"meta",y,h,k:"Meta level",b:"Build and steer",d:"Needs that do not touch the individual: create the transformation, adjust the machine."});y+=h+120}
  if(V.lanes.prod){const y0=y;CHAINS.forEach((c,ci)=>{const ry=y0+40+ci*(SH+70);G.chainY[c.id]=ry;
      const list=chainNeeds(c).filter(visNeed).sort((a,b)=>depth[a.id]-depth[b.id]);list.forEach((x,i)=>P[x.id]={x:320+i*(CARD+90),y:ry,w:CARD,h:SH});
      P[c.id]={x:320+Math.max(list.length,1)*(CARD+90),y:ry,w:CARD,h:SH}});
    const h=40+CHAINS.length*(SH+70);G.lanes.push({id:"prod",y:y0,h,k:"Lane 1",b:"Production needs",d:"Build the assets the individual will encounter."});y+=h+60}

    const h=40+mx*156;G.lanes.push({id:"graph",y,h,k:"Exits & returns",b:"Off the line",d:"An individual who exits remains a state, with a return path."});y+=h+50}
  if(V.lanes.mach){let mx=0;
    TRANS.forEach(t=>{const prim=NEEDS.filter(x=>!x.chain&&!x.dom&&!x.meta&&x.t[0]===t.id&&visNeed(x)).sort((a,b)=>depth[a.id]-depth[b.id]);prim.forEach((x,i)=>P[x.id]={x:cx(t.n)+15,y:y+20+i*(SH+HG),w:CARD,h:SH});
      const sec=NEEDS.filter(x=>x.t.indexOf(t.id)>0&&visNeed(x));G.also[t.id]={list:sec,y:y+20+prim.length*(SH+HG)-(prim.length?HG:0)+16};mx=Math.max(mx,prim.length)});
    const h=40+Math.max(1,mx)*(SH+HG)+30;G.lanes.push({id:"mach",y,h,k:"Lane 3",b:"Conversion needs",d:"What must happen for an individual to move forward, linked by handoffs."});y+=h+40}
  if(V.lanes.sup){const y0=y;DOMAINS.forEach((d,di)=>{const ry=y0+40+di*(SH+50);P[d.id]={x:0,y:ry,w:280,h:SH};
      NEEDS.filter(n=>n.dom===d.id&&visNeed(n)).forEach((n,i)=>P[n.id]={x:320+i*(CARD+40),y:ry,w:CARD,h:SH})});
    const h=40+DOMAINS.length*(SH+50);G.lanes.push({id:"sup",y:y0,h,k:"Lane 4",b:"Support functions",d:"Needs that do not move the individual forward, but keep the business running."});y+=h+40}
  if(V.lanes.found){[...MEM,ORCH].forEach((m,i)=>P[m.id]={x:0,y:y+20+i*84,w:WTOT,h:68});
    const h=20+6*84+10;G.lanes.push({id:"found",y,h,k:"Foundations",b:"Memory & orchestration",d:"What all needs share. R = reads, W = writes."});y+=h+30}
  if(V.lanes.tools){const cols=Math.max(1,Math.floor((WTOT+30)/(CARD+30)));TOOLS.forEach((t,i)=>P[t.id]={x:(i%cols)*(CARD+30),y:y+40+Math.floor(i/cols)*174,w:CARD,h:150});
    const rows=Math.max(1,Math.ceil(TOOLS.length/cols));const h=40+rows*174+20;G.lanes.push({id:"tools",y,h,k:"Foundations",b:"Tools & data",d:"Each tool, what it holds, who uses it."});y+=h}
  const nl=LOOPS.filter(l=>byId[l.to]&&byId[l.to]._k==="trans").length;G.loopsTop=-80-nl*56;

const layer=document.getElementById("layer"),edgeLayer=document.getElementById("edge-layer"),world=document.getElementById("world"),vp=document.getElementById("viewport");
function esc(t){return String(t==null?"":t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
const box=(p,cls,inner,id)=>`<div class="${cls}" data-sel="${id}" tabindex="0" role="button" style="left:${p.x}px;top:${p.y}px;width:${p.w}px;height:${p.h}px">${inner}</div>`;

  ACTS.forEach(a=>{h+=`<div class="act" style="left:${sx(a.from-1)+10}px;top:${G.actY}px;width:${Math.max(200,sx(a.to)+SW-10-(sx(a.from-1)+10))}px"><div class="k">${a.k}</div><b>${a.name}</b><span>${a.poles}</span></div>`});
  G.marks.forEach(m=>{h+=`<div class="exp" data-sel="${m.t}" style="left:${m.x}px;top:${m.y}px;max-width:${CARD}px">${esc(m.text)}</div>`});

      TRANS.forEach(t=>{const list=serves(t);const r=list.some(x=>x.r.includes(m.id)),w=list.some(x=>x.w.includes(m.id));if(r||w)inner+=`<span class="mark${w?" w":""}" style="left:${cx(t.n)+15+CARD/2-24}px">${r&&w?"R · W":(w?"W":"R")}</span>`})}

const measDef=(t,k)=>({taux:t.rate,delai:"Median time from "+(STATES[t.n-1]||{}).name+" to "+(STATES[t.n]||{}).name,volume:"Individuals entering per week",cout:"Cost per successful pass"}[k]);
function bez(t,a,b,c,d){const u=1-t;return[u*u*u*a[0]+3*u*u*t*b[0]+3*u*t*t*c[0]+t*t*t*d[0],u*u*u*a[1]+3*u*u*t*b[1]+3*u*t*t*c[1]+t*t*t*d[1]]}
function link2(a,b){const ac=[a.x+a.w/2,a.y+a.h/2],bc=[b.x+b.w/2,b.y+b.h/2];const dx=bc[0]-ac[0],dy=bc[1]-ac[1];let s0,e0,c1,c2;
  if(Math.abs(dx)>Math.abs(dy)*.8){s0=[dx>0?a.x+a.w:a.x,ac[1]];e0=[dx>0?b.x:b.x+b.w,bc[1]];const k=Math.max(40,Math.abs(e0[0]-s0[0])*.45)*(dx>0?1:-1);c1=[s0[0]+k,s0[1]];c2=[e0[0]-k,e0[1]]}
  else{s0=[ac[0],dy>0?a.y+a.h:a.y];e0=[bc[0],dy>0?b.y:b.y+b.h];const k=Math.max(30,Math.abs(e0[1]-s0[1])*.45)*(dy>0?1:-1);c1=[s0[0],s0[1]+k];c2=[e0[0],e0[1]-k]}
  return{d:`M${s0[0]},${s0[1]} C${c1[0]},${c1[1]} ${c2[0]},${c2[1]} ${e0[0]},${e0[1]}`,mid:bez(.5,s0,c1,c2,e0)}}
const colOf=id=>{const x=byId[id];return x&&x._k==="need"&&placeOf(x)==="mach"?byId[x.t[0]].n:null};
function edge(cls,m,d,mid,label,lc,rel){return `<path class="edge ${cls}" data-rel="${rel}" d="${d}" marker-end="url(#m-${m})"/>`+(label&&mid?`<text class="elabel ${lc}" data-rel="${rel}" x="${mid[0]}" y="${mid[1]-8}" text-anchor="middle">${esc(label)}</text>`:"")}
function renderEdges(){let h="";const P=G.pos;const sel=V.sel;
  STATES.forEach((e,i)=>{if(i===STATES.length-1)return;const a=P[e.id],t=P[TRANS[i].id],b=P[STATES[i+1].id];const my=a.y+a.h/2;h+=`<path class="edge e-spine" data-rel="${e.id} ${TRANS[i].id}" d="M${a.x+a.w},${my} L${t.x},${my}"/><path class="edge e-spine" data-rel="${TRANS[i].id} ${STATES[i+1].id}" d="M${t.x+t.w},${my} L${b.x},${my}" marker-end="url(#m-gold)"/>`});
  if(V.lanes.graph&&V.edges.short)SHORTS.forEach((c,i)=>{const a=P[c.from],b=P[c.to];const x1=a.x+a.w/2,x2=b.x+b.w/2,top=a.y-150+i*14;h+=edge("e-short","gold",`M${x1},${a.y} C${x1},${top} ${x2},${top} ${x2},${b.y}`,bez(.5,[x1,a.y],[x1,top],[x2,top],[x2,b.y]),c.label+" · to validate","l-gold",`${c.from} ${c.to} ${c.via}`)});
  if(V.lanes.graph)EXITS.forEach(x=>{const b=P[x.id];if(!b)return;x.from.forEach(f=>{const a=P[f];if(!a)return;const side=f===x.anchor?0:(byId[f].n<byId[x.anchor].n?1:-1);const x1=a.x+a.w/2+side*60,x2=b.x+b.w/2-side*60;h+=edge("e-exit","exit",`M${x1},${a.y+a.h} C${x1},${a.y+a.h+40} ${x2},${b.y-40} ${x2},${b.y}`,null,"","",`${f} ${x.id}`)});
    if(x.ret&&P[x.ret]){const r=P[x.ret];const x1=b.x,y1=b.y+b.h/2,x2=r.x+r.w/2,y2=r.y+r.h;h+=edge("e-ret","ret",`M${x1},${y1} C${x1-120},${y1} ${x2},${y2+80} ${x2},${y2}`,bez(.5,[x1,y1],[x1-120,y1],[x2,y2+80],[x2,y2]),"return","l-ret",`${x.id} ${x.ret} ${x.via.join(" ")}`)}});
  if(V.edges.hand)HAND.forEach(e=>{const a=P[e.from],b=P[e.to];if(!a||!b||!visNeed(byId[e.from])||!visNeed(byId[e.to]))return;
    const la=placeOf(byId[e.from]),lb=placeOf(byId[e.to]);const near=la===lb&&(la==="prod"||(la==="mach"&&Math.abs((colOf(e.from)||0)-(colOf(e.to)||0))<=1));
    if(!near&&!(sel&&(sel===e.from||sel===e.to)))return;const L=link2(a,b);h+=edge("e-hand","gold",L.d,L.mid,e.ev,"l-gold",`${e.from} ${e.to}`)});
  if(V.lanes.meta&&V.edges.loops){let k=0;const tl=LOOPS.filter(l=>byId[l.to]._k==="trans");LOOPS.forEach(l=>{const A=P[l.from],B2=P[l.to];if(!A||!B2)return;let d,mid;
    if(byId[l.to]._k==="trans"){k++;const top=G.loopsTop+(tl.length-k)*56;const off=((k%3)-1)*40;const x1=A.x+A.w/2+off,x2=B2.x+B2.w/2+off;d=`M${x1},${A.y} C${x1},${top} ${x2},${top} ${x2},${B2.y}`;mid=bez(.5,[x1,A.y],[x1,top],[x2,top],[x2,B2.y])}
    else{const x1=A.x+A.w/2,x2=B2.x+B2.w/2,y2=B2.y+B2.h;d=`M${x1},${A.y} C${x1},${A.y-300} ${x2},${y2+300} ${x2},${y2}`;mid=bez(.5,[x1,A.y],[x1,A.y-300],[x2,y2+300],[x2,y2])}
    h+=edge("e-loop","loop",d,mid,l.label,"l-loop",`${l.from} ${l.to}`)})}
  const showEsc=V.lens!=="need"&&V.edges.esc;
  NEEDS.forEach(x=>x.means.forEach(m=>{const to=escTarget(x,m);if(!to||m.kind==="human")return;if(!(showEsc||sel===x.id||sel===to))return;const a=P[x.id],b=P[to];if(!a||!b||!visNeed(x))return;const L=link2(a,b);h+=edge("e-esc","esc",L.d,L.mid,sel===x.id?"escalation":"","l-esc",`${x.id} ${to}`)}));
  const feed=(fromId,toId)=>{const a=P[fromId],b=P[toId];if(a&&b){const L=link2(a,b);h+=edge("e-feed","gold",L.d,null,"","",`${fromId} ${toId}`)}};
  const sx2=sel&&byId[sel];
  if(sx2){if(sx2._k==="chain")sx2.feeds.forEach(f=>feed(sx2.id,f));
    if(sx2._k==="tool"){toolUsers(sx2).forEach(n=>feed(sx2.id,n.id));[...MEM,ORCH].forEach(m=>{if(m.host===sx2.id)feed(sx2.id,m.id)})}
    if((sx2._k==="mem"||sx2._k==="orch")&&sx2.host)feed(sx2.host,sx2.id);
    if(sx2._k==="need"){sx2.rel.forEach(r=>feed(sx2.id,r));sx2.means.forEach(m=>m.tools.forEach(t=>feed(t,sx2.id)))}}
  edgeLayer.innerHTML=h}
function related(id){const R=new Set([id]);const x=byId[id];if(!x)return R;
  const addN=s2=>{R.add(s2.id);s2.r.concat(s2.w).forEach(m=>R.add(m))};
  if(x._k==="need"){x.t.forEach(t=>R.add(t));if(x.chain)R.add(x.chain);if(x.dom)R.add(x.dom);x.r.concat(x.w,x.rel,x.deps).forEach(m=>R.add(m));HAND.forEach(h=>{if(h.from===id)R.add(h.to);if(h.to===id)R.add(h.from)});
    x.means.forEach(m=>{const e=escTarget(x,m);if(e)R.add(e);m.tools.forEach(t=>R.add(t))});NEEDS.forEach(s2=>{if(s2.means.some(m=>escTarget(s2,m)===id)||s2.rel.includes(id))R.add(s2.id)});LOOPS.forEach(l=>{if(l.to===id)R.add(l.from)});EXITS.forEach(z=>{if(z.via.includes(id))R.add(z.id)})}
  else if(x._k==="trans"){R.add(STATES[x.n-1].id);if(STATES[x.n])R.add(STATES[x.n].id);serves(x).forEach(addN);x.cons.forEach(c=>{R.add(c);chainNeeds(byId[c]).forEach(s2=>R.add(s2.id))});EXITS.forEach(z=>{if(z.from.includes(id)){R.add(z.id);z.via.forEach(v=>R.add(v))}});LOOPS.forEach(l=>{if(l.from===id)R.add(l.to);if(l.to===id)R.add(l.from)});NEEDS.forEach(n=>{if(n.rel.includes(id))R.add(n.id)})}
  else if(x._k==="state"){const i=STATES.indexOf(x);if(TRANS[i-1])R.add(TRANS[i-1].id);if(TRANS[i])R.add(TRANS[i].id);R.add("OR");SHORTS.forEach(c=>{if(c.from===id||c.to===id){R.add(c.from);R.add(c.to);R.add(c.via)}});EXITS.forEach(z=>{if(z.ret===id)R.add(z.id)})}
  else if(x._k==="chain"){chainNeeds(x).forEach(addN);x.feeds.forEach(f=>R.add(f))}
  else if(x._k==="dom"){NEEDS.filter(n=>n.dom===id).forEach(n=>{addN(n);n.rel.forEach(r=>R.add(r))})}
  else if(x._k==="exit"){x.from.forEach(f=>R.add(f));if(x.ret)R.add(x.ret);x.via.forEach(v=>R.add(v))}
  else if(x._k==="tool"){toolUsers(x).forEach(n=>R.add(n.id));[...MEM,ORCH].forEach(m=>{if(m.host===id)R.add(m.id)});NEEDS.forEach(n=>{if(n.rel.includes(id))R.add(n.id)})}
  else{if(x.host)R.add(x.host);NEEDS.forEach(s2=>{if(s2.r.includes(id)||s2.w.includes(id)||s2.rel.includes(id)){R.add(s2.id);s2.t.forEach(t=>R.add(t))}})}
  return R}
function markSel(){const R=V.sel?related(V.sel):null;world.classList.toggle("focus",!!V.sel);
  layer.querySelectorAll("[data-sel]").forEach(el=>{const id=el.dataset.sel;el.classList.toggle("sel",id===V.sel&&!el.classList.contains("exp"));el.classList.toggle("dim",!!R&&!R.has(id))});

  const now=ai.length?Math.round(ai.reduce((a,m)=>a+m.now,0)/(ai.length*4)*100):0,tg=ai.length?Math.round(ai.reduce((a,m)=>a+m.target,0)/(ai.length*4)*100):0;

const nextNum=(prefix,list)=>{let n=0;list.forEach(x=>{const m=String(x).match(new RegExp("^"+prefix+"(\\d+)$"));if(m)n=Math.max(n,+m[1])});return n+1};
function newNeedId(){const ids=[...NEEDS_B.map(n=>n.id),...Object.keys(over)];return "B"+nextNum("B",ids)}
function addNeed(place){beginGroup("Add a need");const id=newNeedId();put(id,Object.assign({added:"need",title:"New need",why:"",t:[],chain:"",meta:"",dom:"",r:[],w:[],kr:[],rel:[],deps:[],c:{},means:[]},place));refresh();jump(id)}
function setMeans(n,fn){rebuild();const cur=byId[n.id]||n;const arr=clone(cur.means);fn(arr);setO(["means"],arr,n.id)}
function deleteState(st0){st0=byId[st0.id]||st0;const i=STATES.indexOf(st0);if(i<=0)return;const tid=st0.tid;const rep=(TRANS[i]&&TRANS[i].id)||(TRANS[i-2]&&TRANS[i-2].id)||"";
  NEEDS.forEach(n=>{if(n.t.includes(tid)){const t=n.t.map(x=>x===tid?rep:x).filter((v,k,a)=>v&&a.indexOf(v)===k);setO(["t"],t,n.id)}});
  if(over[st0.id]&&over[st0.id].added==="state")dropO(st0.id);else put(st0.id,{deleted:true});
  put("__order",{states:STATES.map(s=>s.id).filter(x=>x!==st0.id)})}
function addStateAfter(st0){st0=byId[st0.id]||st0;const i=STATES.indexOf(st0);const sfx=Date.now().toString(36).slice(-5);const sid="E"+sfx,tid="T"+sfx;const next=TRANS[i]||TRANS[i-1];
  put(sid,{added:"state",name:"New state",sub:"",signal:"",event:"",tid,trans:{mission:"New transition",pole:next?next.pole:"Delivery",inter:[],rate:""}});
  const ord=STATES.map(s=>s.id);ord.splice(i+1,0,sid);put("__order",{states:ord});return sid}

const num=v=>{const m=String(v==null?"":v).replace(/\s/g,"").replace(",",".").match(/-?\d+(\.\d+)?/);return m?parseFloat(m[0]):null};

function simCtx(){const idx=ev=>STATES.findIndex(e=>e.event===ev);const x4=EXITS.find(x=>x.id==="XS4"),x5=EXITS.find(x=>x.id==="XS5"),sc=SHORTS.find(c=>c.id==="SC3");

  gains.sort((a,c)=>c.g-a.g);
  $("sim-lev").innerHTML=gains.slice(0,3).map((g,i)=>{const t=byId[g.k];const needs=g.kind==="t"?serves(t).map(n=>n.id):t.via;const title=g.kind==="t"?t.mission:g.l;
    return `<div class="lev"><span class="rk">Lever ${i+1} · ${g.k}</span><b>${esc(title)}</b><span class="g">+${eur(g.g)} / month</span><div class="chips">${needs.length?"Carried by "+needs.map(n=>`<button data-jump="${n}">${n}</button>`).join(""):"Relies on the assets: "+(t.cons||[]).map(c=>`<button data-jump="${c}">${c}</button>`).join("")}</div></div>`}).join("");
  const sumD=(a,z)=>{let s2=0;for(let j=a+1;j<=z;j++){const t=TRANS[j-1];if(t)s2+=+val("delay",t.id)||0}return s2};
  const tLead=C.iOpt>0&&C.iPay>C.iOpt?sumD(C.iOpt,C.iPay):0,tB=C.iPay>0&&C.iB>C.iPay?sumD(C.iPay,C.iB):0;
  const pctT=tg>0?b.netM/tg*100:0,mult=b.netM>0?tg/b.netM:Infinity;const fx=i=>i>=0&&STATES[i]?b.f[STATES[i].id]||0:0;
  $("sim-kpis").innerHTML=`<div class="kpi hero"><small>Monthly net revenue</small><b>${eur(b.netM)}</b><div class="prog" title="${fr(pctT,0)}% of target"><i style="width:${Math.min(100,pctT)}%"></i></div><span>${fr(pctT,0)}% of the ${eur(tg)} target.${pctT<100&&Number.isFinite(mult)?` At constant rates, you would need ${fr(mult,1)} times more exposed, i.e. ${fr(fx(1)*mult,0)} per week.`:""}</span></div>
   <div class="kpi"><small>Clients per month</small><b>${fr(b.clientsM)}</b><span>${fr(fx(C.iPay))} per week</span></div>
   <div class="kpi"><small>Leads per week</small><b>${fr(fx(C.iOpt))}</b><span>including ${fr(b.ref)} from referrals</span></div>
   <div class="kpi"><small>Students at Point B per month</small><b>${fr(fx(C.iB)*b.W)}</b><span>${fr(fx(C.lf)*b.W)} become ambassadors</span></div>
   <div class="kpi"><small>Lead times</small><b>${fr(tLead,0)} d</b><span>from lead to client, then ${fr(tB,0)} days from client to Point B</span></div>`;
  const all=rows.map(t=>src("rate",t.id));$("sim-srcsum").textContent=`Rates: ${all.filter(x=>x==="mesure").length} measured, ${all.filter(x=>x==="hypothese").length} assumptions, ${all.filter(x=>x==="scenario").length} changed in this scenario.`}
simPage.addEventListener("input",e=>{const t=e.target;if(!t.dataset.kind)return;const v=num(t.value);if(v==null)return;SIM[t.dataset.kind][t.dataset.k]=v;saveSim();const s2=document.getElementById(`src-${t.dataset.kind}-${t.dataset.k}`);if(s2){s2.className="src src-scenario";s2.textContent=SRC_L.scenario}updateSim()});
simPage.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.id==="sim-clear"){askConfirm({title:"Clear the scenario?",body:"The values you changed in the simulator go back to the measures and assumptions.",ok:"Clear",final:true}).then(ok=>{if(ok){SIM={rate:{},delay:{},p:{}};saveSim();renderSim()}});return}
  if(b.dataset.jump){setView("map");requestAnimationFrame(()=>jump(b.dataset.jump))}});

/* =================== BUILD ORDER VIEW (build sequence) =================== */
const worksPage=document.getElementById("works");
function computeWorks(){const items={};const add=(id,kind,title,status,deps,extra)=>{items[id]=Object.assign({id,kind,title,status,deps:deps.filter((d,i,a)=>d&&d!==id&&a.indexOf(d)===i)},extra||{})};
  TOOLS.forEach(t=>{if(t.status!=="ok")add(t.id,"Tool",t.name,t.status,[],{build:[t.role]})});
  MEM.forEach(m=>{if(m.status!=="ok")add(m.id,"Memory",m.name,m.status,m.host?[m.host]:[],{build:[m.host?"In "+byId[m.host].name:"Choose the tool that hosts it"]})});
  if(ORCH.status!=="ok")add("OR","Orchestration",ORCH.name,ORCH.status,ORCH.host?[ORCH.host]:[],{build:["Route the "+new Set(HAND.map(h=>h.ev)).size+" handoff events"]});
  const linked=new Set();HAND.forEach(h=>{linked.add(h.from);linked.add(h.to)});
  NEEDS.forEach(n=>{const cs=cover(n);const todo=n.means.filter(m=>m.status!=="ok"&&(m.kind!=="human"||cs!=="ok"));if(cs==="ok"&&!todo.length)return;
    const deps=[...n.r,...n.w,...n.means.flatMap(m=>m.tools),...(linked.has(n.id)?["OR"]:[]),...n.deps];
    add(n.id,"Need",n.title,cs,deps,{build:(todo.length?todo:n.means).map(m=>KSHORT[m.kind]+" : "+(m.name||"unnamed")),kr:n.kr,need:n})});
  Object.values(items).forEach(it=>it.wait=it.deps.filter(d=>items[d]));
  const lvl={};const L=(id,seen)=>{if(lvl[id]!=null)return lvl[id];if(seen.has(id))return 0;seen.add(id);const it=items[id];const v=it.wait.length?1+Math.max(...it.wait.map(d=>L(d,seen))):0;seen.delete(id);lvl[id]=v;return v};
  Object.keys(items).forEach(id=>L(id,new Set()));
  const rev={};Object.values(items).forEach(it=>it.wait.forEach(d=>(rev[d]=rev[d]||[]).push(it.id)));
  const down=id=>{const s2=new Set(),stk=[id];while(stk.length){const x=stk.pop();(rev[x]||[]).forEach(y=>{if(!s2.has(y)){s2.add(y);stk.push(y)}})}return s2.size};
  const gains=cellGains();
  Object.values(items).forEach(it=>{it.level=lvl[it.id];it.unblocks=down(it.id);it.value=it.need&&placeOf(it.need)==="mach"?Math.max(0,...it.need.t.map(t=>gains[t]||0)):0;it.kr=it.kr||[]});
  return items}
function wkCard(it,rank){return `<button class="wk s-${it.status}" data-go="${it.id}"><div class="row"><span class="tp">${rank?rank+" · ":""}${it.kind} · ${it.id}</span><span class="pill"><span class="dot d-${it.status}"></span>${(it.kind==="Need"?COVER:STATUS)[it.status]}</span></div>
  <b>${esc(it.title)}</b>${it.kr.length?`<div>${it.kr.map(k=>`<span class="kr">${esc(k)}</span>`).join(" ")}</div>`:""}
  <div class="meta2">${it.unblocks?`<span>Unblocks <strong>${it.unblocks}</strong></span>`:""}${it.value>.5?`<span>Leverage <strong>+${eur(it.value)}</strong>/month</span>`:""}</div>
  <div class="wait">${esc(it.build.join(" · "))}</div>
  ${it.wait.length?`<div class="wait">Waits for ${it.wait.map(d=>`<code>${d}</code>`).join("")}</div>`:""}</button>`}
function renderWorks(){const items=computeWorks();const list=Object.values(items);
  const sortK=(a,b)=>(b.kr.length>0)-(a.kr.length>0)||b.unblocks-a.unblocks||b.value-a.value||a.id.localeCompare(b.id);
  const maxL=list.length?Math.max(...list.map(i=>i.level)):0;const waves=[];for(let l=0;l<=maxL;l++)waves.push(list.filter(i=>i.level===l).sort(sortK));
  const top=list.slice().sort((a,b)=>b.unblocks-a.unblocks||b.value-a.value).filter(i=>i.unblocks>0).slice(0,3);
  const ready=waves[0]?waves[0].filter(i=>i.kind==="Need"&&i.kr.length).concat(waves[0].filter(i=>!(i.kind==="Need"&&i.kr.length))).slice(0,3):[];
  worksPage.innerHTML=`<div class="wrap">
  <div><h2>Build order</h2><p class="lead">The build order, computed from the model’s dependencies: a need waits for the memories it reads or writes, the tools of its means, and the orchestrator if it receives or passes a handoff. A wave can only start once its prerequisites exist. Within each wave, build items tied to Q4 objectives go first, then the ones that unblock the most.</p>
  <div class="es-stats"><span class="chip"><strong>${list.length}</strong> build items</span><span class="chip"><strong>${waves.length}</strong> waves</span><span class="chip"><strong>${waves[0]?waves[0].length:0}</strong> can start now</span><span class="chip"><strong>${list.filter(i=>i.kr.length).length}</strong> tied to Q4 objectives</span></div></div>
  ${top.length?`<div><h3 class="es-h">What unblocks the most</h3><p class="lead">The foundations that the most build items depend on. Until they exist, the agents that plug into them cannot run for real.</p><div class="top3">${top.map((it,i)=>wkCard(it,"#"+(i+1))).join("")}</div></div>`:""}
  ${ready.length?`<div><h3 class="es-h">Start first</h3><p class="lead">First-wave build items, with priority given to Q4 objectives.</p><div class="top3">${ready.map(it=>wkCard(it)).join("")}</div></div>`:""}
  <div><h3 class="es-h">All waves</h3><div class="wv-scroll"><div class="wv-board" style="grid-template-columns:repeat(${Math.max(1,waves.length)},minmax(280px,1fr));min-width:${Math.max(1,waves.length)*294}px">${waves.map((w,i)=>`<div class="wv-col"><div class="wv-h"><div class="k">Wave ${i+1}</div><b>${i===0?"No prerequisites":"After wave "+i}</b><span>${w.length} build item${w.length>1?"s":""}</span></div>${w.map(it=>wkCard(it)).join("")}</div>`).join("")}</div></div></div>
  </div>`}
worksPage.addEventListener("click",e=>{const b=e.target.closest("[data-go]");if(!b)return;setView("map");requestAnimationFrame(()=>jump(b.dataset.go))});

const PAGES={model,events:evPage,works:worksPage,sim:simPage};
function renderPage(v){if(v==="model")renderModel();if(v==="events")renderEvents();if(v==="works")renderWorks();if(v==="sim")renderSim()}
function setView(v){V.view=v;V.model=v!=="map";Object.entries(PAGES).forEach(([k,el])=>el.hidden=k!==v);document.body.classList.toggle("model-open",v!=="map");
  document.querySelectorAll("[data-view]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.view===v));renderPage(v);if(PAGES[v])PAGES[v].scrollTop=0}
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>setView(b.dataset.view));

/* =================== CAMERA =================== */
const pct=document.getElementById("z-pct");
function apply(){world.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;const g=26*s;vp.style.backgroundSize=`${g}px ${g}px`;vp.style.backgroundPosition=`${tx}px ${ty}px`;world.classList.toggle("far",s<.4);pct.textContent=Math.round(s*100)+"%";drawMini()}
function zoomAt(f,X,Y){const ns=Math.min(2.2,Math.max(.03,s*f));const k=ns/s;tx=X-(X-tx)*k;ty=Y-(Y-ty)*k;s=ns;apply()}
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function flyTo(wx,wy,ns){const W=vp.clientWidth,H=vp.clientHeight;const off=document.body.classList.contains("panel-open")&&W>760?-210:0;const T={s:ns,x:W/2+off-wx*ns,y:H/2+30-wy*ns};
  if(reduce){s=T.s;tx=T.x;ty=T.y;return apply()}const S0={s,x:tx,y:ty},t0=performance.now();
  (function step(t){const p=Math.min(1,(t-t0)/520),e=1-Math.pow(1-p,3);s=S0.s+(T.s-S0.s)*e;tx=S0.x+(T.x-S0.x)*e;ty=S0.y+(T.y-S0.y)*e;apply();if(p<1)requestAnimationFrame(step)})(t0)}
function fitRect(r){const W=vp.clientWidth,H=vp.clientHeight-90;const ns=Math.min(W/r.w,H/r.h)*.95;flyTo(r.x+r.w/2,r.y+r.h/2-30/ns,ns)}
const fit=()=>fitRect(bounds);
const ptrs=new Map();let drag=null,pinch=null;
vp.addEventListener("pointerdown",e=>{if(e.button!==0&&e.pointerType==="mouse")return;vp.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1)drag={x:e.clientX,y:e.clientY,tx,ty,moved:false,el:e.target.closest("[data-jump],[data-sel]")};
  if(ptrs.size===2){const [a,b]=[...ptrs.values()];pinch={d:Math.hypot(a.x-b.x,a.y-b.y),s};drag=null}});
vp.addEventListener("pointermove",e=>{if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size===2){const [a,b]=[...ptrs.values()];const d=Math.hypot(a.x-b.x,a.y-b.y);zoomAt((pinch.s*d/pinch.d)/s,(a.x+b.x)/2,(a.y+b.y)/2);return}
  if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(!drag.moved&&Math.hypot(dx,dy)>4){drag.moved=true;vp.classList.add("panning")}if(drag.moved){tx=drag.tx+dx;ty=drag.ty+dy;apply()}}});
function up(e){ptrs.delete(e.pointerId);vp.classList.remove("panning");
  if(drag&&!drag.moved){const el=drag.el;if(el&&el.dataset.jump)jump(el.dataset.jump);else if(el)openPanel(el.dataset.sel);else if(V.sel)closePanel()}
  if(ptrs.size<2)pinch=null;drag=null}
vp.addEventListener("pointerup",up);vp.addEventListener("pointercancel",up);
vp.addEventListener("wheel",e=>{e.preventDefault();const r=vp.getBoundingClientRect();const mouse=!e.deltaX&&Math.abs(e.deltaY)>=50&&Number.isInteger(e.deltaY);
  if(e.ctrlKey||e.metaKey||mouse||e.deltaMode===1)zoomAt(Math.exp(-e.deltaY*(e.ctrlKey?.01:.0015)),e.clientX-r.left,e.clientY-r.top);else{tx-=e.deltaX;ty-=e.deltaY;apply()}},{passive:false});
layer.addEventListener("keydown",e=>{const c=e.target.closest("[data-sel]");if(c&&(e.key==="Enter"||e.key===" ")){e.preventDefault();openPanel(c.dataset.sel)}});
document.getElementById("z-in").onclick=()=>zoomAt(1.25,vp.clientWidth/2,vp.clientHeight/2);
document.getElementById("z-out").onclick=()=>zoomAt(.8,vp.clientWidth/2,vp.clientHeight/2);
document.getElementById("z-fit").onclick=fit;
addEventListener("keydown",e=>{if(e.target.matches&&e.target.matches("input,textarea,select"))return;
  if(e.key==="/"){e.preventDefault();q.focus()}else if(e.key==="+"||e.key==="=")zoomAt(1.2,vp.clientWidth/2,vp.clientHeight/2);else if(e.key==="-")zoomAt(.83,vp.clientWidth/2,vp.clientHeight/2);
  else if(e.key==="0")fit();else if(e.key==="Escape"){if(V.model)setView("map");else if(V.sel)closePanel()}
  else if(e.key.startsWith("Arrow")){const k=60;if(e.key==="ArrowLeft")tx+=k;if(e.key==="ArrowRight")tx-=k;if(e.key==="ArrowUp")ty+=k;if(e.key==="ArrowDown")ty-=k;apply()}});

const mm=document.getElementById("minimap"),mc=mm.getContext("2d");
const css=v=>getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const mmk=()=>Math.min(mm.width/bounds.w,mm.height/bounds.h)*.92;
function drawMini(){if(!bounds.w)return;const k=mmk(),ox=(mm.width-bounds.w*k)/2,oy=(mm.height-bounds.h*k)/2;mc.clearRect(0,0,mm.width,mm.height);const X=x=>ox+(x-bounds.x)*k,Y=y=>oy+(y-bounds.y)*k;
  mc.fillStyle=css("--surface-2");G.lanes.forEach(l=>mc.fillRect(X(0),Y(l.y),WTOT*k,Math.max(2,l.h*k)));
  const col={ok:css("--ok"),wip:css("--wip"),missing:css("--missing")};
  NEEDS.forEach(x=>{const p=G.pos[x.id];if(!p||!visNeed(x))return;mc.fillStyle=col[cover(x)];mc.fillRect(X(p.x),Y(p.y),Math.max(2,p.w*k),Math.max(2,p.h*k))});
  TOOLS.forEach(x=>{const p=G.pos[x.id];if(!p)return;mc.fillStyle=col[x.status];mc.fillRect(X(p.x),Y(p.y),Math.max(2,p.w*k),Math.max(2,p.h*k))});
  mc.fillStyle=css("--gold");STATES.forEach(e=>{const p=G.pos[e.id];if(p)mc.fillRect(X(p.x),Y(p.y),Math.max(2,p.w*k),Math.max(2,p.h*k))});
  mc.strokeStyle=css("--gold");mc.lineWidth=2;mc.strokeRect(X(-tx/s),Y(-ty/s),vp.clientWidth/s*k,vp.clientHeight/s*k)}
mm.addEventListener("click",e=>{const r=mm.getBoundingClientRect();const k=mmk()*r.width/mm.width;const ox=(r.width-bounds.w*k)/2,oy=(r.height-bounds.h*k)/2;flyTo(bounds.x+(e.clientX-r.left-ox)/k,bounds.y+(e.clientY-r.top-oy)/k,s)});

/* =================== CONTROLS =================== */
function refresh(){rebuild();layout();render();renderLayers();if(V.view!=="map"&&!(V.view==="sim"&&simPage.contains(document.activeElement)))renderPage(V.view)}
const layersEl=document.getElementById("layers");
layersEl.addEventListener("change",e=>{const id=e.target.id,on=e.target.checked;const [p,k]=id.split("-");
  if(p==="l")V.lanes[k]=on;if(p==="e")V.edges[k]=on;if(p==="k")V.kinds[k]=on;if(p==="c")V.cov[k]=on;
  if(V.sel&&byId[V.sel]&&byId[V.sel]._k==="need"&&!visNeed(byId[V.sel]))closePanel();refresh()});
layersEl.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;
  if(b.dataset.closeLayers)return setLayers(false);
  if(b.dataset.lact==="add-need"){if(SHARED&&!CANW)return;const sel=byId[V.sel];const p=sel&&sel._k==="trans"?{t:[sel.id]}:sel&&sel._k==="chain"?{chain:sel.id}:sel&&sel._k==="dom"?{dom:sel.id}:{t:[(TRANS[0]||{}).id].filter(Boolean)};return addNeed(p)}
  if(b.dataset.lact==="add-tool"){if(SHARED&&!CANW)return;const id="TL"+String(nextNum("TL",[...TOOLS_B.map(t=>t.id),...Object.keys(over)])).padStart(2,"0");beginGroup("Add a tool");put(id,{added:"tool",name:"New tool",cat:"",role:"",status:"missing",owner:"",holds:""});refresh();return jump(id)}
  if(b.dataset.act){const [a,c]=b.dataset.act.split("-").map(Number);const x0=sx(a-1),x1=sx(c)+SW;const y0=G.actY;const last=G.lanes.find(q=>q.id==="mach")||G.lanes.find(q=>q.id==="spine");fitRect({x:x0,y:y0,w:x1-x0,h:last.y+last.h-y0})}
  if(b.dataset.lane){const l=G.lanes.find(q=>q.id===b.dataset.lane);if(l)fitRect({x:0,y:l.y,w:["prod","sup"].includes(b.dataset.lane)?3200:WTOT,h:l.h})}});
document.getElementById("stats").addEventListener("click",e=>{if(e.target.closest("#chip-gaps")){V.gaps=!V.gaps;refresh()}if(e.target.closest("#chip-ill")){V.ill=!V.ill;refresh()}});
document.querySelectorAll("[data-lens]").forEach(b=>b.onclick=()=>{V.lens=b.dataset.lens;document.querySelectorAll("[data-lens]").forEach(x=>x.setAttribute("aria-pressed",x===b));render();renderLayers();if(V.sel)openPanel(V.sel,true)});
const btnL=document.getElementById("btn-layers");
function setLayers(open){layersEl.hidden=!open;btnL.setAttribute("aria-pressed",open);try{localStorage.setItem("skl-filters-open",open?"1":"0")}catch(e){}if(!open)btnL.focus()}

addEventListener("keydown",e=>{if(!(e.ctrlKey||e.metaKey)||e.shiftKey||e.key.toLowerCase()!=="z")return;if(e.target.matches&&e.target.matches("input,textarea,select"))return;if(!document.getElementById("confirm").hidden)return;e.preventDefault();undo()});
addEventListener("keydown",e=>{if(e.target.matches&&e.target.matches("input,textarea,select")||V.view!=="map")return;if(e.key==="f"||e.key==="F"){e.preventDefault();setLayers(layersEl.hidden)}});
addEventListener("resize",syncTop);
const q=document.getElementById("q");
q.addEventListener("input",()=>{const v=q.value.trim().toLowerCase();let first=null;layer.querySelectorAll(".match").forEach(el=>el.classList.remove("match"));if(v.length<2)return;
  Object.values(byId).forEach(x=>{const txt=[x.id,x.title,x.why,x.name,x.mission,x.sub,x.signal,x.desc,x.asset,x.role,x.holds,x.owner,x.c&&Object.values(x.c).join(" "),x.means&&x.means.map(m=>m.name+" "+m.owner).join(" ")].join(" ").toLowerCase();if(txt.includes(v)){const el=layer.querySelector(`.card[data-sel="${x.id}"],.strip[data-sel="${x.id}"]`);if(el){el.classList.add("match");if(!first)first=x.id}}});
  if(first){const p=G.pos[first];if(p)flyTo(p.x+Math.min(p.w,600)/2,p.y+p.h/2,Math.max(s,.6))}});
q.addEventListener("keydown",e=>{if(e.key==="Enter"){const m=layer.querySelector(".match");if(m)openPanel(m.dataset.sel)}});

(function(){const W=vp.clientWidth,H=vp.clientHeight-90;s=Math.min(W/bounds.w,H/bounds.h)*.95;tx=(W-bounds.w*s)/2-bounds.x*s;ty=90+(H-bounds.h*s)/2-bounds.y*s;apply()})();
