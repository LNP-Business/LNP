<style>
/* Single light product UI, as designed in the LNP canvas: warm paper ground, ink sidebar, blue action. */
:root {
  color-scheme: light;
  --paper: #F7F8FB;
  --ink: #1E2A5E;
  --action: #2B6CF5;
  --action-strong: #1E2A5E;
}
html, body { background: var(--paper); color: var(--ink); }
body { margin: 0; font-family: 'Poppins', system-ui, -apple-system, 'Segoe UI', sans-serif; }
a { color: var(--action); }
a:hover { color: var(--action-strong); }
#app { overflow-x: clip; }
/* admin-only entries (Settings › Access): shown only when the web edition signs in an admin */
html:not(.skl-admin) [data-admin-only] { display: none !important; }
#app :focus-visible { outline: 3px solid var(--action); outline-offset: 2px; }
/* The sidebar stays on screen while the page scrolls, so Settings is always in the bottom-left corner */
[data-navgrp]:hover { color: #D0D8F2 !important; background: #192039 !important; }
[data-navgrp]:focus-visible { outline: 2px solid #5B8DF7; outline-offset: 2px; }
[data-root] > nav { position: sticky; top: 0; align-self: flex-start; height: var(--screen-h, 100vh); overflow-y: auto; }
#app input[style*="background: #1E2A5E"]::placeholder, #app textarea[style*="background: #1E2A5E"]::placeholder { color: #A2A8BB; opacity: 1; }
#app select[style*="background: #1E2A5E"] { color-scheme: dark; }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

<section><h3 style="margin: 0 0 10px; display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600"><span style="width: 28px; height: 28px; border-radius: 50%; background: #1E2A5E; color: #FFFFFF; font-size: 13px; display: inline-flex; align-items: center; justify-content: center">1</span>À quoi sert cette page</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #222C4E">Le CRM des ventes : chaque prospect, du premier contact au montant encaissé, avec sa prochaine action, ses appels, ses transcriptions et le motif d’une perte.</p></section>
<section><h3 style="margin: 0 0 10px; display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600"><span style="width: 28px; height: 28px; border-radius: 50%; background: #1E2A5E; color: #FFFFFF; font-size: 13px; display: inline-flex; align-items: center; justify-content: center">2</span>Ce qu’elle apporte à chacun</h3>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.55; color: #222C4E">
<li><strong style="color: #1E2A5E">Aucun prospect n’est oublié.</strong> Chaque prospect a une prochaine action datée ; celles en retard ressortent.</li>
<li><strong style="color: #1E2A5E">Le pipeline dit vrai.</strong> Étapes, tours et motifs de perte sont explicites : la prévision repose sur des faits.</li>
<li><strong style="color: #1E2A5E">L’encaissé, pas seulement les ventes.</strong> Les ventes gagnées montrent côte à côte le montant signé et le montant encaissé.</li></ul></section>
<section><h3 style="margin: 0 0 10px; display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600"><span style="width: 28px; height: 28px; border-radius: 50%; background: #1E2A5E; color: #FFFFFF; font-size: 13px; display: inline-flex; align-items: center; justify-content: center">3</span>Comment l’utiliser</h3>
<ol style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.55; color: #222C4E; padding-left: 22px">
<li>Pipeline : faites glisser une carte pour passer un prospect à sa nouvelle étape.</li>
<li>Prospects : filtrez, triez, choisissez vos colonnes et agissez sur plusieurs prospects à la fois.</li>
<li>Cycle de vente : une ligne par prospect en cours, du RDV pris au premier paiement Whop, face aux objectifs de présence, de décision et d’encaissement. Chaque matin, lisez Critique, puis Le commercial doit agir, de haut en bas ; Calendrier montre aujourd’hui et les prochains appels, Depuis le RDV compare la durée des cycles ; ouvrez une ligne pour lire chaque échange, ou la fiche prospect pour chaque message, appel et paiement.</li>
<li>Cliquez sur un prospect pour ouvrir sa fiche : appels, prochaine action, note, transcriptions et analyse.</li>
<li>Notez la prochaine action avant de fermer la fiche d’un prospect.</li></ol></section>

<main style="flex-grow: 1; min-width: 0; box-sizing: border-box; padding: 40px 48px 48px; display: flex; flex-direction: column; gap: 28px">

<header data-topbar style="display: flex; align-items: center; gap: 14px; min-height: 54px; padding-right: 72px"><div role="group" aria-label="Vues" style="display: flex; gap: 6px; padding: 5px; background: #E3ECFB; border-radius: 12px; align-self: flex-start; flex-shrink: 0"><span style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 20px; border: 0; border-radius: 9px; font: inherit; font-size: 15px; cursor: pointer; text-decoration: none; white-space: nowrap; background: #1E2A5E; color: #FFFFFF; font-weight: 600" aria-current="page">Alertes et notifications</span><a href="Account.dc.html" style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 20px; border: 0; border-radius: 9px; font: inherit; font-size: 15px; cursor: pointer; text-decoration: none; white-space: nowrap; background: transparent; color: #222C4E; font-weight: 500">Compte</a><a href="Access.dc.html" data-admin-only style="display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 20px; border: 0; border-radius: 9px; font: inherit; font-size: 15px; cursor: pointer; text-decoration: none; white-space: nowrap; background: transparent; color: #222C4E; font-weight: 500">Accès</a></div><span style="flex: 1"></span><span style="font-size: 13px; color: {{saveColor}}">{{saveText}}</span><button type="button" onClick="{{reset}}" style="min-height: 44px; padding: 0 18px; border: 1px solid #AECBF2; border-radius: 10px; background: #FFFFFF; color: #1E2A5E; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap">Rétablir les réglages par défaut</button><button type="button" onClick="{{save}}" style="{{saveBtn}}">Enregistrer les modifications</button></header>

<div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px">
<div style="background: #FFFFFF; border: 1px solid #E3ECFB; border-radius: 14px; padding: 16px 18px"><div style="font-family: Poppins, Arial, sans-serif; font-size: 30px; line-height: 1">{{onCount}} / {{total}}</div><div style="font-size: 13px; color: #5A6478; margin-top: 6px">alertes activées</div></div>
<div style="background: #FFFFFF; border: 1px solid #E3ECFB; border-radius: 14px; padding: 16px 18px"><div style="font-family: Poppins, Arial, sans-serif; font-size: 30px; line-height: 1">23</div><div style="font-size: 13px; color: #5A6478; margin-top: 6px">notifications envoyées · 7 derniers jours</div></div>
<div style="background: #FFFFFF; border: 1px solid #E3ECFB; border-radius: 14px; padding: 16px 18px"><div style="font-family: Poppins, Arial, sans-serif; font-size: 30px; line-height: 1; color: #9B1C12">4</div><div style="font-size: 13px; color: #5A6478; margin-top: 6px">critiques · toutes prises en compte</div></div>
<div style="background: #FFFFFF; border: 1px solid #E3ECFB; border-radius: 14px; padding: 16px 18px"><div style="font-family: Poppins, Arial, sans-serif; font-size: 30px; line-height: 1">3,1 h</div><div style="font-size: 13px; color: #5A6478; margin-top: 6px">délai moyen de prise en compte</div></div>
</div>

<section aria-labelledby="delivery" style="background: #FFFFFF; border: 1px solid #E3ECFB; border-radius: 14px; padding: 22px 24px; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 1fr) 340px; gap: 18px; align-items: stretch">
<div style="grid-column: 1 / -1; display: flex; justify-content: space-between; align-items: baseline"><h2 id="delivery" style="margin: 0; font-family: Poppins, Arial, sans-serif; font-size: 22px; font-weight: 500">Règles d’envoi</h2><span style="font-size: 13px; color: #5A6478">Comment et quand les notifications arrivent</span></div>

<div style="display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 10px; background: #F7F8FB">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 10px"><span style="font-size: 14px; font-weight: 600">Heures calmes</span><button type="button" role="switch" aria-checked="{{quiet.on}}" aria-label="Heures calmes" onClick="{{quiet.toggle}}" style="{{quiet.sw}}"><span style="{{quiet.knob}}"></span></button></div>
<div style="font-size: 13px; line-height: 1.5; color: #222C4E">Aucune notification de <strong>20 h</strong> à <strong>8 h</strong>, à l’heure locale de chacun. Les alertes critiques passent quand même.</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 10px; background: #F7F8FB">
<div style="display: flex; justify-content: space-between; align-items: center; gap: 10px"><span style="font-size: 14px; font-weight: 600">Résumé quotidien</span><button type="button" role="switch" aria-checked="{{digest.on}}" aria-label="Résumé quotidien" onClick="{{digest.toggle}}" style="{{digest.sw}}"><span style="{{digest.knob}}"></span></button></div>
<div style="font-size: 13px; line-height: 1.5; color: #222C4E">Les alertes de gravité basse sont regroupées en un seul message à <strong>8 h 30</strong> au lieu d’être envoyées une par une.</div>
</div>

<div style="display: flex; flex-direction: column; gap: 10px; padding: 14px 16px; border-radius: 10px; background: #F7F8FB">
<span style="font-size: 14px; font-weight: 600">Escalade</span>
<div style="font-size: 13px; line-height: 1.5; color: #222C4E">Une alerte critique ou haute qui n’est pas prise en compte dans le délai ci-dessous est envoyée à Romain.</div>
<div style="display: flex; align-items: center; gap: 6px">
<button type="button" onClick="{{esc.minus}}" aria-label="Raccourcir le délai d’escalade" style="width: 34px; height: 34px; border: 1px solid #AECBF2; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 16px; cursor: pointer">−</button>
<span style="min-width: 64px; text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 14px">{{esc.label}}</span>
<button type="button" onClick="{{esc.plus}}" aria-label="Allonger le délai d’escalade" style="width: 34px; height: 34px; border: 1px solid #AECBF2; border-radius: 8px; background: #FFFFFF; font: inherit; font-size: 16px; cursor: pointer">+</button>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 8px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5A6478">Exemple de notification</span>
<div style="flex-grow: 1; display: flex; gap: 12px; padding: 14px 16px; border-radius: 12px; background: #1E2A5E; color: #F7F8FB">
<span style="width: 10px; height: 10px; border-radius: 50%; background: #E0503F; flex-shrink: 0; margin-top: 5px"></span>
<div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
<span style="font-size: 12px; color: #B6BBCA">LNP · Tâche en retard · Haute</span>
<span style="font-size: 14px; font-weight: 600; line-height: 1.35">Brief de tournage — masterclass n° 3 : 4 h de retard sur sa date d’engagement (jeu. 15).</span>
<span style="font-size: 12px; color: #B6BBCA">À : Hugo Petit · Ouvrir dans l’application</span>
</div>
</div>
</div>
</section>

<section aria-labelledby="alerts" style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; justify-content: space-between; align-items: baseline; gap: 16px">
<h2 id="alerts" style="margin: 0; font-family: Poppins, Arial, sans-serif; font-size: 22px; font-weight: 500">Alertes</h2>
<span style="font-size: 13px; color: #5A6478">Cliquez sur une alerte pour régler son seuil, sa gravité, ses destinataires et ses canaux</span>
</div>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start">
<sc-for list="{{groups}}" as="grp" hint-placeholder-count="4">
<div style="background: #FFFFFF; border: 1px solid #E3ECFB; border-radius: 14px; padding: 8px 8px 6px">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 10px; padding: 10px 12px 8px">
<span style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase">{{grp.label}}</span>
<span style="font-size: 12px; color: #5A6478">{{grp.count}}</span>
</div>
<sc-for list="{{grp.items}}" as="al" hint-placeholder-count="3">
<div style="display: flex; align-items: center; gap: 12px; padding: 4px 8px 4px 4px; border-top: 1px solid #DDE3F5">
<button type="button" onClick="{{al.open}}" aria-haspopup="dialog" style="{{al.rowStyle}}">
<span style="flex-grow: 1; min-width: 0">{{al.name}}</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#747D9A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"></polyline></svg>
</button>
<button type="button" role="switch" aria-checked="{{al.on}}" aria-label="{{al.switchLabel}}" onClick="{{al.toggle}}" style="{{al.sw}}"><span style="{{al.knob}}"></span></button>
</div>
</sc-for>
</div>
</sc-for>
</div>
</section>

</main>

<sc-if value="{{hasEdit}}" hint-placeholder-val="{{false}}">
<div data-overlay="info" style="position: fixed; inset: 0; background: rgba(30,42,94,0.55); display: flex; justify-content: center; align-items: flex-start; padding-top: 56px; overflow: auto; z-index: 50">
<div role="dialog" aria-modal="true" aria-labelledby="edit-title" style="width: 620px; max-width: calc(100% - 48px); box-sizing: border-box; background: #FFFFFF; border-radius: 16px; padding: 28px 32px; display: flex; flex-direction: column; gap: 22px; box-shadow: 0 24px 64px rgba(0,0,0,0.28)">
<div style="display: flex; justify-content: space-between; align-items: flex-start; gap: 16px">
<div><div style="font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #5A6478">Alerte · {{ed.group}}</div><h2 id="edit-title" style="margin: 6px 0 0; font-family: Poppins, Arial, sans-serif; font-size: 30px; font-weight: 500">{{ed.name}}</h2></div>
<button type="button" onClick="{{closeEdit}}" aria-label="Fermer" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; border: 1px solid #AECBF2; background: #FFFFFF; color: #1E2A5E; font: inherit; font-size: 22px; line-height: 1; cursor: pointer">×</button>
</div>

<div style="display: flex; justify-content: space-between; align-items: center; gap: 16px; padding: 14px 16px; border-radius: 12px; background: #F7F8FB">
<div><div style="font-size: 15px; font-weight: 600">{{ed.stateLabel}}</div><div style="font-size: 13px; color: #5A6478; margin-top: 2px">{{ed.stateHint}}</div></div>
<button type="button" role="switch" aria-checked="{{ed.on}}" aria-label="{{ed.switchLabel}}" onClick="{{ed.toggle}}" style="{{ed.sw}}"><span style="{{ed.knob}}"></span></button>
</div>

<div style="{{ed.dim}}; display: flex; flex-direction: column; gap: 22px">
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5A6478">Condition</span>
<div style="display: flex; align-items: center; flex-wrap: wrap; gap: 8px; font-size: 15px; line-height: 1.5">
<span>{{ed.before}}</span>
<sc-if value="{{ed.hasValue}}" hint-placeholder-val="{{true}}">
<span style="display: inline-flex; align-items: center; gap: 2px; border: 1px solid #AECBF2; border-radius: 10px; background: #F0F4FD">
<button type="button" onClick="{{ed.minus}}" aria-label="Baisser le seuil" style="width: 40px; height: 40px; border: 0; background: transparent; font: inherit; font-size: 18px; cursor: pointer">−</button>
<span style="min-width: 76px; text-align: center; font-family: 'IBM Plex Mono', monospace; font-size: 15px; font-weight: 500">{{ed.valueLabel}}</span>
<button type="button" onClick="{{ed.plus}}" aria-label="Relever le seuil" style="width: 40px; height: 40px; border: 0; background: transparent; font: inherit; font-size: 18px; cursor: pointer">+</button>
</span>
</sc-if>
<span>{{ed.after}}</span>
</div>
<span style="font-size: 12px; color: #5A6478">{{ed.defaultHint}}</span>
</div>

<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5A6478">Gravité</span>
<div role="group" aria-label="Gravité" style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px">
<sc-for list="{{ed.sevs}}" as="sv" hint-placeholder-count="4"><button type="button" onClick="{{sv.pick}}" aria-pressed="{{sv.on}}" style="{{sv.style}}">{{sv.label}}</button></sc-for>
</div>
<span style="font-size: 12px; color: #5A6478">{{ed.sevHint}}</span>
</div>

<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px">
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5A6478">Prévenir</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{ed.who}}" as="w" hint-placeholder-count="3"><button type="button" onClick="{{w.toggle}}" aria-pressed="{{w.on}}" style="{{w.style}}">{{w.label}}</button></sc-for></div>
</div>
<div style="display: flex; flex-direction: column; gap: 10px">
<span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5A6478">Canaux</span>
<div style="display: flex; flex-wrap: wrap; gap: 6px"><sc-for list="{{ed.ch}}" as="c" hint-placeholder-count="3"><button type="button" onClick="{{c.toggle}}" aria-pressed="{{c.on}}" style="{{c.style}}">{{c.label}}</button></sc-for></div>
</div>
</div>

<div style="padding: 14px 16px; border-radius: 12px; background: #1E2A5E; color: #F7F8FB; font-size: 14px; line-height: 1.5"><span style="display: block; font-size: 12px; color: #B6BBCA; margin-bottom: 4px">Quand elle se déclenche</span>{{ed.summary}}</div>
</div>

<div style="display: flex; justify-content: space-between; align-items: center; gap: 12px">
<button type="button" onClick="{{ed.restore}}" style="min-height: 44px; padding: 0 14px; border: 1px solid #AECBF2; border-radius: 10px; background: #FFFFFF; color: #1E2A5E; font: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Rétablir la valeur par défaut</button>
<button type="button" onClick="{{closeEdit}}" style="min-height: 44px; padding: 0 22px; border: 0; border-radius: 10px; background: #1E2A5E; color: #FFFFFF; font: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Terminé</button>
</div>
</div>

<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #222C4E">C’est ici que se règle le système d’alertes. Chaque alerte surveille une condition, par exemple une tâche en retard, un résultat clé qui passe au rouge ou une décision qui dépasse son échéance. Pour chaque alerte, vous choisissez le seuil, la gravité, qui est prévenu et par quel canal. Les règles d’envoi décident quand les notifications arrivent et ce qui se passe quand personne ne réagit.</p>
</section>

<section>
<h3 style="margin: 0 0 10px; display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600"><span style="width: 28px; height: 28px; border-radius: 50%; background: #1E2A5E; color: #FFFFFF; font-size: 13px; display: inline-flex; align-items: center; justify-content: center">2</span>En quoi elle rend chacun plus efficace</h3>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.55; color: #222C4E">
<li><strong style="color: #1E2A5E">Le système prévient, personne n’a à vérifier.</strong> Un écart arrive à la bonne personne au moment où il se produit, pas à la réunion suivante.</li>
<li><strong style="color: #1E2A5E">La bonne personne, pas tout le monde.</strong> Chaque alerte va d’abord au responsable. Romain ne reçoit que ce qui a besoin de lui, ou ce que personne n’a traité à temps.</li>
<li><strong style="color: #1E2A5E">Pas de bruit.</strong> La gravité, les heures calmes et le résumé quotidien évitent que des alertes peu utiles interrompent le travail de fond.</li>
<li><strong style="color: #1E2A5E">Des règles qui suivent votre façon de travailler.</strong> Les seuils reprennent les règles de travail (tâches de 8 h, 3 tâches en cours, décisions en 48 h) et s’ajustent à mesure que l’équipe progresse.</li>
</ul>
</section>

<section>
<h3 style="margin: 0 0 10px; display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600"><span style="width: 28px; height: 28px; border-radius: 50%; background: #1E2A5E; color: #FFFFFF; font-size: 13px; display: inline-flex; align-items: center; justify-content: center">3</span>Comment l’utiliser</h3>
<ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.55; color: #222C4E">
<li>Activez ou désactivez une alerte avec l’interrupteur de sa ligne.</li>
<li>Cliquez sur le nom de l’alerte pour ouvrir ses réglages.</li>
<li>Dans la fenêtre, ajustez le seuil avec − et +, par exemple le nombre d’heures après la date d’engagement à partir duquel une tâche est en retard.</li>
<li>Choisissez la gravité (les alertes de gravité basse vont dans le résumé quotidien), qui est prévenu et les canaux. Le cadre foncé montre exactement ce qui sera envoyé.</li>
<li>Réglez les règles d’envoi : heures calmes, résumé quotidien et délai d’escalade.</li>
<li>Enregistrez. Revoyez les réglages à chaque planification trimestrielle : une alerte sur laquelle personne n’agit doit être ajustée ou désactivée.</li>
</ol>
</section>

<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #222C4E">Qui utilise LNP ici : la personne dont les écrans montrent le travail, le compte connecté et l’équipe.</p>
</section>
<section>
<h3 style="margin: 0 0 10px; display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600"><span style="width: 28px; height: 28px; border-radius: 50%; background: #1E2A5E; color: #FFFFFF; font-size: 13px; display: inline-flex; align-items: center; justify-content: center">2</span>En quoi elle aide</h3>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.55; color: #222C4E">
<li>Le menu ne garde que les écrans ; votre compte et l’équipe sont réunis au même endroit.</li>

</ul>

<li>Dans la version web, <strong>Se déconnecter</strong> met fin à votre session sur ce navigateur.</li>
<li>Administrateurs : <strong>Accès de l’équipe</strong> invite quelqu’un (envoyez-lui le lien obtenu), change un rôle, donne un lien de réinitialisation ou retire une personne. Les écrans que chacun peut ouvrir se règlent dans l’onglet Accès.</li>
</ol>

<li><strong>Une chose à la fois.</strong> Vous voyez un seul prospect, l'action à mener et ce qu'il vous faut pour la mener, rien d'autre.</li>
<li><strong>Le CRM reste juste.</strong> Une issue déclarée ici est la même que dans CRM › Cycle de vente ; « Fait » enregistre ce que vous avez fait en note sur le prospect.</li>

<script>/* LNP · one way to show a key result everywhere (Cockpit overview, department views, Sales dashboard).

(function () {

  var DEPT = { contenu: "Content", marketing: "Marketing", sales: "Sales", romain: "Leadership", amin: "Leadership" };
  var COL = { green: "#2E7D4F", amber: "#B45309", red: "#B42318", stale: "#747D9A", "new": "#747D9A" };
  var TXT = { green: "#1E5E38", amber: "#8A3F06", red: "#9B1C12", stale: "#5A6478", "new": "#1E2A5E" };

  function xAt(day) { return Math.round(X0 + (X1 - X0) * Math.max(0, Math.min(QDAYS, day)) / QDAYS); }

  function view(k) {

    var b = Number(k.baseline) || 0, t = Number(k.target), cur = Number(k.current);
    // the bottom of the chart is 0 (for a "stay below" KR, the baseline): progress reads against the whole way
    var lo = t >= b ? Math.min(0, b) : b, span = (t - lo) || 1;
    var y = function (v) { return Math.round(Math.max(2, Math.min(58, YB - (YB - YT) * (Number(v) - lo) / span))); };
    var today = dayOfQ(S.iso(S.today)), tx = xAt(today);
    var cs = (k.checkins || []).slice().sort(function (a, c) { return a.date < c.date ? -1 : 1; });
    var last = cs[cs.length - 1], prev = cs[cs.length - 2];

    if (prev && last) { var dd = dayOfQ(last.date) - dayOfQ(prev.date); if (dd > 0) perDay = (Number(last.value) - Number(prev.value)) / dd; }
    var remain = Math.max(0, QDAYS - today);
    var forecast = perDay === null ? (last ? lastV : null) : Math.max(0, lastV + perDay * remain);
    if (forecast !== null) { var capV = t + (t - b) * 0.25; forecast = (t < b) ? Math.max(forecast, capV) : Math.min(forecast, capV); }
    if (forecast !== null && k.unit === "n") forecast = Math.round(forecast);
    var known = key !== "stale" && key !== "new" && forecast !== null;
    var lowerBetter = S.lowerBetter(k);
    var reqPerWk = remain ? (t - lastV) / remain * 7 : 0;
    var arrow = "→", arrowCol = "#5A6478";
    if (prev && last && Number(last.value) !== Number(prev.value)) {

    var nextTxt = next ? next.text + " · " + S.wl(next.week) + " · " + S.shortDate(S.weekSunday(next.week)) : "All milestones done";

      ratioStyle: "font-family: 'IBM Plex Mono', monospace; font-size: 15px;" + (key === "stale" ? " color: #5A6478" : ""),
      ratioSub: key === "stale" && last ? fmt(last.value) + " " + age + " d ago" : fmt(cur) + " · expected " + fmt(k.expected),

      paceStyle: "color: " + (known && perDay !== null && (lowerBetter ? perDay * 7 <= reqPerWk || lastV <= t : perDay * 7 >= reqPerWk) ? "#1E5E38" : (known ? "#8A3F06" : "#5A6478")),

  }

    bg.setAttribute("data-skl-confirm", "");
    bg.style.cssText = "position:fixed;inset:0;z-index:90;background:rgba(30,42,94,.55);display:flex;align-items:center;justify-content:center;padding:24px;font-family:'Poppins',system-ui,sans-serif";

<script>/* LNP CRM data layer (docs/crm/11-crm-frontend.md §2): window.SKL_CRM.
   Web edition: reads crm_* tables through the Supabase client of web/public/skl-web.js (claude.use("crm")), so row-level
   security decides what each person sees; writes go only through the crm_* RPCs (web/supabase/004_crm_rpc.sql).
   Artifact or plain file: demo mode, sample data, nothing saved. Screens start using it in phases 2-3. */
(function () {
  "use strict";
  var api = null, mode = "loading", waiting = [];

  // A tiny sample so screens have something to draw in demo mode (fictional people).
  var now = Date.now(), H = 3600 * 1000;
  var DEMO = {
    me: { id: "demo-sales", member_key: "sales", full_name: "Camille Martin", role: "sales" },
    cycles: [
      { id: "demo-c1", status: "active", origin: "new", owner_key: "sales", opened_at: new Date(now - 50 * H).toISOString(),
        current_stage: "show", person: { id: "demo-p1", full_name: "Prospect d’exemple A", primary_email: "a@example.com" },
        calls: [{ id: "demo-call1", rank: 1, status: "scheduled", scheduled_start: new Date(now + 20 * H).toISOString() }] },
      { id: "demo-c2", status: "active", origin: "new", owner_key: "sales", opened_at: new Date(now - 120 * H).toISOString(),
        current_stage: "decision", person: { id: "demo-p2", full_name: "Prospect d’exemple B", primary_email: "b@example.com" },
        calls: [{ id: "demo-call2", rank: 1, status: "held", scheduled_start: new Date(now - 30 * H).toISOString() }] }
    ]
  };
  function clone(x) { return JSON.parse(JSON.stringify(x)); }

  function start() {
    // only the web edition serves "crm"; inside a claude.ai Artifact or as a plain file: demo
    var use = window.claude && window.claude.web && typeof window.claude.use === "function" ? window.claude.use : null;
    if (!use) return settle(null);
    Promise.resolve().then(function () { return use("crm"); }).then(settle, function () { settle(null); });
  }
  function settle(a) {
    api = a || null; mode = api ? "live" : "demo";
    waiting.splice(0).forEach(function (fn) { fn(); });
  }
  function ready() { return mode === "loading" ? new Promise(function (r) { waiting.push(r); }) : Promise.resolve(); }

  async function rows(q) { var r = await q; if (r.error) { var e = new Error(r.error.message); e.code = r.error.code; throw e; } return r.data; }
  // every row, past the API's 1000-row page (build returns a fresh query each time)
  async function all(build) {
    var out = [], page;
    do { page = await rows(build().range(out.length, out.length + 999)); out = out.concat(page || []); } while (page && page.length === 1000);
    return out;
  }
  // rows of a cycle table for many cycles, by 100 ids (a long id list does not fit in one request)
  async function forCycles(table, cols, ids, order) {
    var parts = [];
    for (var i = 0; i < ids.length; i += 100) {
      (function (chunk) { parts.push(all(function () { return api.from(table).select(cols).in("cycle_id", chunk).order(order); })); })(ids.slice(i, i + 100));
    }
    return [].concat.apply([], await Promise.all(parts));
  }
  async function call(fn, args) {
    await ready();
    if (mode !== "live") return { demo: true };   // demo mode: nothing is saved
    return api.rpc(fn, args);
  }

  // CRM › Sales cycle (docs/crm/16 §3): the board's cycles as the screen's view model. Pure: cycles from listBoard,
  // members from listMembers, now in ms. t = hours since the booking (opened_at); events after now are scheduled.
  // labels shown on screen, by reason code (the codes are data; LNP shows French)
  var REASON = { price: "Prix", timing: "Pas le bon moment", partner: "Associé ou conjoint", trust: "Manque de confiance", competitor: "A choisi une autre offre",
    unreachable: "Injoignable", unpaid: "Paiement non effectué", refunded: "Remboursé", dq_off_target: "Hors cible", dq_budget: "Aucun budget",
    dq_not_decider: "Pas décisionnaire", dq_fake: "Faux contact ou spam", dq_customer: "Déjà client", dq_out_of_offer: "Demande hors de l’offre" };
  function reasonLabel(code, fallback) { return REASON[code] || fallback || code || "—"; }
  // a payment plan label (stored "Paid in full" / "N instalments", or the French ones) as shown on screen
  function planLabel(x) { x = String(x || ""); var m = /^(\d+) (instal|échéance)/.exec(x); return /^(paid in full|payé en une fois)$/i.test(x) ? "payé en une fois" : m ? m[1] + " échéances" : x; }
  function eur(v) { return Number(v).toLocaleString("fr-FR") + " €"; }
  function salesCycleView(cycles, members, now) {
    var H = 3600e3, keys = {};
    (members || []).forEach(function (m) { keys[m.id] = m.member_key; });
    return (cycles || []).map(function (c) {
      var opened = Date.parse(c.opened_at), age = Math.max(0, (now - opened) / H), ev = [], rank = {};
      var t = function (iso) { return Math.max(0, (Date.parse(iso) - opened) / H); };
      (c.calls || []).forEach(function (k) { rank[k.id] = k.rank; });
      var add = function (o) { ev.push(o); }, lastOut = null;
      var stOf = function (x) { x = String(x || "").toLowerCase(); return x ? x.charAt(0).toUpperCase() + x.slice(1) : undefined; };
      (c.events || []).forEach(function (e) {
        var d = e.data || {}, r = rank[e.call_id] || 1, at = t(e.occurred_at), txt = e.content || "";
        var auto = e.actor === "auto" || e.actor === "system", sms = e.channel === "sms";
        switch (e.type) {
          case "call_booked": add({ t: at, w: "p", k: "booked", r: r, txt: "RDV R" + r + " pris" + (d.event_name ? " · " + d.event_name : "") }); break;
          case "call_rescheduled": add({ t: at, w: "p", k: "booked", r: r, txt: "RDV R" + r + " reporté" }); break;
          case "call_canceled": add({ t: at, w: "a", k: "note", txt: "R" + r + " annulé" + (d.cancel_reason ? " · " + d.cancel_reason : "") }); break;
          case "message_in": add({ t: at, w: "p", k: sms ? "sms" : "im", txt: txt }); break;
          case "message_out": add(auto ? { t: at, w: "a", k: "remind", txt: txt, st: stOf(d.status) } : { t: at, w: "s", k: sms ? "sms" : "im", txt: txt, st: stOf(d.status) }); break;
          case "phone_call_in": add({ t: at, w: "p", k: "call", txt: txt || "Appel téléphonique entrant" }); break;
          case "phone_call_out": add({ t: at, w: "s", k: "call", txt: txt || "Appel téléphonique sortant" }); break;
          case "note": add({ t: at, w: "s", k: "note", txt: txt }); break;
          case "checkout_created": add({ t: at, w: "s", k: "paylink", txt: "Lien Whop envoyé" }); break;
          case "payment_succeeded": add({ t: at, w: "p", k: "paid", txt: "Paiement Whop" + (d.amount ? " · " + eur(d.amount) : "") }); break;
          case "cycle_won":
            add({ t: at, w: "s", k: "decision", yes: 1, txt: "Issue déclarée · Gagné" + (e.source === "import" ? " (depuis iClosed)" : "") });
            if (!(c.events || []).some(function (x) { return x.type === "payment_succeeded"; })) add({ t: at, w: "p", k: "paid", txt: "Gagné · paiement enregistré dans iClosed" });
            break;
          // outcomes declared in the CRM (phase 3): the decision line and, for the latest one, the next step
          case "outcome_yes":
            add({ t: at, w: "s", k: "decision", yes: 1, r: r, txt: "Issue déclarée · Honoré · Oui" + (d.amount_sold ? " · " + eur(d.amount_sold) : "") +
              (d.payment_plan ? " · " + planLabel(d.payment_plan) : "") });
            lastOut = { t: at, nx: { txt: "Envoyer le lien Whop", src: "oui au R" + r, due: at + 1 } }; break;
          case "outcome_follow_up":
            add({ t: at, w: "s", k: "decision", fu: 1, r: r, txt: "Issue déclarée · Honoré · Relance" + (d.next_step ? " · prochaine étape : " + d.next_step : "") });
            lastOut = { t: at, nx: d.next_step ? { txt: d.next_step, src: "d’après l’issue du R" + r } : null }; break;
          case "outcome_no_show": if (e.source === "crm" || e.source === "rules") lastOut = { t: at, nx: { txt: "Reprendre contact après l’absence", src: e.source === "rules" ? "aucun enregistrement Fathom" : "votre issue", due: at + 2 } }; break;
          case "outcome_no": case "outcome_disqualified":
            add({ t: at, w: "s", k: "decision", no: 1, r: r, txt: "Issue déclarée · Honoré · " + (e.type === "outcome_no" ? "Non" : "Disqualifié") +
              " · motif : " + reasonLabel(d.reason_code) + (d.nurture && d.nurture !== "none" ? " · suivi long terme" : "") });
            lastOut = { t: at, nx: null }; break;
          case "cycle_lost": case "cycle_disqualified":
            if (ev.some(function (x) { return x.k === "decision" && x.no; })) break;   // one closing step
            add({ t: at, w: "s", k: "decision", no: 1, txt: "Issue déclarée · " + (e.type === "cycle_lost" ? "Non" : "Disqualifié") +
              " · motif : " + reasonLabel(d.reason || c.close_reason) }); break;
        }
      });
      (c.calls || []).forEach(function (k) {
        var s = k.scheduled_start ? t(k.scheduled_start) : null, end = k.scheduled_end ? Date.parse(k.scheduled_end) : null;
        if (s == null || k.status === "canceled") return;
        var dur = end && k.scheduled_start ? Math.round((end - Date.parse(k.scheduled_start)) / 60e3) : undefined;
        if (k.status === "held") add({ t: s, w: "s", k: "meet", r: k.rank, dur: dur, cid: k.id, txt: "R" + k.rank + " · Appel" });
        else if (k.status === "no_show") add({ t: s, w: "p", k: "noshow", r: k.rank, cid: k.id, txt: "Absence R" + k.rank });
        // 030: an R2+ with no Fathom recording of 7 min is not a no-show: the lead stays in its round, to reschedule
        else if (k.status === "missed") add({ t: s, w: "a", k: "note", r: k.rank, cid: k.id, txt: "R" + k.rank + " non honoré (aucun enregistrement Fathom) · à replanifier" });
        else if (k.status === "outcome_pending" || (end ? end < now : s < age)) add({ t: s, w: "s", k: "meetdue", r: k.rank, cid: k.id, txt: "R" + k.rank + " · Appel" });
        else add({ t: s, w: "s", k: "meet", r: k.rank, dur: dur, cid: k.id, txt: "R" + k.rank + " · Appel" });
      });
      ev.sort(function (a, b) { return a.t - b.t; });
      var p = c.person || {}, nm = c.next_move && c.next_move.code;
      return { id: c.id, p: p.full_name || p.primary_email || p.primary_phone || "—", o: keys[c.owner_id] || "none",
        prod: (c.deal && c.deal.product) || "—", a: (c.deal && Number(c.deal.amount_sold)) || 0, ph: p.primary_phone || "—", em: p.primary_email || "—",
        opened: c.opened_at, age: age, ev: ev,
        nx: lastOut && !ev.some(function (x) { return x.t > lastOut.t && x.t <= age && x.w === "s" && x.k !== "decision"; }) ? lastOut.nx
          : nm === "rebook" ? (c.next_move.missed ? { txt: "Replanifier l’appel", src: "R" + c.next_move.missed + " non honoré" } : { txt: "Reprendre un rendez-vous", src: "le dernier appel a été annulé" }) : null };
    });
  }

  var CYCLE_COLS = "id,status,origin,opened_at,closed_at,close_reason,current_stage,stage_entered_at,calls_held,no_shows," +
    "sales_attempts,last_prospect_at,last_sales_at,last_event_at,next_move,owner_id,person:crm_people(id,full_name,primary_email,primary_phone,first_seen_at)";

  window.SKL_CRM = {
    mode: function () { return mode; },
    ready: ready,
    // the signed-in person's CRM profile (null: no CRM role)
    me: async function () {
      await ready();
      if (mode !== "live") return clone(DEMO.me);
      return api.me();
    },
    // filters: {status: 'active'|'won'|'lost'|'disqualified', owner_id}
    listCycles: async function (filters) {
      await ready(); filters = filters || {};
      if (mode !== "live") return clone(DEMO.cycles).filter(function (c) { return !filters.status || c.status === filters.status; });
      var q = api.from("crm_cycles").select(CYCLE_COLS).order("opened_at", { ascending: false });
      if (filters.status) q = q.eq("status", filters.status);
      if (filters.owner_id) q = q.eq("owner_id", filters.owner_id);
      return rows(q);
    },
    // every visible cycle with its calls, events and deal, for the CRM board (one query per table)
    // onCycles(cycles): called as soon as the cycles are in, before their calls and events, so a screen can draw them at once
    listBoard: async function (onCycles) {
      await ready();
      if (mode !== "live") return [];
      var cycles = await all(function () { return api.from("crm_cycles").select(CYCLE_COLS).order("opened_at", { ascending: false }).order("id"); });
      if (typeof onCycles === "function") {
        try { onCycles(cycles.map(function (c) { return Object.assign({}, c, { calls: [], events: [], deal: null }); })); } catch (e) { console.error(e); }
      }
      var ids = cycles.map(function (c) { return c.id; });
      if (!ids.length) return [];
      var r = await Promise.all([
        forCycles("crm_calls", "id,cycle_id,rank,status,scheduled_start,scheduled_end", ids, "rank"),
        forCycles("crm_events", "id,cycle_id,call_id,type,occurred_at,source,content,actor,channel,data", ids, "occurred_at"),
        forCycles("crm_deals", "cycle_id,product,amount_sold,currency,payment_plan,schedule,yes_at", ids, "cycle_id"),
        forCycles("crm_payments", "id,cycle_id,amount,refunded_amount,currency,status,paid_at,source,method,note", ids, "paid_at")
      ]);
      var by = function (list) { var m = {}; list.forEach(function (x) { (m[x.cycle_id] = m[x.cycle_id] || []).push(x); }); return m; };
      var calls = by(r[0]), events = by(r[1]), deals = by(r[2]), pays = by(r[3]);
      return cycles.map(function (c) {
        return Object.assign(c, { calls: calls[c.id] || [], events: events[c.id] || [], deal: (deals[c.id] || [])[0] || null, payments: pays[c.id] || [] });
      });
    },
    // people who never booked a call (no cycle): the CRM's "No booking" status, with their iClosed status
    listNoBooking: async function () {
      await ready();
      if (mode !== "live") return [];
      return all(function () {
        return api.from("crm_people_without_cycle").select("id,full_name,primary_email,primary_phone,created_at,iclosed_status,last_event_at,first_seen_at")
          .order("first_seen_at", { ascending: false }).order("id");
      });
    },
    salesCycleView: salesCycleView,
    // the French label of a loss or disqualification reason code, and of a payment plan
    reasonLabel: reasonLabel,
    planLabel: planLabel,
    // the CRM team: id, member_key, full_name, role (readable by every signed-in person)
    listMembers: async function () {
      await ready();
      if (mode !== "live") return [clone(DEMO.me)];
      return rows(api.from("crm_members").select("id,member_key,full_name,role,active"));
    },
    // reasons of loss and disqualification (crm_reason_codes)
    listReasons: async function () {
      await ready();
      if (mode !== "live") return [];
      return rows(api.from("crm_reason_codes").select("code,kind,label,active,automatic").order("position"));
    },
    getCycle: async function (id) {
      await ready();
      if (mode !== "live") return clone(DEMO.cycles.find(function (c) { return c.id === id; }) || null);
      var cycle = (await rows(api.from("crm_cycles").select(CYCLE_COLS).eq("id", id)))[0];
      if (!cycle) return null;
      var r = await Promise.all([
        rows(api.from("crm_calls").select("*").eq("cycle_id", id).order("rank")),
        rows(api.from("crm_events").select("*").eq("cycle_id", id).order("occurred_at")),
        rows(api.from("crm_deals").select("*").eq("cycle_id", id)),
        rows(api.from("crm_payments").select("*").eq("cycle_id", id)),
        rows(api.from("crm_nurture_tracks").select("*").eq("origin_cycle_id", id))
      ]);
      var callIds = r[0].map(function (c) { return c.id; });
      var outcomes = callIds.length ? await rows(api.from("crm_call_outcomes").select("*").in("call_id", callIds).is("superseded_at", null)) : [];
      var analyses = callIds.length ? await rows(api.from("crm_call_analyses").select("*").in("call_id", callIds)) : [];
      return Object.assign(cycle, { calls: r[0], events: r[1], deal: r[2][0] || null, payments: r[3], nurture: r[4], outcomes: outcomes, analyses: analyses });
    },
    // writes (02 §5): each one checks the role on the server and is audited
    declareOutcome: function (callId, p) { return call("crm_declare_outcome", { p_call: callId, p: p }); },
    // call analysis (020 / 021, call-analysis/PLAN.md): past R1 / R2 sales calls the caller may analyse with their state,
    // one full call record, adding a transcript (queues the analysis), running it again; nothing outside the web edition
    caBoard: async function () { await ready(); if (mode !== "live") return []; return call("crm_ca_board", {}); },
    caRecord: function (jobId) { return call("crm_ca_record", { p_job: jobId }); },
    caAddTranscript: function (callId, raw, speakerMap) { return call("crm_ca_add_transcript", { p_call: callId, p_raw: raw, p_speaker_map: speakerMap, p_source: "upload" }); },
    caRetry: function (callId) { return call("crm_ca_retry", { p_call: callId }); },
    // cash entered by hand (022): the amount signed, a payment received, removing a payment entered by hand
    setDeal: function (cycleId, amount, currency) { return call("crm_set_deal", { p_cycle: cycleId, p_amount: amount, p_currency: currency || "EUR" }); },
    // the payment method is not asked (Romain 2026-10-28: the terms matter, not the method)
    addPayment: function (cycleId, p) { return call("crm_add_payment", { p_cycle: cycleId, p_amount: p.amount, p_paid_at: p.paid_at, p_method: p.method || "other", p_note: p.note || null }); },
    // payment plan (024): amount signed + instalments [{due: "YYYY-MM-DD", amount}]
    setPlan: function (cycleId, amount, currency, schedule) { return call("crm_set_payment_plan", { p_cycle: cycleId, p_amount: amount, p_currency: currency || "EUR", p_schedule: schedule }); },
    deletePayment: function (paymentId) { return call("crm_delete_payment", { p_payment: paymentId }); },
    // a refund on a payment (026): the rest of it by default; every payment refunded = lost, reason Refunded
    addRefund: function (paymentId, amount) { return call("crm_add_refund", { p_payment: paymentId, p_amount: amount == null ? null : amount }); },
    // the Sales cockpit figures (016_crm_sales_cockpit.sql): periods 7 / 30 / 56 days with baselines, team, 8 weeks, cash at risk
    salesCockpit: function () { return call("crm_sales_cockpit", {}); },
    // the signed-in person's own screen settings (031): Pipeline column order, Sales Day lists; in demo mode kept in this browser
    getPref: async function (key) {
      await ready();
      if (mode !== "live") { try { return JSON.parse(localStorage.getItem("skl_crm_pref:" + key) || "null"); } catch (e) { return null; } }
      var r = await api.rpc("crm_get_pref", { p_key: key });
      if (r.error) throw new Error(r.error.message);
      return r.data;
    },
    setPref: async function (key, value) {
      await ready();
      if (mode !== "live") { try { if (value == null) localStorage.removeItem("skl_crm_pref:" + key); else localStorage.setItem("skl_crm_pref:" + key, JSON.stringify(value)); } catch (e) {} return value; }
      var r = await api.rpc("crm_set_pref", { p_key: key, p_value: value == null ? null : value });
      if (r.error) throw new Error(r.error.message);
      return r.data;
    },
    addNote: function (cycleId, text) { return call("crm_add_note", { p_cycle: cycleId, p_text: text }); },
    reassignCycle: function (cycleId, memberId) { return call("crm_reassign_cycle", { p_cycle: cycleId, p_member: memberId }); },
    cancelAutoClose: function (cycleId) { return call("crm_cancel_auto_close", { p_cycle: cycleId }); },
    setNurture: function (personId, p) { return call("crm_set_nurture", { p_person: personId, p: p }); },
    resolveUnmatched: function (itemId, personId, cycleId) { return call("crm_resolve_unmatched", { p_item: itemId, p_person: personId, p_cycle: cycleId || null }); },
    dismissUnmatched: function (itemId) { return call("crm_dismiss_unmatched", { p_item: itemId }); },
    mergePeople: function (keepId, mergeId) { return call("crm_merge_people", { p_keep: keepId, p_merge: mergeId }); },
    updateCrmConfig: function (table, key, value) { return call("crm_update_config", { p_table: table, p_key: key, p_value: value }); },
    createCheckout: function (cycleId) { return call("crm_create_checkout", { p_cycle: cycleId }); },
    // live changes of cycles, events and CRM alerts; returns an unsubscribe function
    subscribe: function (fn) {
      if (mode !== "live") return function () {};
      return api.subscribe(["crm_cycles", "crm_events", "crm_alerts"], fn);
    }
  };
  start();
})();
