          (Q.references_missing ? '<div class="alert"><b>L’écart et la présentation de l’offre ne sont pas encore fiables.<\/b> La référence de l’offre et la bibliothèque de cas clients de l’analyse d’appel sont vides : aucun appel ne peut les réussir (écart présent ' +
            (A.gap_present || 0) + ' sur ' + (A.gap_n || 0) + ', présentation conforme ' + (A.pitch_ok || 0) + ' sur ' + (A.pitch_n || 0) + '). Remplissez-les avant de lire ces deux notes.<\/div>' : "") +
          '<div class="grid"><div class="card"><h3>Qualification du prospect<\/h3>' + crit +
            '<div class="note">La lecture de l’agent de qualification sur le R1 de chaque prospect : est-il qualifié (SQL, « prospect qualifié ») sur les trois critères Métier, Financement, Décision et timing ? La plus récente par prospect.' +
            (verdicts ? ' Résultats : ' + verdicts + '.' : '') + ' Un prospect non lu compte comme qualifié, sauf s’il est disqualifié.<\/div><\/div>' +
          '<div class="card"><h3>Pourquoi les prospects sont perdus<\/h3>' + reasons + '<div class="note">Les prospects fermés dans la période, avec leur motif déclaré ou automatique.<\/div><\/div><\/div>';
      }

      function impact(D) {
        var rows = D.delays.filter(function (d) { return d.impact; }).map(function (d) {
          var m = d.impact, a = pct(m.met_won, m.met_n), b = pct(m.miss_won, m.miss_n), lift = (a != null && b) ? a / b : (a && b === 0 ? Infinity : null);
          var v, cls;
          if (m.met_n < 5 || m.miss_n < 5) { v = "Pas assez de données"; cls = "na"; }
          else if (lift >= 1.5) { v = "Fait vendre"; cls = "ok"; }
          else if (lift >= 1.1) { v = "Un certain effet"; cls = "warn"; }
          else if (lift < 0.9) { v = "Effet inverse : à vérifier"; cls = "warn"; }
          else { v = "Pas d’effet visible"; cls = "na"; }
          // under 20 cases on a side, no green verdict (B7): « à confirmer »
          var firm = m.met_n >= MIN && m.miss_n >= MIN;
          if (!firm && cls !== "na") { v = "À confirmer"; cls = "na"; }
          return { d: d, m: m, a: a, b: b, lift: lift, v: v, cls: cls, firm: firm };
        }).sort(function (x, y) { return (y.lift === Infinity ? 99 : y.lift || 0) - (x.lift === Infinity ? 99 : x.lift || 0); });
        var tbl = '<table><thead><tr><th>Étape<\/th><th class="n">Vente si dans les temps<\/th><th class="n">Si manquée<\/th><th class="n">Effet<\/th><th>Lecture<\/th><\/tr><\/thead><tbody>' +
          rows.map(function (r) {
            return '<tr><td title="Règle ' + esc(r.d.rule) + '">' + esc(r.d.label) + '<div class="rule">cible ' + target(r.d) + '<\/div><\/td>' +
              '<td class="n">' + fmtP(r.a) + ' <span class="rule">(' + r.m.met_won + '/' + r.m.met_n + ')<\/span>' + ind(r.m.met_n) + '<\/td>' +
              '<td class="n">' + fmtP(r.b) + ' <span class="rule">(' + r.m.miss_won + '/' + r.m.miss_n + ')<\/span>' + ind(r.m.miss_n) + '<\/td>' +
              '<td class="n">' + (r.lift == null ? "—" : r.lift === Infinity ? "∞" : "×" + dec(Math.round(r.lift * 10) / 10)) + '<\/td>' +
              '<td><span class="verdict ' + r.cls + '">' + r.v + '<\/span>' + (r.firm || r.cls === "na" ? "" : ' <span class="rule">indicatif<\/span>') + '<\/td><\/tr>';
          }).join("") + '<\/tbody><\/table>';
        var keep = rows.filter(function (r) { return r.cls === "ok"; }).map(function (r) { return esc(r.d.label); });
        return head("Impact", "Les étapes qui font vraiment vendre : le taux de vente des prospects qualifiés dont l’étape a été faite dans les temps, face à ceux dont l’étape a été manquée. Il dit où mettre l’effort de l’équipe ; c’est une corrélation, pas une preuve.") +
          '<div class="card"><h3>Étapes et vente<\/h3>' + tbl +
          '<div class="note">Base : les R1 tenus et qualifiés de la période, d’au moins 14 jours ; gagné = payé dans les 14 jours. « Fait vendre » à partir de ×1,5 avec au moins 5 prospects de chaque côté ; « indicatif » sous ' + MIN + ' prospects d’un côté. ' +
          'À revoir chaque mois : garder et pousser les étapes qui font vendre, tester celles sans effet visible, et retirer un délai qui ne fait bouger aucun résultat en 8 semaines.<\/div><\/div>' +
          '<div class="card"><h3>Ce qu’il faut pousser maintenant<\/h3><div class="note">' + (keep.length ? keep.join(" · ") : "Pas encore assez de données sur aucune étape.") + '<\/div>' +
          '<div class="note">Puis tester, un changement à la fois : proposer chaque R1 dans les 48 h, envoyer le récap dans l’heure, appeler (pas seulement écrire) après chaque R1 sans décision, et recontacter chaque absent dans les 15 minutes.<\/div><\/div>';
      }

      // une étape de l'Exécution, expliquée (STEPS), avec les chiffres de l'équipe
      function stepPop(id) {
        var d = (S.data && S.data.delays || []).filter(function (x) { return x.id === id; })[0], T = STEPS[id];
        if (!d || !T) return;
        var p = pct(d.met, d.n), m = d.impact;
        var own = '<div class="cmp"><div><b>' + fmtP(p) + '<\/b><span>dans les temps (' + d.met + ' / ' + d.n + ')' + ind(d.n) + '<\/span><\/div><div><b>' + dur(d.median, d.unit) + '<\/b><span>délai médian · cible ' + target(d) + '<\/span><\/div><\/div>' +
          (m ? '<div class="cmp"><div><b>' + fmtP(pct(m.met_won, m.met_n)) + '<\/b><span>vente si dans les temps (' + m.met_won + '/' + m.met_n + ')' + ind(m.met_n) + '<\/span><\/div><div><b>' + fmtP(pct(m.miss_won, m.miss_n)) +
            '<\/b><span>vente si manquée (' + m.miss_won + '/' + m.miss_n + ')' + ind(m.miss_n) + '<\/span><\/div><\/div>' : "");
        var host = document.createElement("div");
        host.innerHTML = '<div class="scrim" data-close><div class="dlg" role="dialog" aria-modal="true" aria-labelledby="sxh">' +
          '<div style="display:flex;gap:16px;align-items:flex-start"><div style="flex:1"><div class="kick">Étape du cycle de vente · ' + esc(d.rule) + '<\/div><h2 id="sxh">' + esc(d.label) + '<\/h2><\/div>' +
          '<button class="x" data-close aria-label="Fermer">×<\/button><\/div>' +
          '<div><h4>Comment ça marche<\/h4><p>' + esc(T.how) + '<\/p><\/div>' +
          '<div><h4>Pourquoi c’est important<\/h4><p>' + esc(T.why) + '<\/p><\/div>' +
          '<div><h4>Vos chiffres' + (S.data.sample ? ' (exemple)' : ' · ' + S.days + ' derniers jours') + '<\/h4>' + own + '<\/div>' +
          '<div><h4>Bonne pratique et ce que la recherche a mesuré<\/h4><div style="display:flex;flex-direction:column;gap:8px">' +
            T.bench.map(function (x) { return '<div class="bm"><b>' + esc(x[0]) + '<\/b><span>' + esc(x[1]) + '<\/span><\/div>'; }).join("") + '<\/div><\/div>' +
          '<div><h4>Pourquoi c’est considéré comme la meilleure<\/h4><p>' + esc(T.best) + '<\/p><\/div>' +
          '<div><h4>Comment l’atteindre<\/h4><ul>' + T.tips.map(function (x) { return '<li>' + esc(x) + '<\/li>'; }).join("") + '<\/ul><\/div>' +
          '<div class="note">Les chiffres extérieurs sont ceux d’autres entreprises, cités avec leur source ; ce que cette étape fait pour vos propres ventes est dans Impact.<\/div><\/div><\/div>';
        var el = host.firstChild;
        var close = function () { el.remove(); document.removeEventListener("keydown", key, true); };
        var key = function (e) { if (e.key === "Escape") { e.stopPropagation(); close(); } };
        el.addEventListener("click", function (e) { if (e.target === el || e.target.closest("button[data-close]")) close(); });
        document.addEventListener("keydown", key, true);
        root.appendChild(el); el.querySelector(".x").focus();
      }

      function render() {
        var v = view();
        if (S.loading && !S.data) { box.innerHTML = '<div class="cover">Chargement…<\/div>'; return; }
        if (S.error) { box.innerHTML = '<div class="cover">Les chiffres ne se sont pas chargés : ' + esc(S.error) + '<br><br><button class="btn" data-reload>Réessayer<\/button><\/div>'; return; }
        var D = S.data; if (!D || !D.delays) { box.innerHTML = '<div class="cover">Pas encore de chiffres.<\/div>'; return; }
        box.innerHTML = v === "quality" ? quality(D) : v === "impact" ? impact(D) : execution(D);
      }

      box.addEventListener("click", function (e) {
        var st = e.target.closest("tr[data-step]"); if (st) return stepPop(st.dataset.step);
        var b = e.target.closest("button"); if (!b) return;
        if (b.hasAttribute("data-reload")) return load();
        if (b.dataset.days) { S.days = +b.dataset.days; return load(); }
      });
      box.addEventListener("keydown", function (e) { var st = e.target.closest && e.target.closest("tr[data-step]"); if (st && (e.key === "Enter" || e.key === " ")) { e.preventDefault(); stepPop(st.dataset.step); } });
      box.addEventListener("change", function (e) { if (e.target.hasAttribute("data-owner")) { S.owner = e.target.value; load(); } });
      load();
      return { render: render };
    }
  };
})();
</script>
<script>window.LNP_SALES = {css: ":host{display:block;position:relative;height:calc(var(--screen-h, 900px) - 162px);min-height:620px;font-family:var(--sans);color:var(--ink)}*{box-sizing:border-box}\n:host{\n  --bg:#F7F8FB;--card:#FFFFFF;--ink:#1E2A5E;--ink2:#222C4E;--mut:#5A6478;--mut2:#5A6478;--line:#E3ECFB;--line2:#DEE3F5;--soft:#E3ECFB;\n  --gold:#5B8DF7;--gold2:#2B6CF5;--goldsoft:#E3ECFB;\n  --green:#2E7D4F;--greent:#1E5E38;--greens:#E6F2EA;\n  --amber:#B45309;--ambert:#8A3F06;--ambers:#FDECEA;\n  --red:#B42318;--redt:#9B1C12;--reds:#FDECEA;\n  --sans:'Poppins',system-ui,-apple-system,'Segoe UI',sans-serif;--mono:'Poppins',system-ui,sans-serif;--serif:Poppins,Arial,sans-serif;\n}\n\n\n\n\n\n\n\n\n\n\n\n/* main */\n.sv{position:relative;height:100%;display:grid;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:14px}\n.top{position:absolute;right:40px;top:-82px;height:54px;display:flex;align-items:center;gap:14px}\n.ttl{display:flex;flex-direction:column;gap:2px;min-width:0}\n.ttl .ey{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}\n.ttl h1{margin:0;font-family:var(--serif);font-weight:500;font-size:26px;line-height:1.1;white-space:nowrap}\n.seg{display:flex;gap:3px;padding:4px;background:var(--soft);border-radius:10px}\n.seg button{border:0;background:transparent;font:inherit;font-size:13px;color:var(--ink2);padding:6px 11px;border-radius:7px;cursor:pointer;white-space:nowrap}\n.seg button.on{background:var(--ink);color:#fff;font-weight:600}\n.sp{flex:1}\n.verdict{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border-radius:12px;background:var(--card);border:1px solid var(--line)}\n.vbadge{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:600;font-size:13px;padding:6px 10px;border-radius:8px;letter-spacing:.04em}\n.vbadge.fail{background:var(--ambers);color:var(--ambert)}.vbadge.part{background:var(--soft);color:var(--ink)}.vbadge.pass{background:var(--greens);color:var(--greent)}\n.verdict .vt{font-size:12px;line-height:1.35;color:var(--ink2);max-width:340px}.verdict .vt b{color:var(--ink)}\n.kr{display:flex;flex-direction:column;gap:5px;padding:8px 12px;border-radius:10px;background:var(--ink);color:#F7F8FB}\n.kr .v{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}\n.kr .l{display:flex;justify-content:space-between;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:#B6BBCA}\n.kr .l b{letter-spacing:0;text-transform:none;font-size:12px;color:var(--gold)}\n.kr .v{font-size:13px}.kr .v strong{font-family:var(--mono);font-variant-numeric:tabular-nums}\n.krbar{position:relative;height:6px;border-radius:3px;background:#1D2643}.krbar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--gold)}.krbar u{position:absolute;top:-3px;width:2px;height:12px;background:#F7F8FB}\n/* rows */\n.row{display:grid;gap:14px;min-height:0}\n.rA{grid-template-columns:minmax(0,7fr) minmax(0,5fr)}\n.rB{grid-template-columns:minmax(0,4.6fr) minmax(0,3.5fr) minmax(0,3.9fr)}\n.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 18px;display:flex;flex-direction:column;min-height:0;min-width:0;position:relative}\n.ch{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:6px}\n.ch h2{margin:0;font-family:var(--serif);font-weight:500;font-size:17px;white-space:nowrap}\n.ch .q{font-size:12px;color:var(--mut);text-align:right}\n.ey{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}\nsvg{display:block;overflow:visible}\nsvg text{font-family:var(--sans)}\n.num{font-family:var(--mono);font-variant-numeric:tabular-nums}\n/* unit economics */\n.ue{flex:1;min-height:0;display:grid;grid-template-rows:repeat(3,minmax(0,1fr));gap:10px}\n.uer{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:stretch;min-height:0;padding:10px 12px;border-radius:12px;background:linear-gradient(180deg,var(--goldsoft),#fff 70%);border:1px solid var(--line2)}\n.uel{display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:0}\n.uel .n{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut);white-space:nowrap}\n.uel .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:26px;font-weight:600;line-height:1.1;color:var(--ink)}\n.uel .d{align-self:flex-start;font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:12px;font-weight:600;padding:2px 7px;border-radius:999px}\n.uel .d.g{background:var(--greens)}.uel .d.a{background:var(--soft)}.uel .d.r{background:var(--ambers)}\n.uel small{font-size:12px;color:var(--mut2)}\n.uec{min-width:0;min-height:0;position:relative}\n/* team */\n.team{display:flex;flex-direction:column;flex:1;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#AECBF2 transparent}\n.th,.tr{display:grid;grid-template-columns:150px minmax(0,1fr) 62px 62px;gap:12px;align-items:center}\n.colv{font-weight:600;color:var(--ink)}\n.colrow{display:flex;gap:18px;flex-wrap:wrap;align-items:baseline;font-size:12px;color:var(--mut);padding:6px 4px 0;border-top:1px solid var(--line2)}.colrow b{font-family:'Poppins',system-ui,sans-serif;font-size:15px;color:var(--ink);font-weight:600;margin-left:4px}\n.th{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--mut2);padding:0 0 6px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:1;background:#FFFFFF}\n.th span:nth-child(n+3){text-align:right}\n.tr{flex:0 0 56px;border:0;border-bottom:1px solid var(--line2);background:transparent;font:inherit;color:inherit;text-align:left;cursor:pointer;padding:0;min-height:0;border-radius:6px}\n.tr:hover{background:var(--goldsoft)}\n.who{display:flex;align-items:center;gap:8px;min-width:0}.who i{width:26px;height:26px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-style:normal;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}\n.who div{min-widt /* ---- 2. Unit economics: the 3 remaining parity criteria, each as a full-size 8-week area chart against its baseline ---- */
function smooth(pts){let d="M"+pts[0][0]+","+pts[0][1];for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
  d+=` C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)},${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)},${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`}return d}
function unit(C){
  const L=[C.cpc,C.aov,C.refund];
  // B7 (2026-11-09): the gap is the value against its reference; a rate where lower is better reads in points, « mieux » when it fell
  const gapTxt=x=>{if(x.inv){const d=Math.round((x.v-x.b)*10)/10;return (d>0?"+":d<0?"−":"")+pc(Math.abs(d),1).replace(/\u00a0%$/,"")+(Math.abs(d)>1?"\u00a0pts":"\u00a0pt")+(d<0?" · mieux":d>0?" · moins bien":"")}
    const r=(x.v/x.b-1)*100;return (r>=0?"+":"−")+pc(Math.abs(r))+" vs réf."};
  el("ue").innerHTML=L.map((x,i)=>{
    return `<div class="uer"><div class="uel"><span class="n">${x.l}<\/span><span class="v">${x.fmt(x.v)}<\/span>
      <span class="d ${x.tone}" data-tip="${x.inv?"Plus c’est bas, mieux c’est. ":""}${pc(x.ratio)} de la référence">${x.nd?"non mesuré":gapTxt(x)}<\/span><small>réf. ${x.fmt(x.b)}${x.inv?" · plus bas = mieux":""}<\/small><\/div>
      <div class="uec" id="uec${i}"><\/div><\/div>`}).join("");
  L.forEach((x,i)=>{
    const box=el("uec"+i), W=box.clientWidth, H=box.clientHeight; if(W<80||H<40) return;
    if(x.nd){box.innerHTML=`<p style="margin:14px 0 0;font-size:12px;color:var(--mut)">Pas encore mesuré : ${i===1?"aucune vente avec un montant":"aucun paiement"} dans le CRM.<\/p>`;return}
    const ser=LIVE?liveWeekly(["cpc","aov","refund"][i]):series(x.v,x.b,i+2), mn=Math.min(...ser,x.b), mx=Math.max(...ser,x.b), pad=(mx-mn)*.25||1;
    const lo=mn-pad, hi=mx+pad, T=8, B=16, R=54;
    const X=j=>j/7*(W-R), Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
    const pts=ser.map((v,j)=>[X(j),Y(v)]), line=smooth(pts), last=pts[7], yb=Y(x.b);
    // worse than baseline = red: under it, or over it when lower is better
    const G="var(--green)", Rd="var(--amber)", cUp=x.inv?Rd:G, cDn=x.inv?G:Rd, cEnd=(x.inv?x.v>x.b:x.v<x.b)?Rd:G;
    let s=`<svg width="${W}" height="${H}" role="img" aria-label="${x.l}, 8 dernières semaines"><defs>
      <clipPath id="uu${i}"><rect x="-10" y="-10" width="${W+20}" height="${yb+10}"/><\/clipPath>
      <clipPath id="ud${i}"><rect x="-10" y="${yb}" width="${W+20}" height="${H}"/><\/clipPath>
      <linearGradient id="gu${i}" gradientUnits="userSpaceOnUse" x1="0" y1="${T}" x2="0" y2="${yb}"><stop offset="0" style="stop-color:${cUp};stop-opacity:.05"/><stop offset="1" style="stop-color:${cUp};stop-opacity:.3"/><\/linearGradient>
      <linearGradient id="gd${i}" gradientUnits="userSpaceOnUse" x1="0" y1="${yb}" x2="0" y2="${H-B}"><stop offset="0" style="stop-color:${cDn};stop-opacity:.3"/><stop offset="1" style="stop-color:${cDn};stop-opacity:.05"/><\/linearGradient><\/defs>`;
    const band=`${line} L${last[0]},${yb} L0,${yb} Z`;
    s+=`<path d="${band}" fill="url(#gu${i})" clip-path="url(#uu${i})"/><path d="${band}" fill="url(#gd${i})" clip-path="url(#ud${i})"/>`;
    s+=`<line x1="0" x2="${W-R}" y1="${yb}" y2="${yb}" stroke="var(--mut2)" stroke-dasharray="4 4"/><text x="${W-R+6}" y="${yb+4}" font-size="12" fill="var(--mut2)">réf.<\/text>`;
    s+=`<path d="${line}" fill="none" stroke="${cUp}" stroke-width="2.5" stroke-linecap="round" clip-path="url(#uu${i})"/><path d="${line}" fill="none" stroke="${cDn}" stroke-width="2.5" stroke-linecap="round" clip-path="url(#ud${i})"/>`;
    s+=`<circle cx="${last[0]}" cy="${last[1]}" r="9" fill="${cEnd}" opacity=".15"/><circle cx="${last[0]}" cy="${last[1]}" r="4.5" fill="#fff" stroke="${cEnd}" stroke-width="2.5"/>`;
    s+=`<text x="0" y="${H-3}" font-size="12" fill="var(--mut2)">il y a 8 sem.<\/text><text x="${W-R}" y="${H-3}" font-size="12" text-anchor="end" fill="var(--mut2)">maintenant<\/text>`;
    ser.forEach((v,j)=>s+=`<rect x="${X(j)-(W-R)/14}" y="0" width="${(W-R)/7}" height="${H}" fill="transparent" data-tip="${j===7?"Cette semaine":"Il y a "+(7-j)+" sem."} : ${x.fmt(v)}"/>`);

}

      el.title = say; el.setAttribute("aria-hidden", "true");
      var a = el.closest("a"); if (a) a.setAttribute("aria-label", "Cycle de vente" + (n ? " : " + say : ""));
    });
    var slot = app.querySelector("[data-salesday]");
    if (slot) {
      var bar = app.querySelector("[data-alertbar]");
      if (!n) { if (bar) bar.remove(); return; }
      if (!bar) {
        bar = document.createElement("a"); bar.setAttribute("data-alertbar", ""); bar.setAttribute("href", "SalesCycle.dc.html"); bar.setAttribute("data-now", "");
        bar.style.cssText = "display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-radius: 12px; text-decoration: none; font-size: 15px; font-weight: 500; color: #1E2A5E; border: 1px solid #E3ECFB; background: #FFFFFF";
        slot.parentNode.insertBefore(bar, slot);
      }
      // neutral reminder: only the label of a critical lead is red (no coloured border); once the day is done, no alarm (A9)
      var dayDone = !!slot.querySelector("[data-daydone]");
      var chip = function (txt, bg, fg) { return '<span style="flex-shrink: 0; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; background: ' + bg + '; color: ' + fg + '">' + txt + '</span>'; };
      // C1: these leads are already first in the day's queue; the reminder is neutral and secondary
      bar.style.fontSize = "15px"; bar.style.padding = "10px 16px";
      bar.innerHTML = '<span>' + (dayDone ? "Encore " + plr(n, "prospect", "prospects") + " à traiter maintenant" : plr(n, "prospect", "prospects") + " à traiter maintenant en tête de votre file") +
        (crit ? ", dont " + crit + " critique" + (crit > 1 ? "s" : "") : "") + "</span>" +
        '<span style="margin-left: auto; font-weight: 600; color: #1F5BD6">Voir dans Cycle de vente</span>';
    }
  }
  window.addEventListener("lnp-alerts", function () { decorate(); });

  // CRM LNP screens run in their own frames, kept alive outside the re-rendered app so their state survives.
  var frames = {};
  // a dialog opened inside a training frame dims the whole page, the sidebar included (B4, 2026-11-09)
  var scrim = document.createElement("div");
  scrim.style.cssText = "position: fixed; inset: 0; z-index: 1; background: rgba(30,42,94,.45); display: none";
  document.body.appendChild(scrim);
  var DOC_VARS = { crm: "LNP_CRM_DOC", training: "LNP_TRAINING_DOC", academie: "LNP_ACADEMIE_DOC", resultats: "LNP_RESULTATS_DOC", suivi: "LNP_SUIVI_DOC" };
  // C13 (2026-11-09): the screens' documents are a separate, versioned file (kept in the browser cache), fetched once signed in
  var docsP = null;
  function docsReady() { placeCrm(); setTimeout(warmCrm, 1500); }
  function loadDocs() {
    if (docsP) return docsP;
    if (window.LNP_CRM_DOC || !window.LNP_DOCS_SRC) { docsP = Promise.resolve(true); docsReady(); return docsP; }
    docsP = new Promise(function (res) {
      var s = document.createElement("script"); s.src = window.LNP_DOCS_SRC; s.async = true;
      s.onload = function () { res(true); docsReady(); };
      s.onerror = function () { docsP = null; res(false); };
      document.head.appendChild(s);
    });
    return docsP;
  }
  var FRAME_TITLES = { crm: "CRM", training: "Découverte", academie: "Maîtrise de l’offre", resultats: "Mes résultats", suivi: "Entraînement de l’équipe" };
  function frameFor(key, bg) {
    var doc = window[DOC_VARS[key]];
    if (!frames[key] && !doc) { if (!document.documentElement.classList.contains("lnp-locked")) loadDocs(); return null; }
    if (!frames[key]) {
      var f = document.createElement("iframe");
      f.title = FRAME_TITLES[key] || "Tableau de bord commercial";
      f.setAttribute("srcdoc", doc);
      f.style.cssText = "position: fixed; border: 0; z-index: 1; background: " + bg + ";";
      document.body.appendChild(f);
      frames[key] = f;
    }
    return frames[key];
  }
  function placeOne(key, sel, bg, fill) {
    var slot = app.querySelector(sel);
    if (!slot) { if (frames[key]) frames[key].style.display = "none"; return; }
    if (fill) {
      var z = parseFloat(app.style.zoom) || 1;
      var top = slot.getBoundingClientRect().top + window.scrollY;
      slot.style.height = Math.max(480, Math.floor((window.innerHeight - top) / z) - 24) + "px";
    }
    var f = frameFor(key, bg);
    if (!f) return;
    var r = slot.getBoundingClientRect();
    f.style.display = "block";
    f.style.left = r.left + "px"; f.style.top = r.top + "px";
    f.style.width = r.width + "px"; f.style.height = r.height + "px";
  }
  function placeCrm() {
    placeOne("crm", "[data-crm]", "#F7F8FB", false);
    placeOne("training", "[data-training]", "#F7F8FB", true);
    placeOne("academie", "[data-academie]", "#F7F8FB", true);
    placeOne("resultats", "[data-resultats]", "#F7F8FB", true);
    placeOne("suivi", "[data-suivi]", "#F7F8FB", true);
    crmView();
    mountDash();
  }

  // One CRM document for two screens (as LNP, 2026-11-07): CRM shows its Pipeline and Prospects, Ventes › Cycle de vente its
  // lead desk (data-crmview="cycle"); the document switches when it is ready (window.lnpCrmView)
  function crmView() {
    var slot = app.querySelector("[data-crm]"), f = frames.crm;
    if (!slot || !f) return;
    var v = slot.getAttribute("data-crmview") || "crm";
    try { if (f.contentWindow.lnpCrmView) { f.contentWindow.lnpCrmView(v); return; } } catch (err) {}
    if (!f.__view) { f.__view = true; f.addEventListener("load", function () { f.__view = false; crmView(); }, { once: true }); }
  }

  // The sales dashboard lives in the cockpit page itself, isolated in a shadow root, and keeps its state
  var dashHost = null;
  // Cockpit modules live in shadow roots, keep their state between renders, and redraw when the shared data changes
  var modHosts = {}, modTip = null, modToast = null;
  function modChrome() {
    if (modTip) return;
    modTip = document.createElement("div");
    modTip.setAttribute("role", "tooltip");
    modTip.style.cssText = "position:fixed;pointer-events:none;background:#1E2A5E;color:#F7F8FB;font:12px/1.4 'Poppins',system-ui,sans-serif;padding:8px 10px;border-radius:8px;max-width:280px;opacity:0;transition:opacity .12s;z-index:60";
    modToast = document.createElement("div");
    modToast.setAttribute("role", "status");
    modToast.style.cssText = "position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#1E2A5E;color:#F7F8FB;font:13px 'Poppins',system-ui,sans-serif;padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;z-index:60;pointer-events:none";
    document.body.appendChild(modTip); document.body.appendChild(modToast);
  }
  function mountModule(sel, mod) {
    var slot = app.querySelector(sel);
    var mo = window[mod];
    if (!slot || !mo) return;
    modChrome();
    var h = modHosts[mod];
    if (!h) {
      h = modHosts[mod] = document.createElement("div");
      var root = h.attachShadow({ mode: "open" });
      root.innerHTML = '<style>:focus-visible:not(#_lnp_a):not(#_lnp_b){outline:3px solid #2B6CF5 !important;outline-offset:2px !important}' + mo.css + '</style>' + mo.html;
      slot.appendChild(h);
      try { h.__api = mo.mount(root, modTip, modToast); } catch (err) { console.error(err); }
      // While the person types in a field of this module, a data change (their own save coming back through the shared
      // database, or a colleague's) waits until the field loses the focus: redrawing then took the cursor away (Romain 2026-11-02).
      var redraw = function () { if (h.__api && h.isConnected) { try { h.__api.render(); } catch (err) { console.error(err); } } };
      var typingHere = function () { return document.activeElement === h && fieldFocused(); };
      if (window.LNP) LNP.onChange(function () { if (typingHere()) { h.__pending = true; return; } redraw(); });
      h.addEventListener("focusout", function () { setTimeout(function () { if (h.__pending && !typingHere()) { h.__pending = false; redraw(); } }, 0); });
      return;
    }
    if (h.parentNode !== slot) { slot.appendChild(h); }
    if (h.__api) { try { h.__api.render(); } catch (err) { console.error(err); } }
  }
  function mountDash() {
    mountModule("[data-dash]", "LNP_SALES");
    mountModule("[data-salesexec]", "LNP_SALESEXEC");
    mountModule("[data-salesday]", "LNP_SALESDAY");
    mountModule("[data-alertes]", "LNP_ALERTS");
    if (modTip) modTip.style.opacity = 0;
  }
  // A team row on the sales dashboard opens the CRM filtered on that sales rep
  window.addEventListener("message", function (e) {
    var d = e.data || {};
    if (d.lnp === "scrim") { scrim.style.display = d.on ? "block" : "none"; return; }
    if (d.lnp === "now") {
      NOW = { n: +d.n || 0, crit: +d.crit || 0 };
      // the same leads come first in Ma journée (C1)
      var was = JSON.stringify(window.LNP_NOWLIST || []); window.LNP_NOWLIST = Array.isArray(d.list) ? d.list : [];
      if (JSON.stringify(window.LNP_NOWLIST) !== was) window.dispatchEvent(new Event("lnp-nowlist"));
      decorate(); return;
    }
    if (d.lnp === "go" && d.screen === "alertes") { openNow(); return; }
    if (d.lnp === "go" && typeof d.screen === "string") { go(d.screen); return; }
    if (d.lnp !== "crm") return;
    // « Voir toutes les alertes » of the Cockpit: Cycle de vente, on « Agir maintenant » (the Alertes screen left, 2026-11-09)
    if (d.view === "alerts") { openNow(); return; }
    go("crm");
    var f = frames.crm;
    var apply = function () {
      try {
        if (d.lead) {
          // a lead of the Alertes screen: its record, once the CRM has loaded the leads (live data come a little later)
          var tries = 0, lead = JSON.stringify(String(d.lead));
          var openIt = function () {
            var ok = false;
            try { ok = f.contentWindow.eval("(function(){if(typeof byD!=='function'||!byD(" + lead + "))return false;S.view='crm';renderAll();openLead(" + lead + ");return true})()"); } catch (err) {}
            if (!ok && ++tries < 40) setTimeout(openIt, 300);
          };
          openIt();
          return;
        }
        f.contentWindow.eval("S.view='crm';S.cx.owner=" + JSON.stringify(String(d.owner)) + ";S.cx.tab='pipeline';S.cx.quick=null;renderAll();");
      } catch (err) { console.error(err); }
    };
    if (!f) return;
    var ready = false;
    try { ready = f.contentDocument && f.contentDocument.readyState === "complete" && f.contentDocument.getElementById("v-crm"); } catch (err) {}
    if (ready) apply(); else f.addEventListener("load", apply, { once: true });
  });
  // scrolling moves the frames only; it no longer redraws the modules, which dropped the keyboard focus on <body> (2026-11-09)
  function placeFrames() {
    placeOne("crm", "[data-crm]", "#F7F8FB", false);
    placeOne("training", "[data-training]", "#F7F8FB", true);
    placeOne("academie", "[data-academie]", "#F7F8FB", true);
    placeOne("resultats", "[data-resultats]", "#F7F8FB", true);
    placeOne("suivi", "[data-suivi]", "#F7F8FB", true);
  }
  window.addEventListener("scroll", placeFrames, { passive: true });

  // Desktop only (Romain 2026-11-09): the layout is fluid from 1280 to 1920 px and is never scaled down. The former
  // zoom = width / 1440 shrank every text under 12 px at 1280 px. The root fills the window height so the sidebar runs
  // to the bottom of the screen.
  function fit() {
    var root = app.querySelector("[data-root]");
    if (!root) return;
    app.style.zoom = "";
    var h = Math.ceil(window.innerHeight) + "px";
    root.style.minHeight = h;
    root.style.setProperty("--screen-h", h);
  }

  var MOVED = { alertes: "salescycle" };   // Alertes left the sidebar (2026-11-09): its address opens Cycle de vente
  // the alerts now live in Cycle de vente › « Agir maintenant » (Romain 2026-11-09): every « Voir les alertes » opens it there
  function openNow() {
    go("salescycle");
    var tries = 0;
    (function apply() {
      var f = frames.crm, ok = false;
      try { if (f && f.contentWindow.lnpCrmBucket) { f.contentWindow.lnpCrmBucket("now"); ok = true; } } catch (err) {}
      if (!ok && ++tries < 60) setTimeout(apply, 250);
    })();
  }
  // edition.json (LNP: the Sales System only): the home screen, and every screen outside the edition lands on it
  var HOME = "salescockpit", KEEP = ["salescockpit", "salesday", "salescycle", "alertes", "entrainement", "academie", "resultats", "suivi", "crm", "settings", "account", "access"];
  if (KEEP) Object.keys(SCREENS).forEach(function (id) { if (KEEP.indexOf(id) < 0) MOVED[id] = HOME; });
  // Ma journée merged into Cycle de vente (Romain 2026-11-10): an old link or bookmark opens Cycle de vente on « Agir maintenant »
  MOVED.salesday = "salescycle";
  window.LNP_EDITION = { home: HOME, keep: KEEP };   // read by web/public/lnp-web.js (Settings › Access lists only these screens)
  function go(id) {
    if (id === "salesday") { openNow(); return; }
    id = MOVED[id] || id;
    if (!SCREENS[id]) return;
    current = id;
    // the tab title names the screen (B2, 2026-11-09)
    var h1 = document.getElementById("tpl-" + id); h1 = h1 && h1.content.querySelector("h1");
    document.title = "LNP · " + (h1 ? h1.textContent : "Ventes");
    render();
    window.scrollTo(0, 0);
    try { history.replaceState(null, "", "#" + id); } catch (e) {}
  }

  document.querySelectorAll("template[data-file]").forEach(function (t) {
    fileToScreen[t.getAttribute("data-file")] = t.id.replace("tpl-", "");
  });

  app.addEventListener("click", function (e) {
    var a = e.target.closest ? e.target.closest("a[href]") : null;
    if (!a) return;
    var href = a.getAttribute("href");
    var cnt = nowCount();
    if (a.hasAttribute("data-now") || (href === "SalesCycle.dc.html" && current !== "salescycle" && cnt && cnt.n)) { e.preventDefault(); openNow(); }
    else if (fileToScreen[href]) { e.preventDefault(); go(fileToScreen[href]); }
    else if (href === "#" || href.charAt(0) === "#") { e.preventDefault(); }
  });
  app.addEventListener("submit", function (e) { e.preventDefault(); });
  // while the sign-in screen is up, the hidden app is out of the keyboard's way (A10)
  var landing = !(location.hash || "").replace("#", ""), navigated = false;
  app.addEventListener("click", function (e) { if (e.isTrusted && e.target.closest && e.target.closest("a[href]")) navigated = true; }, true);
  function roleHome() {
    if (!landing || navigated || current !== HOME) return; landing = false;
    if (document.documentElement.classList.contains("lnp-admin")) return;   // admins: the Cockpit
    var C = window.LNP_CRM; if (!C || !C.me) return;
    Promise.resolve(C.ready && C.ready()).then(function () { return C.me(); }).then(function (me) {
      if (!navigated && current === HOME && me && me.role === "sales") openNow();
    }).catch(function () {});
  }
  var lockSync = function () { app.inert = document.documentElement.classList.contains("lnp-locked"); if (!app.inert) { roleHome(); loadDocs(); } };
  lockSync(); new MutationObserver(lockSync).observe(document.documentElement, { attributes: true, attributeFilter: ["class"] });
  document.querySelector(".skip").addEventListener("click", function (e) {
    e.preventDefault();
    var m = app.querySelector("main"); if (!m) return;
    // the content of Leads and Cycle de vente is a frame: the focus goes into it
    var f = m.querySelector("[data-crm]") ? frames.crm : null;
    if (f && f.style.display !== "none") { try { f.focus(); return; } catch (err) {} }
    m.focus();
  });
  document.addEventListener("keydown", function (e) {
    var inst = instances[current];
    if (e.key === "Escape" && inst && inst.state && (inst.state.info || inst.state.edit)) inst.setState({ info: false, edit: null });
  });
  window.addEventListener("resize", function () { fit(); placeCrm(); });

  var start = (location.hash || "").replace("#", "");
  var wasDay = start === "salesday";   // Ma journée (2026-11-10): Cycle de vente on « Agir maintenant »
  start = MOVED[start] || start;
  current = SCREENS[start] ? start : HOME;
  (function () { var h = document.getElementById("tpl-" + current); h = h && h.content.querySelector("h1"); if (h) document.title = "LNP · " + h.textContent; })();
  if (KEEP && location.hash && location.hash.replace("#", "") !== current) { try { history.replaceState(null, "", "#" + current); } catch (e) {} }
  render();
  if (wasDay) openNow();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
  // the CRM frame is prepared in the background once the documents are there, so Cycle de vente opens at once
  function warmCrm() {
    var had = !!frames.crm, f = frameFor("crm", "#F7F8FB"); if (!f) return;
    if (!had && !app.querySelector("[data-crm]")) f.style.display = "none";
    var warm = function () { try { f.contentWindow.lnpCycleWarm && f.contentWindow.lnpCycleWarm(); } catch (err) {} };
    var ready = false; try { ready = f.contentDocument && f.contentDocument.readyState === "complete" && f.contentWindow.lnpCycleWarm; } catch (err) {}
    if (ready) warm(); else f.addEventListener("load", warm, { once: true });
  }
})();
</script>
