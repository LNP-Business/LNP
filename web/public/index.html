<section>
<h3 style="margin: 0 0 10px; display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600"><span style="width: 28px; height: 28px; border-radius: 50%; background: #1E2A5E; color: #FFFFFF; font-size: 13px; display: inline-flex; align-items: center; justify-content: center">1</span>À quoi sert cette page</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #222C4E">La vue commerciale de LNP sur un seul écran : comment les prospects deviennent des encaissements, ce que chaque appel et chaque vente coûte et rapporte, où en est chaque commercial, ce qui arrive dans les 30 prochains jours et quels encaissements sont à risque.</p>
</section>
<section>
<h3 style="margin: 0 0 10px; display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600"><span style="width: 28px; height: 28px; border-radius: 50%; background: #1E2A5E; color: #FFFFFF; font-size: 13px; display: inline-flex; align-items: center; justify-content: center">2</span>Ce qu’elle apporte</h3>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.55; color: #222C4E">
<li><strong>Du prospect à l’encaissement</strong> montre, étape par étape, où l’entonnoir perd des prospects, pour que l’équipe travaille d’abord l’étape la plus faible. Les <strong>appels honorés</strong> ne comptent que les R1 : les prospects venus à leur R1, jamais les R2 ni les R3. Le <strong>taux de présence</strong> compare ces prospects à ceux dont le R1 était prévu ; un R1 sans issue déclarée reste en attente pendant 48 h, puis compte comme absence. Les fiches de test de l’équipe ne comptent pas. Sous le flux, le <strong>CA signé</strong> (prix de l’offre), le <strong>CA collecté</strong> à ce jour et le <strong>reste à collecter</strong> des ventes de la période ; l’échéancier se déduit du montant saisi dans iClosed (par exemple 850 € = 1re de 4 échéances) tant qu’il n’est pas fixé dans la fiche prospect.</li>
<li><strong>Rentabilité unitaire</strong> suit les 8 dernières semaines face à la référence (pointillés) : ce que rapporte un appel, le panier moyen et le taux de remboursement.</li>
<li><strong>Équipe commerciale</strong> classe les commerciaux par montant encaissé ; un clic ouvre leur pipeline dans le CRM.</li>
<li><strong>À venir</strong> et <strong>Encaissements à risque</strong> disent ce qu’il faut préparer et ce qu’il faut sécuriser ce mois-ci.</li>
<li>Le <strong>contrôle de parité</strong> (en haut à droite) compare 6 critères à leur référence : il affiche combien sont au niveau (« 4/6 critères à la référence ») et nomme ceux à relever ; un critère sans données est « non mesuré ».</li>
<li><strong>Exécution</strong> mesure chaque étape du cycle de vente face à sa cible (les SLA de Paramètres › Alertes et notifications) : la part faite dans les temps, le délai médian, la relance des absents et des ventes manquées, et le lien entre les interactions et la vente. Un clic sur une étape explique son fonctionnement et la bonne pratique.</li>
<li><strong>Qualité</strong> réunit l’analyse d’appel, la qualification porte par porte (Métier, Financement, Décision et timing), les motifs de perte et la fiabilité des données.</li>
<li><strong>Impact</strong> compare le taux de vente quand une étape est faite dans les temps et quand elle est manquée : où mettre l’effort de l’équipe. C’est une corrélation, pas une preuve.</li>
</ul>
</section>
<section>
<h3 style="margin: 0 0 10px; display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600"><span style="width: 28px; height: 28px; border-radius: 50%; background: #1E2A5E; color: #FFFFFF; font-size: 13px; display: inline-flex; align-items: center; justify-content: center">3</span>Comment l’utiliser</h3>
<ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.55; color: #222C4E">
<li>Choisissez la période en haut à droite (7 j, 30 j ou 8 sem.) : chaque chiffre est comparé à la période précédente de même durée.</li>
<li>Lisez-la de haut en bas chaque lundi matin.</li>
<li>Survolez un chiffre, ou placez-y le focus avec Tab, pour voir comment il est calculé ; cliquez sur un commercial pour ouvrir ses prospects dans le CRM.</li>
<li>Dans Exécution, Qualité et Impact, choisissez la période (7, 30, 90 ou 180 jours) et, en administrateur, un commercial. Un prospect est gagné quand son premier paiement arrive dans les 14 jours après son premier appel tenu ; un taux sur moins de 20 prospects est marqué indicatif.</li>
<li>Ouvrez le CRM (dans le menu) pour agir sur un prospect : déclarer l’issue, relancer, ajouter une note.</li>
</ol>
</section>

<section>
<h3 style="margin: 0 0 10px; display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600"><span style="width: 28px; height: 28px; border-radius: 50%; background: #1E2A5E; color: #FFFFFF; font-size: 13px; display: inline-flex; align-items: center; justify-content: center">1</span>À quoi sert cette page</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #222C4E">La journée du commercial dans le CRM, un prospect à la fois : chaque prospect qui a besoin de vous aujourd'hui arrive sous forme de carte, dans l'ordre qui protège l'encaissé. D'abord les issues à déclarer (un appel est terminé et rien n'est déclaré), puis les appels du jour à préparer, les appels à replanifier (un R2 manqué, un appel annulé), les absents à relancer et les relances prévues.</p>
</section>
<section>
<h3 style="margin: 0 0 10px; display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600"><span style="width: 28px; height: 28px; border-radius: 50%; background: #1E2A5E; color: #FFFFFF; font-size: 13px; display: inline-flex; align-items: center; justify-content: center">2</span>Ce que vous y gagnez</h3>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.55; color: #222C4E">
<li><strong>Rien ne passe entre les mailles.</strong> La file est construite à partir du CRM lui-même : un appel ne reste jamais sans issue et un prospect n'attend jamais sans relance.</li>
<li><strong>Une chose à la fois.</strong> Vous voyez un seul prospect, l'action à mener et ce qu'il vous faut pour la mener, rien d'autre.</li>
<li><strong>Le CRM reste juste.</strong> Une issue déclarée ici est la même que dans Cycle de vente ; « Fait » enregistre ce que vous avez fait en note sur le prospect.</li>
</ul>
</section>
<section>
<h3 style="margin: 0 0 10px; display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600"><span style="width: 28px; height: 28px; border-radius: 50%; background: #1E2A5E; color: #FFFFFF; font-size: 13px; display: inline-flex; align-items: center; justify-content: center">3</span>Comment l'utiliser</h3>
<ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.55; color: #222C4E">
<li>Commencez la journée ici : l’application s’ouvre sur Ma journée pour les commerciaux. Les prospects « Agir maintenant » de Cycle de vente sont en tête de la file, dans le même ordre : les critiques d’abord, puis par montant en jeu.</li>
<li>Chaque carte montre le cycle de vente du prospect jour par jour (filtres Tous, Appels, Messages, Paiements), le plus récent en vue : relisez-le avant d'agir.</li>
<li>Pour une issue : indiquez si l'appel a été honoré, puis la décision (et le motif d'un non), puis <em>Déclarer et suivant</em>.</li>
<li>Pour les autres cartes : menez l'action, écrivez en une ligne ce que vous avez fait, puis <em>Fait</em> (touche Entrée).</li>
<li><em>Demain</em> met un prospect de côté pour aujourd'hui, <em>Passer</em> l'envoie en fin de file ; <em>À suivre</em> vous permet de choisir un autre prospect d'abord.</li>
<li>Votre liste du jour (fait, mis de côté) n'est conservée que pour vous.</li>
</ol>
</section>
<!-- D7 (2026-11-10): the words of the sales cycle, in plain French -->
<section>
<h3 style="margin: 0 0 10px; display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600"><span style="width: 28px; height: 28px; border-radius: 50%; background: #1E2A5E; color: #FFFFFF; font-size: 13px; display: inline-flex; align-items: center; justify-content: center">4</span>Lexique</h3>
<dl style="margin: 0; display: grid; grid-template-columns: max-content 1fr; gap: 6px 16px; font-size: 15px; line-height: 1.5; color: #222C4E">
<dt style="font-weight: 600">R1, R2, R3</dt><dd style="margin: 0">1er, 2e et 3e appel avec le prospect.</dd>
<dt style="font-weight: 600">Issue</dt><dd style="margin: 0">Ce qui s’est passé à l’appel : honoré ou absent, puis oui, relance, non ou disqualifié.</dd>
<dt style="font-weight: 600">Délai (SLA)</dt><dd style="margin: 0">Le temps qu’on s’engage à tenir pour une étape, par exemple répondre à un message. Le code (SH-1, DE-9…) s’affiche au survol.</dd>
<dt style="font-weight: 600">En retard, Critique</dt><dd style="margin: 0">Le délai est dépassé ; « Critique » quand il l’est largement : à traiter en premier.</dd>
<dt style="font-weight: 600">Setter</dt><dd style="margin: 0">La personne qui prend les RDV avant le 1er appel (étape « Prise de RDV »).</dd>
</dl>
</section>

<div><div style="font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #5A6478">Mode d'emploi</div><h2 id="info-title" style="margin: 6px 0 0; font-family: Poppins, Arial, sans-serif; font-size: 32px; font-weight: 500">Alertes</h2></div>
<button type="button" onClick="{{closeInfo}}" aria-label="Fermer" style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; border: 1px solid #AECBF2; background: #FFFFFF; color: #1E2A5E; font: inherit; font-size: 22px; line-height: 1; cursor: pointer">×</button>
</div>
<section>
<h3 style="margin: 0 0 10px; display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600"><span style="width: 28px; height: 28px; border-radius: 50%; background: #1E2A5E; color: #FFFFFF; font-size: 13px; display: inline-flex; align-items: center; justify-content: center">1</span>À quoi sert cette page</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #222C4E">Les alertes du cycle de vente, dans le CRM : chaque fois qu'un prospect attend une action au-delà de l'objectif (un premier message, une issue à déclarer, un récap, une réponse…), une alerte s'ouvre ici pour le commercial du prospect. Un commercial voit les alertes de ses propres prospects ; un administrateur voit celles de toute l'équipe.</p>
</section>
<section>
<h3 style="margin: 0 0 10px; display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600"><span style="width: 28px; height: 28px; border-radius: 50%; background: #1E2A5E; color: #FFFFFF; font-size: 13px; display: inline-flex; align-items: center; justify-content: center">2</span>Ce que vous y gagnez</h3>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.55; color: #222C4E">
<li><strong>Le CRM prévient.</strong> Personne n'a à surveiller les tableaux : la pastille rouge de la barre latérale compte vos alertes ouvertes, et un bandeau annonce chaque nouvelle alerte.</li>
<li><strong>Le plus urgent d'abord.</strong> Critique, puis En retard, puis Bientôt dû : vous savez par quoi commencer.</li>
<li><strong>Rien à cocher.</strong> Une alerte se ferme toute seule dès que l'action est faite (message WhatsApp envoyé, issue déclarée, paiement reçu), en 5 minutes au plus.</li>
</ul>
</section>
<section>
<h3 style="margin: 0 0 10px; display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600"><span style="width: 28px; height: 28px; border-radius: 50%; background: #1E2A5E; color: #FFFFFF; font-size: 13px; display: inline-flex; align-items: center; justify-content: center">3</span>Comment l'utiliser</h3>
<ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.55; color: #222C4E">
<li>Ouvrez Alertes dès que la pastille s'allume, et commencez par les critiques.</li>
<li><em>Ouvrir la fiche</em> ouvre le prospect dans le CRM : menez l'action demandée (le SLA, depuis quand, l'objectif sont écrits sur la ligne).</li>
<li>Administrateurs : choisissez un commercial pour suivre ses alertes, ou Toute l'équipe. Les alertes techniques (intégrations, données) ne vont qu'aux administrateurs.</li>
<li><em>Être prévenu des alertes critiques</em> autorise une notification du navigateur tant que LNP est ouvert.</li>
<li>Les seuils et les SLA suivis se règlent dans Paramètres › Alertes et notifications.</li>
</ol>
</section>

<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #222C4E">Le CRM des ventes : chaque prospect, du premier contact au montant encaissé, avec sa prochaine action, ses appels, ses transcriptions et le motif d’une perte.</p></section>
<section><h3 style="margin: 0 0 10px; display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600"><span style="width: 28px; height: 28px; border-radius: 50%; background: #1E2A5E; color: #FFFFFF; font-size: 13px; display: inline-flex; align-items: center; justify-content: center">2</span>Ce qu’elle apporte à chacun</h3>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.55; color: #222C4E">
<li><strong style="color: #1E2A5E">Aucun prospect n’est oublié.</strong> Chaque prospect a une prochaine action datée ; celles en retard ressortent.</li>
<li><strong style="color: #1E2A5E">Le pipeline dit vrai.</strong> Étapes, tours et motifs de perte sont explicites : la prévision repose sur des faits.</li>
<li><strong style="color: #1E2A5E">L’encaissé, pas seulement les ventes.</strong> Les ventes gagnées montrent côte à côte le montant signé et le montant encaissé.</li></ul></section>
<section><h3 style="margin: 0 0 10px; display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600"><span style="width: 28px; height: 28px; border-radius: 50%; background: #1E2A5E; color: #FFFFFF; font-size: 13px; display: inline-flex; align-items: center; justify-content: center">3</span>Comment l’utiliser</h3>
<ol style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.55; color: #222C4E; padding-left: 22px">
<li>Pipeline : un lead par ligne. État : la dernière action effectuée. Progrès : les étapes du lead, cochées quand elles sont faites (RDV pris, 1er contact, appel d’éligibilité, confirmation de présence, appel honoré, décision, lien de paiement, payé). Prochaine action avec l’heure prévue (en rouge si elle est en retard), alertes à traiter, et le temps écoulé depuis le dernier message du lead.</li>
<li>Cliquez sur un en-tête pour trier (Alertes, Prochaine action…) ; Colonnes choisit ce qui s’affiche.</li>
<li>Prospects : filtrez, triez, choisissez vos colonnes et agissez sur plusieurs prospects à la fois.</li>
<li>Cycle de vente a maintenant son propre onglet dans la barre de gauche (Ventes › Cycle de vente) : le prospect à traiter, sa prochaine action et son cycle de vente, un prospect à la fois.</li>
<li>Cliquez sur un prospect pour ouvrir sa fiche : à gauche son cycle de vente jour par jour (filtres Tous, Messages, Paiements), à droite « À faire » avec l’action du moment (déclarer l’issue, ou « Fait » avec ce que vous avez fait, enregistré en note), ses appels de vente et leur analyse. Son menu Statut déplace le prospect comme dans le Pipeline.</li>
<li>Notez la prochaine action avant de fermer la fiche d’un prospect.</li></ol></section>

<section><h3 style="margin: 0 0 10px; display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600"><span style="width: 28px; height: 28px; border-radius: 50%; background: #1E2A5E; color: #FFFFFF; font-size: 13px; display: inline-flex; align-items: center; justify-content: center">3</span>Comment l’utiliser</h3>
<ol style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.55; color: #222C4E; padding-left: 22px">
<li>Chaque matin, videz Agir maintenant, puis À faire : la page s’ouvre sur Agir maintenant.</li>
<li>Lisez À faire et le cycle de vente à droite, puis agissez : déclarez l’issue de l’appel, ou écrivez ce que vous avez fait et appuyez sur Fait ; un paiement ouvre les paiements.</li>
<li>Pas maintenant ? Demain (touche D) retire le prospect de la file jusqu’à demain ; Passer (touche P) le met en fin de file sans rien enregistrer. « Remettre aujourd’hui », en bas de la file, le fait revenir.</li>
<li>Le prospect suivant s’ouvre ; ↑ ↓ passent d’un prospect à l’autre, Filtres resserre la file (commercial, action, étape, activité, tri).</li>
<li>Fiche prospect ouvre le dossier complet du prospect dans le CRM.</li></ol></section>

<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #222C4E">L'entraînement à la découverte des commerciaux de LNP (questions SPIN), sur des extraits d'appels R1. « Le coup suivant » : 100 cas, choisir le geste que la conversation appelle (L1 Situation, L2 Problème, L3 Impact, L4 Vision), écrire la question exacte, la comparer à l'étalon et la juger. « La lettre imposée » : 20 cas, trois questions d'implication d'affilée (le coût direct, l'effet en chaîne, ce que ça lui fait), le prospect répond après chacune.</p>

<h3 style="margin: 0 0 10px; display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600"><span style="width: 28px; height: 28px; border-radius: 50%; background: #1E2A5E; color: #FFFFFF; font-size: 13px; display: inline-flex; align-items: center; justify-content: center">2</span>Ce que vous y gagnez</h3>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.55; color: #222C4E">
<li><strong>Le bon geste au bon moment.</strong> Chaque coup se joue sur un vrai moment d'appel : ni le cran d'avant, ni celui d'après.</li>
<li><strong>Des questions qui passent les règles.</strong> Ouverte, sans « ou », sans « pourquoi », une seule question, 18 mots au plus : vérifié pendant que vous écrivez.</li>
<li><strong>Un bilan qui dit où vous vous trompez.</strong> La matrice des confusions de geste, le maillon le plus faible de la chaîne, la règle la plus souvent enfreinte.</li>
</ul>
</section>

<ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.55; color: #222C4E">
<li>Choisissez l'entraînement en haut : « Le coup suivant » ou « La lettre imposée ». Chacun garde sa séance en cours.</li>
<li>« Nouvelle séance » règle le nombre de coups ou de cas, le geste, le registre et les cas (tous, jamais joués, mes erreurs).</li>
<li>Clavier : 1 à 4 pour choisir un geste, Entrée pour valider, Ctrl ou ⌘ + Entrée pour comparer, O et N pour vos deux jugements.</li>

<section>
<h3 style="margin: 0 0 10px; display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600"><span style="width: 28px; height: 28px; border-radius: 50%; background: #1E2A5E; color: #FFFFFF; font-size: 13px; display: inline-flex; align-items: center; justify-content: center">1</span>À quoi sert cette page</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #222C4E">L'entraînement des commerciaux de LNP à l'offre : 100 cas tirés de vrais appels (la garantie, les tarifs, le financement, le contenu de l'accompagnement…). Format A : répondre au prospect comme en visio, en 90 secondes. Format B : relire un extrait d'appel et dire ce qui ne va pas, puis ce qu'il fallait dire.</p>
</section>
<section>
<h3 style="margin: 0 0 10px; display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600"><span style="width: 28px; height: 28px; border-radius: 50%; background: #1E2A5E; color: #FFFFFF; font-size: 13px; display: inline-flex; align-items: center; justify-content: center">2</span>Ce que vous y gagnez</h3>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.55; color: #222C4E">
<li><strong>Des réponses justes sur l'offre.</strong> Chaque cas a sa grille de correction, ses formulations éliminatoires et un corrigé.</li>
<li><strong>Une auto-correction honnête.</strong> Vous validez d'abord votre réponse, elle est figée ; puis vous la comparez à la grille du formateur et au corrigé, et vous cochez ce qu'elle contient vraiment.</li>
<li><strong>Une progression qui vous suit.</strong> Validé à 8/10 ; la meilleure note de chaque cas est gardée sur votre compte.</li>
</ul>
</section>
<section>
<h3 style="margin: 0 0 10px; display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600"><span style="width: 28px; height: 28px; border-radius: 50%; background: #1E2A5E; color: #FFFFFF; font-size: 13px; display: inline-flex; align-items: center; justify-content: center">3</span>Comment l'utiliser</h3>
<ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.55; color: #222C4E">
<li>Choisissez un cas avec ← et →, la grille des 100 cas ou « Prochain à faire ».</li>
<li>Écrivez votre réponse, puis « Valider ma réponse ». Le chrono de 90 secondes est facultatif.</li>
<li>Auto-correction : votre réponse validée est affichée à côté de la grille ; l'onglet Corrigé montre aussi la réponse modèle. Cochez ce que votre réponse contient, puis « Enregistrer ma note ».</li>
<li>Lisez le résultat critère par critère, puis le corrigé. La fiche mémo résume l'offre en une page.</li>
<li>Chaque note est enregistrée sur votre compte (Entraînement › Mes résultats) et ne peut pas être effacée.</li>
</ol>
</section>

<section>
<h3 style="margin: 0 0 10px; display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600"><span style="width: 28px; height: 28px; border-radius: 50%; background: #1E2A5E; color: #FFFFFF; font-size: 13px; display: inline-flex; align-items: center; justify-content: center">1</span>À quoi sert cette page</h3>
<p style="margin: 0; font-size: 15px; line-height: 1.6; color: #222C4E">C’est ici que se règlent les alertes du cycle de vente de LNP : les 42 SLA, de la prise de RDV au premier paiement, plus la conversation, la clôture et la fiabilité des données. Chaque SLA est un engagement de délai : un événement démarre l’horloge, un résultat l’arrête ; au-delà du seuil, le prospect passe « Bientôt dû », « En retard » ou « Critique ».</p>
<p style="margin: 10px 0 0; font-size: 15px; line-height: 1.6; color: #222C4E">Chaque SLA indique s’il est mesuré, en attente d’une source de données, une règle de formulaire ou un indicateur lu dans le Cockpit commercial. Ses seuils ouvrent les alertes du CRM (Cycle de vente › Agir maintenant) ; Slack n’est qu’une copie facultative, éteinte par défaut. Les heures sont celles de Paris.</p>
</section>

<section>
<h3 style="margin: 0 0 10px; display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600"><span style="width: 28px; height: 28px; border-radius: 50%; background: #1E2A5E; color: #FFFFFF; font-size: 13px; display: inline-flex; align-items: center; justify-content: center">2</span>En quoi elle rend chacun plus efficace</h3>
<ul style="margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.55; color: #222C4E">
<li><strong style="color: #1E2A5E">Le système prévient, personne n’a à vérifier.</strong> Un retard arrive au commercial au moment où il se produit, pas à la réunion suivante.</li>
<li><strong style="color: #1E2A5E">Un seul référentiel.</strong> Les mêmes seuils servent aux alertes du CRM, au Cycle de vente et au Cockpit commercial (Exécution, Impact).</li>
<li><strong style="color: #1E2A5E">Pas de fausse alerte.</strong> Une source non reliée (WhatsApp, Whop, analyse automatique) met ses SLA en attente au lieu de mettre des prospects en retard à tort.</li>
</ul>
</section>

<section>
<h3 style="margin: 0 0 10px; display: flex; align-items: center; gap: 10px; font-size: 17px; font-weight: 600"><span style="width: 28px; height: 28px; border-radius: 50%; background: #1E2A5E; color: #FFFFFF; font-size: 13px; display: inline-flex; align-items: center; justify-content: center">3</span>Comment l’utiliser</h3>
<ol style="margin: 0; padding-left: 22px; display: flex; flex-direction: column; gap: 8px; font-size: 15px; line-height: 1.55; color: #222C4E">
<li>Indiquez d’abord les sources reliées : tant qu’une source ne l’est pas, ses SLA restent en attente.</li>
<li>Activez ou désactivez un SLA avec l’interrupteur de sa ligne.</li>
<li>Cliquez sur un SLA pour régler l’alerte préventive, le retard et le seuil critique, puis choisir s’il ouvre des alertes dans le CRM et, en option, s’il est aussi copié dans Slack.</li>
<li>Fermez la fenêtre avec « Terminé », puis enregistrez avec « Enregistrer les modifications » en haut de la page ; « Rétablir les réglages par défaut » remet les valeurs du référentiel. Seuls un administrateur et le responsable commercial enregistrent.</li>
</ol>
</section>

    box.innerHTML = '<h3 id="lnpcfT" style="margin:0;font-family:Poppins,Arial,sans-serif;font-weight:600;font-size:22px"><\/h3><p style="margin:0;font-size:15px;line-height:1.55;color:#5A6478"><\/p>' +
      '<div style="display:flex;justify-content:flex-end;gap:10px;margin-top:6px"><button type="button" data-no style="font:inherit;font-size:15px;font-weight:600;border-radius:10px;padding:10px 16px;cursor:pointer;background:#fff;border:1px solid #AECBF2;color:#1E2A5E">Annuler<\/button>' +
      '<button type="button" data-yes style="font:inherit;font-size:15px;font-weight:600;border-radius:10px;padding:10px 16px;cursor:pointer;background:#B42318;border:1px solid #B42318;color:#fff"><\/button><\/div>';
    box.querySelector("h3").textContent = o.title || "Supprimer cet élément ?";
    box.querySelector("p").textContent = o.body || "Cette action est définitive.";
    // o.html : un corps plus riche, construit par l'appelant à partir de valeurs échappées
    if (o.html) { var hb = document.createElement("div"); hb.style.cssText = "display:flex;flex-direction:column;gap:10px"; hb.innerHTML = o.html; box.querySelector("p").replaceWith(hb); }
    if (o.width) box.style.width = "min(" + Number(o.width) + "px,100%)";
    box.querySelector("[data-yes]").textContent = o.ok || "Supprimer";
    // o.primary : une action qui ne détruit rien (Renommer), bouton foncé ; o.focus : le champ à remplir, Entrée confirme
    if (o.primary) box.querySelector("[data-yes]").style.cssText += ";background:#1E2A5E;border-color:#1E2A5E;color:#5B8DF7";
    bg.appendChild(box);
    function close() { bg.remove(); document.removeEventListener("keydown", key, true); try { if (prev && prev.focus && prev.isConnected) prev.focus(); } catch (e) {} }
    function key(e) { if (e.key === "Escape") { e.stopPropagation(); e.preventDefault(); close(); if (o.onCancel) o.onCancel(); } }
    bg.addEventListener("mousedown", function (e) { if (e.target === bg) { close(); if (o.onCancel) o.onCancel(); } });
    box.querySelector("[data-no]").onclick = function () { close(); if (o.onCancel) o.onCancel(); };
    box.querySelector("[data-yes]").onclick = function () { var f = o.focus ? box.querySelector(o.focus) : null, v = f ? f.value : undefined; close(); if (o.onOk) o.onOk(v); };
    document.addEventListener("keydown", key, true);
    document.body.appendChild(bg);
    var fld = o.focus ? box.querySelector(o.focus) : null;
    if (fld) { fld.focus(); try { fld.select(); } catch (e) {} fld.addEventListener("keydown", function (e) { if (e.key === "Enter") { e.preventDefault(); box.querySelector("[data-yes]").click(); } }); }
    else box.querySelector(o.quick ? "[data-yes]" : "[data-no]").focus();
  }
  window.lnpConfirm = confirmBox;

  window.LNP = {
    mode: "local", readOnly: false,
    list: function (c) { return Array.from(col(c).values()).map(clone); },
    get: function (c, id) { return clone(col(c).get(id)); },
    save: function (c, doc) { col(c).set(doc.id, clone(doc)); emit(); return doc; },
    remove: function (c, id) { col(c).delete(id); emit(); },
    onChange: function (fn) { listeners.push(fn); },
    confirm: confirmBox
  };
})();

<script>/* LNP CRM data layer (docs/crm/11-crm-frontend.md §2): window.LNP_CRM.
   Web edition: reads crm_* tables through the Supabase client of web/public/lnp-web.js (claude.use("crm")), so row-level
   security decides what each person sees; writes go only through the crm_* RPCs (web/supabase/004_crm_rpc.sql).
   Artifact or plain file: demo mode, sample data, nothing saved. Screens start using it in phases 2-3. */
(function () {
  "use strict";
  var api = null, mode = "loading", waiting = [];

  // A tiny sample so screens have something to draw in demo mode (fictional people).
  var now = Date.now(), H = 3600 * 1000;
  var DEMO = {
    me: { id: "demo-sales", member_key: "sales", full_name: "Léa Moreau", role: "sales" },   // D5: one demo team, the same « me » everywhere
    cycles: [
      { id: "demo-c1", status: "active", origin: "new", owner_key: "sales", opened_at: new Date(now - 50 * H).toISOString(),
        current_stage: "show", person: { id: "demo-p1", full_name: "Prospect d’exemple A", primary_email: "a@example.com" },
        calls: [{ id: "demo-call1", rank: 1, status: "scheduled", scheduled_start: new Date(now + 20 * H).toISOString() }] },
      { id: "demo-c2", status: "active", origin: "new", owner_key: "sales", opened_at: new Date(now - 120 * H).toISOString(),
        current_stage: "decision", person: { id: "demo-p2", full_name: "Prospect d’exemple B", primary_email: "b@example.com" },
        calls: [{ id: "demo-call2", rank: 1, status: "held", scheduled_start: new Date(now - 30 * H).toISOString() }] }
    ]
  };
  function clone(x) { return JSON.parse(JSON.stringify(x)); }

  function start() {
    // only the web edition serves "crm"; inside a claude.ai Artifact or as a plain file: demo
    var use = window.claude && window.claude.web && typeof window.claude.use === "function" ? window.claude.use : null;
    if (!use) return settle(null);
    Promise.resolve().then(function () { return use("crm"); }).then(settle, function () { settle(null); });
  }
  function settle(a) {
    api = a || null; mode = api ? "live" : "demo";
    waiting.splice(0).forEach(function (fn) { fn(); });
  }
  function ready() { return mode === "loading" ? new Promise(function (r) { waiting.push(r); }) : Promise.resolve(); }

  async function rows(q) { var r = await q; if (r.error) { var e = new Error(r.error.message); e.code = r.error.code; throw e; } return r.data; }
  // every row, past the API's 1000-row page (build returns a fresh query each time)
  async function all(build) {
    var out = [], page;
    do { page = await rows(build().range(out.length, out.length + 999)); out = out.concat(page || []); } while (page && page.length === 1000);
    return out;
  }
  // rows of a cycle table for many cycles, by 100 ids (a long id list does not fit in one request)
  async function forCycles(table, cols, ids, order) {
    var parts = [];
    for (var i = 0; i < ids.length; i += 100) {
      (function (chunk) { parts.push(all(function () { return api.from(table).select(cols).in("cycle_id", chunk).order(order); })); })(ids.slice(i, i + 100));
    }
    return [].concat.apply([], await Promise.all(parts));
  }
  async function call(fn, args) {
    await ready();
    if (mode !== "live") return { demo: true };   // demo mode: nothing is saved
    return api.rpc(fn, args);
  }

  // CRM › Sales cycle (docs/crm/16 §3): the board's cycles as the screen's view model. Pure: cycles from listBoard,
  // members from listMembers, now in ms. t = hours since the booking (opened_at); events after now are scheduled.
  // labels shown on screen, by reason code (the codes are data; LNP shows French)
  var REASON = { price: "Prix", timing: "Pas le bon moment", partner: "Associé ou conjoint", trust: "Manque de confiance", competitor: "A choisi une autre offre",
    unreachable: "Injoignable", unpaid: "Paiement non effectué", refunded: "Remboursé", dq_off_target: "Hors cible", dq_budget: "Aucun budget",
    dq_not_decider: "Pas décisionnaire", dq_fake: "Faux contact ou spam", dq_customer: "Déjà client", dq_out_of_offer: "Demande hors de l’offre" };
  function reasonLabel(code, fallback) { return REASON[code] || fallback || code || "—"; }
  // a payment plan label (stored "Paid in full" / "N instalments", or the French ones) as shown on screen
  function planLabel(x) { x = String(x || ""); var m = /^(\d+) (instal|échéance)/.exec(x); return /^(paid in full|payé en une fois)$/i.test(x) ? "payé en une fois" : m ? m[1] + " échéances" : x; }
  function eur(v) { return Number(v).toLocaleString("fr-FR") + " €"; }
  function salesCycleView(cycles, members, now) {
    var H = 3600e3, keys = {};
    (members || []).forEach(function (m) { keys[m.id] = m.member_key; });
    return (cycles || []).map(function (c) {
      var opened = Date.parse(c.opened_at), age = Math.max(0, (now - opened) / H), ev = [], rank = {};
      var t = function (iso) { return Math.max(0, (Date.parse(iso) - opened) / H); };
      (c.calls || []).forEach(function (k) { rank[k.id] = k.rank; });
      var add = function (o) { ev.push(o); }, lastOut = null, rec = {}, ana = {};
      // SLAs DO-2 / DE-2 (supabase/functions/_shared/sla_rules.js): when each call got its Fathom recording and its analysis
      (c.events || []).forEach(function (e) {
        if (!e.call_id) return;
        if (e.type === "call_recorded" && rec[e.call_id] === undefined) rec[e.call_id] = t(e.occurred_at);
        if (e.type === "analysis_ready" && ana[e.call_id] === undefined) ana[e.call_id] = t(e.occurred_at);
      });
      var stOf = function (x) { x = String(x || "").toLowerCase(); return x ? x.charAt(0).toUpperCase() + x.slice(1) : undefined; };
      (c.events || []).forEach(function (e) {
        var d = e.data || {}, r = rank[e.call_id] || 1, at = t(e.occurred_at), txt = e.content || "";
        var auto = e.actor === "auto" || e.actor === "system", sms = e.channel === "sms";
        switch (e.type) {
          case "call_booked": add({ t: at, w: "p", k: "booked", r: r, txt: "RDV R" + r + " pris" + (d.event_name ? " · " + d.event_name : "") }); break;
          case "call_rescheduled": add({ t: at, w: "p", k: "booked", r: r, txt: "RDV R" + r + " reporté" }); break;
          case "call_canceled": add({ t: at, w: "a", k: "note", txt: "R" + r + " annulé" + (d.cancel_reason ? " · " + d.cancel_reason : "") }); break;
          case "message_in": add({ t: at, w: "p", k: sms ? "sms" : "im", txt: txt }); break;
          case "message_out": add(auto ? { t: at, w: "a", k: "remind", txt: txt, st: stOf(d.status) } : { t: at, w: "s", k: sms ? "sms" : "im", txt: txt, st: stOf(d.status) }); break;
          case "phone_call_in": add({ t: at, w: "p", k: "call", txt: txt || "Appel téléphonique entrant" }); break;
          case "phone_call_out": add({ t: at, w: "s", k: "call", txt: txt || "Appel téléphonique sortant" }); break;
          case "note": add({ t: at, w: "s", k: "note", txt: txt }); break;
          case "opt_out": add({ t: at, w: "a", k: "note", stop: 1, txt: "STOP : le prospect ne veut plus de messages automatiques" }); break;
          case "checkout_created": add({ t: at, w: "s", k: "paylink", txt: "Lien Whop envoyé" }); break;
          case "payment_succeeded": add({ t: at, w: "p", k: "paid", txt: "Paiement Whop" + (d.amount ? " · " + eur(d.amount) : "") }); break;
          case "cycle_won":
            add({ t: at, w: "s", k: "decision", yes: 1, txt: "Issue déclarée · Gagné" + (e.source === "import" ? " (depuis iClosed)" : "") });
            if (!(c.events || []).some(function (x) { return x.type === "payment_succeeded"; })) add({ t: at, w: "p", k: "paid", txt: "Gagné · paiement enregistré dans iClosed" });
            break;
          // outcomes declared in the CRM (phase 3): the decision line and, for the latest one, the next step
          case "outcome_yes":
            add({ t: at, w: "s", k: "decision", yes: 1, r: r, txt: "Issue déclarée · Honoré · Oui" + (d.amount_sold ? " · " + eur(d.amount_sold) : "") +
              (d.payment_plan ? " · " + planLabel(d.payment_plan) : "") });
            lastOut = { t: at, nx: { txt: "Envoyer le lien Whop", src: "oui au R" + r, due: at + 1 } }; break;
          case "outcome_follow_up":
            add({ t: at, w: "s", k: "decision", fu: 1, r: r, txt: "Issue déclarée · Honoré · Relance" + (d.next_step ? " · prochaine étape : " + d.next_step : "") });
            lastOut = { t: at, nx: d.next_step ? { txt: d.next_step, src: "d’après l’issue du R" + r } : null }; break;
          case "outcome_no_show": if (e.source === "crm" || e.source === "rules") lastOut = { t: at, nx: { txt: "Reprendre contact après l’absence", src: e.source === "rules" ? "aucun enregistrement Fathom" : "votre issue", due: at + 2 } }; break;
          case "outcome_no": case "outcome_disqualified":
            add({ t: at, w: "s", k: "decision", no: 1, r: r, txt: "Issue déclarée · Honoré · " + (e.type === "outcome_no" ? "Non" : "Disqualifié") +
              " · motif : " + reasonLabel(d.reason_code) + (d.nurture && d.nurture !== "none" ? " · suivi long terme" : "") });
            lastOut = { t: at, nx: null }; break;
          case "cycle_reopened": add({ t: at, w: "s", k: "note", txt: "Prospect rouvert dans le pipeline" }); break;
          case "stage_moved": add({ t: at, w: "s", k: "note", txt: "Déplacé dans le pipeline · " + ({ r1: "R1", r2: "R2", r3: "R3 et plus", longfu: "Relance longue" }[d.to] || d.to) }); break;
          case "cycle_lost": case "cycle_disqualified":
            // 045: closed by hand from the Pipeline (a lead with no call to declare)
            if (e.source === "manual") { add({ t: at, w: "s", k: "decision", no: 1, txt: "Clos à la main · " + (e.type === "cycle_lost" ? "Perdu" : "Disqualifié") +
              " · motif : " + reasonLabel(d.reason) + (txt ? " · " + txt : "") }); break; }
            if (ev.some(function (x) { return x.k === "decision" && x.no; })) break;   // one closing step
            add({ t: at, w: "s", k: "decision", no: 1, txt: "Issue déclarée · " + (e.type === "cycle_lost" ? "Non" : "Disqualifié") +
              " · motif : " + reasonLabel(d.reason || c.close_reason) }); break;
        }
      });
      (c.calls || []).forEach(function (k) {
        var s = k.scheduled_start ? t(k.scheduled_start) : null, end = k.scheduled_end ? Date.parse(k.scheduled_end) : null;
        if (s == null || k.status === "canceled") return;
        var dur = end && k.scheduled_start ? Math.round((end - Date.parse(k.scheduled_start)) / 60e3) : undefined;
        if (k.status === "held") add({ t: s, w: "s", k: "meet", r: k.rank, dur: dur, cid: k.id, rec: rec[k.id], ana: ana[k.id], txt: "R" + k.rank + " · Appel" });
        else if (k.status === "no_show") add({ t: s, w: "p", k: "noshow", r: k.rank, cid: k.id, txt: "Absence R" + k.rank });
        // 030: an R2+ with no Fathom recording of 7 min is not a no-show: the lead stays in its round, to reschedule
        else if (k.status === "missed") add({ t: s, w: "a", k: "note", r: k.rank, cid: k.id, txt: "R" + k.rank + " non honoré (aucun enregistrement Fathom) · à replanifier" });
        else if (k.status === "outcome_pending" || (end ? end < now : s < age)) add({ t: s, w: "s", k: "meetdue", r: k.rank, cid: k.id, txt: "R" + k.rank + " · Appel" });
        else add({ t: s, w: "s", k: "meet", r: k.rank, dur: dur, cid: k.id, txt: "R" + k.rank + " · Appel" });
      });
      ev.sort(function (a, b) { return a.t - b.t; });
      var p = c.person || {}, nm = c.next_move && c.next_move.code;
      return { id: c.id, p: p.full_name || p.primary_email || p.primary_phone || "—", o: keys[c.owner_id] || "none",
        prod: (c.deal && c.deal.product) || "—", a: (c.deal && Number(c.deal.amount_sold)) || 0, ph: p.primary_phone || "—", em: p.primary_email || "—",
        opened: c.opened_at, age: age, ev: ev, rec: true,
        nx: lastOut && !ev.some(function (x) { return x.t > lastOut.t && x.t <= age && x.w === "s" && x.k !== "decision"; }) ? lastOut.nx
          : nm === "rebook" ? (c.next_move.missed ? { txt: "Replanifier l’appel", src: "R" + c.next_move.missed + " non honoré" } : { txt: "Reprendre un rendez-vous", src: "le dernier appel a été annulé" }) : null };
    });
  }

  var CYCLE_COLS = "id,status,origin,opened_at,closed_at,close_reason,current_stage,stage_entered_at,calls_held,no_shows," +
    "sales_attempts,last_prospect_at,last_sales_at,last_event_at,next_move,owner_id,person:crm_people(id,full_name,primary_email,primary_phone,first_seen_at,setter_id,lead_source,quiz,setting_status,setting_since,setting_last_action,setting_last_at,setting_due_at,setting_attempts)";

  window.LNP_CRM = {
    mode: function () { return mode; },
    ready: ready,
    // the signed-in person's CRM profile (null: no CRM role)
    me: async function () {
      await ready();
      if (mode !== "live") return clone(DEMO.me);
      return api.me();
    },
    // filters: {status: 'active'|'won'|'lost'|'disqualified', owner_id}
    listCycles: async function (filters) {
      await ready(); filters = filters || {};
      if (mode !== "live") return clone(DEMO.cycles).filter(function (c) { return !filters.status || c.status === filters.status; });
      var q = api.from("crm_cycles").select(CYCLE_COLS).order("opened_at", { ascending: false });
      if (filters.status) q = q.eq("status", filters.status);
      if (filters.owner_id) q = q.eq("owner_id", filters.owner_id);
      return rows(q);
    },
    // every visible cycle with its calls, events and deal, for the CRM board (one query per table)
    // onCycles(cycles): called as soon as the cycles are in, before their calls and events, so a screen can draw them at once
    listBoard: async function (onCycles) {
      await ready();
      if (mode !== "live") return [];
      var cycles = await all(function () { return api.from("crm_cycles").select(CYCLE_COLS).order("opened_at", { ascending: false }).order("id"); });
      if (typeof onCycles === "function") {
        try { onCycles(cycles.map(function (c) { return Object.assign({}, c, { calls: [], events: [], deal: null }); })); } catch (e) { console.error(e); }
      }
      var ids = cycles.map(function (c) { return c.id; });
      if (!ids.length) return [];
      var r = await Promise.all([
        forCycles("crm_calls", "id,cycle_id,rank,status,scheduled_start,scheduled_end", ids, "rank"),
        forCycles("crm_events", "id,cycle_id,call_id,type,occurred_at,source,content,actor,channel,data", ids, "occurred_at"),
        forCycles("crm_deals", "cycle_id,product,amount_sold,currency,payment_plan,schedule,yes_at", ids, "cycle_id"),
        forCycles("crm_payments", "id,cycle_id,amount,refunded_amount,currency,status,paid_at,source,method,note", ids, "paid_at")
      ]);
      var by = function (list) { var m = {}; list.forEach(function (x) { (m[x.cycle_id] = m[x.cycle_id] || []).push(x); }); return m; };
      var calls = by(r[0]), events = by(r[1]), deals = by(r[2]), pays = by(r[3]);
      return cycles.map(function (c) {
        return Object.assign(c, { calls: calls[c.id] || [], events: events[c.id] || [], deal: (deals[c.id] || [])[0] || null, payments: pays[c.id] || [] });
      });
    },
    // people who never booked a call (no cycle): the CRM's "No booking" status, with their iClosed status
    listNoBooking: async function () {
      await ready();
      if (mode !== "live") return [];
      return all(function () {
        return api.from("crm_people_without_cycle").select("id,full_name,primary_email,primary_phone,created_at,iclosed_status,last_event_at,first_seen_at,setter_id,lead_source,quiz,setting_status,setting_since,setting_last_action,setting_last_at,setting_due_at,setting_attempts")
          .order("first_seen_at", { ascending: false }).order("id");
      });
    },
    salesCycleView: salesCycleView,
    // the French label of a loss or disqualification reason code, and of a payment plan
    reasonLabel: reasonLabel,
    planLabel: planLabel,
    // the CRM team: id, member_key, full_name, role (readable by every signed-in person)
    listMembers: async function () {
      await ready();
      if (mode !== "live") return [clone(DEMO.me)];
      return rows(api.from("crm_members").select("id,member_key,full_name,role,active"));
    },
    // reasons of loss and disqualification (crm_reason_codes)
    listReasons: async function () {
      await ready();
      if (mode !== "live") return [];
      return rows(api.from("crm_reason_codes").select("code,kind,label,active,automatic").order("position"));
    },
    // the SLA settings saved in Settings › Alerts (crm_settings.sla_rules: sources connected, SLAs on, thresholds, places)
    slaRules: async function () {
      await ready();
      if (mode !== "live") return null;
      var r = await rows(api.from("crm_settings").select("value").eq("key", "sla_rules"));
      return r[0] ? r[0].value : null;
    },
    getCycle: async function (id) {
      await ready();
      if (mode !== "live") return clone(DEMO.cycles.find(function (c) { return c.id === id; }) || null);
      var cycle = (await rows(api.from("crm_cycles").select(CYCLE_COLS).eq("id", id)))[0];
      if (!cycle) return null;
      var r = await Promise.all([
        rows(api.from("crm_calls").select("*").eq("cycle_id", id).order("rank")),
        rows(api.from("crm_events").select("*").eq("cycle_id", id).order("occurred_at")),
        rows(api.from("crm_deals").select("*").eq("cycle_id", id)),
        rows(api.from("crm_payments").select("*").eq("cycle_id", id)),
        rows(api.from("crm_nurture_tracks").select("*").eq("origin_cycle_id", id))
      ]);
      var callIds = r[0].map(function (c) { return c.id; });
      var outcomes = callIds.length ? await rows(api.from("crm_call_outcomes").select("*").in("call_id", callIds).is("superseded_at", null)) : [];
      var analyses = callIds.length ? await rows(api.from("crm_call_analyses").select("*").in("call_id", callIds)) : [];
      return Object.assign(cycle, { calls: r[0], events: r[1], deal: r[2][0] || null, payments: r[3], nurture: r[4], outcomes: outcomes, analyses: analyses });
    },
    // writes (02 §5): each one checks the role on the server and is audited
    declareOutcome: function (callId, p) { return call("crm_declare_outcome", { p_call: callId, p: p }); },
    // call analysis (020 / 021, call-analysis/PLAN.md): past R1 / R2 sales calls the caller may analyse with their state,
    // one full call record, adding a transcript (queues the analysis), running it again; nothing outside the web edition
    caBoard: async function () { await ready(); if (mode !== "live") return []; return call("crm_ca_board", {}); },

  var STAGES = ["Setting", "Présence", "Décision", "Encaissement", "Conversation", "Clôture et suivi long terme", "Données et fiabilité"];

  function configure(cfg) {

      if (force && open && lv !== "crit") lv = force;

      push(id, lv, { open: open, start: start, stop: stop, elapsed: el, at: start + (thr == null ? 0 : thr),

      if (lv3 !== "ok") push("SH-3", lv3, { open: r1.t > age, start: booked.t, stop: r1.t, elapsed: gap, at: booked.t, extra: "entre la prise de RDV et le R1" });
    }
    // SH-4: before the R1, a two-way exchange (a sales message, then a prospect reply); thresholds are hours before the R1
    if (booked && r1 && r1.t > booked.t && on("SH-4")) {
      var d4 = BY["SH-4"], s4 = first(ev, function (e) { return sTouch(e) && e.t < r1.t; }, booked.t);

      // the person presses « Annuler ». Leaving the page sends it at once, so nothing is lost; nothing changes on the server side.
      var undoBar = null;
      function hideUndo() { if (undoBar) { undoBar.remove(); undoBar = null; } }
      function showUndo(msg, won) {
        hideUndo();
        undoBar = document.createElement("div"); undoBar.className = "undo" + (won ? " won" : ""); undoBar.setAttribute("role", "status");
        undoBar.innerHTML = '<span>' + esc(msg) + '<\/span><button type="button" data-undo aria-keyshortcuts="U">Annuler <kbd style="background:transparent;color:#fff;border-color:rgba(255,255,255,.6)">U<\/kbd><\/button><i><\/i>';
        undoBar.querySelector("[data-undo]").onclick = undo;
        root.appendChild(undoBar);
      }
      function commitPending() {
        var p = S.pending; if (!p) return; S.pending = null; clearTimeout(p.timer); hideUndo();
        Promise.resolve(p.send()).then(function (r) { if (r && r.error) fail(p, r.error.message || "Non enregistré"); }, function (e) { fail(p, String((e && e.message) || e)); });
      }
      function fail(p, m) {
        p.revert(); S.front = p.i.id; S.form = p.form; S.form.err = "Non enregistré : " + m; say("Non enregistré pour " + p.i.name + " : " + m); render();
      }
      function undo() {
        var p = S.pending; if (!p) return; S.pending = null; clearTimeout(p.timer); hideUndo();
        p.revert(); S.front = p.i.id; S.form = p.form; S.form.err = ""; S.focusCard = true; render(); say("Déclaration annulée pour " + p.i.name);
      }
      function defer(p, msg, won) {
        commitPending();   // one at a time: the previous one is sent now
        S.pending = p; p.timer = setTimeout(commitPending, 5000); showUndo(msg, won);
      }
      window.addEventListener("pagehide", commitPending);
      document.addEventListener("visibilitychange", function () { if (document.visibilityState === "hidden") commitPending(); });
      function act(kind) {
        var i = current(); if (!i || S.busy) return;
        var F = S.form;
        if (kind === "skip") { S.skipped = S.skipped.filter(function (x) { return x !== i.id; }).concat([i.id]); return finish("aside", function () {}); }
        if (kind === "snooze") { S.day.snoozed.push(i.id); saveDay(); return finish("aside", function () {}); }
        if (kind === "done") {
          if (noteNeeded(i) && !(S.form.note || "").trim()) { S.focusField = "#sdnote"; return render(); }   // D4
          var note = (F.note || "").trim(), formD = Object.assign({}, F), nDone = S.day.done.length;
          F.err = "";
          finish("out", function () { markDone(i, "done"); });
          defer({ i: i, form: formD,
            send: function () { return S.live ? C.addNote(i.c.id, "Ma journée · " + KIND[i.kind].act + (note ? " : " + note : "")) : { demo: true }; },
            revert: function () { S.day.done.splice(nDone, 1); saveDay(); } }, "Fait pour " + i.name);
          return;
        }
        if (kind === "declare") {
          // C4: an unusual amount (above 5 000 €) needs a second press, so a typing slip is not recorded as a sale
          var bigAmt = F.att === "held" && F.dec === "yes" ? amountOf(F.amount) : 0;
          if (bigAmt > 5000 && F.bigOk !== F.amount) { F.bigOk = F.amount; S.focusField = "#sdamount"; return render(); }   // D3: one message, in the hint under the amount
          var p = { attendance: F.att };
          if (F.att === "held") {
            p.decision = F.dec;
            if (F.dec === "no" || F.dec === "disqualified") p.reason_code = F.reason;
            if (F.dec === "follow_up" && (F.next || "").trim()) p.next_step = F.next.trim();
            // a French amount ("1 500,50") is read as 1500.50
            var amt = Number(String(F.amount || "").replace(/[\s\u00a0\u202f]/g, "").replace(",", "."));
            if (F.dec === "yes" && F.amount && !isNaN(amt)) p.amount_sold = amt;
          }
          F.err = "";
          var form = Object.assign({}, F), how = F.att === "no_show" ? "no-show" : { yes: "yes", follow_up: "follow-up", no: "no", disqualified: "disqualified" }[F.dec];
          var was = { next_move: i.c.next_move, events: i.c.events, status: i.c.status, last_sales_at: i.c.last_sales_at, call: i.call.status }, n0 = S.day.done.length;
          finish("out", function () {
            markDone(i, how, p.amount_sold);
            // the cycle's next move changes on the server: drop its outcome from the board until the next refresh
            i.c.next_move = form.att === "no_show" ? { code: "follow_up" } : form.dec === "follow_up" ? { code: "follow_up" } : { code: "done" };
            i.c.events = (i.c.events || []).concat([{ type: "outcome_" + (form.att === "no_show" ? "no_show" : form.dec), source: "crm", call_id: i.call.id, occurred_at: new Date().toISOString() }]);
            if (form.att === "no_show") i.call.status = "no_show"; else i.call.status = "held";
            i.c.last_sales_at = new Date().toISOString();
            if (form.dec === "no" || form.dec === "disqualified") i.c.status = form.dec === "no" ? "lost" : "disqualified";
          });
          var won = how === "yes";
          var msg = won ? "Vente signée avec " + i.name + (p.amount_sold ? " · " + euros(p.amount_sold) : "") + ". Bien joué !" :
            how === "no-show" ? "Absence notée pour " + i.name + " : relance demain" : how === "follow-up" ? "Relance notée pour " + i.name :
            how === "no" ? "Issue « Non » déclarée pour " + i.name : "Disqualifié : " + i.name;
          defer({ i: i, form: form,
            send: function () { return S.live ? C.declareOutcome(i.call.id, p) : { demo: true }; },
            revert: function () {
              S.day.done.splice(n0, 1); saveDay();
              i.c.next_move = was.next_move; i.c.events = was.events; i.c.status = was.status; i.c.last_sales_at = was.last_sales_at; i.call.status = was.call;
            } }, msg, won);
        }
      }
      box.addEventListener("click", function (e) {
        var b = e.target.closest("button"); if (!b) return;
        if (b.dataset.go) return goScreen(b.dataset.go);
        if (b.dataset.front) { S.front = b.dataset.front; S.form = {}; return render(); }
        if (b.dataset.unsnooze) { S.day.snoozed = S.day.snoozed.filter(function (x) { return x !== b.dataset.unsnooze; }); saveDay(); return render(); }
        if (b.dataset.att) { S.form.att = b.dataset.att; if (b.dataset.att === "no_show") S.form.dec = null; S.form.err = ""; return render(); }
        if (b.dataset.dec) { S.form.dec = b.dataset.dec; S.form.reason = ""; S.form.err = ""; if (b.dataset.dec === "yes" && !S.form.amount) S.form.amount = String(OFFER[0][0]); S.focusField = FIELD[b.dataset.dec] || null; return render(); }
        if (b.dataset.reason) { S.form.reason = b.dataset.reason; S.form.err = ""; S.focusField = '[data-do="declare"]'; return render(); }
        if (b.dataset.amount) { S.form.amount = b.dataset.amount; S.focusField = '[data-do="declare"]'; return render(); }
        if (b.dataset.do === "reload") return load();
        if (b.dataset.do) return act(b.dataset.do);
      });
      box.addEventListener("input", function (e) {
        var id = e.target.id;
        if (id === "sdnote") { S.form.note = e.target.value; var di = current(), db = root.querySelector('[data-do="done"]'), dw = root.getElementById("sdwhy");
          if (di && db && noteNeeded(di)) { var miss = !S.form.note.trim(); db.disabled = miss || S.busy; if (dw) dw.textContent = miss ? "Notez ce que vous avez fait." : ""; } }
        if (id === "sdnext") S.form.next = e.target.value;
        if (id === "sdamount") { S.form.amount = e.target.value; amountHint(); }
      });
      // C4: the prefilled amount is selected on focus, so typing replaces it instead of appending to it
      box.addEventListener("focusin", function (e) { if (e.target.id === "sdamount" && e.target.select) setTimeout(function () { try { e.target.select(); } catch (x) {} }, 0); });
      box.addEventListener("change", function (e) {
        if (e.target.id === "sdreason") { S.form.reason = e.target.value; render(); }
        if (e.target.hasAttribute("data-who")) { S.who = e.target.value; S.front = null; S.form = {}; render(); }
      });
      // drag the card to the right (Done) or to the left (Skip); outcomes are declared with their buttons
      function swipe() {
        var el = root.getElementById("tc"); if (!el) return;
        var i = current(), x0 = null, dx = 0;
        el.addEventListener("pointerdown", function (e) { if (e.target.closest("button,input,select,textarea,.cyc")) return; x0 = e.clientX; dx = 0; el.classList.add("drag"); el.setPointerCapture(e.pointerId); });
        el.addEventListener("pointermove", function (e) { if (x0 == null) return; dx = e.clientX - x0; el.style.transform = "translateX(" + dx + "px) rotate(" + dx / 30 + "deg)"; });
        var up = function () {
          if (x0 == null) return; x0 = null; el.classList.remove("drag"); el.style.transform = "";
          if (dx > 120 && i && i.kind !== "outcome") act("done");
          else if (dx < -120) act("skip");
        };
        el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
      }
      box.addEventListener("toggle", function (e) { if (e.target.id === "sdcyc") S.cycOpen = e.target.open; }, true);
      window.addEventListener("lnp-nowlist", function () {
        var a = root.activeElement; if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) return;
        if (root.host && root.host.isConnected && !S.loading) render();
      });
      // keyboard shortcuts (Romain 2026-11-09): H / A, 1 to 4, Entrée, D, P; never while typing in a field (Entrée excepted)
      document.addEventListener("keydown", function (e) {
        // C7: « Annuler » without hunting for it — U, or Ctrl+Z / Cmd+Z, while the undo bar is shown
        if (S.pending && root.host && root.host.isConnected && !e.altKey) {
          var ta = root.activeElement && /^(INPUT|TEXTAREA)$/.test(root.activeElement.tagName);
          if ((!ta && !e.ctrlKey && !e.metaKey && (e.key === "u" || e.key === "U")) || ((e.ctrlKey || e.metaKey) && (e.key === "z" || e.key === "Z") && !ta)) { e.preventDefault(); undo(); return; }
        }
        if (!root.host || !root.host.isConnected || e.ctrlKey || e.metaKey || e.altKey || e.defaultPrevented) return;
        var a = root.activeElement, typing = a && (a.tagName === "TEXTAREA" || a.tagName === "SELECT" || (a.tagName === "INPUT" && a.type !== "button"));
        if (document.activeElement && document.activeElement !== root.host && document.activeElement !== document.body) return;
        var i = current(); if (!i || S.busy) return;
        var k = e.key.toLowerCase(), F = S.form;
        if (k === "enter") {
          if (a && a.tagName === "TEXTAREA" && !(e.ctrlKey || e.metaKey)) return;
          if (a && a.tagName === "BUTTON") return;   // Entrée on a focused button presses that button
          var b = root.querySelector(i.kind === "outcome" ? '[data-do="declare"]' : '[data-do="done"]');
          if (b && !b.disabled) { e.preventDefault(); act(i.kind === "outcome" ? "declare" : "done"); }
          return;
        }
        if (typing) return;
        if (i.kind === "outcome" && (k === "h" || k === "a")) { F.att = k === "h" ? "held" : "no_show"; if (k === "a") F.dec = null; F.err = ""; e.preventDefault(); return render(); }
        // digits choose the decision only while no field waits for an answer (A2: « 3500 » used to switch Oui to Non)
        if (i.kind === "outcome" && F.att === "held" && /^[1-4]$/.test(k) && !root.querySelector("#sdamount,#sdnext,[data-reason]")) {
          F.dec = ["yes", "follow_up", "no", "disqualified"][+k - 1]; F.reason = ""; F.err = ""; if (F.dec === "yes" && !F.amount) F.amount = String(OFFER[0][0]); S.focusField = FIELD[F.dec] || null; e.preventDefault(); return render(); }
        // with Non / Disqualifié, the digits pick the reason
        if (i.kind === "outcome" && (F.dec === "no" || F.dec === "disqualified") && /^[1-9]$/.test(k)) {
          var rb = root.querySelectorAll("[data-reason]")[+k - 1]; if (rb) { F.reason = rb.dataset.reason; F.err = ""; S.focusField = '[data-do="declare"]'; e.preventDefault(); return render(); } }
        if (k === "d") { e.preventDefault(); return act("snooze"); }
        if (k === "p") { e.preventDefault(); return act("skip"); }
      });
      load();
      return { render: render };
    }
  };
})();

<script>/* LNP › Ventes › Alertes (Romain 2026-11-09 : « je veux que ce soit l'application CRM qui soit la base des notifications » ;
   « les alertes sont reçues par les commerciaux selon les alertes qui concernent uniquement leurs leads, et les admins peuvent
   suivre toutes les alertes de tous les commerciaux »).
   Le serveur (sla-tick, toutes les 5 minutes) ouvre, fait monter et ferme les alertes (crm_sla_alerts, migration 053) ; ici :
   - LNP_ALERTS.store : les alertes ouvertes que la personne peut voir (crm_sla_alerts_open), rechargées en direct (Realtime) et
     chaque minute ; la pastille de la barre latérale, le bandeau « Nouvelle alerte » et, si la personne l'a accepté, une
     notification du navigateur pour une alerte critique ;
   - l'écran Alertes (module monté dans [data-alertes] par build.py) : critiques d'abord, puis en retard, puis bientôt dues ; un
     administrateur choisit un commercial ou toute l'équipe ; « Ouvrir la fiche » ouvre le prospect dans le CRM.
   Hors édition web : un exemple, rien n'est enregistré. */
(function () {
  "use strict";
  var MIN = 60e3, H = 3600e3;
  var LV = { crit: "Critique", late: "En retard", warn: "Bientôt dû" };
  var ORDER = ["crit", "late", "warn"];

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  // « 2 h 10 », « 35 min », « 3 j »
  function dur(ms) {
    ms = Math.max(0, ms);
    if (ms < H) return Math.max(1, Math.round(ms / MIN)) + " min";
    if (ms < 48 * H) { var h = Math.floor(ms / H), m = Math.round((ms - h * H) / MIN); return h + " h" + (m ? " " + String(m).padStart(2, "0") : ""); }
    return Math.round(ms / (24 * H)) + " j";
  }

  // un exemple pour le fichier seul (personnes fictives)
  function demo(now) {
    var iso = function (ms) { return new Date(ms).toISOString(); };
    var a = function (id, lv, sla, name, person, owner, ownerId, startedH, detail, target, kind) {
      return { id: id, cycle_id: "demo-" + id, person: person, owner: owner, owner_id: ownerId, sla: sla, kind: kind || "sales", level: lv, name: name,
        detail: detail, target: target, started_at: iso(now - startedH * H), crossed_at: iso(now - startedH * H / 2), opened_at: iso(now - startedH * H / 2) };
    };
    return { sees_all: true, closed_today: 4, alerts: [
      a("a1", "crit", "SH-2", "Premier contact du commercial", "Prospect fictif A", "Commercial fictif 1", "m1", 1.6, "depuis la prise de RDV", "5 min"),
      a("a2", "late", "SH-11", "Issue déclarée", "Prospect fictif B", "Commercial fictif 2", "m2", 1.2, "depuis la fin du R1", "15 min"),
      a("a3", "late", "DE-1", "Récap écrit après l’appel", "Prospect fictif C", "Commercial fictif 1", "m1", 3.5, "depuis la fin du R1", "60 min"),
      a("a4", "warn", "CO-1", "Réponse à un message du prospect", "Prospect fictif D", "Commercial fictif 2", "m2", 0.2, "depuis le message du prospect", "15 min dans la plage du commercial")] };
  }

  // ---------- les alertes de la personne, partagées par la pastille, le bandeau et l'écran ----------
  var store = (function () {
    var S = { live: false, loaded: false, data: { alerts: [], closed_today: 0, sees_all: false }, error: "", seen: null }, subs = [], timer = null, C = null;
    function emit() {
      subs.forEach(function (fn) { try { fn(); } catch (e) { console.error(e); } });
      try { window.dispatchEvent(new Event("lnp-alerts")); } catch (e) {}
    }
    function load() {
      if (!S.live) { S.data = demo(Date.now()); S.loaded = true; emit(); return Promise.resolve(); }
      return C.slaAlerts().then(function (d) {
        var fresh = [];
        var list = (d && d.alerts) || [];
        if (S.seen) list.forEach(function (x) { var k = x.id + ":" + x.level; if (!S.seen[k] && x.level !== "warn") fresh.push(x); });
        S.seen = {}; list.forEach(function (x) { S.seen[x.id + ":" + x.level] = 1; });
        S.data = { alerts: list, closed_today: (d && d.closed_today) || 0, sees_all: !!(d && d.sees_all) };
        S.loaded = true; S.error = "";
        emit();
        if (fresh.length) announce(fresh);
      }, function (e) { S.error = String((e && e.message) || e); S.loaded = true; emit(); });
    }
    var later = null;
    function soon() { clearTimeout(later); later = setTimeout(load, 1500); }
    function start() {
      C = window.LNP_CRM;
      Promise.resolve(C && C.ready()).then(function () {
        S.live = !!(C && C.mode() === "live");
        load();
        if (!S.live) return;
        if (C.onAlerts) C.onAlerts(soon);
        timer = setInterval(load, MIN);
        document.addEventListener("visibilitychange", function () { if (document.visibilityState === "visible") load(); });
      });
    }
    return {
      start: start, load: load, state: function () { return S; },
      on: function (fn) { subs.push(fn); return function () { subs = subs.filter(function (x) { return x !== fn; }); }; },
      count: function () { return S.data.alerts.length; },
      critical: function () { return S.data.alerts.filter(function (x) { return x.level === "crit"; }).length; }
    };
  })();

  // ---------- « Nouvelle alerte » : un bandeau dans la page, une notification du navigateur pour une critique ----------
  var bar = null;
  function open(cycleId) { try { window.postMessage({ lnp: "crm", lead: cycleId }, "*"); } catch (e) {} }
  function goAlerts() { try { window.postMessage({ lnp: "go", screen: "alertes" }, "*"); } catch (e) {} }
  function announce(list) {
    var x = list[0], more = list.length - 1;
    var txt = (list.length > 1 ? list.length + " nouvelles alertes · " : "Nouvelle alerte · ") + LV[x.level] + " · " + x.sla + " " + x.name + " · " + (x.person || "un prospect") + (more ? " (et " + more + " autre" + (more > 1 ? "s" : "") + ")" : "");
    if (!document.body) return;
    if (!bar) {
      bar = document.createElement("div");
      bar.setAttribute("role", "status");
      bar.setAttribute("data-lnp-alertbar", "");
      bar.style.cssText = "position:fixed;top:16px;right:16px;z-index:80;max-width:min(460px,calc(100vw - 32px));display:flex;gap:12px;align-items:center;background:#1E2A5E;color:#F7F8FB;border-radius:12px;padding:12px 14px;font:15px/1.4 'Poppins',system-ui,sans-serif;box-shadow:0 12px 32px rgba(0,0,0,.25)";
      document.body.appendChild(bar);
    }
    bar.innerHTML = '<span style="width:10px;height:10px;border-radius:50%;flex:none;background:' + (x.level === "crit" ? "#E5484D" : "#5B8DF7") + '"><\/span><span style="flex:1"><\/span>' +
      '<button type="button" data-see style="font:inherit;font-weight:600;border:0;border-radius:8px;padding:6px 10px;background:#F7F8FB;color:#1E2A5E;cursor:pointer">Voir<\/button>' +
      '<button type="button" data-x aria-label="Fermer" style="font:inherit;border:0;background:transparent;color:#F7F8FB;cursor:pointer;font-size:17px;line-height:1">×<\/button>';
    bar.children[1].textContent = txt;
    bar.querySelector("[data-see]").onclick = function () { bar.remove(); bar = null; goAlerts(); };
    bar.querySelector("[data-x]").onclick = function () { bar.remove(); bar = null; };
    clearTimeout(announce.t); announce.t = setTimeout(function () { if (bar) { bar.remove(); bar = null; } }, 15000);
    var crit = list.filter(function (y) { return y.level === "crit"; })[0];
    if (crit && "Notification" in window && Notification.permission === "granted" && document.visibilityState !== "visible") {
      try { var n = new Notification("LNP · Alerte critique", { body: crit.sla + " " + crit.name + " · " + (crit.person || "un prospect"), tag: "lnp-" + crit.id }); n.onclick = function () { window.focus(); open(crit.cycle_id); n.close(); }; } catch (e) {}
    }
  }

  var CSS = [
    ":host{all:initial;display:block;font:15px/1.5 'Poppins',system-ui,sans-serif;color:#1E2A5E;--line:#E3ECFB;--soft:#E3ECFB;--mut:#5A6478;--crit:#B42318;--crits:#FDECEA;--late:#B4561E;--lates:#FDECEA;--warn:#143A8D;--warns:#DEE3F5}",
    "*{box-sizing:border-box}button,select{font:inherit;color:inherit}",
    ".wrap{display:flex;flex-direction:column;gap:20px;max-width:1080px}",
    ".head{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}.head h2{font-family:Poppins,Arial,sans-serif;font-weight:500;font-size:32px;margin:0}",
    ".sub{color:var(--mut);font-size:15px;max-width:640px;margin:4px 0 0}.sp{flex:1}",
    ".sel{height:38px;border:1px solid #AECBF2;border-radius:10px;background:#fff;padding:0 10px;font-size:15px}",
    ".btn{height:38px;border:1px solid #AECBF2;border-radius:10px;background:#fff;padding:0 14px;font-size:15px;font-weight:600;cursor:pointer}",
    ".btn:focus-visible,.sel:focus-visible,.row button:focus-visible{outline:3px solid #2B6CF5;outline-offset:2px}",
    ".chips{display:flex;gap:10px;flex-wrap:wrap}",
    ".chip{display:flex;flex-direction:column;gap:2px;min-width:140px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px}",
    ".chip b{font-size:26px;font-weight:600;line-height:1.1}.chip span{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut)}",
    ".chip.crit b{color:var(--crit)}.chip.late b{color:var(--late)}.chip.warn b{color:var(--warn)}",
    ".grp{display:flex;flex-direction:column;gap:8px}.grp h3{margin:6px 0 0;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}",
    ".row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}",
    ".row.crit{border-left:4px solid var(--crit)}.row.late{border-left:4px solid var(--late)}.row.warn{border-left:4px solid var(--warn)}",
    ".tag{font-size:12px;font-weight:700;letter-spacing:.04em;padding:3px 10px;border-radius:999px;white-space:nowrap}",

      });
      store.on(render);
      render();
      return { render: render };
    }
  };
  store.start();
