veau lead */\nfunction openMini(kind,id,st){closeMenu();S.cx.mini={kind,id,st};const l=id?byD(id):null;let body=\"\",title=\"\";\n  if(kind===\"amount\"){title=t(\"cx_amount_t\");body=`<p class=\"sub\" style=\"margin:0\">${t(\"cx_amount_d\")}<\/p><div class=\"fld\"><label for=\"mA\">${t(\"cx_amount_t\")} (\u20ac)<\/label><input id=\"mA\" type=\"number\" min=\"1\" step=\"100\" inputmode=\"numeric\" value=\"${l.a||prodOf(l).p}\"><\/div><div class=\"fld2\"><div class=\"fld\"><label for=\"mI\">${t(\"cx_inv\")} (\u20ac)<\/label><input id=\"mI\" type=\"number\" min=\"0\" step=\"100\" inputmode=\"numeric\" value=\"${l.inv||\"\"}\" placeholder=\"0\"><\/div><div class=\"fld\"><label for=\"mC\">${t(\"cx_col\")} (\u20ac)<\/label><input id=\"mC\" type=\"number\" min=\"0\" step=\"100\" inputmode=\"numeric\" value=\"${l.col||\"\"}\" placeholder=\"0\"><\/div><\/div>`;}\n  else if(kind===\"pay\"){title=t(\"cx_pay_t\");body=`<p class=\"sub\" style=\"margin:0\">${t(\"cx_pay_d\")}<\/p><div class=\"fld\"><label>${t(\"cx_signed\")}<\/label><div class=\"cx-ro\">${money(l.a)}<\/div><\/div><div class=\"fld2\"><div class=\"fld\"><label for=\"mI\">${t(\"cx_inv\")} (\u20ac)<\/label><input id=\"mI\" type=\"number\" min=\"0\" step=\"100\" inputmode=\"numeric\" value=\"${l.inv}\"><\/div><div class=\"fld\"><label for=\"mC\">${t(\"cx_col\")} (\u20ac)<\/label><input id=\"mC\" type=\"number\" min=\"0\" step=\"100\" inputmode=\"numeric\" value=\"${l.col}\"><\/div><\/div>`;}\n  else if(kind===\"reason\"){title=t(\"cx_reason_t\");body=`<p class=\"sub\" style=\"margin:0\">${t(\"cx_reason_\"+st)}<\/p><div class=\"fld\"><label for=\"mR\">${t(\"cx_reason_t\")}<\/label><select id=\"mR\">${REASONS[st].map(r=>`<option value=\"${r}\">${L(REASON_L[r])}<\/option>`).join(\"\")}<\/select><\/div>`;}\n  else{title=t(\"cx_newlead\");body=`<div class=\"fld\"><label for=\"mP\">${t(\"cx_nl_name\")}<\/label><input id=\"mP\" autocomplete=\"off\"><\/div><div class=\"fld\"><label for=\"mE\">${t(\"cx_nl_email\")}<\/label><input id=\"mE\" type=\"email\" autocomplete=\"off\"><\/div>\n    <div class=\"fld2\"><div class=\"fld\"><label for=\"mO\">${t(\"cx_nl_rep\")}<\/label><select id=\"mO\">${SALES.map(s=>`<option value=\"${s.id}\" ${S.cx.owner===s.id?\"selected\":\"\"}>${s.name}<\/option>`).join(\"\")}<\/select><\/div><div class=\"fld\"><label for=\"mPr\">${t(\"cx_nl_prod\")}<\/label><select id=\"mPr\">${PRODUCTS.map(p=>`<option value=\"${p.id}\">${L(p.n)}<\/option>`).join(\"\")}<\/select><\/div><\/div>\n    <div class=\"fld2\"><div class=\"fld\"><label for=\"mD\">${t(\"cx_nl_rdv\")}<\/label><input id=\"mD\" type=\"date\"><\/div><div class=\"fld\"><label for=\"mH\">${t(\"cx_nl_time\")}<\/label><input id=\"mH\" type=\"time\" value=\"10:00\"><\/div><\/div>`;}\n  const back=S.cx.lead?\"minicancel\":\"close\";\n  document.getElementById(\"layer\").innerHTML=`<div class=\"scrim\" data-act=\"${back}\"><\/div><div class=\"modal cx-mini\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"miT\">\n    <div class=\"m-h\"><div>${l?`<div class=\"eyebrow\">${esc(l.p)} \u2192 ${stLabel(st)}<\/div>`:\"\"}<h2 id=\"miT\">${title}<\/h2><\/div><button class=\"x\" data-act=\"${back}\" aria-label=\"${t(\"cx_close\")}\">\u00d7<\/button><\/div>\n    <form class=\"m-b\" id=\"miniForm\" style=\"gap:12px\" novalidate><div id=\"mErr\" class=\"err\" hidden><\/div>${body}<div class=\"cx-btns\" style=\"justify-content:flex-end\"><button type=\"button\" class=\"btn\" data-act=\"${back}\">${t(\"d_cancel\")}<\/button><button type=\"submit\" class=\"btn pri\">${t(\"cx_confirm\")}<\/button><\/div><\/form><\/div>`;\n  document.getElementById(\"miniForm\").addEventListener(\"submit\",e=>{e.preventDefault();miniSave()});\n  setTimeout(()=>{const f=document.querySelector(\"#layer input,#layer select\");if(f)f.focus()},30);\n}\nfunction miniSave(){const M=S.cx.mini;if(!M)return;const g=x=>document.getElementById(x),err=m=>{const e=g(\"mErr\");e.textContent=m;e.hidden=false};\n  const payVals=a=>{const inv=Number(g(\"mI\").value)||0,col=Number(g(\"mC\").value)||0;\n    if(inv<0||col<0)return null; if(inv>a){err(t(\"cx_err_inv\"));return null} if(col>inv){err(t(\"cx_err_col\"));return null} return {inv,col};};\n  if(M.kind===\"amount\"){const a=Number(g(\"mA\").value);if(!(a>0))return err(t(\"err_amount\"));const pv=payVals(a);if(!pv)return;S.cx.mini=null;if(!S.cx.lead)closeLayer();moveLead(M.id,\"close\",{amount:a,...pv});return;}\n  if(M.kind===\"pay\"){const l=byD(M.id);const pv=payVals(l.a);if(!pv)return;l.inv=pv.inv;l.col=pv.col;l.hist.push({st:\"close\",d:0,src:\"pay\"});S.cx.mini=null;\n    if(S.cx.lead)renderLead();else closeLayer();renderAll();if(S.cx.lead)renderLead();toast(t(\"cx_pay_saved\"));return;}\n  if(M.kind===\"reason\"){const r=g(\"mR\").value;S.cx.mini=null;if(!S.cx.lead)closeLayer();moveLead(M.id,M.st,{reason:r});return;}\n  const p=g(\"mP\").value.trim(),em=g(\"mE\").value.trim();\n  if(!p)return err(t(\"err_name\"));if(!/^\\S+@\\S+\\.\\S+$/.test(em))return err(t(\"cx_err_email\"));\n  const dv=g(\"mD\").value,hv=g(\"mH\").value||\"10:00\";const rdv=dv?{d:Math.round((new Date(dv+\"T12:00:00\")-TODAY)/864e5),h:hv}:null;\n  const l={id:\"n\"+Date.now(),p,em,o:g(\"mO\").value,prod:g(\"mPr\").value,st:rdv?\"planifie\":\"nouveau\",a:0,age:0,tour:1,rdv,tent:0,warm:[false,false,false],nx:null,note:\"\"};\n  l.hist=[{st:\"nouveau\",d:0,src:\"sales\"}].concat(rdv?[{st:\"planifie\",d:0,src:\"bookings\"}]:[]);\n  projectCycle(l);LEADS.unshift(l);closeLayer();renderAll();toast(t(\"cx_created\"));\n}\n\n/* actions CRM, appel\u00e9es depuis le gestionnaire de clics */\nfunction cxAction(act,el,e){const X=S.cx,id=el.dataset.id,l=id?byD(id):null;\n  switch(act){\n    case \"cxtab\": X.tab=el.dataset.t; closeMenu(); renderCRM(); return true;\n    case \"cxper\": X.per=el.dataset.v; renderCRM(); return true;\n    case \"cxcolreset\": window.cxColOrder=null;{const P=cxPrefs();if(P)P.setPref(\"crm.pipeline.cols\",null).catch(()=>{})} renderCRM(); return true;\n    case \"cxquick\": X.quick=X.quick===el.dataset.k?null:el.dataset.k; renderCRM(); return true;\n    case \"cxshow\": X.show[el.dataset.k]=!X.show[el.dataset.k]; renderCRM(); return true;\n    case \"cxsort\": if(X.sort===el.dataset.k)X.dir=-X.dir;else{X.sort=el.dataset.k;X.dir=1} renderCRM(); return true;\n    case \"nxmenu\": e.stopPropagation(); nxMenu(el,id); return true;\n    case \"stmenu\": e.stopPropagation(); stMenu(el,id); return true;\n    case \"cxcols\": e.stopPropagation(); colsMenu(el); return true;\n    case \"nxpick\": l.nx={k:el.dataset.k,d:1}; projectCycle(l); closeMenu(); autoClose(l); renderAll(); if(X.lead)renderLead(); toast(t(\"cx_nx_set\",{a:L(ACT[el.dataset.k])})); return true;\n    case \"nxclear\": closeMenu(); sklAsk(\"Retirer l\u2019action ?\",\"La prochaine action de ce prospect sera retir\u00e9e.\",t(\"cx_nx_clear\"),function(){l.nx=null; renderAll(); if(X.lead)renderLead();}); return true;\n    case \"nxdone\": {const k=l.nx.k;\n      if(k===\"call\"&&l.st===\"nouveau\")l.tent=Math.min(3,(l.tent||0)+1);\n      if(k===\"relance\"&&l.rel){l.rel.n=Math.min(3,l.rel.n+1);l.rel.ago=0}\n      if(k===\"warm_j1\")l.warm[1]=true; if(k===\"warm_jj\")l.warm[2]=true;\n      l.nx=null; autoClose(l); renderAll(); if(X.lead)renderLead(); toast(t(\"cx_done\")); return true;}\n    case \"warm\": l.warm[+el.dataset.i]=!l.warm[+el.dataset.i]; autoClose(l); renderAll(); return true;\n    case \"nsback\": l.st=\"nouveau\"; l.age=0; l.tent=0; l.nx={k:\"calendly\",d:0}; l.hist.push({st:\"nouveau\",d:0,src:\"sales\"}); projectCycle(l); renderAll(); toast(t(\"cx_back\")); return true;\n    case \"nslost\": moveLead(id,\"perdu\",{reason:\"noshow_unreach\"}); return true;\n    case \"lead\": case \"deal\": openLead(id); return true;\n    case \"ltab\": X.lead.tab=el.dataset.t; renderLead(); return true;\n    case \"stnew\": X.lead.step=\"new\"; renderLead(); setTimeout(()=>{const f=document.getElementById(\"cyForm\");if(f)f.scrollIntoView({block:\"nearest\"})},0); return true;\n    case \"stedit\": X.lead.step=+el.dataset.i; renderLead(); setTimeout(()=>{const f=document.getElementById(\"cyForm\");if(f)f.scrollIntoView({block:\"nearest\"})},0); return true;\n    case \"stcancel\": X.lead.step=null; renderLead(); return true;\n    case \"stdel\": {const si=+el.dataset.i;sklAsk(\"Supprimer cette \u00e9tape ?\",\"Cette \u00e9tape du cycle de vente sera supprim\u00e9e.\",t(\"cy_delete\"),function(){const lead=byD(X.lead.id);lead.hist.splice(si,1);X.lead.step=null;renderLead();toast(t(\"cy_deleted\"));});return true;}\n    case \"ltr\": l.tr=\"R\"+l.tour; renderAll(); renderLead(); toast(t(\"cx_tr_added\")); return true;\n    case \"lstpick\": closeMenu(); moveLead(id,el.dataset.s); return true;\n    case \"rdvheld\": moveLead(id,\"realise\"); return true;\n    case \"rdvnoshow\": moveLead(id,\"noshow\"); return true;\n    case \"noteedit\": X.lead.edit=true; renderLead(); return true;\n    case \"notecancel\": X.lead.edit=false; renderLead(); return true;\n    case \"notesave\": l.note=document.getElementById(\"noteTa\").value.trim(); X.lead.edit=false; renderLead(); toast(t(\"cx_note_saved\")); return true;\n    case \"minicancel\": X.mini=null; renderLead(); return true;\n    case \"cxreps\": toast(t(\"cx_reps_done\")); return true;\n    case \"cxnew\": openMini(\"new\"); return true;\n    case \"cxmock\": toast(t(\"cx_mock\")); return true;\n    case \"pay\": e.stopPropagation(); openMini(\"pay\",id,\"close\"); return true;\n  }\n  return false;\n}\n\n/* Cl\u00f4ture automatique : le fait a cess\u00e9 d'\u00eatre vrai */\nfunction autoClose(d){\n  ALERTS.filter(a=>a.deal===d.id&&a.s!==\"closed\").forEach(a=>{\n    const ok=(a.c===\"2.2\"&&(d.warm[1]||d.warm[2]))||((a.c===\"2.3\"||a.c===\"2.10\"||a.c===\"2.4\")&&d.nx)||([\"perdu\",\"disq\"].includes(d.st)&&a.c!==\"2.8\")||(a.c===\"2.4\"&&d.st!==\"planifie\")||(a.c===\"2.10\"&&d.st===\"nouveau\"&&d.tent>0);\n    if(ok)closeAlert(a.id,true);\n  });\n}\n\n/* ============ ALERTS ============ */\nfunction alertObj(a){\n  if(!a.deal)return L(a.obj);\n  const d=byD(a.deal);return `Lead ${d.p} \u00b7 ${d.a?money(d.a)+\" \u00b7 \":\"\"}${stLabel(d.st)}`;\n}\nfunction alertCard(a){\n  const C=CODES[a.c];\n  let due;\n  if(a.s===\"deferred\")due=`<span class=\"al-due\">${t(\"deferred_to\",{d:fdate(dPlus(a.defer))})}<\/span>`;\n  else if(a.s===\"queued\")due=`<span class=\"al-due\">${t(\"queued_rank\",{n:a.rank})}<\/span>`;\n  else if(a.h<0)due=`<span class=\"al-due late\">${a.who===\"HoS\"?\"HoS\":a.who} \u00b7 ${S.lang===\"fr\"?\"en retard de\":\"overdue by\"} ${-a.h} h<\/span>`;\n  else due=`<span class=\"al-due\">${t(\"due_in\",{who:a.who,h:a.h})}<\/span>`;\n  return `<article class=\"al sev-${a.sev} ${a.s!==\"active\"?\"q\":\"\"}\" data-act=\"alert\" data-id=\"${a.id}\" tabindex=\"0\">\n    <div class=\"al-top\"><span class=\"code\">${a.c}<\/span><span class=\"tt\">${L(C.t)}<\/span>${due}<\/div>\n    <div class=\"al-obj\">${esc(alertObj(a))}<\/div>\n    <div class=\"al-fact\">${esc(L(a.fact))}<\/div>\n    <div class=\"al-meta\">${ava(a.o,true)}<span class=\"impact\">~ ${money(a.imp)}<\/span><span class=\"chip c-mut\">${t(\"est\")}<\/span><span>${t(\"occ\",{n:a.occ})}<\/span><\/div>\n    ${a.s===\"active\"?`<div class=\"al-act\"><button class=\"btn teal sm\" data-act=\"doalert\" data-id=\"${a.id}\">${L(C.act)}<\/button><button class=\"btn sm\" data-act=\"defer\" data-id=\"${a.id}\">${t(\"defer\")}<\/button><\/div>`:\"\"}\n  <\/article>`;\n}\nfunction renderAlerts(){\n  const scoped=ALERTS.filter(a=>a.s!==\"closed\");\n  const c={active:scoped.filter(a=>a.s===\"active\").length,queue:scoped.filter(a=>a.s===\"queued\").length,\n    deferred:scoped.filter(a=>a.s===\"deferred\").length,escal:scoped.filter(a=>a.s===\"active\"&&(a.g===\"escalate\"||a.h<0)).length,closed:CLOSEDA.length};\n  let groups=[];\n  if(S.axis===\"decision\")groups=[\"now\",\"1on1\",\"escalate\",\"waiting\"].map(g=>({n:t(\"g_\"+g),items:scoped.filter(a=>(a.s===\"queued\"?\"now\":a.g)===g&&!(g!==\"waiting\"&&a.s===\"deferred\"))}));\n  else if(S.axis===\"lever\")groups=[\"cash\",\"process\",\"coaching\"].map(l=>({n:t(\"lv_\"+l),items:scoped.filter(a=>CODES[a.c].lv===l)}));\n  else groups=[...SALES.map(s=>({n:s.name,id:s.id})),{n:\"Romain N. (CRO)\",id:\"cro\"}].map(p=>({n:p.n,items:scoped.filter(a=>a.o===p.id)}));\n  const order={active:0,queued:1,deferred:2};\n  const body=scoped.length?groups.filter(g=>g.items.length).map(g=>`<div class=\"group\"><div class=\"group-h\"><span class=\"gn\">${esc(g.n)}<\/span><span class=\"gc\">${g.items.length}<\/span><\/div>\n     <div class=\"al-grid\">${g.items.sort((a,b)=>order[a.s]-order[b.s]||b.imp-a.imp).map(alertCard).join(\"\")}<\/div><\/div>`).join(\"\")\n    :`<div class=\"card green-state\"><div class=\"big\">${t(\"green_t\")}<\/div><ul><li>${t(\"green_1\")}<\/li><li>${t(\"green_2\")}<\/li><li>${t(\"green_3\")}<\/li><li>${t(\"green_4\")}<\/li><\/ul><\/div>`;\n  const closed=CLOSEDA.length?`<div class=\"card\" style=\"margin-top:18px\"><div class=\"eyebrow\">${t(\"closed_t\")}<\/div><div class=\"closed-list\">${CLOSEDA.map(a=>`<div class=\"closed-row\"><span class=\"code\">${a.c}<\/span><span style=\"flex:1;color:var(--ink)\">${esc(alertObj(a))}<\/span><span>${t(\"closed_by\",{p:L(CODES[a.c].proof)})}<\/span><\/div>`).join(\"\")}<\/div><\/div>`:\"\";\n  document.getElementById(\"v-alerts\").innerHTML=`\n   <div class=\"head\">\n     <div><div class=\"crumb\">${t(\"crumb_admin\")}<\/div><h1>${t(\"al_title\")}<\/h1><div class=\"sub\">${t(\"al_sub\")}<\/div><\/div>\n     <div class=\"controls\"><span class=\"fresh\">${t(\"fresh\")}<\/span><\/div>\n   <\/div>\n   <div class=\"counters\">\n     ${[[\"active\",c.active],[\"queue\",c.queue],[\"deferred\",c.deferred],[\"escal\",c.escal],[\"closed\",c.closed]].map(x=>`<div class=\"ctr\"><div class=\"t\">${t(\"c_\"+x[0])}<\/div><div class=\"v\">${x[1]}<\/div><\/div>`).join(\"\")}\n   <\/div>\n   <div class=\"spread\" style=\"align-items:center\">\n     <div class=\"controls\"><span class=\"small mut\">${t(\"group_by\")}<\/span><div class=\"seg\">${[\"decision\",\"person\",\"lever\"].map(x=>`<button class=\"${S.axis===x?'on':''}\" data-act=\"axis\" data-x=\"${x}\">${t(\"ax_\"+x)}<\/button>`).join(\"\")}<\/div><\/div>\n     <div class=\"small mut\" style=\"max-width:460px\">${t(\"queue_note\")}<\/div>\n   <\/div>\n   ${body}${closed}`;\n}\nfunction openAlert(id){\n  const a=ALERTS.find(x=>x.id===id), C=CODES[a.c];\n  document.getElementById(\"layer\").innerHTML=`\n   <div class=\"scrim\" data-act=\"close\"><\/div>\n   <div class=\"modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"mT\">\n     <div class=\"m-h\"><div><div class=\"eyebrow\">${a.c} \u00b7 ${t(\"lv_\"+C.lv)}<\/div><h2 id=\"mT\">${L(C.t)}<\/h2><div class=\"sub\">${esc(alertObj(a))}<\/div><\/div><button class=\"x\" data-act=\"close\" aria-label=\"Close\">\u00d7<\/button><\/div>\n     <div class=\"m-b\">\n       <div class=\"m-sec\"><h3>${t(\"m_why\")}<\/h3><ol class=\"steps\"><li>${t(\"why_1\",{c:a.c})}<\/li><li>${esc(L(a.fact))}<\/li><li>${t(\"why_3\")}<\/li><li>${t(\"why_4\")}<\/li><\/ol><\/div>\n       <div class=\"m-sec\"><h3>${t(\"m_vals\")}<\/h3><dl class=\"kv\">${a.vals.map(v=>`<dt>${L(v[0])}<\/dt><dd>${esc(L(v[1]))}<\/dd>`).join(\"\")}<dt>${t(\"m_owner\")}<\/dt><dd>${esc(ownerName(a.o))}<\/dd><dt>${t(\"m_proof\")}<\/dt><dd>${L(C.proof)}<\/dd><\/dl><\/div>\n       <div class=\"m-sec\"><h3>${t(\"m_excl\")}<\/h3><ul class=\"excl\">${L(C.excl).map(e=>`<li>${esc(e)}<\/li>`).join(\"\")}<\/ul><\/div>\n       <div class=\"m-sec\"><h3>${t(\"m_log\")}<\/h3><div class=\"tl\"><div class=\"tl-i\"><div class=\"tw\">${fdate(dPlus(-2))}<\/div>${t(\"log_created\")}<\/div><div class=\"tl-i\"><div class=\"tw\">${fdate(dPlus(-2))}<\/div>${t(\"log_notified\")}<\/div>${a.g===\"escalate\"||a.h<0?`<div class=\"tl-i\"><div class=\"tw\">${fdate(dPlus(-1))}<\/div>${t(\"log_escalated\")}<\/div>`:\"\"}<\/div><\/div>\n       ${a.s===\"active\"?`<div class=\"al-act\"><button class=\"btn teal\" data-act=\"doalert\" data-id=\"${a.id}\">${L(C.act)}<\/button>${a.deal?`<button class=\"btn\" data-act=\"deal\" data-id=\"${a.deal}\">${t(\"open_deal\")}<\/button>`:\"\"}<button class=\"btn\" data-act=\"defer\" data-id=\"${a.id}\">${t(\"defer\")}<\/button><\/div>`:(a.deal?`<div><button class=\"btn\" data-act=\"deal\" data-id=\"${a.deal}\">${t(\"open_deal\")}<\/button><\/div>`:\"\")}\n     <\/div>\n   <\/div>`;\n}\nfunction closeAlert(id,silent){\n  const a=ALERTS.find(x=>x.id===id); if(!a||a.s===\"closed\")return;\n  const owner=a.o; a.s=\"closed\"; CLOSEDA.unshift(a);\n  const q=ALERTS.filter(x=>x.s===\"queued\"&&x.o===owner).sort((x,y)=>x.rank-y.rank)[0];\n  if(q&&ALERTS.filter(x=>x.s===\"active\"&&x.o===owner).length<3){q.s=\"active\";delete q.rank}\n  if(!silent)toast(t(\"toast_closed\"));\n}\nfunction doAlert(id){\n  const a=ALERTS.find(x=>x.id===id);\n  if(a.deal){const d=byD(a.deal);\n    if(a.c===\"2.2\")d.warm[1]=true;\n    if([\"2.3\",\"2.10\",\"2.4\"].includes(a.c)){d.nx={k:ACT_BY[d.st][0],d:1};if(a.c===\"2.4\")d.age=0}}\n  closeAlert(id);closeLayer();renderAll();\n}\nfunction deferAlert(id){const a=ALERTS.find(x=>x.id===id);a.s=\"deferred\";a.g=\"waiting\";a.defer=3;closeLayer();renderAll();toast(t(\"toast_deferred\",{d:fdate(dPlus(3))}))}\n\n/* ============ FICHES DES R\u00c8GLES D'ALERTE (source : doc 02 \u00b7 Bornage v1.0) ============ */\nconst RULE_INFO={\n \"2.1\":{lvl:2,st:\"ready\",\n  why:{fr:\"Un lead non contact\u00e9 vite est perdu en silence : la probabilit\u00e9 de joindre le prospect s\u2019effondre dans les premi\u00e8res heures.\",en:\"A lead not contacted quickly is lost silently: the odds of reaching the prospect collapse within the first hours.\"},\n  how:{fr:\"Pour chaque lead attribu\u00e9 au statut Nouveau, le moteur cherche le premier contact logg\u00e9 (appel, tentative d\u2019appel ou message). S\u2019il n\u2019y en a aucun apr\u00e8s 2 h ouvr\u00e9es \u2014 ou 24 h calendaires quoi qu\u2019il arrive \u2014 l\u2019alerte s\u2019ouvre sur ce lead.\",en:\"For each assigned lead in New, the engine looks for the first logged contact (call, call attempt or message). If there is none after 2 business hours \u2014 or 24 calendar hours in any case \u2014 the alert opens on that lead.\"},\n  entry:{fr:\"2 h ouvr\u00e9es sans contact, plancher absolu 24 h calendaires\",en:\"2 business hours without contact, absolute floor of 24 calendar hours\"},\n  exit:{fr:\"Premier contact logg\u00e9\",en:\"First contact logged\"},\n  win:{fr:\"Depuis l\u2019attribution du lead\",en:\"From lead assignment\"}, freq:{fr:\"Continue, toutes les 30 min\",en:\"Continuous, every 30 min\"},\n  esc:[{fr:\"2 h ouvr\u00e9es \u00b7 le sales\",en:\"2 business hours \u00b7 sales rep\"},{fr:\"4 h ouvr\u00e9es \u00b7 Head of Sales\",en:\"4 business hours \u00b7 Head of Sales\"},{fr:\"24 h \u00b7 CRO\",en:\"24 h \u00b7 CRO\"}],\n  key:\"lead.id\",\n  excl:{fr:[\"Un lead disqualifi\u00e9 au setting sort du p\u00e9rim\u00e8tre au moment de la d\u00e9cision, pas au d\u00e9lai.\",\"Une tentative d\u2019appel non aboutie compte comme contact si elle est logg\u00e9e : le geste a eu lieu.\",\"Un lead non attribu\u00e9 rel\u00e8ve de l\u2019allocation, pas de cette r\u00e8gle.\"],en:[\"A lead disqualified at setting leaves scope at the decision, not at the deadline.\",\"An unanswered call attempt counts as contact if it is logged: the action took place.\",\"An unassigned lead belongs to allocation, not to this rule.\"]},\n  close:{fr:\"Automatique, au premier contact logg\u00e9\",en:\"Automatic, on the first logged contact\"}, arb:\"ARB-022 \u00b7 ARB-029 \u00b7 ARB-040\"},\n \"2.2\":{lvl:2,st:\"ready\",\n  why:{fr:\"Un RDV oubli\u00e9 est un no-show \u00e9vitable. Le no-show est imputable au sales : le warming rend ce geste v\u00e9rifiable et explique le show rate.\",en:\"A forgotten call is an avoidable no-show. No-shows are on the sales rep: warming makes that step verifiable and explains the show rate.\"},\n  how:{fr:\"Pour chaque RDV planifi\u00e9, 24 h avant l\u2019heure, le moteur v\u00e9rifie qu\u2019un message de warming J-1 est logg\u00e9 sur la fiche. S\u2019il manque, l\u2019alerte s\u2019ouvre. \u00c0 4 h du RDV, si le warming Jour J manque aussi, elle escalade au Head of Sales.\",en:\"For each booked call, 24 h before it starts, the engine checks that a D-1 warming message is logged on the lead. If it is missing, the alert opens. At 4 h before the call, if the day-of warming is also missing, it escalates to the Head of Sales.\"},\n  entry:{fr:\"S\u00e9quence J-1 absente \u00e0 24 h du RDV, puis Jour J absente \u00e0 4 h\",en:\"D-1 sequence missing 24 h before the call, then day-of sequence missing 4 h before\"},\n  exit:{fr:\"Les deux s\u00e9quences logg\u00e9es avant l\u2019heure du RDV\",en:\"Both sequences logged before the call time\"},\n  win:{fr:\"Les 24 h qui pr\u00e9c\u00e8dent le RDV\",en:\"The 24 h before the call\"}, freq:{fr:\"Continue, toutes les 30 min\",en:\"Continuous, every 30 min\"},\n  esc:[{fr:\"24 h avant \u00b7 le sales\",en:\"24 h before \u00b7 sales rep\"},{fr:\"4 h avant le RDV \u00b7 Head of Sales\",en:\"4 h before the call \u00b7 Head of Sales\"},{fr:\"Apr\u00e8s le RDV \u00b7 CRO\",en:\"After the call \u00b7 CRO\"}],\n  key:\"rdv.id\",\n  excl:{fr:[\"Un message logistique (report, lien de connexion) ne compte pas comme warming.\",\"Un RDV replanifi\u00e9 remet le compteur \u00e0 z\u00e9ro sur la nouvelle date.\",\"Un R2 ou un R3 suit la m\u00eame r\u00e8gle qu\u2019un R1 : le no-show ne d\u00e9pend pas du rang de l\u2019appel.\"],en:[\"A logistics message (rescheduling, meeting link) does not count as warming.\",\"A rescheduled call resets the counter to the new date.\",\"An R2 or R3 follows the same rule as an R1: no-shows do not depend on the call round.\"]},\n  close:{fr:\"Automatique, \u00e0 l\u2019enregistrement des deux s\u00e9quences\",en:\"Automatic, once both sequences are logged\"}, arb:\"ARB-041 \u00b7 ARB-058\"},\n \"2.3\":{lvl:2,st:\"active\",\n  why:{fr:\"Un prospect non conclu est un gisement \u00ab presque gagn\u00e9 \u00bb \u00e0 co\u00fbt d\u2019acquisition nul. Au-del\u00e0 de 24 h, ce gisement se d\u00e9grade fortement.\",en:\"An undecided prospect is an \u201calmost won\u201d deal at zero acquisition cost. After 24 h, that value drops sharply.\"},\n  how:{fr:\"Apr\u00e8s chaque R1 ou R2 honor\u00e9 et non conclu, le moteur cherche une t\u00e2che de relance dat\u00e9e cr\u00e9\u00e9e dans les 24 h suivant la fin d\u2019appel. Si elle n\u2019existe pas, l\u2019alerte s\u2019ouvre sur le deal.\",en:\"After each R1 or R2 held without a decision, the engine looks for a dated follow-up task created within 24 h of the end of the call. If there is none, the alert opens on the deal.\"},\n  entry:{fr:\"24 h apr\u00e8s la fin d\u2019appel sans t\u00e2che de relance dat\u00e9e\",en:\"24 h after the call ends with no dated follow-up task\"},\n  exit:{fr:\"T\u00e2che de relance dat\u00e9e cr\u00e9\u00e9e\",en:\"Dated follow-up task created\"},\n  win:{fr:\"Les 24 h qui suivent la fin d\u2019appel\",en:\"The 24 h after the call ends\"}, freq:{fr:\"Continue, toutes les 6 h\",en:\"Continuous, every 6 h\"},\n  esc:[{fr:\"24 h \u00b7 le sales\",en:\"24 h \u00b7 sales rep\"},{fr:\"48 h \u00b7 Head of Sales\",en:\"48 h \u00b7 Head of Sales\"},{fr:\"96 h \u00b7 CRO\",en:\"96 h \u00b7 CRO\"}],\n  key:\"deal.id\",\n  excl:{fr:[\"Un deal clos\u00e9 ou disqualifi\u00e9 pendant l\u2019appel sort du p\u00e9rim\u00e8tre.\",\"Un message WhatsApp de relance logg\u00e9 vaut t\u00e2che de relance ; un message logistique ne vaut rien.\",\"Une t\u00e2che sans date d\u2019\u00e9ch\u00e9ance ne compte pas : c\u2019est une intention, pas une relance.\"],en:[\"A deal won or disqualified during the call leaves scope.\",\"A logged WhatsApp follow-up message counts as a follow-up task; a logistics message counts for nothing.\",\"A task with no due date does not count: it is an intention, not a follow-up.\"]},\n  close:{fr:\"Automatique, \u00e0 la cr\u00e9ation de la t\u00e2che\",en:\"Automatic, when the task is created\"}, arb:\"ARB-005 \u00b7 ARB-019 \u00b7 ARB-042\"},\n \"2.4\":{lvl:2,st:\"ready\",\n  why:{fr:\"Rendre visible un deal qui stagne avant qu\u2019il ne meure faute d\u2019attention. L\u2019alerte force la d\u00e9cision : avancer ou trancher.\",en:\"Make a stalling deal visible before it dies from lack of attention. The alert forces a decision: move it forward or close it out.\"},\n  how:{fr:\"Pour chaque deal dans une \u00e9tape ouverte, le moteur compare le temps pass\u00e9 dans l\u2019\u00e9tape au 75\u1d49 percentile des dur\u00e9es observ\u00e9es pour cette \u00e9tape. Sous 30 observations, il prend 10 jours comme repli, signal\u00e9 comme tel.\",en:\"For each deal in an open stage, the engine compares time in stage with the 75th percentile of observed durations for that stage. Below 30 observations it falls back to 10 days, flagged as a fallback.\"},\n  entry:{fr:\"Au-del\u00e0 du P75 de l\u2019\u00e9tape, ou 10 jours en repli\",en:\"Beyond the stage\u2019s P75, or 10 days as fallback\"},\n  exit:{fr:\"Changement d\u2019\u00e9tape, ou passage en Perdu avec cause\",en:\"Stage change, or moved to Lost with a reason\"},\n  win:{fr:\"8 semaines glissantes pour calculer le seuil\",en:\"Rolling 8 weeks to compute the threshold\"}, freq:{fr:\"Quotidienne, 06:00\",en:\"Daily, 06:00\"},\n  esc:[{fr:\"24 h \u00b7 le sales\",en:\"24 h \u00b7 sales rep\"},{fr:\"10 j \u00b7 Head of Sales\",en:\"10 d \u00b7 Head of Sales\"},{fr:\"14 j \u00b7 CRO\",en:\"14 d \u00b7 CRO\"}],\n  key:\"deal.id + \u00e9tape\",\n  excl:{fr:[\"Une action dat\u00e9e future pos\u00e9e explicitement avec le prospect suspend le compteur jusqu\u2019\u00e0 cette date.\",\"Un deal en nurturing d\u00e9clar\u00e9 sort du pipeline actif et de la r\u00e8gle.\"],en:[\"A future dated action explicitly agreed with the prospect pauses the counter until that date.\",\"A deal declared as nurturing leaves the active pipeline and the rule.\"]},\n  close:{fr:\"Automatique, au changement d\u2019\u00e9tape ou au passage en Perdu\",en:\"Automatic, on stage change or move to Lost\"}, arb:\"ARB-043\"},\n \"2.8\":{lvl:5,st:\"active\",\n  why:{fr:\"Une perte qui a une cause interne est un d\u00e9faut de process corrigeable. Sans correctif \u00e9crit, la m\u00eame erreur se reproduit sur le deal suivant.\",en:\"A loss with an internal cause is a fixable process defect. Without a written fix, the same mistake happens again on the next deal.\"},\n  how:{fr:\"Pour chaque deal pass\u00e9 en Perdu avec une cause du groupe INTERNE, le moteur v\u00e9rifie qu\u2019un correctif rattach\u00e9 \u00e0 un crit\u00e8re du r\u00e9f\u00e9rentiel est saisi. 48 h apr\u00e8s le passage en Perdu, s\u2019il manque, l\u2019alerte s\u2019ouvre.\",en:\"For each deal moved to Lost with an INTERNAL cause, the engine checks that a fix linked to a criterion of the framework has been entered. 48 h after the move to Lost, if it is missing, the alert opens.\"},\n  entry:{fr:\"48 h apr\u00e8s le passage en Perdu, cause interne, correctif vide\",en:\"48 h after the move to Lost, internal cause, no fix\"},\n  exit:{fr:\"Correctif saisi et rattach\u00e9 \u00e0 un crit\u00e8re nomm\u00e9\",en:\"Fix entered and linked to a named criterion\"},\n  win:{fr:\"Depuis le passage en Perdu\",en:\"From the move to Lost\"}, freq:{fr:\"Quotidienne, 06:00\",en:\"Daily, 06:00\"},\n  esc:[{fr:\"48 h \u00b7 le sales\",en:\"48 h \u00b7 sales rep\"},{fr:\"96 h \u00b7 Head of Sales\",en:\"96 h \u00b7 Head of Sales\"},{fr:\"7 j \u00b7 CRO\",en:\"7 d \u00b7 CRO\"}],\n  key:\"deal.id\",\n  excl:{fr:[\"Une cause EXTERNE (budget, timing, concurrent, hors cible) n\u2019appelle pas de correctif et sort de la r\u00e8gle.\",\"Un correctif g\u00e9n\u00e9rique sans crit\u00e8re rattach\u00e9 ne ferme pas l\u2019alerte : le crit\u00e8re est obligatoire.\",\"Une disqualification n\u2019est pas une perte.\"],en:[\"An EXTERNAL cause (budget, timing, competitor, off target) needs no fix and leaves the rule.\",\"A generic fix with no linked criterion does not close the alert: the criterion is mandatory.\",\"A disqualification is not a loss.\"]},\n  close:{fr:\"Automatique, \u00e0 la saisie d\u2019un correctif rattach\u00e9 \u00e0 un crit\u00e8re\",en:\"Automatic, when a fix linked to a criterion is entered\"}, arb:\"ARB-005 \u00b7 ARB-037\"},\n \"2.10\":{lvl:2,st:\"delivery\",\n  why:{fr:\"Filet de s\u00e9curit\u00e9 du pipeline : aucun lead vivant ne doit rester sans prochaine \u00e9tape dat\u00e9e. Elle couvre ce que les alertes plus pr\u00e9cises (2.3, 2.4) ne voient pas.\",en:\"Safety net for the pipeline: no live lead should sit without a dated next step. It covers what the more specific alerts (2.3, 2.4) do not see.\"},\n  how:{fr:\"Pour chaque lead vivant (Nouveau, RDV planifi\u00e9, RDV r\u00e9alis\u00e9), le moteur v\u00e9rifie qu\u2019une prochaine action dat\u00e9e existe. Si aucune n\u2019existe et que le cas n\u2019est pas d\u00e9j\u00e0 couvert par 2.3 ou 2.4, l\u2019alerte s\u2019ouvre.\",en:\"For each live lead (New, Call booked, Call held), the engine checks that a dated next action exists. If there is none and the case is not already covered by 2.3 or 2.4, the alert opens.\"},\n  entry:{fr:\"Aucune prochaine action dat\u00e9e sur un lead vivant\",en:\"No dated next action on a live lead\"},\n  exit:{fr:\"Prochaine action dat\u00e9e pos\u00e9e, ou avancement d\u2019\u00e9tape\",en:\"Dated next action set, or stage progress\"},\n  win:{fr:\"Depuis la mise en service \u2014 jamais le stock ant\u00e9rieur\",en:\"From go-live \u2014 never the prior backlog\"}, freq:{fr:\"Quotidienne, 06:00\",en:\"Daily, 06:00\"},\n  esc:[{fr:\"24 h \u00b7 le sales\",en:\"24 h \u00b7 sales rep\"},{fr:\"48 h \u00b7 Head of Sales\",en:\"48 h \u00b7 Head of Sales\"},{fr:\"96 h \u00b7 CRO\",en:\"96 h \u00b7 CRO\"}],\n  key:\"deal.id\",\n  excl:{fr:[\"Un lead clos\u00e9, perdu, disqualifi\u00e9 ou archiv\u00e9 sort du p\u00e9rim\u00e8tre.\",\"Une note libre sans date ne vaut pas action.\",\"Une date pos\u00e9e par le sales sans accord du prospect compte pour le CRM, mais est marqu\u00e9e \u00ab non confirm\u00e9e \u00bb pour le coaching.\"],en:[\"A won, lost, disqualified or archived lead leaves scope.\",\"A free-text note with no date is not an action.\",\"A date set by the sales rep without the prospect\u2019s agreement counts for the CRM but is flagged \u201cunconfirmed\u201d for coaching.\"]},\n  close:{fr:\"Automatique, \u00e0 l\u2019enregistrement d\u2019une action dat\u00e9e\",en:\"Automatic, when a dated action is recorded\"}, arb:\"ARB-019\"},\n \"1.4\":{lvl:1,st:\"delivery\",\n  why:{fr:\"Le cash sain est le juge de paix. Un taux de remboursement qui monte ronge le cash encaiss\u00e9 et signale souvent une survente.\",en:\"Healthy cash is the final judge. A rising refund rate eats into collected cash and often points to overselling.\"},\n  how:{fr:\"Chaque mois, pour chaque mois de VENTE, le moteur calcule ventes rembours\u00e9es \u00f7 ventes et le compare au taux de remboursement de la baseline.\",en:\"Each month, for each month of SALE, the engine computes refunded sales \u00f7 sales and compares it with the baseline refund rate.\"},\n  entry:{fr:\"Taux au-dessus de la baseline\",en:\"Rate above baseline\"},\n  exit:{fr:\"Sous le seuil deux mois de vente de suite\",en:\"Below threshold for two consecutive sale months\"},\n  win:{fr:\"Par mois de vente, observ\u00e9 sur 90 jours\",en:\"Per month of sale, observed over 90 days\"}, freq:{fr:\"Mensuelle, le 1er \u00e0 06:00\",en:\"Monthly, on the 1st at 06:00\"},\n  esc:[{fr:\"30 j \u00b7 CRO\",en:\"30 d \u00b7 CRO\"},{fr:\"+14 j \u00b7 CEO\",en:\"+14 d \u00b7 CEO\"},{fr:\"+30 j \u00b7 CEO\",en:\"+30 d \u00b7 CEO\"}],\n  key:\"mois_vente\",\n  excl:{fr:[\"Un remboursement est toujours rattach\u00e9 au mois de la VENTE, jamais au mois de l\u2019encaissement.\",\"Une annulation avant tout encaissement est une perte, pas un remboursement.\"],en:[\"A refund always belongs to the month of SALE, never the month of payment.\",\"A cancellation before any payment is a loss, not a refund.\"]},\n  close:{fr:\"Automatique, sur deux mois de vente sous le seuil\",en:\"Automatic, after two sale months below threshold\"}, arb:\"ARB-053\"},\n \"1.5\":{lvl:1,st:\"delivery\",\n  why:{fr:\"Signer ne suffit pas : l\u2019\u00e9cart qui se creuse entre CA sign\u00e9 et cash encaiss\u00e9 annonce un probl\u00e8me d\u2019encaissement avant qu\u2019il ne co\u00fbte.\",en:\"Signing is not enough: a widening gap between signed revenue and collected cash flags a collection problem before it costs money.\"},\n  how:{fr:\"Chaque semaine, le moteur calcule cash encaiss\u00e9 \u00f7 CA sign\u00e9. Si ce ratio baisse trois semaines de suite et perd au moins 5 points au total, l\u2019alerte s\u2019ouvre. Elle s\u2019appuie sur le factur\u00e9 et l\u2019encaiss\u00e9 saisis sur les leads clos\u00e9s.\",en:\"Each week, the engine computes collected cash \u00f7 signed revenue. If that ratio falls three weeks in a row and loses at least 5 points in total, the alert opens. It relies on the invoiced and collected amounts entered on won leads.\"},\n  entry:{fr:\"3 semaines de baisse ET \u22125 points cumul\u00e9s\",en:\"3 weeks of decline AND \u22125 points in total\"},\n  exit:{fr:\"Ratio stable ou en hausse sur 3 semaines\",en:\"Ratio stable or rising over 3 weeks\"},\n  win:{fr:\"8 semaines glissantes, lecture hebdomadaire\",en:\"Rolling 8 weeks, read weekly\"}, freq:{fr:\"Hebdomadaire, lundi 06:00\",en:\"Weekly, Monday 06:00\"},\n  esc:[{fr:\"7 j \u00b7 CRO\",en:\"7 d \u00b7 CRO\"},{fr:\"14 j \u00b7 CEO\",en:\"14 d \u00b7 CEO\"},{fr:\"21 j \u00b7 CEO\",en:\"21 d \u00b7 CEO\"}],\n  key:\"client\",\n  excl:{fr:[\"Les deals de moins de 15 jours sont exclus : un pic de signatures en fin de p\u00e9riode n\u2019est pas encore encaiss\u00e9, m\u00e9caniquement.\",\"Un remboursement n\u2019entre pas dans le ratio \u2014 il rel\u00e8ve de l\u2019alerte 1.4.\",\"Un lead dont le montant factur\u00e9 vaut z\u00e9ro sort du calcul : z\u00e9ro veut dire non renseign\u00e9.\"],en:[\"Deals under 15 days old are excluded: a burst of signings at period end is not collected yet, by construction.\",\"Refunds are not in the ratio \u2014 they belong to alert 1.4.\",\"A lead with a billed amount of zero is left out: zero means not filled in.\"]},\n  close:{fr:\"Automatique, quand le ratio se stabilise\",en:\"Automatic, once the ratio stabilises\"}, arb:\"ARB-046\"},\n \"3.3\":{lvl:3,st:\"calib\",\n  why:{fr:\"Une objection non isol\u00e9e est trait\u00e9e \u00e0 l\u2019aveugle : le sales r\u00e9pond \u00e0 la mauvaise objection. L\u2019isolement est le geste qui s\u00e9pare un traitement AIC r\u00e9ussi d\u2019un d\u00e9bat perdu.\",en:\"An objection that is not isolated is handled blind: the sales rep answers the wrong objection. Isolating it is what separates a successful AIC response from a lost argument.\"},\n  how:{fr:\"Pour chaque sales, sur 8 semaines, le moteur calcule objections isol\u00e9es \u00f7 objections \u00e9mises. Au-del\u00e0 de 10 objections, si le taux passe sous le seuil plancher, l\u2019alerte s\u2019ouvre.\",en:\"For each sales rep, over 8 weeks, the engine computes isolated objections \u00f7 objections raised. Past 10 objections, if the rate drops below the floor, the alert opens.\"},\n  entry:{fr:\"\u00c0 calibrer \u2014 protocole sur 60 appels\",en:\"To be calibrated \u2014 60-call protocol\"},\n  exit:{fr:\"Taux au seuil sur les 10 objections suivantes\",en:\"Rate at threshold over the next 10 objections\"},\n  win:{fr:\"8 semaines glissantes\",en:\"Rolling 8 weeks\"}, freq:{fr:\"\u00c0 calibrer\",en:\"To be calibrated\"},\n  esc:[{fr:\"7 j \u00b7 Head of Sales et coach\",en:\"7 d \u00b7 Head of Sales and coach\"},{fr:\"14 j \u00b7 CRO\",en:\"14 d \u00b7 CRO\"},{fr:\"21 j \u00b7 CRO\",en:\"21 d \u00b7 CRO\"}],\n  key:\"sales_id\",\n  excl:{fr:[\"L\u2019unit\u00e9 de mesure est l\u2019objection, jamais l\u2019appel.\",\"Une objection soulev\u00e9e puis retir\u00e9e par le prospect avant r\u00e9ponse ne compte pas.\",\"La d\u00e9finition des trois composants AIC rel\u00e8ve du manuel, pas de cette r\u00e8gle.\"],en:[\"The unit of measure is the objection, never the call.\",\"An objection raised and withdrawn by the prospect before any answer does not count.\",\"The definition of the three AIC parts belongs to the manual, not to this rule.\"]},\n  close:{fr:\"Automatique, sur les 10 objections suivantes au seuil\",en:\"Automatic, over the next 10 objections at threshold\"}, arb:\"ARB-059 \u00b7 ARB-065 \u00b7 ARB-066\"}\n};\nfunction openRuleInfo(c){const R=RULE_INFO[c],rule=RULES.find(r=>r.c===c);if(!R)return;\n  const st={active:[\"c-green\",\"ri_st_active\"],ready:[\"c-teal\",\"ri_st_ready\"],delivery:[\"c-gold\",\"ri_st_delivery\"],calib:[\"c-amber\",\"ri_st_calib\"]}[R.st];\n  const row=(k,v)=>`<dt>${t(k)}<\/dt><dd>${v}<\/dd>`;\n  document.getElementById(\"layer\").innerHTML=`<div class=\"scrim\" data-act=\"close\"><\/div>\n  <div class=\"modal ri-modal\" role=\"dialog\" aria-modal=\"true\" aria-labelledby=\"riT\">\n    <div class=\"m-h\"><div><div class=\"eyebrow\">${t(\"ri_level\",{n:R.lvl})} \u00b7 ${t(\"ri_lvl_\"+R.lvl)}<\/div><h2 id=\"riT\"><span class=\"code\" style=\"margin-right:8px;vertical-align:middle\">${c}<\/span>${L(rule.n)}<\/h2>\n      <div class=\"ri-tags\"><span class=\"chip ${st[0]}\">${t(st[1])}<\/span><span class=\"chip ${rule.on?\"c-green\":\"c-mut\"}\">${t(rule.on?\"ri_on\":\"ri_off\")}<\/span><\/div><\/div>\n      <button class=\"x\" data-act=\"close\" aria-label=\"${t(\"cx_close\")}\">\u00d7<\/button><\/div>\n    <div class=\"m-b\">\n      <div class=\"m-sec\"><h3>${t(\"ri_why\")}<\/h3><p class=\"ri-p\">${L(R.why)}<\/p><\/div>\n      <div class=\"m-sec\"><h3>${t(\"ri_how\")}<\/h3><p class=\"ri-p\">${L(R.how)}<\/p><\/div>\n      <div class=\"m-sec\"><h3>${t(\"ri_bounds\")}<\/h3><dl class=\"ri-kv\">${row(\"ri_entry\",`<b>${L(R.entry)         S.day.done.push({ id: i.id, kind: i.kind, name: i.name, how: how, at: new Date().toISOString(), who: i.c.owner_id || null });
        saveDay();
      }
      function act(kind) {
        var i = current(); if (!i || S.busy) return;
        var F = S.form;
        if (kind === "skip") { S.skipped = S.skipped.filter(function (x) { return x !== i.id; }).concat([i.id]); return finish("aside", function () {}); }
        if (kind === "snooze") { S.day.snoozed.push(i.id); saveDay(); return finish("aside", function () {}); }
        if (kind === "done") {
          var note = (F.note || "").trim();
          S.busy = true; F.err = ""; render();
          Promise.resolve(S.live ? C.addNote(i.c.id, "Ma journée · " + KIND[i.kind].act + (note ? " : " + note : "")) : { demo: true }).then(function (r) {
            S.busy = false;
            if (r && r.error) { F.err = r.error.message || "Non enregistré"; return render(); }
            finish("out", function () { markDone(i, "done"); });
          }, function (e) { S.busy = false; F.err = String((e && e.message) || e); render(); });
          return;
        }
        if (kind === "declare") {
          var p = { attendance: F.att };
          if (F.att === "held") {
            p.decision = F.dec;
            if (F.dec === "no" || F.dec === "disqualified") p.reason_code = F.reason;
            if (F.dec === "follow_up" && (F.next || "").trim()) p.next_step = F.next.trim();
            // a French amount ("1 500,50") is read as 1500.50
            var amt = Number(String(F.amount || "").replace(/[\s\u00a0\u202f]/g, "").replace(",", "."));
            if (F.dec === "yes" && F.amount && !isNaN(amt)) p.amount_sold = amt;
          }
          S.busy = true; F.err = ""; render();
          Promise.resolve(S.live ? C.declareOutcome(i.call.id, p) : { demo: true }).then(function (r) {
            S.busy = false;
            if (r && r.error) { F.err = r.error.message || "Non enregistré"; return render(); }
            var how = F.att === "no_show" ? "no-show" : { yes: "yes", follow_up: "follow-up", no: "no", disqualified: "disqualified" }[F.dec];
            finish("out", function () {
              markDone(i, how);
              // the cycle's next move changes on the server: drop its outcome from the board until the next refresh
              i.c.next_move = F.att === "no_show" ? { code: "follow_up" } : F.dec === "follow_up" ? { code: "follow_up" } : { code: "done" };
              i.c.events = (i.c.events || []).concat([{ type: "outcome_" + (F.att === "no_show" ? "no_show" : F.dec), source: "crm", call_id: i.call.id, occurred_at: new Date().toISOString() }]);
              if (F.att === "no_show") i.call.status = "no_show"; else i.call.status = "held";

              if (F.dec === "no" || F.dec === "disqualified") i.c.status = F.dec === "no" ? "lost" : "disqualified";
            });
            say("Issue déclarée pour " + i.name);
          }, function (e) { S.busy = false; F.err = String((e && e.message) || e); render(); });
        }
      }
      box.addEventListener("click", function (e) {
        var b = e.target.closest("button"); if (!b) return;
        if (b.dataset.go) return goScreen(b.dataset.go);
        if (b.dataset.front) { S.front = b.dataset.front; S.form = {}; return render(); }
        if (b.dataset.unsnooze) { S.day.snoozed = S.day.snoozed.filter(function (x) { return x !== b.dataset.unsnooze; }); saveDay(); return render(); }
        if (b.dataset.att) { S.form.att = b.dataset.att; if (b.dataset.att === "no_show") S.form.dec = null; S.form.err = ""; return render(); }
        if (b.dataset.dec) { S.form.dec = b.dataset.dec; S.form.reason = ""; S.form.err = ""; return render(); }
        if (b.dataset.do === "reload") return load();
        if (b.dataset.do) return act(b.dataset.do);
      });
      box.addEventListener("input", function (e) {
        var id = e.target.id;
        if (id === "sdnote") S.form.note = e.target.value;
        if (id === "sdnext") S.form.next = e.target.value;

      });
      box.addEventListener("change", function (e) {

        if (e.target.hasAttribute("data-who")) { S.who = e.target.value; S.front = null; S.form = {}; render(); }
      });
      // drag the card to the right (Done) or to the left (Skip); outcomes are declared with their buttons
      function swipe() {

        var i = current(), x0 = null, dx = 0;
        el.addEventListener("pointerdown", function (e) { if (e.target.closest("button,input,select,textarea")) return; x0 = e.clientX; dx = 0; el.classList.add("drag"); el.setPointerCapture(e.pointerId); });

        var up = function () {
          if (x0 == null) return; x0 = null; el.classList.remove("drag"); el.style.transform = "";
          if (dx > 120 && i && i.kind !== "outcome") act("done");
          else if (dx < -120) act("skip");
        };
        el.addEventListener("pointerup", up); el.addEventListener("pointercancel", up);
      }
      load();
      return { render: render };
    }
  };
})();

  el("per").querySelectorAll("button").forEach(b=>b.onclick=()=>{S.period=+b.dataset.p;render()});
}

/* ---- the 6 parity criteria, computed once ---- */
function criteria(K,f){
  const d=[
    {k:"sales",l:"Ventes gagnées",v:K.sales[0]*f,b:K.sales[1]*f,fmt:nf},
    {k:"cash",l:"Montant encaissé",v:K.cash[0]*f,b:K.cash[1]*f,fmt:moneyK},
    {k:"show",l:"Taux de présence",v:K.show[0],b:K.show[1],fmt:x=>pc(x)},
    {k:"cpc",l:"Chiffre d’affaires par appel",v:K.cpc[0],b:K.cpc[1],fmt:money},
    {k:"aov",l:"Panier moyen",v:K.aov[0],b:K.aov[1],fmt:money},
    {k:"refund",l:"Taux de remboursement",v:K.refund[0],b:K.refund[1],fmt:x=>pc(x,1),inv:true}
  ];
  d.forEach(x=>{x.nd=!isFinite(x.v)||!isFinite(x.b)||(!x.b&&!x.v);x.ratio=x.nd?NaN:x.inv?(x.v?x.b/x.v*100:100):(x.b?x.v/x.b*100:100);x.tone=x.nd?"a":tone(x.ratio)});
  return Object.fromEntries(d.map(x=>[x.k,x]));
}

/* ---- header: parity verdict + LNP key result ---- */
function header(C){
  const below=Object.values(C).filter(x=>x.ratio<100), nd=Object.values(C).filter(x=>x.nd);
  const fail=below.length>0;
  el("verdict").innerHTML=`<span class="vbadge ${fail?"fail":nd.length?"":"pass"}"${!fail&&nd.length?' style="background:#E3ECFB;color:#5A6478"':""}>${fail?"ÉCHEC":nd.length?"EN ATTENTE":"VALIDÉ"}<\/span><span class="vt"><b>Contrôle de parité<\/b><br>${fail?below.length+" sur 6 sous la référence":nd.length?(6-nd.length)+" sur 6 à la référence · "+nd.length+(nd.length>1?" non mesurés":" non mesuré"):"6 sur 6 à la référence"}<\/span>`;
  el("verdict").setAttribute("data-tip","Contrôle de parité : les 6 critères face à leur référence. "+(fail?"Sous la référence : "+below.map(x=>x.l.toLowerCase()).join(", ")+". ":"")+(nd.length?"Pas encore mesuré : "+nd.map(x=>x.l.toLowerCase()).join(", ")+" (pas encore de données dans le CRM). ":"")+"Ventes gagnées, taux de présence et montant encaissé sont marqués dans le flux, les trois autres dans la rentabilité unitaire.");

}

/* ---- 1. From lead to cash: one flow that carries volumes, conversion rates, deals won and cash ---- */
function flow(K,f,C){
  const box=el("flow"), W=box.clientWidth, H=box.clientHeight;
  if(W<200||H<120)return;
  const fn=K.funnel.map(x=>x*f), cash=K.cash[0]*f, signed=cash/(K.upfront/100);
  const st=[
    {l:"Prospects",v:fn[0],fmt:nf(fn[0])},
    {l:"RDV pris",v:fn[1],fmt:nf(fn[1])},
    {l:"Appels honorés",v:fn[2],fmt:nf(fn[2])},
    {l:"Ventes gagnées",v:fn[3],fmt:nf(fn[3]),crit:C.sales},
    {l:"Encaissé",v:fn[3],fmt:moneyK(cash),crit:C.cash,cash:true}
  ];
  const rates=[
    {v:fn[1]/fn[0]*100,l:"prise RDV",t:"Prise de RDV"},
    {v:LIVE?K.show[0]:fn[2]/fn[1]*100,l:"présence",t:"Taux de présence",crit:C.show},
    {v:LIVE?K.close:fn[3]/fn[2]*100,l:"conversion",t:"Taux de conversion"},
    {v:K.upfront,l:"comptant",up:true}
  ];
  const top=34, bot=78, hMax=H-top-bot, colW=Math.min(92,(W-40)/9), pad=22, gap=(W-2*pad-colW*5)/4;
  const hOf=v=>Math.max(10,hMax*Math.sqrt(Math.min(1,v/(Math.max(...fn)||1))));
  const mid=top+hMax/2;
  let s=`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Du prospect à l’encaissement">`;
  s+=`<defs><linearGradient id="rib" x1="0" x2="1"><stop offset="0" stop-color="#E3ECFB"/><stop offset="1" stop-color="#F7F8FB"/><\/linearGradient><\/defs>`;
  // ribbons
  st.forEach((x,i)=>{if(i===4)return;const h1=hOf(x.v),h2=hOf(st[i+1].v),x1=pad+i*(colW+gap)+colW,x2=pad+(i+1)*(colW+gap);
    s+=`<path d="M${x1},${mid-h1/2} C${x1+gap/2},${mid-h1/2} ${x2-gap/2},${mid-h2/2} ${x2},${mid-h2/2} L${x2},${mid+h2/2} C${x2-gap/2},${mid+h2/2} ${x1+gap/2},${mid+h1/2} ${x1},${mid+h1/2}Z" fill="url(#rib)"/>`;
    const r=rates[i], rc=r.crit?COL[r.crit.tone]:"var(--ink)";
    const cx=(x1+x2)/2;
    const lbl=r.crit?`${pc(r.v)}`:pc(r.v);
    const tipTxt=r.crit?`${r.t} : ${pc(r.v)} · référence ${pc(r.crit.b)} (${pc(r.crit.ratio)} de la référence)`:r.up?`Part du chiffre d’affaires signé payée à la signature : ${pc(r.v)}. Le reste, ce sont des échéances encore à encaisser.`:`${r.t} : ${pc(r.v)}`;
    s+=`<g data-tip="${tipTxt}"><rect x="${cx-38}" y="${mid-19}" width="76" height="38" rx="9" fill="#fff" stroke="${r.crit?rc:"#E3ECFB"}" stroke-width="${r.crit&&r.crit.tone!=="g"?1.5:1}"/>
      <text x="${cx}" y="${mid+1}" text-anchor="middle" font-family="IBM Plex Mono" font-size="15" font-weight="600" fill="${rc}">${lbl}<\/text>
      <text x="${cx}" y="${mid+13}" text-anchor="middle" font-size="10" fill="#5A6478">${r.l}<\/text><\/g>`;
  });
  // columns
  st.forEach((x,i)=>{
    const h=hOf(x.v), x0=pad+i*(colW+gap), y0=mid-h/2, c=x.crit?COL[x.crit.tone]:null;
    if(x.cash){
      const hc=h*((isFinite(K.upfront)?K.upfront:0)/100);
      s+=`<g data-tip="Chiffre d’affaires signé ${moneyK(signed)} · encaissé ${moneyK(cash)} (${pc(K.upfront)} à la signature) · référence ${moneyK(x.crit.b)}"><rect x="${x0}" y="${y0}" width="${colW}" height="${h}" rx="6" fill="#EBF0FC" stroke="#5B8DF7" stroke-dasharray="3 3"/>
        <rect x="${x0}" y="${y0+h-hc}" width="${colW}" height="${hc}" rx="6" fill="#5B8DF7"/><\/g>`;
    } else s+=`<rect x="${x0}" y="${y0}" width="${colW}" height="${h}" rx="6" fill="${i===3?"#1E2A5E":"#222C4E"}" opacity="${i===3?1:.9-i*.12}"/>`;
    // labels
    s+=`<text x="${x0+colW/2}" y="${top-16}" text-anchor="middle" font-size="11" font-weight="600" letter-spacing=".06em" fill="#5A6478">${x.l.toUpperCase()}<\/text>`;
    const vy=H-bot+26;
    s+=`<text x="${x0+colW/2}" y="${vy}" text-anchor="middle" font-family="Poppins" font-size="${x.cash?24:22}" fill="#1E2A5E">${x.fmt}<\/text>`;
    if(x.crit){
      s+=`<g data-tip="${x.crit.l} : ${x.crit.fmt(x.crit.v)} · référence ${x.crit.fmt(x.crit.b)}"><rect x="${x0+colW/2-56}" y="${vy+10}" width="112" height="20" rx="10" fill="${x.crit.tone==="g"?"#E6F2EA":x.crit.tone==="a"?"#FDF1E3":"#FDECEA"}"/>
      <text x="${x0+colW/2}" y="${vy+24}" text-anchor="middle" font-family="IBM Plex Mono" font-size="11" font-weight="600" fill="${x.crit.tone==="g"?"#1E5E38":x.crit.tone==="a"?"#8A3F06":"#9B1C12"}">${x.crit.nd?"non mesuré":pc(x.crit.ratio)+" de la réf."}<\/text><\/g>`;
    } else if(x.cash===undefined && i<3){
      s+=`<text x="${x0+colW/2}" y="${vy+22}" text-anchor="middle" font-size="11" fill="#747D9A">${i===0?"entrés":i===1?"à l’agenda":(LIVE&&K.noOutcome?"réalisés · "+nf(K.noOutcome)+" sans issue":"réalisés")}<\/text>`;
    }
  });
  s+=`<\/svg>`;
  box.innerHTML=s; bindTips(box);
  el("flowq").textContent=`${PL[S.period]} · réf. = les ${PL[S.period]} d’avant · ${LIVE?"CRM en direct":"exemple"}`;
}

/* ---- 2. Unit economics: the 3 remaining parity criteria, each as a full-size 8-week area chart against its baseline ---- */
function smooth(pts){let d="M"+pts[0][0]+","+pts[0][1];for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
  d+=` C${(p1[0]+(p2[0]-p0[0])/6).toFixed(1)},${(p1[1]+(p2[1]-p0[1])/6).toFixed(1)} ${(p2[0]-(p3[0]-p1[0])/6).toFixed(1)},${(p2[1]-(p3[1]-p1[1])/6).toFixed(1)} ${p2[0].toFixed(1)},${p2[1].toFixed(1)}`}return d}
function unit(C){
  const L=[C.cpc,C.aov,C.refund];
  el("ue").innerHTML=L.map((x,i)=>{const dv=(x.ratio-100), sg=dv>=0?"+":"−";
    return `<div class="uer"><div class="uel"><span class="n">${x.l}<\/span><span class="v">${x.fmt(x.v)}<\/span>
      <span class="d ${x.tone}" data-tip="${x.inv?"Plus c’est bas, mieux c’est. ":""}${pc(x.ratio)} de la référence">${x.nd?"non mesuré":sg+pc(Math.abs(dv))+" vs réf."}<\/span><small>réf. ${x.fmt(x.b)}${x.inv?" · plus bas = mieux":""}<\/small><\/div>
      <div class="uec" id="uec${i}"><\/div><\/div>`}).join("");
  L.forEach((x,i)=>{
    const box=el("uec"+i), W=box.clientWidth, H=box.clientHeight; if(W<80||H<40) return;
    if(x.nd){box.innerHTML=`<p style="margin:14px 0 0;font-size:12px;color:var(--mut)">Pas encore mesuré : ${i===1?"aucune vente avec un montant":"aucun paiement"} dans le CRM.<\/p>`;return}
    const ser=LIVE?liveWeekly(["cpc","aov","refund"][i]):series(x.v,x.b,i+2), mn=Math.min(...ser,x.b), mx=Math.max(...ser,x.b), pad=(mx-mn)*.25||1;
    const lo=mn-pad, hi=mx+pad, T=8, B=16, R=54;
    const X=j=>j/7*(W-R), Y=v=>T+(1-(v-lo)/(hi-lo))*(H-T-B);
    const pts=ser.map((v,j)=>[X(j),Y(v)]), line=smooth(pts), last=pts[7], yb=Y(x.b);
    // worse than baseline = red: under it, or over it when lower is better
    const G="var(--green)", Rd="var(--red)", cUp=x.inv?Rd:G, cDn=x.inv?G:Rd, cEnd=(x.inv?x.v>x.b:x.v<x.b)?Rd:G;
    let s=`<svg width="${W}" height="${H}" role="img" aria-label="${x.l}, 8 dernières semaines"><defs>
      <clipPath id="uu${i}"><rect x="-10" y="-10" width="${W+20}" height="${yb+10}"/><\/clipPath>
      <clipPath id="ud${i}"><rect x="-10" y="${yb}" width="${W+20}" height="${H}"/><\/clipPath>
      <linearGradient id="gu${i}" gradientUnits="userSpaceOnUse" x1="0" y1="${T}" x2="0" y2="${yb}"><stop offset="0" style="stop-color:${cUp};stop-opacity:.05"/><stop offset="1" style="stop-color:${cUp};stop-opacity:.3"/><\/linearGradient>
      <linearGradient id="gd${i}" gradientUnits="userSpaceOnUse" x1="0" y1="${yb}" x2="0" y2="${H-B}"><stop offset="0" style="stop-color:${cDn};stop-opacity:.3"/><stop offset="1" style="stop-color:${cDn};stop-opacity:.05"/><\/linearGradient><\/defs>`;
    const band=`${line} L${last[0]},${yb} L0,${yb} Z`;
    s+=`<path d="${band}" fill="url(#gu${i})" clip-path="url(#uu${i})"/><path d="${band}" fill="url(#gd${i})" clip-path="url(#ud${i})"/>`;
    s+=`<line x1="0" x2="${W-R}" y1="${yb}" y2="${yb}" stroke="var(--mut2)" stroke-dasharray="4 4"/><text x="${W-R+6}" y="${yb+4}" font-size="10" fill="var(--mut2)">réf.<\/text>`;
    s+=`<path d="${line}" fill="none" stroke="${cUp}" stroke-width="2.5" stroke-linecap="round" clip-path="url(#uu${i})"/><path d="${line}" fill="none" stroke="${cDn}" stroke-width="2.5" stroke-linecap="round" clip-path="url(#ud${i})"/>`;
    s+=`<circle cx="${last[0]}" cy="${last[1]}" r="9" fill="${cEnd}" opacity=".15"/><circle cx="${last[0]}" cy="${last[1]}" r="4.5" fill="#fff" stroke="${cEnd}" stroke-width="2.5"/>`;
    s+=`<text x="0" y="${H-3}" font-size="10" fill="var(--mut2)">il y a 8 sem.<\/text><text x="${W-R}" y="${H-3}" font-size="10" text-anchor="end" fill="var(--mut2)">maintenant<\/text>`;
    ser.forEach((v,j)=>s+=`<rect x="${X(j)-(W-R)/14}" y="0" width="${(W-R)/7}" height="${H}" fill="transparent" data-tip="${j===7?"Cette semaine":"Il y a "+(7-j)+" sem."} : ${x.fmt(v)}"/>`);
    box.innerHTML=s+`<\/svg>`;
  });
  bindTips(el("ue"));
}

/* ---- 3. Team: cash as the bar, close and show rates as the two quality checks ---- */
function team(f){
  const t=SALES.slice().sort((a,b)=>b.cash-a.cash);
  const mx=Math.max(1,...t.map(s=>s.cash));
  if(!t.length){el("team").innerHTML=`<p style="color:var(--mut);font-size:13px;margin:8px 0">Aucune activité commerciale sur cette période.<\/p>`;return}
  el("team").innerHTML=`<div class="th"><span>Commercial<\/span><span data-tip="Montant encaissé · ventes gagnées / appels">Encaissé<\/span><span data-tip="Taux de conversion">Conversion<\/span><span data-tip="Taux de présence">Présence<\/span><\/div>`+
   t.map(s=>{const w=s.cash/mx*100, cl=s.close>=32?"g":s.close>=28?"a":"r", sh=s.show>=72?"g":s.show>=65?"a":"r";
    return `<button class="tr" data-id="${s.id}" data-tip="${s.name} : ${money(s.cash*f)} encaissés, ${nf(s.won*f)} vente${pl(s.won*f)} gagnée${pl(s.won*f)} sur ${nf(s.calls*f)} appel${pl(s.calls*f)}">
      <span class="who"><i style="background:${s.color}">${s.ini}<\/i><div><b>${s.name}<\/b><small>${money(s.cpc)} par appel<\/small><\/div><\/span>
      <span class="cbar"><i style="width:calc((100% - 62px) * ${w/100})"><\/i><span style="left:calc((100% - 62px) * ${w/100} + 6px)">${moneyK(s.cash*f)}<\/span><small>${nf(s.won*f)} gagnée${pl(s.won*f)} / ${nf(s.calls*f)} appel${pl(s.calls*f)}<\/small><\/span>
      <span class="pct ${cl} p${cl}">${pc(s.close)}<\/span><span class="pct ${sh} p${sh}">${pc(s.show)}<\/span>
    <\/button>`}).join("");
  el("team").querySelectorAll(".tr").forEach(b=>b.onclick=()=>window.postMessage({skl:"crm",owner:b.dataset.id},"*"));
  bindTips(el("team"));
}

/* ---- 4. What's coming: weighted pipeline turned into a cash forecast, plus the two speed checks ---- */
function pipe(K){
  const fc=K.pond*K.upfront/100, w=K.pond?fc/K.pond*100:0;
  el("pipe").innerHTML=`
    <div data-tip="Pipeline pondéré : chaque vente en cours × la probabilité de gain observée à son étape. Prévision = pipeline pondéré × part observée payée à la signature.">
      <div class="ey" style="margin-bottom:4px">Prévision d’encaissement à 30 jours<\/div>
      <div style="display:flex;align-items:baseline;gap:8px"><span class="big">${moneyK(fc)}<\/span><span class="num" style="font-size:12px;color:var(--mut)">sur ${moneyK(K.pond)} pondérés<\/span><\/div>
      <div style="position:relative;height:16px;border-radius:5px;background:#EBF0FC;border:1px dashed #5B8DF7;margin-top:8px"><i style="position:absolute;left:0;top:0;bottom:0;width:${w}%;border-radius:4px;background:var(--gold)"><\/i><\/div>
      <div style="display:flex;justify-content:space-between;font-size:10.5px;color:var(--mut);margin-top:4px"><span>encaissement attendu<\/span><span>reste en pipeline pondéré<\/span><\/div>
    <\/div>
    <div class="mini">
      <div data-tip="Ventes en cours relancées sous 24 h. Objectif 75 %."><span class="k">Relance sous 24 h<\/span><span class="val ${K.follow<75?"a":"g"}">${pc(K.follow)}<\/span><div class="gbar"><i style="width:${K.follow}%;background:${K.follow<75?"var(--amber)":"var(--green)"}"><\/i><u style="left:75%"><\/u><\/div><span class="s">objectif 75 %<\/span><\/div>
      <div data-tip="Nombre médian de jours qu’une vente passe à chaque étape. Alerte au-delà de 8 jours."><span class="k">Jours par étape<\/span><span class="val ${K.velo>8?"a":"g"}">${isFinite(K.velo)?String(K.velo).replace(".",",")+" j":"—"}<\/span><div class="gbar"><i style="width:${Math.min(100,K.velo/14*100)}%;background:${K.velo>8?"var(--amber)":"var(--green)"}"><\/i><u style="left:${8/14*100}%"><\/u><\/div><span class="s">alerte au-delà de 8 j<\/span><\/div>
    <\/div>
    ${krBox()}`;
  bindTips(el("pipe"));
  const kb=el("pipe").querySelector("[data-kr]"); if(kb) kb.onclick=()=>window.SKL&&SKL.openKr(kb.dataset.kr);
}

function krBox(){
  const SK=window.SKL; if(!SK) return "";
  const k=SK.list("krs").find(x=>x.owner==="sales"); if(!k) return "";
  const v=SK.krView(k), fm=x=>SK.fmtVal(x,k.unit), span=(Number(k.target)-Number(k.baseline))||1;
  const w=Math.max(0,Math.min(100,(Number(k.current)-Number(k.baseline))/span*100)), e=Math.max(0,Math.min(100,(Number(k.expected)-Number(k.baseline))/span*100));
  return `<div class="kr" data-kr="${k.id}" style="cursor:pointer" data-tip="Résultat clé commercial : ${fm(k.current)} sur ${fm(k.target)}. Attendu à date : ${fm(k.expected)}. Cliquer pour l’ouvrir."><div class="l"><span>Résultat clé<\/span><b>${v.label} · ${v.ratio}<\/b><\/div><div class="v">${k.name} : <strong>${fm(k.current)}<\/strong> <span style="color:#B6BBCA">· attendu ${fm(k.expected)}<\/span><\/div><div class="krbar"><i style="width:${w}%"><\/i><u style="left:${e}%"><\/u><\/div><\/div>`;
}

/* ---- 5. Cash at risk: the alerts ranked by money at stake ---- */
function alerts(){
  const L=ALERTS.slice().sort((a,b)=>b.imp-a.imp);
  const tot=L.reduce((x,a)=>x+a.imp,0), mx=Math.max(...L.map(a=>a.imp),1), shown=L.slice(0,5);
  if(LIVE&&!L.length){el("alq").innerHTML="0 alerte";el("al").innerHTML=`<p style="color:var(--mut);font-size:13px;margin:8px 0">Rien à risque pour l’instant : aucune alerte ouverte et aucune prochaine étape en retard.<\/p>`;return}
  el("alq").innerHTML=`<b class="num" style="color:var(--redt);font-size:13px">~${moneyK(tot)}<\/b> · ${L.length} alerte${L.length>1?"s":""}`;
  el("al").innerHTML=shown.map(a=>{const s=SALES.find(x=>x.id===a.o);
    return `<div class="alr" data-tip="${a.t} · ${a.obj} · ${s?s.name:(LIVE?"Non attribué":"Direction")} · impact estimé ${money(a.imp)}"><span class="code">${a.c}<\/span><div style="min-width:0"><div class="t">${a.t}<\/div><div class="o">${a.obj} · ${s?s.name.split(" ")[0]:(LIVE?"Non attribué":"Direction")}<\/div><\/div>
    <div class="ib"><i style="width:${Math.max(6,a.imp/mx*100)}%"><\/i><span>~${moneyK(a.imp)}<\/span><\/div><\/div>`}).join("")+
    `<div class="more"><span style="color:var(--mut)">${L.length>5?(L.length-5)+" de plus, ~"+moneyK(L.slice(5).reduce((x,a)=>x+a.imp,0)):""}<\/span><button class="lnk" data-allalerts>Voir toutes les alertes →<\/button><\/div>`;
  bindTips(el("al"));
  const aa=el("al").querySelector("[data-allalerts]"); if(aa) aa.onclick=()=>window.postMessage({skl:"crm",view:"alerts"},"*");
}

function cover(msg,retry){let c=R.getElementById("livecover");if(!msg){if(c)c.remove();return}
  if(!c){c=document.createElement("div");c.id="livecover";c.setAttribute("role","status");c.style.cssText="position:absolute;inset:0;z-index:5;display:flex;align-items:center;justify-content:center;gap:12px;background:var(--bg);font-size:14px;color:var(--mut)";R.querySelector(".sv").appendChild(c)}
  c.textContent=msg;if(retry){const b=document.createElement("button");b.textContent="Réessayer";b.style.cssText="font:inherit;font-weight:600;border:1px solid #AECBF2;background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;color:var(--ink)";b.onclick=()=>{cover("Chargement des chiffres en direct…");loadLive()};c.appendChild(b)}}
function render(){
  const K=LIVE?liveK(S.period):KPI.all, f=LIVE?1:PF[S.period], C=criteria(K,f);
  SALES=LIVE?liveTeam(S.period):SALES0; ALERTS=LIVE?LIVE.alerts.map(a=>({c:a.c==="next"?"SLA":a.c,o:a.o,imp:+a.imp,t:frTxt(a.t),obj:frTxt(a.obj)})):ALERTS0;
  controls(); header(C); flow(K,f,C); unit(C); team(f); pipe(K); alerts(); bindTips(el("verdict").parentNode);
}

loadLive();setInterval(loadLive,300000);

  // Shared data: badges in the sidebar, who is using the OS, and whether the data is shared
  function fieldFocused() {
    var a = deepActive(), top = document.activeElement;
    return !!(a && top && app.contains(top) && (a.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)));
  }
  function deepActive() {
    var a = document.activeElement;
    while (a && a.shadowRoot && a.shadowRoot.activeElement) a = a.shadowRoot.activeElement;
    return a;
  }
  function textFocused() {
    var a = deepActive(), top = document.activeElement;
    if (!a || !top || !app.contains(top)) return false;
    if (a.isContentEditable || a.tagName === "TEXTAREA") return true;
    return a.tagName === "INPUT" && /^(text|search|email|url|tel|password|number|)$/.test((a.getAttribute("type") || "").toLowerCase());
  }
  var pendingRemote = false;
  if (window.SKL) {
    // A local save made while the person types in a text field (Build saves its draft as you type) waits for the field
    // to lose the focus: redrawing the screen then took the focus away mid-sentence (Romain 2026-11-02).
    window.SKL.onChange(function (remote) {
      if (remote ? fieldFocused() : textFocused()) { pendingRemote = true; return; }
      render();
    });
    app.addEventListener("focusout", function () {
      setTimeout(function () { if (pendingRemote && !fieldFocused() && !textFocused()) { pendingRemote = false; render(); } }, 0);
    });
  }
  // Sidebar groups fold and unfold on their title; the choice is kept across screens
  var navFold = {}, navSeen = null;
  try { navFold = JSON.parse(localStorage.getItem("skl-nav-fold") || "{}") || {}; } catch (e) { navFold = {}; }
  function applyNav() {
    app.querySelectorAll("[data-navgrp]").forEach(function (b) {
      var k = b.getAttribute("data-navgrp"), box = app.querySelector('[data-navitems="' + k + '"]');
      if (!box) return;
      if (navSeen !== current && box.querySelector('[aria-current="page"]')) delete navFold[k];
      var shut = !!navFold[k];
      box.style.display = shut ? "none" : "flex";
      b.setAttribute("aria-expanded", shut ? "false" : "true");
      var c = b.querySelector("[data-chev]"); if (c) c.style.transform = shut ? "rotate(-90deg)" : "none";
    });
    navSeen = current;
  }
  app.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest("[data-navgrp]") : null;
    if (!b) return;
    var k = b.getAttribute("data-navgrp");
    if (navFold[k]) delete navFold[k]; else navFold[k] = 1;
    try { localStorage.setItem("skl-nav-fold", JSON.stringify(navFold)); } catch (err) {}
    navSeen = current; applyNav();
  });
  function decorate() {
    applyNav();
    var S = window.SKL; if (!S) return;
    // the week of the quarter in the sidebar footer follows the OS clock (French: ISO week "S45", T4 = the fourth quarter)
    app.querySelectorAll("nav div").forEach(function (el) {
      var t = el.firstChild;
      if (t && t.nodeType === 3 && /^T4 2026 · semaine \d+\/13/.test(t.nodeValue)) t.nodeValue = t.nodeValue.replace(/semaine \d+\/13/, S.wl(S.week).replace(/^W/, "S") + " · semaine " + S.week + "/13");
    });
    var b = S.badges();
    app.querySelectorAll("[data-badge]").forEach(function (el) {
      var key = el.getAttribute("data-badge");
      var n = key === "agentdec" ? (window.__sklAgentsPending || 0) : (b[key] || 0);
      el.textContent = String(n); el.style.display = n ? "" : "none";
    });
    var box = app.querySelector("[data-me]"); if (!box) return;
    var ROLE_FR = { "Content Lead": "Responsable contenu", "Sales": "Commercial" };   // shown only: the roles stay as stored
    box.textContent = "";
    var lab = document.createElement("label");
    lab.style.cssText = "display: flex; flex-direction: column; gap: 6px; font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: #5A6478";
    lab.appendChild(document.createTextNode("Vous êtes"));
    var sel = document.createElement("select");
    sel.style.cssText = "font: inherit; font-size: 15px; letter-spacing: 0; text-transform: none; padding: 10px 12px; border-radius: 10px; border: 1px solid #AECBF2; background: #FFFFFF; color: #1E2A5E";
    var o0 = document.createElement("option"); o0.value = ""; o0.textContent = "Choisissez qui vous êtes…"; sel.appendChild(o0);
    S.members.forEach(function (m) { var o = document.createElement("option"); o.value = m.id; o.textContent = m.name + " · " + (ROLE_FR[m.role] || m.role); if (S.me === m.id) o.selected = true; sel.appendChild(o); });
    sel.addEventListener("change", function () { if (sel.value) S.setMe(sel.value); });
    lab.appendChild(sel); box.appendChild(lab);
    var st = document.createElement("div");
    st.style.cssText = "display: flex; align-items: center; gap: 6px; font-size: 13px; color: #5A6478";
    var dot = document.createElement("span");
    dot.style.cssText = "width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: " + (S.mode === "shared" ? (S.readOnly ? "#5B8DF7" : "#2E7D4F") : "#747D9A");
    st.appendChild(dot);
    st.appendChild(document.createTextNode(S.mode === "shared" ? (S.readOnly ? "Données partagées · lecture seule" : "Données partagées · enregistrées pour l’équipe") : S.mode === "loading" ? "Connexion…" : "Données de démonstration · non enregistrées"));
    box.appendChild(st);
  }

  // LNP CRM screens run in their own frames, kept alive outside the re-rendered app so their state survives.
  var frames = {};
  var FRAME_DOCS = { crm: window.SKL_CRM_DOC };
  function frameFor(key, bg) {
    if (!frames[key] && FRAME_DOCS[key]) {
      var f = document.createElement("iframe");
      f.title = key === "crm" ? "CRM" : "Tableau de bord commercial";
      f.setAttribute("srcdoc", FRAME_DOCS[key]);
      f.style.cssText = "position: fixed; border: 0; z-index: 1; background: " + bg + ";";
      document.body.appendChild(f);
      frames[key] = f;
    }
    return frames[key];
  }
  function placeOne(key, sel, bg, fill) {
    var slot = app.querySelector(sel);
    if (!slot) { if (frames[key]) frames[key].style.display = "none"; return; }
    if (fill) {
      var z = parseFloat(app.style.zoom) || 1;
      var top = slot.getBoundingClientRect().top + window.scrollY;
      slot.style.height = Math.max(480, Math.floor((window.innerHeight - top) / z) - 24) + "px";
    }
    var f = frameFor(key, bg);
    if (!f) return;
    var r = slot.getBoundingClientRect();
    f.style.display = "block";
    f.style.left = r.left + "px"; f.style.top = r.top + "px";
    f.style.width = r.width + "px"; f.style.height = r.height + "px";
  }
  function placeCrm() {
    placeOne("crm", "[data-crm]", "#F7F8FB", false);
    mountDash();
  }

  // The sales dashboard lives in the cockpit page itself, isolated in a shadow root, and keeps its state
  var dashHost = null;
  // Cockpit modules live in shadow roots, keep their state between renders, and redraw when the shared data changes
  var modHosts = {}, modTip = null, modToast = null;
  function modChrome() {
    if (modTip) return;
    modTip = document.createElement("div");
    modTip.setAttribute("role", "tooltip");
    modTip.style.cssText = "position:fixed;pointer-events:none;background:#1E2A5E;color:#F7F8FB;font:12px/1.4 'Poppins',system-ui,sans-serif;padding:8px 10px;border-radius:8px;max-width:280px;opacity:0;transition:opacity .12s;z-index:60";
    modToast = document.createElement("div");
    modToast.setAttribute("role", "status");
    modToast.style.cssText = "position:fixed;left:50%;bottom:18px;transform:translateX(-50%);background:#1E2A5E;color:#F7F8FB;font:13px 'Poppins',system-ui,sans-serif;padding:10px 16px;border-radius:10px;opacity:0;transition:opacity .2s;z-index:60;pointer-events:none";
    document.body.appendChild(modTip); document.body.appendChild(modToast);
  }
  function mountModule(sel, mod) {
    var slot = app.querySelector(sel);
    var mo = window[mod];
    if (!slot || !mo) return;
    modChrome();
    var h = modHosts[mod];
    if (!h) {
      h = modHosts[mod] = document.createElement("div");
      var root = h.attachShadow({ mode: "open" });
      root.innerHTML = '<style>' + mo.css + '</style>' + mo.html;
      slot.appendChild(h);
      try { h.__api = mo.mount(root, modTip, modToast); } catch (err) { console.error(err); }
      // While the person types in a field of this module, a data change (their own save coming back through the shared
      // database, or a colleague's) waits until the field loses the focus: redrawing then took the cursor away (Romain 2026-11-02).
      var redraw = function () { if (h.__api && h.isConnected) { try { h.__api.render(); } catch (err) { console.error(err); } } };
      var typingHere = function () { return document.activeElement === h && fieldFocused(); };
      if (window.SKL) SKL.onChange(function () { if (typingHere()) { h.__pending = true; return; } redraw(); });
      h.addEventListener("focusout", function () { setTimeout(function () { if (h.__pending && !typingHere()) { h.__pending = false; redraw(); } }, 0); });
      return;
    }
    if (h.parentNode !== slot) { slot.appendChild(h); }
    if (h.__api) { try { h.__api.render(); } catch (err) { console.error(err); } }
  }
  function mountDash() {
    mountModule("[data-dash]", "SKL_SALES");
    mountModule("[data-ov]", "SKL_OV");
    mountModule("[data-krroom]", "SKL_KRROOM");
    mountModule("[data-mkt]", "SKL_MKT");
    mountModule("[data-fin]", "SKL_FIN");
    mountModule("[data-build]", "SKL_BUILD");
    mountModule("[data-execute]", "SKL_EXECUTE");
    mountModule("[data-carto]", "SKL_CARTO");
    mountModule("[data-agents]", "SKL_AGENTS");
    mountModule("[data-salesday]", "SKL_SALESDAY");
    if (modTip) modTip.style.opacity = 0;
  }
  // A team row on the sales dashboard opens the CRM filtered on that sales rep
  window.addEventListener("message", function (e) {
    var d = e.data || {};
    if (d.skl === "go" && typeof d.screen === "string") { go(d.screen); return; }   // e.g. CRM › Sales cycle → Execute, Build ↔ Execute
    if (d.skl !== "crm") return;
    go("crm");
    var f = frames.crm;
    var apply = function () {
      try {
        if (d.view === "alerts") f.contentWindow.eval("S.view='alerts';renderAll();");
        else f.contentWindow.eval("S.view='crm';S.cx.owner=" + JSON.stringify(String(d.owner)) + ";S.cx.tab='pipeline';S.cx.quick=null;renderAll();");
      } catch (err) { console.error(err); }
    };
    if (!f) return;
    var ready = false;
    try { ready = f.contentDocument && f.contentDocument.readyState === "complete" && f.contentDocument.getElementById("v-crm"); } catch (err) {}
    if (ready) apply(); else f.addEventListener("load", apply, { once: true });
  });
  window.addEventListener("scroll", placeCrm, { passive: true });

  // Design width is 1440 px. Narrower windows scale the whole app down; wider ones let it grow.
  // The root always fills the full window height so the sidebar runs to the bottom of the screen.
  function fit() {
    var root = app.querySelector("[data-root]");
    if (!root) return;
    var vw = document.documentElement.clientWidth;
    var z = Math.min(1, vw / 1440);
    app.style.zoom = z < 1 ? String(z) : "";
    var h = Math.ceil(window.innerHeight / z) + "px";
    root.style.minHeight = h;
    root.style.setProperty("--screen-h", h);
  }

  // My Day and Roadmap were replaced by Execute and Build (2026-10-30): their old links and #hashes land on the new screens
  var MOVED = { monjour: "execute", inbox: "execute", roadmap: "build" };
  // edition.json (LNP: the Sales System only): the home screen, and every screen outside the edition lands on it
  var HOME = "salescockpit", KEEP = ["salescockpit", "salesday", "crm", "settings", "account", "access"];
  if (KEEP) Object.keys(SCREENS).forEach(function (id) { if (KEEP.indexOf(id) < 0) MOVED[id] = HOME; });
  window.SKL_EDITION = { home: HOME, keep: KEEP };   // read by web/public/skl-web.js (Settings › Access lists only these screens)
  function go(id) {
    id = MOVED[id] || id;
    if (!SCREENS[id]) return;
    current = id;
    render();
    window.scrollTo(0, 0);
    try { history.replaceState(null, "", "#" + id); } catch (e) {}
  }

  document.querySelectorAll("template[data-file]").forEach(function (t) {
    fileToScreen[t.getAttribute("data-file")] = t.id.replace("tpl-", "");
  });
  fileToScreen["MonJour.dc.html"] = "execute"; fileToScreen["Roadmap.dc.html"] = "build";   // links written before Build and Execute

  app.addEventListener("click", function (e) {
    var a = e.target.closest ? e.target.closest("a[href]") : null;
    if (!a) return;
    var href = a.getAttribute("href");
    if (fileToScreen[href]) { e.preventDefault(); go(fileToScreen[href]); }
    else if (href === "#" || href.charAt(0) === "#") { e.preventDefault(); }
  });
  app.addEventListener("submit", function (e) { e.preventDefault(); });
  document.addEventListener("keydown", function (e) {
    var inst = instances[current];
    if (e.key === "Escape" && inst && inst.state && (inst.state.info || inst.state.edit)) inst.setState({ info: false, edit: null });
  });
  window.addEventListener("resize", function () { fit(); placeCrm(); });

  var start = (location.hash || "").replace("#", "");
  start = MOVED[start] || start;
  current = SCREENS[start] ? start : HOME;
  if (KEEP && location.hash && location.hash.replace("#", "") !== current) { try { history.replaceState(null, "", "#" + current); } catch (e) {} }
  render();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
})();
</script>
